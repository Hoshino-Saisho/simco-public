<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sim Companies 聊天记录</title>
<meta name="referrer" content="no-referrer">
<!--
  安全策略说明（这是公开页面，所以每一条都有意义）：

  default-src 'none'   默认什么都不许加载
  connect-src 'self'   只能读同源的静态 JSON。就算页面里出了问题，也无法把
                       任何东西发到外部域名 —— 数据只能进不能出
  img-src              只允许游戏头像 CDN、玩家常用的截图图床、data:，别的一律不加载，
                       避免有人把 logo 字段塞成追踪像素
  base-uri / form-action 'none'   禁止改写基准地址、禁止任何表单提交

  script-src / style-src 用 'unsafe-inline' 是因为这是单文件页面。真正的
  XSS 防线不在 CSP，而在渲染层：本页对聊天内容【完全不使用 innerHTML】，
  一律用 createTextNode 构造，所以消息里就算写满 <script> 也只是普通文字。
-->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'unsafe-inline';
  style-src 'unsafe-inline';
  connect-src 'self';
  img-src https://d1fxy698ilbz6u.cloudfront.net https://snipboard.io https://i.snipboard.io data:;
  base-uri 'none';
  form-action 'none';
  frame-ancestors 'none';
">
<style>
  :root{
    --bg:#0e1015; --panel:#151821; --panel2:#1b1f2a; --line:rgba(255,255,255,.08);
    --tx:#e6e9ef; --mut:#8b93a3; --dim:#666e7e; --acc:#7dd3fc; --ok:#86efac;
    --warn:#fbbf24; --bad:#f87171; --sw:250px;
    /*
     * 正文列最宽多少，两档：
     *   --colmax          正常，880 ≈ 一行 55~70 个汉字，落在好读的区间
     *   --colmax-compact  紧凑，440 = 正常的一半，录视频用
     * 改这两个数的时候，**下面那两个断点要跟着改**（= 250 + 这里的数）。
     */
    --colmax:880px;
    --colmax-compact:440px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--tx);display:flex;height:100dvh;overflow:hidden;
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
         "Microsoft YaHei","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-text-size-adjust:100%;
  }
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:5px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.22)}
  ::-webkit-scrollbar-track{background:transparent}

  #side{width:var(--sw);flex:0 0 var(--sw);background:var(--panel);
        border-right:1px solid var(--line);display:flex;flex-direction:column;
        overflow-y:auto;overscroll-behavior:contain}
  #side h1{font-size:14px;margin:0;padding:15px 16px 4px;font-weight:700}
  #side .tagline{padding:0 16px 12px;font-size:11.5px;color:var(--dim);line-height:1.5}
  .sec{padding:11px 14px;border-top:1px solid var(--line);flex:0 0 auto}
  .sec h2{font-size:11px;color:var(--dim);margin:0 0 8px;font-weight:600;
          letter-spacing:.6px;text-transform:uppercase}

  .btn{padding:6px 12px;background:var(--panel2);color:var(--tx);border:1px solid var(--line);
       border-radius:6px;cursor:pointer;font-size:12.5px;font-family:inherit}
  .btn:hover:not(:disabled){border-color:rgba(255,255,255,.28)}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.pri{background:rgba(125,211,252,.15);border-color:rgba(125,211,252,.4);color:var(--acc)}
  .btnrow{display:flex;gap:6px;flex-wrap:wrap}
  /*
   * 链接按钮。必须显式给颜色 ——
   * 页面里没有全局的 a{color}，所以 <a> 会拿浏览器默认的那个深蓝，
   * 在深色底上又暗又扎眼。第一版就是这么难看的。
   */
  .linkbtn{display:inline-block;padding:6px 12px;border-radius:6px;
           font-size:12.5px;text-decoration:none;cursor:pointer;
           background:rgba(125,211,252,.15);border:1px solid rgba(125,211,252,.4);
           color:var(--acc)}
  .linkbtn:hover{background:rgba(125,211,252,.25);border-color:var(--acc)}

  input[type=search]{width:100%;padding:7px 9px;background:var(--panel2);color:var(--tx);
    border:1px solid var(--line);border-radius:6px;font-size:13px;font-family:inherit}
  input:focus{outline:none;border-color:var(--acc)}

  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{padding:3px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);
        font-size:12px;cursor:pointer;user-select:none;color:var(--mut)}
  .chip:hover{border-color:rgba(255,255,255,.25);color:var(--tx)}
  .chip.on{background:rgba(125,211,252,.16);border-color:var(--acc);color:var(--acc)}

  .rowlist{max-height:220px;overflow-y:auto;margin:0 -4px;overscroll-behavior:contain}
  .row{display:flex;justify-content:space-between;gap:8px;align-items:center;
       padding:4px 8px;border-radius:5px;cursor:pointer;font-size:12.5px;color:var(--mut)}
  .row:hover{background:rgba(255,255,255,.05);color:var(--tx)}
  .row.on{background:rgba(125,211,252,.14);color:var(--acc)}
  .row.done{color:var(--ok)}
  .row .n{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;flex:0 0 auto}
  .row .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stat{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);padding:2px 0}
  .stat b{color:var(--tx);font-weight:600;font-variant-numeric:tabular-nums}
  .note{font-size:11.5px;color:var(--dim);line-height:1.65;white-space:pre-line}
  .err{color:var(--bad);font-size:12px;margin-top:6px;word-break:break-word}

  #main{flex:1;display:flex;flex-direction:column;min-width:0}
  /*
   * 顶栏钉住。
   *
   * 正常情况下它本来就不会滚（#feed 才是滚动的那个），sticky 是空转的。
   * 加它是为了兜住【部分手机浏览器上整页跟着滚】的情况 ——
   * 那时候顶栏会被推出屏幕，模式切换和搜索框就再也够不着了，
   * 而唯一的补救是把整页往回滑，偏偏那时候滑动又被消息流吃掉。
   */
  #bar{padding:9px 16px;border-bottom:1px solid var(--line);background:var(--panel);
       display:flex;gap:10px;align-items:center;flex:0 0 auto;
       position:sticky;top:0;z-index:12}
  #bar .title{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #bar .sub{color:var(--dim);font-size:12.5px;white-space:nowrap}
  #bar .spacer{flex:1}
  #q{max-width:300px}
  #burger{display:none;background:none;border:0;color:var(--tx);font-size:19px;cursor:pointer;padding:0 4px}

  /*
   * ================= 正文列的宽度 + 右边预留的那一栏 =================
   *
   * 以前消息是一路铺到屏幕最右边的。在 24 寸以上的显示器上，
   * 一行聊天能拉到一千多像素宽 —— **眼睛从行尾跳回行首会找不着地方**，
   * 这是排版上最老的一条经验（一行大约 45~90 个字符最好读）。
   *
   * 所以现在是两栏：
   *
   *   #col   正文（AI 卡 + 消息流），宽度封顶 --colmax
   *   #rail  右边那一栏，**现在是空的**，先把地占住
   *
   * 为什么现在就把 #rail 建出来、而不是只给 #col 加一个 max-width：
   * 只加 max-width 的话，以后要往右边放东西还得【改结构】——
   * 而 #feed 是那个滚动容器，动它最容易把滚动位置、
   * 「滚到底」那套逻辑一起弄坏。现在把壳搭好，以后只往 #rail 里填内容。
   *
   * ⚠️ 刻意【左对齐】，不居中。
   * 居中的话空白会平分到两边，右边就没有一整条可用的地方了 ——
   * 而右边正是要留给以后那个东西的。
   * （真想居中：给 #stage 加 justify-content:center 就行，一行。）
   *
   * 窄屏和手机完全不受影响：断点以下 #rail 根本不显示，
   * #col 也不封顶，和改之前一模一样。
   *
   * ---- 两档宽度 ----
   *
   *   正常  880  平时看存档。一行 55~70 个汉字，好读
   *   紧凑  440  **录视频用**。一行短，长消息不会横着拖出画面
   *
   * 换档只是给 body 挂一个类 —— 不重排 DOM、不重画消息流，
   * 所以滚动位置一动不动（一边滚一边找镜头的时候，这一点很关键）。
   */
  #stage{flex:1;display:flex;min-height:0;min-width:0}
  #col{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;min-height:0}
  #rail{display:none}
  .railon{display:block;flex:1 1 auto;border-left:1px solid var(--line)}

  /*
   * ⚠️ 断点必须 = 侧栏 250 + 那一档的正文宽度，**两档各算各的**。
   *
   * 这条规矩是量出来的。第一版我给 #rail 写了 min-width:260px、
   * 断点拍脑袋放在 1240，结果是：
   *     1239px → 正文 989      （没到断点，不封顶）
   *     1240px → 正文 730      （rail 硬要 260，反过来把正文挤瘦了）
   * **窗口拖大一个像素，正文突然瘦一大圈** —— 看着就是个 bug。
   *
   * 现在 rail 不设 min-width，只吃"正文封顶之后剩下的"，
   * 于是断点两侧正文宽度是连续的（879 → 880），拖窗口不会跳。
   * 代价是刚过断点时 rail 只有几个像素 —— 一条贴着边的细线，不碍事。
   */
  /* 正常档：250 + 880 = 1130 → 1140 */
  @media(min-width:1140px){
    body:not(.compact) #col{max-width:var(--colmax)}
    body:not(.compact) #rail{display:block;flex:1 1 auto;
      border-left:1px solid var(--line)}
  }
  /*
   * 紧凑档：250 + 440 = 690，比手机断点（760）还低 ——
   * 所以"只要不是手机版式"就一直封顶。
   * 他说手机暂时不需要这个，所以 760 以下一概不管。
   */
  @media(min-width:761px){
    body.compact #col{max-width:var(--colmax-compact)}
    body.compact #rail{display:block;flex:1 1 auto;
      border-left:1px solid var(--line)}
    /* 列窄了，两边的留白也跟着收一点 —— 440 里省下的 16px 全给正文 */
    body.compact .msg{padding-left:14px;padding-right:14px}
    body.compact .daysep{margin-left:14px;margin-right:14px}
    body.compact #aicard{margin-left:14px;margin-right:14px}
  }
  /* 手机上这个开关什么都改不了，就别摆在那儿让人猜 */
  @media(max-width:760px){ #widthsec{display:none} }

  /*
   * ==================== 两个模式：聊天记录 / 销售办公室 ====================
   *
   * 这两块是【完全独立的两棵 DOM】，只用 body 上一个类切换显示。
   *
   * 为什么这么切，而不是把计算器塞进现在的布局里：
   * 聊天存档这一套（索引、日文件、深搜、滚动到底、房间/日期筛选）
   * 是这个页面最容易坏、也最难验的部分。计算器和它**一行状态都不共享**、
   * 一个函数都不调用 —— 计算器写崩了，存档那边照样跑。
   *
   * 切模式时会把消息流的滚动位置存下来再还原：display:none 会让
   * scrollTop 归零，不还原的话每切一次回来都被弹到顶上。
   */
  #calc{display:none}
  body.mode-calc #side,body.mode-calc #main{display:none}
  body.mode-calc #calc{display:flex;flex-direction:column;flex:1;min-width:0}

  .modetabs{display:flex;border:1px solid var(--line);border-radius:8px;
    overflow:hidden;flex:0 0 auto}
  .modetabs button{padding:5px 11px;font-size:12.5px;background:transparent;
    border:0;color:var(--mut);cursor:pointer;font-family:inherit;white-space:nowrap}
  .modetabs button+button{border-left:1px solid var(--line)}
  .modetabs button.on{background:rgba(125,211,252,.16);color:var(--acc);font-weight:600}
  .modetabs button:hover:not(.on){color:var(--tx)}

  #calcbody{flex:1;overflow-y:auto;overscroll-behavior:contain;
    padding:16px 16px 60px}
  .cwrap{max-width:1180px;display:flex;flex-direction:column;gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:13px 15px 15px}
  .card>h3{margin:0 0 3px;font-size:13.5px;font-weight:700;color:var(--tx)}
  .card>.sub{font-size:11.5px;color:var(--dim);line-height:1.6;margin:0 0 11px}
  .card .grp{margin-top:14px}
  .card .grp>h4{margin:0 0 7px;font-size:11px;color:var(--dim);font-weight:600;
    letter-spacing:.5px;text-transform:uppercase}

  /* 输入格子。数字一律用等宽数位，改一个数字时别的不会跟着抖 */
  #calc input{width:100%;padding:6px 8px;background:var(--panel2);color:var(--tx);
    border:1px solid var(--line);border-radius:6px;font-size:13px;font-family:inherit;
    font-variant-numeric:tabular-nums}
  #calc input:focus{outline:none;border-color:var(--acc)}
  /* 数字框右边那对小箭头占地方又容易误点，去掉 */
  #calc input[type=number]{-moz-appearance:textfield}
  #calc input[type=number]::-webkit-outer-spin-button,
  #calc input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

  /* auto-fill + 上限 200：字段够宽就好，不要为了填满一行把每个拉到 290 */
  /* 表格里的勾选 / 单选：做大一点，手机上要点得中 */
  #calc input.cchk{width:17px;height:17px;padding:0;accent-color:var(--acc);cursor:pointer}

  /* ---- 给建筑选产品的那个模式 ---- */
  .pickbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 2px;
    padding:7px 11px;border-radius:8px;font-size:12px;color:var(--mut);
    background:rgba(134,239,172,.10);border:1px solid rgba(134,239,172,.4)}
  .pickbar b{color:var(--ok)}
  .cbtn.pri{background:rgba(125,211,252,.16);border-color:rgba(125,211,252,.45);
    color:var(--acc)}
  /*
   * 选择模式下整行可点，选中的整行变绿。
   * ⚠️ 行内的输入框必须 pointer-events:none —— 否则点在数字框上会落进输入框、
   * 选不中，而你只会觉得"点了没反应"。选产品的时候本来也不改数字。
   */
  #calc table.picking tbody tr{cursor:pointer}
  #calc table.picking tbody tr:hover td{background:rgba(255,255,255,.05)}
  #calc table.picking input{pointer-events:none}
  #calc table.picking tbody tr.picked td{background:rgba(134,239,172,.13);
    color:var(--ok)}
  #calc table.picking tbody tr.picked td:first-child{
    box-shadow:inset 2px 0 0 var(--ok)}
  .fgrid{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(140px,200px))}
  .fld{min-width:0}
  .fld label{display:block;font-size:11px;color:var(--dim);margin-bottom:3px}
  .fld .hint{font-size:10.5px;color:var(--dim);margin-top:3px;line-height:1.45}

  /* 表格横向能滚 —— 手机上宁可滑，也不要把每一列压成两个字 */
  .tw{overflow-x:auto;margin:0 -4px;padding:0 4px}
  #calc table{border-collapse:collapse;width:100%;min-width:640px;font-size:12.5px}
  #calc th{font-size:10.5px;color:var(--dim);font-weight:600;text-align:right;
    padding:0 6px 6px;letter-spacing:.3px;white-space:nowrap}
  #calc th:first-child{text-align:left}
  #calc td{padding:3px 6px;text-align:right;font-variant-numeric:tabular-nums;
    color:var(--mut);white-space:nowrap}
  #calc td:first-child{text-align:left;color:var(--tx)}
  #calc tbody tr+tr td{border-top:1px solid rgba(255,255,255,.05)}
  /*
   * 表格里的输入框给【固定宽度】。
   * 让它 width:100% 的话，整列会被撑成两三百像素宽，
   * 一个填 4 的品质框横跨半张卡片，而右边的结果被挤到天边。
   */
  #calc td input{width:112px;min-width:0}
  #calc td.out{color:var(--tx)}
  /* 输入列左对齐，表头跟着一起 —— 不然标题飘在空档上方，对不上下面的框 */
  #calc th.i,#calc td.i{text-align:left}

  /* 结果条。时利是这张表唯一真正要看的数，所以给它最大的字号 */
  .kpis{display:grid;gap:9px;margin-top:13px;
    grid-template-columns:repeat(auto-fit,minmax(132px,1fr))}
  .kpi{background:var(--panel2);border:1px solid var(--line);border-radius:9px;
    padding:8px 10px;min-width:0}
  .kpi .k{font-size:10.5px;color:var(--dim);letter-spacing:.3px}
  .kpi .v{font-size:16px;margin-top:2px;font-variant-numeric:tabular-nums;
    word-break:break-all}
  .kpi.big .v{font-size:22px;font-weight:700}
  .kpi.good .v{color:var(--ok)} .kpi.bad .v{color:var(--bad)}
  .kpi.acc .v{color:var(--acc)}

  /* 行尾那个删除键。做小、做灰，误点的代价是丢一行输入 */
  .xbtn{width:24px;height:24px;line-height:1;padding:0;border-radius:6px;
    background:transparent;color:var(--dim);border:1px solid var(--line);
    cursor:pointer;font-size:14px;font-family:inherit}
  .xbtn:hover:not(:disabled){border-color:var(--bad);color:var(--bad)}
  .xbtn:disabled{opacity:.3;cursor:default}

  .cbtn{padding:5px 11px;background:var(--panel2);color:var(--tx);
    border:1px solid var(--line);border-radius:6px;cursor:pointer;
    font-size:12.5px;font-family:inherit}
  .cbtn:hover{border-color:var(--acc);color:var(--acc)}
  .cbtn.warn:hover{border-color:var(--bad);color:var(--bad)}
  .crow{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:10px}

  /* 说明块。这个计算器的坑全在"这个数到底是什么意思"上，所以话要说满 */
  .why{font-size:11.5px;color:var(--mut);line-height:1.7;background:var(--panel2);
    border:1px solid var(--line);border-left:2px solid var(--acc);
    border-radius:8px;padding:9px 11px;margin-top:12px}
  .why b{color:var(--tx)}
  .why.warn{border-left-color:var(--warn)}
  .why code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;
    background:rgba(255,255,255,.06);border-radius:3px;padding:0 4px}

  #feed{flex:1;overflow-y:auto;padding:8px 0 60px;overscroll-behavior:contain}
  .placeholder{height:100%;display:flex;flex-direction:column;align-items:center;
    justify-content:center;color:var(--dim);gap:10px;text-align:center;padding:24px}
  .placeholder .big{font-size:44px;opacity:.35}

  .daysep{display:flex;align-items:center;gap:12px;margin:20px 22px 12px;
          color:var(--dim);font-size:11.5px;letter-spacing:.5px}
  .daysep::before,.daysep::after{content:'';flex:1;height:1px;background:var(--line)}
  .daysep span{padding:2px 10px;border-radius:999px;border:1px solid var(--line)}

  .msg{display:flex;gap:11px;padding:3px 22px}
  .msg:hover{background:rgba(255,255,255,.028)}
  .msg.first{margin-top:9px}
  /* 头像本身就是正方形的图，圆形裁切会把四个角的内容切掉 —— 所以按方的显示。
     4px 只是磨掉锐角，和页面上按钮/输入框的圆角是同一套观感，不改变方形本身。 */
  .av{width:38px;height:38px;border-radius:4px;flex:0 0 38px;object-fit:cover;
      background:var(--panel2);margin-top:2px}
  .av.ph{display:flex;align-items:center;justify-content:center;font-weight:700;
         font-size:15px;color:#0e1015;letter-spacing:-.5px}
  .gutter{width:38px;flex:0 0 38px;font-size:10.5px;color:var(--dim);text-align:right;
          padding-right:2px;opacity:0;line-height:1.7;font-variant-numeric:tabular-nums}
  .msg:hover .gutter{opacity:1}
  .content{min-width:0;flex:1}
  .head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:1px}
  .who{font-weight:600;font-size:14px;cursor:pointer}
  .who:hover{text-decoration:underline}
  .ts{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .body{white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
  .body a{color:var(--acc)}

  .tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;vertical-align:1px;
       background:rgba(255,255,255,.09);color:var(--mut);font-weight:600;letter-spacing:.3px}
  .tag.sup{background:rgba(251,191,36,.17);color:#fcd34d}
  .tag.mod{background:rgba(248,113,113,.17);color:#fca5a5}
  .tag.cert{background:rgba(125,211,252,.14);color:var(--acc)}
  .tag.rm{background:rgba(167,139,250,.16);color:#c4b5fd}
  /* 领域标签是"背景信息"，不是"值得注意的标记" —— 所以刻意做得比
     管理/赞助/证书那几个都低调，每条消息都挂着也不会喧宾夺主 */
  .tag.realm{background:transparent;border:1px solid var(--line);color:var(--dim);font-weight:500}
  /* 变暗：纯 CSS，不重建 DOM、不触发重排。悬停时恢复，方便临时看清 */
  .msg.dim{opacity:.45;transition:opacity .12s}
  .msg.dim:hover{opacity:1}
  .opt{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:12.5px;
       color:var(--mut);cursor:pointer;user-select:none}
  .opt input{accent-color:var(--acc);cursor:pointer;margin:0}
  .opt.off{opacity:.4;cursor:default}
  .opt.off input{cursor:default}
  .mention{color:var(--acc);background:rgba(125,211,252,.12);border-radius:4px;padding:0 3px}
  .emote{display:inline-block;font-size:11px;padding:0 5px;border-radius:4px;margin:0 1px;
         background:rgba(255,255,255,.08);color:var(--mut);
         font-family:ui-monospace,Menlo,Consolas,monospace}
  mark{background:rgba(251,191,36,.34);color:#fff;border-radius:2px;padding:0 1px}
  .flags{margin-top:2px;display:flex;gap:5px;flex-wrap:wrap}
  .flag{font-size:10.5px;padding:1px 7px;border-radius:4px;background:rgba(255,255,255,.07);color:var(--dim)}
  .flag.pin{background:rgba(251,191,36,.16);color:var(--warn)}
  .flag.del{background:rgba(248,113,113,.16);color:var(--bad)}
  .msg.gone .body{opacity:.42;text-decoration:line-through}

  /*
   * 玩家贴的截图。限高不限宽，避免一张长图把整屏占掉；
   * 点开是原图。故意不做灯箱 —— 多一层交互，多一处会坏的地方。
   */
  /*
   * 点开看大图。
   *
   * 我在上一版注释里写过"故意不做灯箱 —— 多一层交互，多一处会坏的地方"。
   * 那句话在"图能看清"的前提下才成立；实际有些设备上截图小到读不了字，
   * 而截图往往就是那条消息的全部内容 —— 看不清等于那条消息没存下来。
   *
   * 所以做，但只做两件事：铺满屏幕看，和切到【原始像素】看。
   * 后者才是真正解决"看不清"的那个 —— 铺满屏幕对一张 1920 宽的截图
   * 在手机上仍然是缩小的。
   */
  #lightbox{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);
    display:flex;align-items:center;justify-content:center;
    /* dvh：手机浏览器地址栏收起/展开时不会把图裁掉 */
    height:100dvh;overscroll-behavior:contain}
  #lightbox[hidden]{display:none}
  #lightbox .lbstage{max-width:100%;max-height:100%;overflow:auto;
    -webkit-overflow-scrolling:touch;display:flex;
    align-items:center;justify-content:center}
  /* 默认铺满：整张看得见 */
  #lightbox img{max-width:100vw;max-height:100dvh;object-fit:contain;
    display:block;cursor:zoom-in}
  /* 切到原始像素：能读清字，代价是要拖动 */
  #lightbox.real .lbstage{align-items:flex-start;justify-content:flex-start}
  #lightbox.real img{max-width:none;max-height:none;width:auto;height:auto;
    cursor:zoom-out}
  #lightbox .lbbar{position:absolute;top:0;left:0;right:0;
    display:flex;gap:10px;align-items:center;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;
    background:linear-gradient(180deg,rgba(0,0,0,.6),transparent);
    font-size:13px;color:#e5e7eb}
  #lightbox .lbbar .sp{flex:1}
  #lightbox .lbbtn{min-width:44px;min-height:44px;padding:0 14px;
    display:inline-flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.10);color:#fff;border:1px solid rgba(255,255,255,.28);
    border-radius:10px;cursor:pointer;font-size:14px;text-decoration:none}
  #lightbox .lbbtn:hover{background:rgba(255,255,255,.18)}
  /* 灯箱开着时不让底下的消息流跟着滚 */
  body.lb{overflow:hidden}

  /*
   * 玩家资料页。
   *
   * 点名字原来是"只看这个人的消息"，那是查存档最常用的动作之一，
   * 【不能弄丢】。所以这里不是替换它，而是把它包进来 ——
   * 面板里那个「只看他的消息」按钮就是原来那个功能，只是现在有名字了。
   */
  #pcard{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.75);
    display:flex;align-items:center;justify-content:center;padding:16px;
    height:100dvh;overscroll-behavior:contain}
  #pcard[hidden]{display:none}
  #pcard .psheet{width:min(540px,100%);max-height:min(86dvh,720px);overflow-y:auto;
    -webkit-overflow-scrolling:touch;background:var(--panel);color:var(--tx);
    border:1px solid var(--line);border-radius:14px;
    box-shadow:0 24px 60px rgba(0,0,0,.55)}
  #pcard .phead{display:flex;gap:12px;align-items:center;padding:16px 16px 12px;
    border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);
    border-radius:14px 14px 0 0}
  #pcard .phead .av{width:40px;height:40px;flex:0 0 40px;font-size:16px}
  #pcard .pname{font-size:16px;font-weight:700;line-height:1.25;
    word-break:break-word;flex:1;min-width:0}
  #pcard .pbody{padding:14px 16px 16px}
  #pcard .pwhen{font-size:12px;color:var(--mut);margin:0 0 12px}
  #pcard .pwhen.old{color:var(--warn)}
  #pcard .pnone{font-size:13px;color:var(--mut);background:var(--panel2);
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 12px;
    line-height:1.6}
  #pcard .pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
    gap:8px;margin:0 0 12px}
  #pcard .pcell{background:var(--panel2);border:1px solid var(--line);
    border-radius:10px;padding:8px 10px;min-width:0}
  #pcard .pcell .k{font-size:11px;color:var(--dim);letter-spacing:.4px}
  #pcard .pcell .v{font-size:14px;margin-top:2px;word-break:break-word}
  #pcard h3{font-size:11px;color:var(--dim);margin:14px 0 8px;font-weight:600;
    letter-spacing:.6px;text-transform:uppercase}
  /* 自我介绍：别人写的自由文本，可能很长也可能一行。
     给个上限 + 自己滚，不让它把下面的"只看他的消息"挤出屏幕。 */
  #pcard .pnote{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;font-size:13px;line-height:1.65;white-space:pre-wrap;
    word-break:break-word;max-height:220px;overflow-y:auto}
  #pcard .pnote a{color:var(--acc)}
  /* 自我介绍里贴的图（snipboard 那种）。放在滚动框里会被压扁，
     所以给它单独的尺寸，点开还是走同一个灯箱。 */
  #pcard .pnote .imgs{margin-top:8px}
  #pcard .pnote .imgwrap img{max-width:100%;max-height:150px}
  #pcard .chips{display:flex;flex-wrap:wrap;gap:6px}
  #pcard .chip{font-size:12px;padding:3px 9px;border-radius:999px;
    background:var(--panel2);border:1px solid var(--line);color:var(--mut)}
  #pcard .pbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  #pcard .pbtn,#mkcard .pbtn{min-height:40px;padding:0 14px;display:inline-flex;align-items:center;
    justify-content:center;border-radius:10px;cursor:pointer;font-size:14px;
    background:var(--panel2);color:var(--tx);border:1px solid var(--line)}
  #pcard .pbtn.main{background:rgba(125,211,252,.14);border-color:rgba(125,211,252,.45);
    color:var(--acc);font-weight:600}
  #pcard .pbtn:hover,#mkcard .pbtn:hover{filter:brightness(1.15)}
  #pcard .pfoot{font-size:11.5px;color:var(--dim);line-height:1.6;margin-top:14px;
    border-top:1px solid var(--line);padding-top:10px}
  /* 手机上铺满，别做成一个够不着的小卡片 */
  @media(max-width:560px){
    #pcard{padding:0;align-items:stretch}
    #pcard .psheet{width:100%;max-height:100dvh;border-radius:0;border:0}
    #pcard .phead{border-radius:0;
      padding-top:calc(env(safe-area-inset-top,0px) + 14px)}
    #pcard .pbody{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
  }
  body.pc{overflow:hidden}

  /*
   * 屏蔽头像 / ID 的那个面板。
   *
   * 结构上刻意和资料页分开：资料页是【看真的】，这里是【设假的】，
   * 两件事同时开着只会让人搞不清眼前这个名字到底是哪一份。
   */
  #mkcard{position:fixed;inset:0;z-index:72;background:rgba(0,0,0,.75);
    display:flex;align-items:center;justify-content:center;padding:16px;
    height:100dvh;overscroll-behavior:contain}
  #mkcard[hidden]{display:none}
  #mkcard .msheet{width:min(520px,100%);max-height:min(86dvh,720px);
    display:flex;flex-direction:column;background:var(--panel);color:var(--tx);
    border:1px solid var(--line);border-radius:14px;
    box-shadow:0 24px 60px rgba(0,0,0,.55)}
  #mkcard .mhead{display:flex;gap:10px;align-items:center;padding:14px 16px;
    border-bottom:1px solid var(--line)}
  #mkcard .mhead b{font-size:15px;flex:1;min-width:0}
  #mkcard .mbody{padding:12px 16px 16px;overflow-y:auto;
    -webkit-overflow-scrolling:touch}
  #mkcard input[type=search]{width:100%;box-sizing:border-box;margin:0 0 10px}
  #mkcard h3{font-size:11px;color:var(--dim);margin:12px 0 6px;font-weight:600;
    letter-spacing:.6px}
  #mkcard .mrow{display:flex;gap:8px;align-items:center;padding:6px 8px;
    border-radius:8px;cursor:pointer;user-select:none}
  #mkcard .mrow:hover{background:var(--panel2)}
  #mkcard .mrow .av{width:24px;height:24px;flex:0 0 24px;font-size:11px}
  #mkcard .mrow .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-size:13px}
  #mkcard .mrow .as{font-size:11.5px;color:var(--acc);flex:0 0 auto}
  #mkcard .mrow .n{font-size:11px;color:var(--dim);flex:0 0 auto;min-width:26px;
    text-align:right}
  #mkcard .mnone{font-size:12.5px;color:var(--mut);padding:8px 8px 2px}
  #mkcard .mnote{font-size:11.5px;color:var(--dim);line-height:1.65;
    border-top:1px solid var(--line);padding:10px 16px;white-space:pre-line}

  .imgs{margin-top:6px;display:flex;flex-wrap:wrap;gap:8px}
  .imgwrap{display:inline-block;line-height:0;border:1px solid var(--line);
    border-radius:8px;overflow:hidden;background:var(--panel2)}
  .imgwrap img{max-width:min(420px,100%);max-height:260px;height:auto;display:block}
  @media(max-width:860px){.imgwrap img{max-height:200px}}


  #deep{display:none;padding:7px 14px;background:var(--panel2);font-size:12px;
    color:var(--mut);border-bottom:1px solid var(--line);align-items:center;gap:10px;
    flex-wrap:wrap}
  #deep.on{display:flex}
  #deep b{color:var(--tx);font-variant-numeric:tabular-nums}
  #deep button{padding:3px 10px;font-size:12px;border-radius:6px;cursor:pointer;
    background:var(--panel);color:var(--tx);border:1px solid var(--line)}
  #deep button:hover{border-color:var(--acc);color:var(--acc)}
  /* 错误条里的「重试」—— 只重拉失败的那几天，不用刷新整页 */
  #err button.retry{padding:2px 10px;font-size:12px;border-radius:6px;cursor:pointer;
    background:var(--panel);color:var(--tx);border:1px solid var(--line)}
  #err button.retry:hover{border-color:var(--acc);color:var(--acc)}
  /*
   * ============ AI 摘要卡 ============
   *
   * 只有一个硬要求：**一眼就知道这段不是人写的。**
   * 所以它刻意不长得像消息 —— 独立边框、紫色调、顶上一条横幅，
   * 而且横幅【收不起来】：正文可以折叠，"AI 生成"那几个字折不掉。
   *
   * 位置在搜索栏下面、消息流【外面】：消息流默认滚到底，
   * 摘要要是塞在流的最上面，等于没人看得到。
   */
  /*
   * ⚠️ 这张卡在 #col 这个纵向 flex 里，和 #feed 是兄弟（以前是在 #main 里）。
   *
   * 第一版只写了 display:block + overflow:hidden，于是摘要一长就出事：
   * flex 项默认 flex-shrink:1，卡片被压扁，而 overflow:hidden 把溢出的部分
   * 【直接切掉】—— 下半段既看不见，也滚不到。
   * 表现是"AI 总结写着写着就没了"，看起来像模型被截断，其实是 CSS 切的。
   *
   * 所以三件事一起做：
   *   flex:0 0 auto  别让它被 #feed 压扁
   *   max-height     再长也不许吃掉整个屏幕（下面还有原始记录要看）
   *   正文自己滚      超出的部分滚得到，而不是被切掉
   */
  #aicard{display:none;margin:10px 22px 2px;border:1px solid #7c3aed;border-radius:10px;
    background:linear-gradient(180deg,rgba(124,58,237,.16),rgba(124,58,237,.05));
    overflow:hidden}
  #aicard.on{display:flex;flex-direction:column;flex:0 0 auto;max-height:42vh}
  /* 横幅和脚注不参与压缩：不管正文多长，"这是 AI 写的"这句话永远在 */
  #aicard .aihead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:0 0 auto;
    padding:7px 12px;background:rgba(124,58,237,.30);
    border-bottom:1px solid rgba(124,58,237,.55);
    font-size:12px;font-weight:700;color:#e9d5ff;letter-spacing:.02em}
  #aicard .aihead .aititle{background:#7c3aed;color:#fff;padding:1px 8px;
    border-radius:5px;letter-spacing:.06em;font-weight:800}
  #aicard .aihead .warn{font-weight:400;color:#d8b4fe}
  #aicard .aihead .warn-short{display:none}   /* 窄屏才用，见下面的 media */
  #aicard .aihead .spacer{flex:1}
  #aicard .aitoggle{padding:2px 9px;font-size:11px;border-radius:6px;cursor:pointer;
    background:transparent;color:#e9d5ff;border:1px solid rgba(233,213,255,.45)}
  #aicard .aitoggle:hover{border-color:#e9d5ff}
  #aicard .aitoggle.on{background:rgba(233,213,255,.22);border-color:#e9d5ff}

  /*
   * 进了选读的那些消息。左边一道紫条 + 很淡的底色。
   * 【故意做得克制】：它是标注，不是高亮 ——
   * 做得太抢眼的话，没被标的那些反而变成了"背景"，
   * 而那些恰恰是读者最该看见的部分。
   */
  .msg.picked{background:rgba(124,58,237,.10);
    box-shadow:inset 3px 0 0 #7c3aed}
  /* 正文是唯一会滚的部分。overscroll-behavior 防止滚到底之后把下面的消息流也带着滚 */
  #aicard .aibody{padding:10px 13px;font-size:13.5px;line-height:1.75;color:var(--tx);
    white-space:pre-wrap;word-break:break-word;
    flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain}
  #aicard .aifoot{padding:6px 13px 9px;font-size:11px;color:var(--mut);flex:0 0 auto;
    display:flex;gap:12px;flex-wrap:wrap;border-top:1px solid rgba(124,58,237,.28)}
  @media(max-width:860px){
    #aicard{margin-left:12px;margin-right:12px}
    /*
     * 手机上屏幕本来就矮，摘要再占 42% 就没地方看原始记录了。
     * 而且这里【只是上限】—— 默认是收起的（见 AI_OPEN），
     * 展开之后最多也就这么高，正文自己滚。
     */
    #aicard.on{max-height:30vh}
    #aicard{margin-top:6px;margin-bottom:0}
    /* 手机上换成短版免责声明 —— 是换，不是删 */
    #aicard .aihead .warn-long{display:none}
    #aicard .aihead .warn-short{display:inline}
    #aicard .aibody{font-size:13px;line-height:1.7;padding:9px 11px}
    #aicard .aitoggle{padding:3px 12px}
  }

  #more{margin:16px auto 40px;display:block;padding:8px 20px;background:var(--panel2);
        color:var(--mut);border:1px solid var(--line);border-radius:7px;cursor:pointer;font-size:13px}
  #scrim{display:none}

  @media(max-width:760px){
    #side{position:fixed;left:0;top:0;bottom:0;z-index:30;transform:translateX(-100%);
          transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.6)}
    body.nav #side{transform:none}
    body.nav #scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20}
    #burger{display:block}
    #q{max-width:none;flex:1}
    #bar .sub,#bar .title{display:none}
    .msg{padding-left:12px;padding-right:12px}
    .daysep{margin-left:12px;margin-right:12px}
  }
</style>
</head>
<body>
<div id="scrim"></div>
<div id="lightbox" hidden></div>
<div id="pcard" hidden></div>
<div id="mkcard" hidden></div>

<div id="side">
  <h1>Sim Companies 聊天记录</h1>
  <div class="tagline">公开只读存档 · 数据为静态文件，页面不会把任何东西传回去<br>（计算器的输入只存在你自己的浏览器里）</div>

  <div class="sec">
    <h2>载入</h2>
    <div class="btnrow" style="margin-bottom:8px">
      <button class="btn pri" id="b_refresh">刷新</button>
      <button class="btn" id="b_recent">最近 7 天</button>
      <button class="btn" id="b_all">全部</button>
    </div>
    <div class="note" id="info">正在读取索引…</div>
    <div class="err" id="err"></div>
  </div>

  <!--
    工具区放在【靠上】的位置：原来那行链接挂在侧栏最底下，
    发送者列表一长就被挤到看不见的地方 —— 等于没有。
    这里在房间/日期/发送者之前，任何时候都在视野里。
  -->
  <div class="sec" id="tools" style="display:none">
    <h2>工具</h2>
    <div id="toolrow"></div>
  </div>

  <!--
    正文列宽。手机上这一段是藏起来的（那边本来就没有多余的横向空间）。
    紧凑那一档是给录视频用的：一行短，长消息不会横着拖出画面。
  -->
  <div class="sec" id="widthsec">
    <h2>显示</h2>
    <div class="chips" id="widthchips"></div>
    <div class="note" id="widthnote"></div>
  </div>

  <div class="sec"><h2>房间</h2><div class="chips" id="rooms"></div></div>
  <div class="sec"><h2>日期</h2><div class="rowlist" id="files"></div></div>
  <div class="sec">
    <h2>领域</h2>
    <div class="chips" id="realms"></div>
    <label class="opt" id="dimwrap">
      <input type="checkbox" id="dimother" checked>

 *   太长 → 线路整个不通时，你得盯着"载入中"干等
 * 20 秒是慢速移动网络下大部分日文件拉得完的量级。
 * 真正防"干等一整批"的不是这个数，是下面那条【连着超时就放弃】。
 */
var NET_TIMEOUT_MS = 20000;
var NET_GIVEUP = 3;              // 连着几个超时就不再拉这一批剩下的

function fetchT(url, opt) {
  var ctl = null;
  try { ctl = new AbortController(); } catch (e) { ctl = null; }
  var o = {};
  for (var k in (opt || {})) o[k] = opt[k];
  if (ctl) o.signal = ctl.signal;

  var timer = null;
  var p = new Promise(function (resolve, reject) {
    timer = setTimeout(function () {
      if (ctl) { try { ctl.abort(); } catch (e) {} }
      // 打一个记号，上层好把"超时"和"404"分开说 —— 这两件事的处理完全不同
      var err = new Error('超时：' + url);
      err.timeout = true;
      reject(err);
    }, NET_TIMEOUT_MS);
    fetch(url, o).then(resolve, function (e) {
      if (e && e.name === 'AbortError') { e.timeout = true; }
      reject(e);
    });
  });
  return p.then(function (r) { clearTimeout(timer); return r; },
                function (e) { clearTimeout(timer); throw e; });
}

function getJSON(path, reuse) {
  var url = reuse ? path
                  : path + (path.indexOf('?') < 0 ? '?' : '&') + '_=' + Date.now();
  return fetchT(url, reuse ? {} : { cache: 'no-store' }).then(function (r) {
    if (!r.ok) {
      // 把状态码挂在错误上。上层要靠它分清「这个部署没有这个文件（404）」
      // 和「网络没通（超时/断网）」—— 这两件事的处理完全相反
      var e = new Error('HTTP ' + r.status + '：' + path);
      e.status = r.status;
      throw e;
    }
    return r.json();
  });
}

/*
 * ===================== 日文件可能是 gzip 存的 =====================
 *
 * GitHub Pages 的发布站点有 1 GB 硬上限，数的是文件本体。
 * 存明文 345 MB/年（约 3 年满），存 gzip 54 MB/年（约 19 年）。
 * 所以 GitHub 那边的日文件是 `.json.gz`。
 *
 * Cloudflare 那边【不需要】这一套：Worker 会带 Content-Encoding: gzip 返回，
 * 浏览器自己就解了，前端拿到的和以前一模一样。
 * GitHub Pages 不认预压缩文件（这个需求 2019 年提的，至今没做），
 * `.gz` 对它就是个普通二进制，只能我们自己解。
 *
 * 怎么知道该不该解：看索引里的 enc 字段，GitHub 那份写着 'gz'。
 * ⚠️ 【绝对不要靠域名判断】—— 换域名、套 CDN、本地起个静态服务器，猜法立刻就错，
 * 而且错的表现是"页面一片空白"，最难查。
 */
function encSuffix() {
  return (INDEX && INDEX.enc === 'gz') ? '.gz' : '';
}

/** 这个浏览器解得了 gzip 吗？解不了要明说，不能静默失败。 */
function canGunzip() {
  return typeof DecompressionStream !== 'undefined';
}

/*
 * 拿到索引之后立刻判一次：数据是压缩存的，而这个浏览器解不了 —— 直接说清楚。
 *
 * 不做这一步的话，表现是每个日文件都"读取失败"，
 * 而那句提示写的是"可能还没发布"—— 把人往完全错误的方向带。
 * 宁可一句难听的实话，也不要一句好听的错话。
 */
function encReady() {
  if (encSuffix() !== '.gz' || canGunzip()) return true;
  setInfo('');
  setErr('这个浏览器不支持 gzip 解压（DecompressionStream），读不了压缩存档。' +
         '请换 Chrome / Edge / Safari 16.4+ / Firefox 113+ 或更新的版本。');
  emptyState('🧯', '浏览器太老，打不开这份存档',
             '存档是压缩存的，需要浏览器支持 DecompressionStream');
  return false;
}

/*
 * 换格式之前发上去的那些天还是明文 `.json`，而且【它们不会被自动重发】——
 * 发布端只重发"条数和上次不一样"的天，已经发完的天永远不会再动。
 * 索引一旦标上 enc:'gz'，这些老天就会全部 404。
 *
 * 所以这里留一条退路：要 .gz 拿到 404，就改要明文，并把这一天记下来，
 * 下次直接走明文，不再多敲一次 404。
 *
 * ⚠️ 只有 404 才回退。断网、超时之类【不能】把这一天永久标成明文 ——
 * 那样网络恢复之后它会一直去要一个不存在的文件。
 *
 * 想把老日子也压了：点一次「全量重发」，它们会以 .gz 重新发一遍；
 * 然后「清理 GitHub 上的旧 .json 日文件」才有东西可删。
 */
var ENC_PLAIN = {};      // 路径 -> true：这一天在这个部署上是明文的

/**
 * 取一个日文件 / recent 包。索引说是 gz 就先解压再当 JSON 读。
 * path 传的是【不带 .gz】的路径，后缀在这里加。
 */
function getPack(path, reuse) {
  var suf = encSuffix();
  if (!suf || ENC_PLAIN[path]) return getJSON(path, reuse);
  if (!canGunzip()) {
    return Promise.reject(new Error(
      '这个浏览器不支持 gzip 解压（DecompressionStream），' +
      '存档数据是压缩存的，读不了。请换新一点的浏览器。'));
  }
  var full = path + suf;
  var url = reuse ? full
                  : full + (full.indexOf('?') < 0 ? '?' : '&') + '_=' + Date.now();
  return fetchT(url, reuse ? {} : { cache: 'no-store' }).then(function (r) {
    if (r.status === 404) {
      ENC_PLAIN[path] = true;               // 这一天还是换格式之前的明文
      return getJSON(path, reuse);
    }
    if (!r.ok) {
      var e2 = new Error('HTTP ' + r.status + '：' + full);
      e2.status = r.status;
      throw e2;
    }
    return new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).json();
  });
}

/*
 * 载入的"轮次"。每换一次房间、每点一次载入按钮就 +1。
 *
 * 为什么需要：上一轮还在飞的请求【不能再动界面】。
 * 国内那个反馈里就有这个叠加：点了三个房间，三轮 loadDays 同时在跑，
 * 谁最后回来谁改 setInfo / renderFiles —— 于是进度条和日期列表
 * 显示的是**你两次之前点的那个房间**，看上去就像界面在自己乱跳。
 */
var LOAD_GEN = 0;

function loadDays(items) {
  // 没载过、或者索引里的条数比已载入的多（当天又有新消息）-> 都要拉
  var todo = items.filter(function (d) {
    return needLoad(d);
  });
  if (!todo.length) { setInfo(); return Promise.resolve(0); }
  var gen = ++LOAD_GEN;
  var total = todo.length;             // 钉住总数：todo 会被 shift 掉，不能拿它当分母
  var done = 0, added = 0, failed = 0, timedOut = 0;
  var streak = 0, gaveUp = 0;          // 连着超时几次了 / 放弃了几个没拉
  var mine = function () { return gen === LOAD_GEN; };
  setInfo('载入中 0/' + total + ' …');

  // 顺序 4 路，避免一次开几十个请求
  function worker() {
    var d = todo.shift();
    if (!d) return Promise.resolve();
    // 这一轮已经过期了（你又换了房间）—— 别再往下拉了，省流量也省等待
    if (!mine()) return Promise.resolve();
    /*
     * 连着几个都超时 = 这条线路现在就是不通。
     * 再老老实实把剩下的一个个等满 20 秒，只是让你多干等几分钟，
     * 换不来任何一条消息。**放弃得快，才有机会去重试或换线路。**
     */
    if (streak >= NET_GIVEUP) { gaveUp += todo.length + 1; todo.length = 0; return Promise.resolve(); }
    return getPack(DATA + '/d/' + encodeURIComponent(d.room) + '/' + encodeURIComponent(d.day) + '.json')
      .then(function (pack) {
        // 数据照收：换了房间也不浪费已经拿到的东西，addAll 是按 id 去重的全局表
        added += addAll(expand(pack));
        // 记两件事：实际拿到多少条，以及是在哪一版索引下拿的。
        // 索引和日文件的条数偶尔会对不上（发布中途失败、或者赶上 GitHub 抽风），
        // 只比条数的话就会每次刷新都判定"有更新"反复重拉同一个文件。
        // 加上索引版本：同一版索引下只试一次，等下一次发布再自动重试。
        LOADED.set(d.room + '|' + d.day,
                   { got: (pack.rows || []).length, gen: INDEX && INDEX.generated });
        streak = 0;                    // 成功一次就把"连着超时"清零
      })
      .catch(function (e) {
        failed++;
        if (e && e.timeout) { timedOut++; streak++; } else { streak = 0; }
      })
      .then(function () {
        done++;
        if (mine()) setInfo('载入中 ' + done + '/' + total + ' …');
        return worker();
      });
  }
  var pool = [];
  for (var i = 0; i < Math.min(4, total); i++) pool.push(worker());
  return Promise.all(pool).then(function () {
    // 过期的那一轮到此为止：数据留下，界面一个字都不改
    if (!mine()) return added;
    renderFiles(); setInfo();
    /*
     * 失败原因要分开说 —— 这两件事你要做的动作完全不同：
     *   超时 / 连不上 → 网络问题，重试或者换线路
     *   404          → 那一天还没发布，等下一次发布就有了
     * 原来一律写成"可能还没发布"，国内用户看到的是一句
     * **和真实原因完全无关的解释**，只会往错的方向找。
     */
    if (timedOut) {
      setErr(timedOut + ' 个文件连不上（等了 ' + Math.round(NET_TIMEOUT_MS / 1000) +
             ' 秒没有响应）' +
             (gaveUp ? '，剩下 ' + gaveUp + ' 个没再试' : '') +
             '。国内直连 GitHub 经常是这样 —— ' +
             '换个网络、开代理，或者用 Cloudflare 那份地址再试。',
             // 只重拉这一批里失败的那几天：成功的已经写进 LOADED，needLoad 会跳过
             function () { loadDays(items); });
    } else if (failed) {
      setErr(failed + ' 个文件读取失败（可能还没发布）');
    } else {
      setErr('');
    }
    if (!ALL.size) emptyState('📭', '这些文件里没有可显示的消息',
                              failed ? '有 ' + failed + ' 个文件没读到' : '');
    else refresh(true);
    return added;
  });
}

/**
 * 快通道：最近一小包消息。
 *
 * 完整的日文件每小时才重发一次（45 KB 起步，还要同时喂 GitHub）。
 * recent.json 只有几 KB，采集端十分钟就更新一次 —— 所以点一次刷新，
 * 最新的消息基本上就在这里面。
 *
 * 拿不到就当没有：GitHub 那条线路根本不生成这个文件，那边照旧走日文件。
 * 重复也不要紧 —— addAll 按 id 去重，这些消息稍后出现在日文件里不会重。
 */
/*
 * 这个部署到底有没有快通道文件。
 *   null = 还不知道；true = 有；false = 试过了，没有（GitHub 那条线路就是没有）
 *
 * 为什么要记：GitHub Pages 上 data/recent.json 是【必然 404】的 ——
 * 那边根本不生成它。功能上没问题（拿不到就当没有），但每次刷新都去请求一次，
 * 浏览器控制台里就会反复冒出红色的 404。
 * 那个 404 是正常的，可它看起来一点都不正常 —— 会让人以为网站坏了。
 * 所以试过一次没有，本次会话就不再问了。
 */
var HAS_RECENT = null;
var RECENT_N = 0;          // 最近一次拿到的快通道条数（给信息栏看）

function loadRecent() {
  if (HAS_RECENT === false) return Promise.resolve(0);
  return getPack(DATA + '/recent.json').then(function (rec) {
    HAS_RECENT = true;
    var n = 0;
    RECENT_N = 0;
    ((rec && rec.packs) || []).forEach(function (p) {
      n += addAll(expand(p));
      // 记一笔"这个房间在快通道里出现过"。
      // 新加的聊天室要等整点那次完整发布才会进索引，在那之前侧栏是看不到它的 ——
      // 但它的消息其实十分钟前就已经在 recent 里了。有了这个，新房间
      // 十分钟内就能在侧栏出现，而不用干等最多一小时。
      RECENT_ROOMS[p.room] = (p.rows || []).length;
      RECENT_N += (p.rows || []).length;
    });
    return n;
  }).catch(function (e) {
    /*
     * ⚠️ 只有【真的 404】才永久封。
     *
     * 原来这里是"一次都没成功过就封" —— 而那一次恰恰是开页那一次。
     * 国内连 GitHub 开页超时是家常便饭，于是：
     *   开页第一次拿 recent 超时 → HAS_RECENT = false
     *   → 这一整个页面会话里，快通道【再也不会被请求】
     *   → 采集端日志明明写着"快通道：recent 684 条"，页面就是不涨
     *   → 你点多少次刷新都没用，因为第一行就 return 了
     *
     * 现在分开：404 = 这个部署确实没这个文件（GitHub 早期就是），封掉合理；
     * 超时 / 断网 = 下次还要再试，绝不能因为一次抖动就把功能关掉一整场。
     */
    var is404 = e && e.status === 404;
    if (is404 && HAS_RECENT === null) HAS_RECENT = false;
    return 0;
  });
}

/** 日文件载完之后再补一次 recent；有新东西才重画。 */
/*
 * 快通道拿回来之后，把结果【说出来】。
 *
 * 以前它是完全静默的：拿到 0 条和根本没请求，从界面上一模一样。
 * 于是"采集端日志写着 recent 684 条、页面就是不涨"这种情况，
 * 你在页面这边看不到任何线索，只能猜是发布的问题还是显示的问题。
 * 现在信息栏会写清楚：拿到几条、其中几条是新的。
 */
var RECENT_MSG = '';
function withRecent() {
  return loadRecent().then(function (n) {
    if (n) { renderFiles(); refresh(true); }
    RECENT_MSG = (HAS_RECENT === false)
      ? '快通道：这个站点没有 recent 文件'
      : ('快通道：' + RECENT_N + ' 条，其中 ' + n + ' 条是新的');
    setInfo();
    return n;
  });
}

/**
 * 错误条。第二个参数给了就顺带放一个「重试」按钮。
 *
 * 为什么值得多这一下：连不上的时候，唯一有用的动作就是再试一次 ——
 * 而在手机上"刷新整页"意味着**已经载进内存的几千条要全部重下**。
 * 一个只重拉失败那几天的按钮，代价差着一个数量级。
 */
function setErr(m, onRetry) {
  var box = $('#err');
  clear(box);
  if (!m) return;
  box.appendChild(document.createTextNode(m));
  if (typeof onRetry !== 'function') return;
  var b = el('button', 'retry', '重试');
  b.style.marginLeft = '8px';
  b.onclick = function () { setErr(''); onRetry(); };
  box.appendChild(b);
}
function setInfo(m) {
  if (m) { $('#info').textContent = m; return; }
  if (!INDEX) { $('#info').textContent = ''; return; }
  var mine = roomDays();
  var mineN = mine.reduce(function (a, d) { return a + (d.n || 0); }, 0);
  var mineLoaded = 0;
  LOADED.forEach(function (v, k) { if (k.split('|')[0] === sel.room) mineLoaded++; });
  $('#info').textContent =
    roomLabel(sel.room) + '：' + mineN.toLocaleString() + ' 条 / ' + mine.length + ' 天 · 已载入 ' +
    mineLoaded + ' 天\n存档合计 ' + INDEX.total.toLocaleString() + ' 条' +
    (RECENT_MSG ? '\n' + RECENT_MSG : '');
}

function emptyState(icon, title, hint) {
  var f = $('#feed');
  clear(f);
  var ph = el('div', 'placeholder');
  ph.appendChild(el('div', 'big', icon));
  ph.appendChild(el('div', title));
  if (hint) {
    var h = el('div', null, hint);
    h.style.fontSize = '12.5px';
    ph.appendChild(h);
  }
  f.appendChild(ph);
}

/*
 * ============================================================================
 *                       合同计算器（第二个模式）
 * ============================================================================
 *
 * 模式有两层：
 *   顶栏      聊天记录 / 计算器
 *   计算器里  销售办公室计算器 / 合同计算器（还没做，先占个位）
 *
 * 和聊天存档【一行状态都不共享、一个函数都不互相调用】——
 * 存档那一套（索引、日文件、深搜、滚到底）是这页最难验的部分，
 * 计算器写崩了也不该碰到它。
 *
 * ---- 销售办公室：模型 ----
 *
 *   每个产品 i：数量 qᵢ、合同单价 pᵢ、要求品质 Qᵢ、你的单位进价 cᵢ
 *   合同奖励：pᵢ · qᵢ · b · Qᵢ          b = 奖励% / 100
 *   合同占用销售办公室 H 小时，这段时间付工资 W（整张合同的总额）
 *
 *   收入 R = Σ pᵢqᵢ(1 + b·Qᵢ)
 *   货款 G = Σ cᵢqᵢ
 *   利润   = R − G − W
 *   时利   = 利润 ÷ H
 *
 * 这套公式是拿他那张 Excel 的实际数字逐位对过的（测试里钉着）。
 */

/*
 * ⚠️ 输入框是 type=text，不是 type=number。这不是随便选的。
 *
 * 线上第一版用的 number，结果【小数点打不进去】：
 * 每敲一下都会 onset(Number(值)) 然后重画，而 Number('1.') === 1，
 * 重画时写回去的是 '1' —— 你刚打的那个点当场就没了，永远输不到小数位。
 *
 * 现在状态里存的是**原始字符串**，只有算的时候才 Number() —— '1.' 原样留着。
 * 顺带把中文输入法下最常见的几个字符就地换掉（。．，全角数字），
 * 不然中文键盘打小数点会直接被过滤掉，看着像键盘坏了。
 */
function normNum(s) {
  s = String(s == null ? '' : s);
  s = s.replace(/[。．｡､、,，]/g, '.');                       // 中文句号/逗号 → 小数点
  s = s.replace(/[０-９]/g, function (c) {                     // 全角数字 → 半角
    return String.fromCharCode(c.charCodeAt(0) - 0xFEE0);
  });
  s = s.replace(/[－ー—–]/g, '-');
  s = s.replace(/[^0-9.\-]/g, '');
  var neg = s.charAt(0) === '-';
  s = s.replace(/-/g, '');
  var parts = s.split('.');
  if (parts.length > 2) s = parts.shift() + '.' + parts.join('');   // 只留第一个点
  return (neg ? '-' : '') + s;
}

/** 只取数，取不出来当 0 —— 空着、只打了个负号、只打了个点都不该让整页炸掉。 */
function cnum(v) { var n = Number(v); return isFinite(n) ? n : 0; }

/**
 * 合同：收入、货款、利润、时利。
 *
 * ⚠️ 奖励是 p·q·b·Q，**q 只乘一次**。
 * 原表 G5 已经含了 q，后面 G9 又写成 (B5+G5)*A5 —— 等于把奖励乘了 q 次。
 * 数量填 1 看不出来，填 10 就差五十多万。
 */
function calcContract(c) {
  var b = cnum(c.bonus) / 100;
  var H = cnum(c.hours) || 1;          // 兜个 1，别让它变成 Infinity
  var W = cnum(c.wage);
  var rows = (c.items || []).map(function (it) {
    var q = cnum(it.q), p = cnum(it.p), Q = cnum(it.quality), cost = cnum(it.cost);
    var gross = p * q;
    var bonus = p * q * b * Q;
    var goods = cost * q;
    return { q: q, p: p, quality: Q, cost: cost,
             gross: gross, bonus: bonus, rev: gross + bonus,
             goods: goods, profit: gross + bonus - goods,
             perQ: p * b };            // 每 +1 品质，合同多给多少（每单位）
  });
  var add = function (k) {
    return rows.reduce(function (a, r) { return a + r[k]; }, 0);
  };
  var rev = add('rev'), goods = add('goods');
  var profit = rev - goods - W;
  return { rows: rows, rev: rev, goods: goods, wage: W, hours: H,
           cost: goods + W, profit: profit, hourly: profit / H };
}

/**
 * 要达到目标时利，货款最多能花多少。
 *
 *   货款总预算 = 收入 − 工资 − 目标时利 × 小时数
 *
 * 这个数**原表其实是对的**（G9 / G18 = 35600.78）。
 * 坏的是把预算分给几个产品那一段：原式 G14 = B5 / (B5*A5 + B6*A6)，
 * 分子是单价、分母是总收入，两边不同量纲 —— 数量都填 1 时刚好蒙对。
 * 这里换成按收入占比分。
 */
function calcBudget(c) {
  var r = calcContract(c);
  var budget = r.rev - r.wage - cnum(c.target) * r.hours;
  var revSum = r.rev;
  var byShare = r.rows.map(function (row) {
    var share = revSum ? row.rev / revSum : 0;
    var money = budget * share;
    return { share: share, money: money, unit: row.q ? money / row.q : 0 };
  });
  return { contract: r, budget: budget, byShare: byShare };
}

/**
 * 品质值不值得加钱。
 *
 * 合同每 +1 品质给你 p×b（每单位）：
 *   供应商每 +1 品质加价 < p×b  → 买高 q 划算
 *   加价 > p×b                 → 高 q 是在给供应商送钱
 */
function qualityWorth(p, bonusPct) { return cnum(p) * cnum(bonusPct) / 100; }

/**
 * 生产端：成本压到多少时利才够。
 *
 * 【界面上暂时不显示】—— 他说那几个产量数据不好弄，等有数据再说。
 * 函数和测试留着，到时候把卡片接回去就行，不用重写。
 */
function calcProd(pr) {
  var mul = (1 + cnum(pr.speed) / 100) * (cnum(pr.cycle) || 1);
  return (pr.rows || []).map(function (row) {
    var rate = cnum(row.rate) * mul;
    var need = rate ? cnum(pr.target) / rate : Infinity;
    return { name: row.name, rate: rate, need: need,
             price: cnum(row.price), max: cnum(row.price) - need };
  });
}

/*
 * ============================================================================
 *                          一条龙时利
 * ============================================================================
 *
 * 来源是他那张「一条龙真实时利计算器」。那张表大半是半成品，
 * 唯一算得通的是右下角那一块；我把它每个数都还原过一遍
 * （bench/27-chain.js，逐位对上），这里是把它做成能用的东西。
 *
 * ---- 核心：为什么「耗时」的单位是【等级·小时】 ----
 *
 * 每一步的「产量」是**每级每小时**能出多少个。所以
 *
 *     总消耗量 ÷ 每级产量  =  这一步要占掉多少个「等级·小时」
 *
 * 把所有【自产】的步骤加起来，就是这一批货总共要占掉多少等级·小时。于是
 *
 *     ★ 一条龙时利 = 利润 ÷ 总耗时（等级·小时）
 *
 * 这正好就是他说的那个定义 ——「每个建筑、每小时、每等级的利润」。
 * 2 级等于 2 个 1 级，所以等级就是产能单位，除下去单位天然对得上。
 *
 * ⚠️ 利润和消耗量必须是**同一批货**的：
 * 消耗量按 21.4 个成品填，利润就得是这 21.4 个的利润。
 * 两边同时放大缩小，时利不变 —— 所以按 1 个填也行，按一批填也行，
 * 但不能一个按 1 个、一个按一批。
 *
 * ---- 每种建筑的时利 ----
 *
 *     权重  = 该建筑负责的那几步耗时之和 ÷ 总耗时
 *     建筑时利 = 权重 × 一条龙时利
 *
 * 几个建筑的时利加起来正好等于总时利（权重和为 1）——
 * 也就是"这条链的时利里，有多少是这个建筑挣的"。
 */

/**
 * 一条龙：总耗时、时利、每种建筑分到多少。
 *
 * 入参（数字都是输入框原文字符串，见 normNum 那段）：
 *   { profit, steps: [{ name, rate, need, self, bld }], blds: [{ id, name }] }
 *   step.bld = 这一步在哪个建筑里做（建筑的 id），空 = 还没分配
 */
function calcChain(c) {
  var steps = (c.steps || []).map(function (s, i) {
    var rate = cnum(s.rate), need = cnum(s.need);
    var self = !!s.self;
    return {
      i: i,
      name: String(s.name || ''),
      bld: String(s.bld || ''),
      rate: rate, need: need, self: self, final: !!s.final,
      // 自产才占等级·小时；外购的那几步你不用建楼，所以是 0
      hours: (self && rate > 0) ? need / rate : 0,
      // 勾了自产却没填产量 = 这一步被静默当成 0 耗时，时利会虚高
      noRate: self && rate <= 0 && need > 0,
    };
  });

  var T = 0, noRate = 0;
  steps.forEach(function (s) { T += s.hours; if (s.noRate) noRate++; });

  var profit = cnum(c.profit);
  var hourly = T > 0 ? profit / T : null;      // ← 这就是「一条龙时利」

  // 按建筑归拢。建筑的顺序按他自己排的来，不重新排序。
  var blds = (c.blds || []).map(function (b) {
    return { id: b.id, name: String(b.name || ''), hours: 0, steps: [], selfN: 0 };
  });
  var byId = {};
  blds.forEach(function (b) { byId[b.id] = b; });

  var orphan = 0;                              // 自产、但还没分到任何建筑
  steps.forEach(function (s) {
    var b = byId[s.bld];
    if (!b) { if (s.hours > 0) orphan++; return; }
    /*
     * 分给它的产品【全都列出来】，包括外购的那些。
     * 只列自产的话，一个建筑明明分了三个产品、却显示"还没选产品"——
     * 你会以为刚才那几下点空了。耗时那一栏是 0 就够说明问题了。
     */
    b.steps.push(s.name || '（未命名）');
    if (s.hours > 0) { b.hours += s.hours; b.selfN++; }
  });

  blds.forEach(function (b) {
    b.weight = T > 0 ? b.hours / T : 0;
    // 几个建筑的时利加起来 = 总时利（权重和为 1）
    b.hourly = (hourly == null) ? null : b.weight * hourly;
  });

  var fin = null;
  steps.forEach(function (s) { if (s.final && fin == null) fin = s; });

  return { steps: steps, blds: blds, hours: T, profit: profit,
           hourly: hourly, noRate: noRate, orphan: orphan, final: fin };
}

/*
 * 默认值【只留不属于任何人的那些】：小时数 47、目标时利 500。
 * 工资、数量、单价、奖励%、品质、进价一律空着 ——
 * 那几个是他自己的单子数据，不该变成所有人打开就看见的示例。
 */
function calcBlankItem() { return { q: '', p: '', quality: '', cost: '' }; }
function calcBlank() {
  return { hours: 47, wage: '', bonus: '', target: 500, items: [calcBlankItem()] };
}
/*
 * 一条龙的默认值 —— 他给的那组（BFR 全自产，两个建筑）。
 * 逐行耗时和他贴过来的一致：
 *   bfr 3.7037 / 轨道助推器 0.5405 / 星际飞船 2.7027 / 机身 9.8522 / 燃料储罐 3.9711
 *   总耗时 20.7703，利润 10000 → 一条龙时利 481.46
 */
var CHAIN_DEFAULT = {
  profit: '10000',
  blds: [
    { id: 'b1', name: '垂直整合设施' },
    { id: 'b2', name: '航空航天厂' },
  ],
  steps: [
    { name: 'bfr',       rate: '0.27', need: '1',  self: true, bld: 'b1', final: true },
    { name: '轨道助推器', rate: '1.85', need: '1',  self: true, bld: 'b2', final: false },
    { name: '星际飞船',   rate: '0.37', need: '1',  self: true, bld: 'b2', final: false },
    { name: '机身',       rate: '4.06', need: '40', self: true, bld: 'b2', final: false },
    { name: '燃料储罐',   rate: '5.54', need: '22', self: true, bld: 'b2', final: false },
  ],
};

var CALC_DEFAULT = {
  hours: 47, wage: '', bonus: '', target: 500,
  items: [calcBlankItem()],
  // 生产端的数据先留着，卡片没显示。等他有数据了再接回来。
  prod: { target: 600, speed: 0, cycle: 1, rows: [] },
  chain: JSON.parse(JSON.stringify(CHAIN_DEFAULT)),
};

var CALC = (function () {
  try {
    var raw = JSON.parse(localStorage.getItem('simco.calc') || 'null');
    if (raw && raw.items && raw.items.length) {
      if (!raw.prod) raw.prod = { target: 600, speed: 0, cycle: 1, rows: [] };
      /*
       * 一条龙这一块的结构改过（去掉了售价/外购价，改成建筑列表 + 直接填利润）。
       * 老存档没有 blds、字段也对不上 —— 与其猜着迁移，不如整块换成默认的：
       * 那一块本来就是"打开对着原表看"的示例，丢了不心疼；
       * 而**猜着迁移出来的半套数据才是真麻烦**，你会以为它算的是你填的东西。
       */
      if (!raw.chain || !raw.chain.steps || !raw.chain.blds) {
        raw.chain = JSON.parse(JSON.stringify(CHAIN_DEFAULT));
      }
      return raw;
    }
  } catch (e) { /* 存的东西坏了就从空的开始，不值得为它报错 */ }
  return JSON.parse(JSON.stringify(CALC_DEFAULT));
})();

/*
 * 存盘。
 *
 * ⚠️ `simco.calc` 这个键**是对外接口** —— 油猴插件的「合同对比」
 * 靠读它拿到你现在填的这张单子。所以下面几件事不能随便动：
 *   · 键名 'simco.calc'
 *   · 字段名 hours / wage / bonus / target / items[{q,p,quality,cost}]
 *   · 值是【字符串】（输入框的原文，见 normNum 那段）
 * 要改结构的话，插件那边（userscript/simco-chat-stats.user.js）要一起改，
 * 而且插件是用户自己更新的 —— 会有一段时间两边版本对不上。
 * 所以：**只加字段，不改已有字段的名字和含义。**
 */
function calcSave() {
  try { localStorage.setItem('simco.calc', JSON.stringify(CALC)); }
  catch (e) { /* 存不了不影响算 */ }
}

/* ------------------------------ 显示用的小工具 ------------------------------ */

/** 钱：整数、带千分位。这个量级上小数位没有意义，只会让数字变长。 */
function cmoney(x) {
  if (!isFinite(x)) return '—';
  return Math.round(x).toLocaleString();
}
/** 时利：要看到小数点后两位 —— 它是这页唯一一个"差几毛钱也想知道"的数。 */
function cmoney2(x) {
  if (!isFinite(x)) return '—';
  return x.toLocaleString(undefined,
    { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
/** 定小数位。耗时那种小数（0.1244）用它，不带千分位。 */
function cfix(x, d) {
  return isFinite(x) ? x.toFixed(d == null ? 2 : d) : '—';
}
/**
 * 会看大小的钱。
 *
 * 一条龙那边的「自产平衡价」经常是个位数甚至零点几（产量高的东西
 * 每个本来就不值钱）——  一律取整的话 0.82 会显示成 1、
 * 而 0.4 会显示成 0，**看着就像没算出来**。
 * 所以小数额保留两位，大数额还是整数带千分位（那时候小数位没意义）。
 */
function cnice(x) {
  if (!isFinite(x)) return '—';
  if (Math.abs(x) < 1000) return String(Math.round(x * 100) / 100);
  return Math.round(x).toLocaleString();
}

function cel(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = String(text);
  return e;
}

/**
 * 一个输入框。改了就重算重画整块。
 *
 * 全画一遍在任何设备上都是零点几毫秒，不值得为它写一套依赖追踪。
 * 但**焦点和光标位置要还回去** —— 否则你打第二个字符时光标已经不在框里了，
 * 而且这个坏法在测试里看不出来，只有真去打字才发现。
 */
function cinput(val, onset, key, cls) {
  var i = document.createElement('input');
  i.type = 'text';                 // 见上面 normNum 那段：number 会吃掉小数点
  i.setAttribute('inputmode', 'decimal');
  i.setAttribute('autocomplete', 'off');
  if (cls) i.className = cls;
  if (key) i.setAttribute('data-k', key);
  i.value = (val == null) ? '' : String(val);
  i.oninput = function () {
    var raw = i.value;
    var fixed = normNum(raw);
    var caret = null;
    try { caret = i.selectionStart; } catch (e) { caret = null; }
    if (fixed !== raw && caret != null) caret -= (raw.length - fixed.length);
    onset(fixed);
    calcSave();
    renderCalc();
    if (!key) return;
    var back = document.querySelector('#calc [data-k="' + key + '"]');
    if (!back || !back.focus) return;
    back.focus();
    try {
      var at = caret == null ? back.value.length : Math.max(0, caret);
      back.setSelectionRange(at, at);
    } catch (e) { /* 个别浏览器不支持，无所谓 */ }
  };
  return i;
}

function cfield(label, val, onset, key) {
  var w = cel('div', 'fld');
  w.appendChild(cel('label', null, label));
  w.appendChild(cinput(val, onset, key));
  return w;
}

function ckpi(k, v, cls) {
  var d = cel('div', 'kpi' + (cls ? ' ' + cls : ''));
  d.appendChild(cel('div', 'k', k));
  d.appendChild(cel('div', 'v', v));
  return d;
}

/**
 * 建表。哪几列是输入列【自己认】—— 看第一行有没有塞元素进去。
 * 让调用方多传一个数组的话，早晚会和真实的列对不上（加了一列忘了改），
 * 而错的样子只是"标题歪了一点"，没人会发现。
 */
function ctable(head, rows) {
  var isIn = (rows[0] || []).map(function (c) { return !!(c && c.nodeType); });
  var wrap = cel('div', 'tw');
  var t = document.createElement('table');
  var thead = document.createElement('thead');
  var tr = document.createElement('tr');
  head.forEach(function (h, i) { tr.appendChild(cel('th', isIn[i] ? 'i' : null, h)); });
  thead.appendChild(tr); t.appendChild(thead);
  var tb = document.createElement('tbody');
  rows.forEach(function (cells) {
    var r = document.createElement('tr');
    cells.forEach(function (c) {
      var td = document.createElement('td');
      if (c && c.nodeType) { td.className = 'i'; td.appendChild(c); }
      else if (c && c.txt != null) { td.textContent = c.txt; td.className = c.cls || ''; }
      else td.textContent = c == null ? '' : String(c);
      r.appendChild(td);
    });
    tb.appendChild(r);
  });
  t.appendChild(tb); wrap.appendChild(t);
  return wrap;
}

/**
 * 产品行的输入格子 + 那一行自己的删除键。
 *
 * 原来只能删最后一行 —— 中间填错一行就得把后面的全删了重来。
 * 现在每行自己带一个 ×，删的就是这一行。
 * 只剩一行时不给删：删光了没有任何好处，还得再点一次"加一个"。
 */
function citemCells(list, it, i, keyPre, onchange) {
  var mk = function (f, suffix) {
    return cinput(it[f], function (v) { it[f] = v; }, keyPre + i + suffix);
  };
  var cells = [cel('span', null, '产品 ' + (i + 1)),
               mk('q', 'q'), mk('p', 'p'), mk('quality', 'Q'), mk('cost', 'c')];
  var del = cel('button', 'xbtn', '×');
  del.title = '删掉这一行';
  if (list.length <= 1) { del.disabled = true; }
  else {
    del.onclick = function () {
      list.splice(i, 1); calcSave(); (onchange || renderCalc)();
    };
  }
  return { cells: cells, del: del };
}

/* ------------------------------ 主界面 ------------------------------ */

/** 勾选框。改了就重画，焦点还回去。 */
function ccheck(val, onset, key) {
  var i = document.createElement('input');
  i.type = 'checkbox';
  i.className = 'cchk';
  i.checked = !!val;
  if (key) i.setAttribute('data-k', key);
  i.onchange = function () {
    onset(!!i.checked);
    calcSave();
    renderCalc();
    if (!key) return;
    var back = document.querySelector('#calc [data-k="' + key + '"]');
    if (back && back.focus) back.focus();
  };
  return i;
}

/** 文本框（产品名 / 建筑名）。不走 normNum —— 这两列本来就不是数字。 */
function ctext(val, onset, key) {
  var i = document.createElement('input');
  i.type = 'text';
  i.setAttribute('autocomplete', 'off');
  if (key) i.setAttribute('data-k', key);
  i.value = (val == null) ? '' : String(val);
  i.oninput = function () {
    var caret = null;
    try { caret = i.selectionStart; } catch (e) { caret = null; }
    onset(i.value);
    calcSave();
    renderCalc();
    if (!key) return;
    var back = document.querySelector('#calc [data-k="' + key + '"]');
    if (!back || !back.focus) return;
    back.focus();
    try {
      var at = caret == null ? back.value.length : caret;
      back.setSelectionRange(at, at);
    } catch (e) { /* 不支持就算了 */ }
  };
  return i;
}

/*
 * 正在给哪个建筑选产品。
 *
 * 这是【纯界面状态】，不进 CALC、不存盘 ——
 * 存下来的话刷新之后会莫名其妙停在选择模式里，而那时候你早忘了在选什么。
 */
var CHAIN_PICK = null;

function chainNewId() {
  return 'b' + Math.floor(Math.random() * 1e9).toString(36) +
         (CALC.chain.blds ? CALC.chain.blds.length : 0);
}

function renderChain(box) {
  var C = CALC.chain;
  if (!C.blds) C.blds = [];
  var R = calcChain(C);
  var picking = null;
  C.blds.forEach(function (b) { if (b.id === CHAIN_PICK) picking = b; });
  if (!picking) CHAIN_PICK = null;

  /* ---------------- 卡片 ①：产品 ---------------- */
  var c1 = cel('div', 'card');
  c1.appendChild(cel('h3', null, '一条龙时利'));
  c1.appendChild(cel('div', 'sub',
    '「产量」填【每级每小时】做多少个。于是 总消耗量÷产量 的单位是「等级·小时」，' +
    '时利 = 利润 ÷ 总耗时，也就是每个建筑等级每小时赚多少。' +
    '利润和消耗量要按【同一批货】填。'));

  var g1 = cel('div', 'fgrid');
  g1.appendChild(cfield(
    '利润' + (R.final && R.final.name ? '（' + R.final.name + '）' : ''),
    C.profit, function (v) { C.profit = v; }, 'chprofit'));
  c1.appendChild(g1);

  // 选产品模式的横幅
  if (picking) {
    var bn = cel('div', 'pickbar');
    bn.appendChild(cel('b', null, '正在给「' + (picking.name || '未命名建筑') + '」选产品'));
    bn.appendChild(document.createTextNode(' —— 点下面的产品行来选 / 取消，选中的是绿的。'));
    var okb = cel('button', 'cbtn pri', '确认');
    okb.onclick = function () { CHAIN_PICK = null; renderCalc(); };
    bn.appendChild(okb);
    c1.appendChild(bn);
  }

  var rows = C.steps.map(function (st, i) {
    var s = R.steps[i];
    var del = cel('button', 'xbtn', '×');
    del.title = '删掉这一行';
    if (C.steps.length <= 1) del.disabled = true;
    else del.onclick = function () { C.steps.splice(i, 1); calcSave(); renderCalc(); };

    // 成品：单选。选中的那一行只是个标记，公式里不特殊对待它。
    var fin = document.createElement('input');
    fin.type = 'radio';
    fin.className = 'cchk';
    fin.name = 'chainfinal';
    fin.checked = !!st.final;
    fin.onclick = function () {
      C.steps.forEach(function (x) { x.final = false; });
      st.final = true; calcSave(); renderCalc();
    };

    var bname = '';
    C.blds.forEach(function (b) { if (b.id === st.bld) bname = b.name || '未命名'; });

    return [
      ctext(st.name, function (v) { st.name = v; }, 'cs' + i + 'n'),
      cinput(st.rate, function (v) { st.rate = v; }, 'cs' + i + 'r'),
      cinput(st.need, function (v) { st.need = v; }, 'cs' + i + 'q'),
      ccheck(st.self, function (v) { st.self = v; }, 'cs' + i + 's'),
      fin,
      { txt: bname || '—' },
      { txt: s.self ? cfix(s.hours, 4) : '—', cls: s.self ? 'out' : '' },
      del,
    ];
  });
  var tw = ctable(
    ['产品', '每级每小时产量', '该产品总消耗量', '自产', '成品', '建筑', '耗时(级·时)', ''],
    rows);

  /*
   * 选产品模式：整行可点。

/*
 * ============ 数据到底卡在哪一边 ============
 *
 * "表格在正常更新、发布也报成功，可网页就是不涨" —— 这种时候
 * 光看页面完全分不清是【发布端在发旧数据】还是【页面没载到】。
 * 而这两件事要查的地方完全不同。
 *
 * 页面这边其实有足够的信息自己判断，只是以前没说出来：
 *
 *   索引时间  = 发布端最后一次跑完是什么时候（index.json 里的 generated）
 *   最新消息  = 已经载进来的消息里最新的那一条是什么时候
 *
 *   索引新、消息旧  → **发布端在发旧数据**，去查采集/合并那边
 *   索引也旧        → **发布根本没跑**，去查定时发布
 *   两个都新        → 页面是好的，你要的那条可能真的还没发生
 */
function freshLines() {
  var out = [];
  if (!INDEX) return out;
  var now = Date.now();
  var ixMs = Date.parse(INDEX.generated || '');
  var ixMin = ixMs ? Math.round((now - ixMs) / 60000) : -1;

  // 已载入的消息里最新的一条（不分房间 —— 问的是"这份数据整体新不新"）
  var newest = 0;
  ALL.forEach(function (m) {
    var t = Date.parse(m.dt || '');
    if (t && t > newest) newest = t;
  });
  var msgMin = newest ? Math.round((now - newest) / 60000) : -1;

  out.push('索引更新于 ' + (ixMin < 0 ? '？' : ixMin + ' 分钟前'));
  out.push('最新消息是 ' + (msgMin < 0 ? '？' : msgMin + ' 分钟前') + '的');

  if (ixMin >= 0 && msgMin >= 0) {
    if (ixMin < 90 && msgMin > 90) {
      out.push('⚠️ 索引是新的、消息是旧的 —— 说明【发布端在发旧数据】，' +
               '问题不在这个页面，去查采集端那边的合并/发布。');
    } else if (ixMin > 90) {
      out.push('⚠️ 索引本身就是旧的 —— 说明【定时发布没跑】，去查发布触发器。');
    }
  }
  return out;
}

function boot() {
  /*
   * 宽度档位【在拿数据之前就先应用】。
   * 放在后面的话，上次选了紧凑的人会先看到一帧正常宽度再跳回去 ——
   * 一闪一跳，看着像页面自己抖了一下。
   */
  applyWidth();
  // 屏蔽名单也要在第一帧之前读回来 —— 晚一步的话，被屏蔽的人会先露一下脸
  maskLoad();
  /*
   * 模式也在拿数据之前就定下来。
   * 上次停在计算器的人，如果等索引回来才切，会先闪一下聊天界面 ——
   * 而索引在国内可能要等十几秒，那就不是"闪一下"了。
   */
  renderModeTabs();
  if (sel.mode === 'calc') setMode('calc');
  renderTools();
  getJSON(DATA + '/index.json').then(function (ix) {
    INDEX = ix;
    // 只按条数过滤，不按 published 过滤。published:false 只表示"这天还有一部分
    // 没传上去"，已经传上去的那部分是真实存在的，不该被藏起来。
    INDEX.days = (ix.days || []).filter(function (d) { return (d.n || 0) > 0; });
    if (!encReady()) return;
    // 索引到手才知道有哪些房间。上次选的那个可能已经不在了，回落到 ZH。
    sel.room = pickRoom();
    renderFiles(); setInfo();
    var about = $('#about');
    clear(about);
    about.appendChild(el('div', null, '更新时间 ' + fmtFull(ix.generated)));
    freshLines().forEach(function (t) {
      var d = el('div', null, t);
      if (t.indexOf('⚠️') === 0) { d.style.color = 'var(--warn)'; d.style.lineHeight = '1.6'; }
      about.appendChild(d);
    });
    about.appendChild(el('div', null, '游戏内公开聊天频道的存档，仅供查阅。'));
    // 页面版本号：两个站对不上就说明有一边的页面没更新
    var bv = el('div', null, '页面 ' + PAGE_BUILD);
    bv.style.opacity = '.55';
    bv.style.fontVariantNumeric = 'tabular-nums';
    bv.title = '这份页面的版本号。CF 和 GitHub 两个站的这个号应该一样，' +
               '对不上就说明有一边没更新。';
    about.appendChild(bv);
    if (!INDEX.days.length) {
      emptyState('📭', '索引里还没有已发布的日期',
                 '采集端跑一会儿并发布快照之后，刷新本页即可');
      return;
    }
    // 只载【当前房间】最近三天。以前这里是 INDEX.days.slice(0,3) ——
    // 三个房间混在一起排序，这三天很可能全是同一个房间的。
    return loadDays(roomDays().slice(0, 3)).then(withRecent);
  }).catch(function (e) {
    setErr('读不到索引：' + e.message);
    emptyState('📭', '还没有数据', '等采集端发布第一份快照后刷新即可');
  });
}

// ---------- 时间 / 颜色 ----------
var PALETTE = ['#7dd3fc','#86efac','#fcd34d','#fca5a5','#c4b5fd','#f9a8d4',
               '#5eead4','#fdba74','#a5b4fc','#d9f99d','#f0abfc','#93c5fd'];
function colorOf(sid) { return PALETTE[Math.abs(Number(sid) || 0) % PALETTE.length]; }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function dayOf(t) { var d = new Date(t);
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function timeOf(t) { var d = new Date(t);
  return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }
function hmOf(t) { var d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function fmtFull(iso) { var d = new Date(iso); return isNaN(d) ? '未知' :
  dayOf(d.getTime()) + ' ' + hmOf(d.getTime()); }
function dayLabel(day) {
  var today = dayOf(Date.now()), y = dayOf(Date.now() - 86400000);
  if (day === today) return day + '  今天';
  if (day === y) return day + '  昨天';
  var w = '日一二三四五六'[new Date(day + 'T12:00:00').getDay()];
  return day + '  周' + (w || '?');
}

// ---------- 正文渲染：分词后逐个建节点，一次 innerHTML 都不用 ----------
function splitBy(parts, re, type) {
  var out = [];
  parts.forEach(function (p) {
    if (p.t !== 'txt') { out.push(p); return; }
    var last = 0, m;
    re.lastIndex = 0;
    while ((m = re.exec(p.s)) !== null) {
      if (!m[0].length) { re.lastIndex++; continue; }
      if (m.index > last) out.push({ t: 'txt', s: p.s.slice(last, m.index) });
      out.push({ t: type, s: m[0] });
      last = m.index + m[0].length;
    }
    if (last < p.s.length) out.push({ t: 'txt', s: p.s.slice(last) });
  });
  return out;
}

function appendText(parent, text, q) {
  if (!q) { parent.appendChild(document.createTextNode(text)); return; }
  var low = text.toLowerCase(), needle = q.toLowerCase(), i = 0;
  while (true) {
    var at = low.indexOf(needle, i);
    if (at < 0) { parent.appendChild(document.createTextNode(text.slice(i))); break; }
    if (at > i) parent.appendChild(document.createTextNode(text.slice(i, at)));
    parent.appendChild(el('mark', null, text.slice(at, at + needle.length)));
    i = at + needle.length;
  }
}

/*
 * ==================== 玩家贴的图 ====================
 *
 * 玩家会发 https://snipboard.io/XXXX.jpg 这种截图链接。
 * 只当链接的话，看存档的人要一个个点开 —— 而截图往往正是那条消息的全部内容。
 *
 * ⚠️ 但"把任何 URL 都当图片渲染"是不行的，这是别人写的内容：
 *   · 只认【白名单里的域名】，别的一律还是纯链接
 *   · 路径必须长得像图片文件（防止拿站内某个页面当图片加载）
 *   · 只认 https
 *   · no-referrer：不告诉对方是从哪个页面点过去的
 *   · lazy：滚到才加载 —— 一整天几千条里可能有几十张图，
 *     一次性全加载既慢又等于把每个访客的 IP 都送过去
 *
 * ⚠️ 还有一件必须说清楚的事：**图片是从第三方加载的。**
 * 谁看存档，谁的浏览器就会去连 snipboard。这是内嵌外部图片的固有代价，
 * 换不掉 —— 除非把图转存到自己这边，那是另一件事（版权、容量、失效）。
 */
var IMG_HOSTS = [
  'https://snipboard.io/',
  'https://i.snipboard.io/',
];
/*
 * 路径必须【整条】长这样：/文件名.后缀，不许有下级目录。
 * ⚠️ 只写结尾锚点（$）是不够的 —— /a/b.jpg 一样能匹配上末尾那段。
 * 起头的 ^ 才是把"多级路径"挡在外面的那一笔。
 */
var RE_IMG_PATH = /^\/[A-Za-z0-9_\-]+\.(?:jpg|jpeg|png|gif|webp)$/i;

/** 这个链接能不能安全地当图片显示。 */
function imageUrl(u) {
  var s = String(u || '');
  for (var i = 0; i < IMG_HOSTS.length; i++) {
    if (s.indexOf(IMG_HOSTS[i]) !== 0) continue;
    // 掐掉 ?query 和 #hash 再看路径形状 —— 带参数的一律不认
    if (s.indexOf('?') >= 0 || s.indexOf('#') >= 0) return null;
    try {
      var path = s.slice(IMG_HOSTS[i].length - 1);   // 保留开头的 /
      if (RE_IMG_PATH.test(path)) return s;
    } catch (e) { return null; }
    return null;
  }
  return null;
}

/*
 * 灯箱。整个页面共用一个，开的时候才填内容 ——
 * 每张图各建一个的话，一天几十张图就是几十个隐藏节点白占内存。
 */
var LB = { open: false, url: '', real: false };

function lbClose() {
  var box = $('#lightbox');
  if (!box) return;
  box.hidden = true;
  box.className = '';
  clear(box);
  LB.open = false;
  try { document.body.classList.remove('lb'); } catch (e) {}
}

function lbToggleReal() {
  var box = $('#lightbox');
  if (!box) return;
  LB.real = !LB.real;
  box.className = LB.real ? 'real' : '';
  var t = $('#lbzoom');
  if (t) t.textContent = LB.real ? '缩到整屏' : '看原始大小';
}

function lbOpen(url) {
  var box = $('#lightbox');
  if (!box) return;
  clear(box);
  LB.open = true; LB.url = url; LB.real = false;
  box.className = '';
  box.hidden = false;
  try { document.body.classList.add('lb'); } catch (e) {}

  var stage = el('div', 'lbstage');
  var img = el('img');
  img.src = url;
  img.alt = '玩家贴的图';
  img.referrerPolicy = 'no-referrer';
  /*
   * 点图片本身 = 在【铺满】和【原始像素】之间切，不关灯箱。
   * "看不清"要靠这个解决：铺满屏幕对一张 1920 宽的截图，
   * 在手机上仍然是缩小的。
   */
  img.onclick = function (e) { e.stopPropagation(); lbToggleReal(); };
  img.onerror = function () { lbClose(); };
  stage.appendChild(img);
  /* 点空白处关掉 —— 手机上这是最自然的动作 */
  stage.onclick = function () { lbClose(); };
  box.appendChild(stage);

  var bar = el('div', 'lbbar');
  var zoom = el('button', 'lbbtn', '看原始大小');
  zoom.id = 'lbzoom';
  zoom.onclick = function (e) { e.stopPropagation(); lbToggleReal(); };
  bar.appendChild(zoom);

  var open = el('a', 'lbbtn', '新标签打开');
  open.href = url; open.target = '_blank';
  open.rel = 'noopener noreferrer nofollow';
  open.onclick = function (e) { e.stopPropagation(); };
  bar.appendChild(open);

  bar.appendChild(el('span', 'sp'));

  var x = el('button', 'lbbtn', '✕ 关闭');
  x.setAttribute('aria-label', '关闭');
  x.onclick = function (e) { e.stopPropagation(); lbClose(); };
  bar.appendChild(x);

  box.appendChild(bar);
  box.onclick = function () { lbClose(); };
}

/*
 * ===================== 玩家资料页 =====================
 *
 * 点名字打开。三件事写在一起：接口抓来的公司资料、存档里的统计、
 * 以及原来那个「只看这个人的消息」。
 *
 * ⚠️ 资料【不是实时的】。采集端一天只抓几十个人，一轮下来要好几天，
 * 所以"抓取于 N 天前"那一行不是装饰 —— 它得显眼，超过 30 天还要变色。
 * 一份两周前的资料和实时的长得一模一样，这是这个页面最容易骗人的地方。
 *
 * ⚠️ 名单只覆盖游戏房（ZH）。别的房间的人点开是"还没有资料"，
 * 这不是出错 —— 面板里要说清楚，不然看着像坏了。
 */
var PL = { map: null, name: null, state: 'idle' };   // idle | loading | ok | fail
var PC = { open: false };

/** players.json 只在第一次点名字时才拉，平时一个请求都不发。 */
function plLoad() {
  if (PL.state === 'ok' || PL.state === 'loading') return Promise.resolve();
  PL.state = 'loading';
  return getPack(DATA + '/players.json').then(function (j) {
    var map = {}, byName = {};
    (j && j.players ? j.players : []).forEach(function (p) {
      if (p.sid) map[p.sid] = p;
      // 名字索引带上领域，否则同名不同服会互相盖掉
      if (p.co) byName[String(p.co).toLowerCase() + '|' + (Number(p.realm) || 0)] = p;
    });
    PL.map = map; PL.name = byName; PL.state = 'ok';
  }).catch(function () {
    PL.state = 'fail';                 // 没发布过 / 404 都走这里，不当错误弹
  });
}

/*
 * 找这个人的资料。
 *
 * 先按 sid 找，找不到再按公司名找。
 * 两条都留着是因为「聊天里的 sid 就是公司 id」这件事**没有被真正验证过** ——
 * 看起来是，但看起来是和验过了不是一回事。哪天不是了，
 * 名字这条路还能兜住，而不是整个功能静默地全部失灵。
 */
function plFind(m) {
  if (PL.state !== 'ok') return null;
  /*
   * 先按 sid 找。sid 是公司 id，全站唯一 —— 两个服务器的同名公司 id 不同，
   * 所以这条路本身就分得开。
   *
   * 按名字兜底时【必须带上领域】：R1 和 R2 可以有同名公司，
   * 只按名字找会把另一个服务器那个人的资料显示在这个人名下。
   */
  if (m.sid && PL.map[m.sid]) return PL.map[m.sid];
  if (!m.name) return null;
  // m._r 是 realm+1（R1 = 1），发布数据里的 realm 是 0 起
  return PL.name[String(m.name).toLowerCase() + '|' + ((Number(m._r) || 1) - 1)] || null;
}

/** LimitedCompany 这种代号，能翻就翻，翻不了原样显示 —— 绝不留空。 */
var LEVEL_KIND = {
  LimitedCompany: '有限公司', PublicCompany: '上市公司',
  Corporation: '股份公司', SoleTrader: '个体户', Partnership: '合伙企业',
};
function levelKindName(k) { return LEVEL_KIND[k] || String(k || ''); }

/**
 * 带符号的加成。
 * 原来一律拼 '+'，负数就成了 "+-1" —— 销售加成是真的会是负的。
 */
function psign(n) {
  if (typeof n !== 'number' || !n) return '';
  return (n > 0 ? '+' : '') + n;
}

function pnum(n) {
  n = Number(n) || 0;
  if (n >= 1e8) return (n / 1e8).toFixed(2) + ' 亿';
  if (n >= 1e4) return (n / 1e4).toFixed(1) + ' 万';
  return String(n);
}

function pcClose() {
  var box = $('#pcard');
  if (!box) return;
  box.hidden = true;
  clear(box);
  PC.open = false;
  try { document.body.classList.remove('pc'); } catch (e) {}
}

function pcOpen(m) {
  var box = $('#pcard');
  if (!box) return;
  PC.open = true;
  box.hidden = false;
  try { document.body.classList.add('pc'); } catch (e) {}
  pcRender(m);
  // 资料还没载入就先把面板开出来（存档统计那部分立刻就能看），
  // 载完再重画一次。不这么做的话，点名字要等一个网络往返才有反应。
  if (PL.state !== 'ok') {
    plLoad().then(function () { if (PC.open) pcRender(m); });
  }
}

function pcRender(m) {
  var box = $('#pcard');
  if (!box) return;
  clear(box);
  var p = plFind(m);

  var sheet = el('div', 'psheet');
  sheet.onclick = function (e) { e.stopPropagation(); };

  var head = el('div', 'phead');
  // 资料页永远是真的：这个功能是"录视频时别露脸"，不是"我自己也查不了"
  head.appendChild(avatar(m, true));
  var nm = el('div', 'pname', (p && p.co) || m.name);
  nm.style.color = colorOf(m.sid);
  head.appendChild(nm);
  var x = el('button', 'pbtn', '✕');
  x.setAttribute('aria-label', '关闭');
  x.onclick = function () { pcClose(); };
  head.appendChild(x);
  sheet.appendChild(head);

  var body = el('div', 'pbody');

  if (p) {
    // 「抓取于 N 天前」—— 这一行是这个页面最重要的一句话
    var days = 0;
    var at = new Date(String(p.at || '') + 'T00:00:00Z').getTime();
    if (at) days = Math.max(0, Math.floor((Date.now() - at) / 86400000));
    var when = el('div', 'pwhen' + (days > 30 ? ' old' : ''),
      p.at ? ('资料抓取于 ' + p.at + '（' + (days ? days + ' 天前' : '今天') + '）' +
              (days > 30 ? ' · 已经挺久了，可能不准' : ''))
           : '不知道是什么时候抓的');
    body.appendChild(when);

    var grid = el('div', 'pgrid');
    function cell(k, v, title) {
      if (v === '' || v == null) return;
      var c = el('div', 'pcell');
      c.appendChild(el('div', 'k', k));
      var vv = el('div', 'v', v);
      if (title) vv.title = title;
      c.appendChild(vv);
      grid.appendChild(c);
    }
    cell('玩家等级', p.lv ? (String(p.lv) + (p.lvk ? ' · ' + levelKindName(p.lvk) : '')) : '');
    cell('信用评级', p.rating ? (p.rating + (p.bracket ? '（' + p.bracket + '）' : '')) : '');
    cell('排名', p.rank ? '#' + p.rank : '');
    cell('EVA 排名', p.eva ? '#' + p.eva : '');
    cell('公司净值', p.value ? pnum(p.value) : '', p.value ? String(p.value) : '');
    cell('建筑价值', p.bval ? pnum(p.bval) : '', p.bval ? String(p.bval) : '');
    cell('专利价值', p.pval ? pnum(p.pval) : '', p.pval ? String(p.pval) : '');
    cell('负债', p.bonds ? pnum(p.bonds) : '', p.bonds ? String(p.bonds) : '');
    cell('员工', p.workers ? pnum(p.workers) : '');
    /*
     * 建筑数和格子数【本来就可能对不上】：免费 / 季节建筑（沙滩集市那种）
     * 不占格子。所以分成两格显示，并把免费那几栋标出来 ——
     * 挤在一起写成"10 栋 / 9 格"看着就像个错。
     */
    cell('建筑', p.nb ? (p.nb + ' 栋' +
      (p.nfree ? '（含 ' + p.nfree + ' 栋免费/季节）' : '')) : '');
    cell('建筑格子', p.slots ? ((p.slots + (p.xslots || 0)) + ' 格' +
      (p.xslots ? '（含额外 ' + p.xslots + '）' : '')) : '');
    cell('生产加成', psign(p.prod));
    cell('销售加成', psign(p.sales));
    cell('休闲加成', psign(p.rec));
    /*
     * 接口给的是一个倍率（1.3 = 比基准多花 30%），显示成"1.3×"要人自己换算。
     * 减 1 变成百分比才是它真正的意思：多付出的那部分。
     */
    cell('管理费用', (typeof p.admin === 'number' && p.admin)
      ? (Math.round((p.admin - 1) * 1000) / 10 + '%') : '');
    cell('政府订单档', (p.gov != null && p.gov >= 0) ? String(p.gov) : '');
    cell('入坑', p.joined || '');
    cell('重开于', p.reset || '');
    cell('赞助者', p.sup ? '是' : '');
    cell('管理员', p.mod ? '是' : '');
    cell('已删除', p.del ? '是' : '');
    body.appendChild(grid);

    // 改过的旧名字。这个在存档里很有用 —— 改名之前的聊天记录是挂在旧名下的
    if (p.prev && p.prev.length) {
      body.appendChild(el('h3', null, '用过的名字'));
      var pc = el('div', 'chips');
      p.prev.forEach(function (x) { pc.appendChild(el('span', 'chip', x)); });
      body.appendChild(pc);
    }

    /*
     * 自我介绍。走的是和聊天正文【完全同一条】渲染路径 ——
     * renderBody 全程 textContent / createTextNode，链接只认 http(s)，
     * 图片只认白名单里的图床，:re-N: 会显示成产品名。
     * 这是一段别人写的自由文本，任何时候都不能因为"它在资料页里"
     * 就换一条更省事的路。
     */
    if (p.note) {
      body.appendChild(el('h3', null, '自我介绍'));
      var nb = el('div', 'pnote');
      renderBody(nb, p.note, '');
      body.appendChild(nb);
    }

    if (p.kinds && p.kinds.length) {
      body.appendChild(el('h3', null, '都有些什么'));
      var chips = el('div', 'chips');
      p.kinds.forEach(function (k) { chips.appendChild(el('span', 'chip', k)); });
      body.appendChild(chips);
    }
  } else {
    var why = PL.state === 'loading' ? '正在读资料…'
            : PL.state === 'fail' ? '这个站点还没有发布玩家资料。'
            : '还没抓到这个人的资料。\n' +
              '资料只覆盖游戏房里出现过的玩家，而且一天只抓几十个人，' +
              '一轮要好几天 —— 过阵子再来看。';
    body.appendChild(el('div', 'pnone', why));
  }

  // ---- 存档里 ----
  body.appendChild(el('h3', null, '在存档里'));
  var st = plArchiveStats(m, p);
  var g2 = el('div', 'pgrid');
  function cell2(k, v) {
    if (!v) return;
    var c = el('div', 'pcell');
    c.appendChild(el('div', 'k', k));
    c.appendChild(el('div', 'v', v));
    g2.appendChild(c);
  }
  cell2('发言', st.n ? (st.n + ' 条') : '');
  cell2('首次发言', st.first || '');
  cell2('最后发言', st.last || '');
  body.appendChild(g2);
  if (st.partial) {
    body.appendChild(el('div', 'pwhen', '（只统计了你这次载入的日期，不是全部存档）'));
  }

  // ---- 原来那个筛选，就在这儿 ----
  var btns = el('div', 'pbtns');
  var only = el('button', 'pbtn main', '只看他的消息');
  (function (sid) {
    only.onclick = function () {
      sel.sender = sid;
      pcClose();
      document.body.classList.remove('nav');
      refresh(true);
    };
  })(m.sid);
  btns.appendChild(only);
  var close = el('button', 'pbtn', '关闭');
  close.onclick = function () { pcClose(); };
  btns.appendChild(close);
  body.appendChild(btns);

  body.appendChild(el('div', 'pfoot',
    '资料来自游戏公开的公司页面，只保留展示性的字段 —— ' +
    '不收在线状态、所在地区、自我介绍和正在生产什么。' +
    '不想被收录的，说一声就去掉。'));

  sheet.appendChild(body);
  box.appendChild(sheet);
  box.onclick = function () { pcClose(); };
}

/**
 * 存档统计：优先用发布数据里的（那是【全量】算的），
 * 没有才退回数当前载入的这些天 —— 并且明说这是不全的。
 * 不说的话，"发言 12 条"会被当成这人一共只说过 12 句。
 */
function plArchiveStats(m, p) {
  if (p && p.msgs) {
    return { n: p.msgs, first: p.first || '', last: p.last || '', partial: false };
  }
  var n = 0, lo = 0, hi = 0;
  ALL.forEach(function (x) {
    if (x.sid !== m.sid) return;
    n++;
    if (!lo || x.t < lo) lo = x.t;
    if (x.t > hi) hi = x.t;
  });
  var d = function (t) { return t ? new Date(t).toISOString().slice(0, 10) : ''; };
  return { n: n, first: d(lo), last: d(hi), partial: true };
}

/**
 * 把认得出来的图片链接渲染成缩略图，挂在消息正文下面。
 * 链接本身【照样保留】—— 图挂了的时候还能点开看。
 */
function appendImages(parent, urls) {
  if (!urls.length) return;
  var box = el('div', 'imgs');
  urls.forEach(function (u) {
    var a = el('a', 'imgwrap');
    /*
     * href 保留着不是摆设：中键、右键"新标签打开"、复制链接地址都还能用，
     * 而且万一灯箱那段脚本出了问题，点击也还是能看到图 —— 降级到旧行为。
     */
    a.href = u; a.target = '_blank'; a.rel = 'noopener noreferrer nofollow';
    a.onclick = function (e) {
      // 让 Ctrl/⌘/中键 保持"新标签打开"的原生行为
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;
      e.preventDefault();
      lbOpen(u);
    };
    var img = el('img');
    img.src = u;
    img.alt = '玩家贴的图';
    img.loading = 'lazy';
    img.decoding = 'async';
    img.referrerPolicy = 'no-referrer';
    /*
     * 加载失败就把整块拿掉 —— 图床上的图是会过期的，
     * 留一个碎图标既难看又让人以为是存档坏了。链接还在正文里，不影响。
     */
    img.onerror = function () { try { box.removeChild(a); } catch (e) {} };
    a.appendChild(img);
    box.appendChild(a);
  });
  parent.appendChild(box);
}

function renderBody(parent, text, q, maskOnly) {
  var parts = [{ t: 'txt', s: String(text || '') }];
  parts = splitBy(parts, /https?:\/\/[^\s<>"']+/g, 'url');
  /*
   * ⚠️ 被屏蔽的人要【先】切出来，再走通用的 @ 规则。
   *
   * 顺序反过来就不对了：通用那条正则遇到空格就停，
   * 而公司名是可以带空格的 —— 「@Big Corp」它只咬得到「@Big」，
   * 剩下的「 Corp」原样留在正文里，等于遮了个寂寞。
   * 这里的正则是拿真名【整个】拼出来的，空格照样匹配得上。
   */
  if (maskOnly && MASK_RE) parts = splitBy(parts, MASK_RE, 'atmk');
  parts = splitBy(parts, /@[A-Za-z0-9_一-龥][\w.\-一-龥]*/g, 'at');
  parts = splitBy(parts, RE_ICON, 'emo');
  var pics = [];
  parts.forEach(function (p) {
    if (p.t === 'url') {
      // 只接受 http(s)，其余按纯文字处理，绝不产生 javascript: 之类的链接
      if (/^https?:\/\//i.test(p.s)) {
        var a = el('a', null, p.s);
        a.href = p.s; a.target = '_blank'; a.rel = 'noopener noreferrer nofollow';
        parent.appendChild(a);
        var pic = imageUrl(p.s);
        if (pic && pics.indexOf(pic) < 0) pics.push(pic);
      } else parent.appendChild(document.createTextNode(p.s));
    } else if (p.t === 'atmk') {
      parent.appendChild(el('span', 'mention', maskAtText(p.s)));
    } else if (p.t === 'at') {
      parent.appendChild(el('span', 'mention', p.s));
    } else if (p.t === 'emo') {
      // 认得出来就显示产品名，认不出来原样显示原始码 —— 绝不留空
      var pn = productName(p.s);
      var chip = el('span', 'emote', pn || p.s);
      if (pn) chip.title = p.s;            // 悬停能看到原始的 :re-30:
      parent.appendChild(chip);
    } else {
      appendText(parent, p.s, q);
    }
  });
  appendImages(parent, pics);
}

/*
 * ==================== 屏蔽头像 / ID ====================
 *
 * 做的事只有一件：**在聊天流里，把某几个人的头像换成占位图、名字换成「玩家N」，
 * 顺带把正文里 @ 到他们的地方也换掉。**
 *
 * 边界（每一条都是故意的）：
 *   · 只改【显示】，不改数据。搜索、统计、导出、深搜全都还是按真名工作 ——
 *     所以你搜真名照样搜得到他说过的话。
 *   · 点名字打开的资料页【不遮】。那是"我要看看这是谁"的地方，
 *     遮了的话这个功能就从"录视频时别露脸"变成"我自己也查不了了"。
 *   · 侧栏「发送者」那一列【不遮】—— 你得能一眼找到人。
 *     录视频时侧栏本来就可以收起来。
 *   · 非 @ 的地方不动。正文里普通提到某个名字，那是别人写的话，
 *     动了就是篡改记录。
 *
 * 名单存在【本机浏览器】里（simco.pref），不上传、不发布，
 * 别人打开这个网站看到的还是原样。
 */
// 占位头像。1:1，四角留了 10% 的余量 —— .av 有 4px 圆角，
// 字贴边的话切角会啃掉一点笔画。
