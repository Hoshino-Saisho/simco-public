var MASK = [];          // [{sid, name}]，【顺序就是编号】：第一个是玩家1
var MASK_IX = {};       // sid -> 1..n
var MASK_RE = null;     // 认 @某某某 的正则；没人被屏蔽时是 null（renderBody 直接跳过）

function reEsc(x) { return String(x).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

/** 从本地偏好里读回名单。坏数据一律当没有，绝不让它把页面带崩。 */
function maskLoad() {
  MASK = [];
  var raw = PREF.mask;
  var seen = {};
  if (Object.prototype.toString.call(raw) === '[object Array]') {
    raw.forEach(function (x) {
      var sid = Number(x && x.sid) || 0;
      if (!sid || seen[sid]) return;
      seen[sid] = 1;
      MASK.push({ sid: sid, name: String((x && x.name) || '') });
    });
  }
  maskRebuild();
}

function maskRebuild() {
  MASK_IX = {};
  MASK.forEach(function (x, i) { MASK_IX[x.sid] = i + 1; });
  var names = [];
  MASK.forEach(function (x) { if (x.name) names.push(x.name); });
  /*
   * ⚠️ 长的名字必须排在前面。
   * 同时屏蔽了「Ab」和「AbCorp」时，正则是从左往右挨个试的 ——
   * 短的排前面就会把 @AbCorp 咬掉半截，剩一个 "Corp" 露在外面。
   * 后面那个 (?!...) 是同一件事的另一半：@Abc 不该被 @Ab 匹配上。
   */
  names.sort(function (a, b) { return b.length - a.length; });
  MASK_RE = names.length
    ? new RegExp('@(?:' + names.map(reEsc).join('|') + ')(?![\\w.\\-\u4e00-\u9fa5])', 'gi')
    : null;
}

function maskOn(sid) { return !!MASK_IX[sid]; }
/** 这个人在聊天流里叫什么。没被屏蔽就是他自己的名字。 */
function maskName(m) {
  var n = MASK_IX[m.sid];
  return n ? ('玩家' + n) : m.name;
}
/** @ 到的那一段该换成什么。按名字反查编号，查不到就退回「玩家」。 */
function maskAtText(hit) {
  var low = String(hit).slice(1).toLowerCase();
  for (var i = 0; i < MASK.length; i++) {
    if (String(MASK[i].name).toLowerCase() === low) return '@玩家' + (i + 1);
  }
  return '@玩家';
}

/**
 * 加进名单 / 从名单里去掉。
 *
 * ⚠️ 编号是按【名单顺序】算的，所以去掉中间那个人，后面的编号会往前挪
 * （玩家3 变成玩家2）。这是有意的：编号必须连着，不然录出来的画面里
 * 会出现「玩家1、玩家3」这种一看就知道"中间还有一个"的东西。
 */
function maskToggle(sid, name) {
  var at = -1;
  for (var i = 0; i < MASK.length; i++) { if (MASK[i].sid === sid) { at = i; break; } }
  if (at >= 0) MASK.splice(at, 1);
  else MASK.push({ sid: Number(sid), name: String(name || '') });
  maskRebuild();
  savePref();
  refresh();
  if (MK.open) mkRender();
}

/** 屏蔽用的占位头像元素。每次都新建一个 —— DOM 节点不能共用。 */
function maskAvatar() {
  var img = el('img', 'av mk');
  img.src = MASK_AV;
  img.alt = '';
  img.draggable = false;
  return img;
}

/* ---------- 那个面板 ---------- */
var MK = { open: false, list: null, q: '' };

/**
 * 候选名单 = 【发过消息的人】，跨房间，按条数从多到少。
 *
 * 只在打开面板时算一次。ALL 可能有二十万条，
 * 每敲一个字重算一遍的话，搜索框会卡得没法用 —— 输入时只筛这个现成数组。
 */
function maskCandidates() {
  var by = new Map();
  ALL.forEach(function (m) {
    var e = by.get(m.sid);
    if (e) { e.n++; if (m.t >= e.t) { e.name = m.name; e.t = m.t; } }
    else by.set(m.sid, { sid: m.sid, name: m.name, n: 1, t: m.t });
  });
  var list = [];
  by.forEach(function (v) { list.push(v); });
  list.sort(function (a, b) { return b.n - a.n; });
  return list;
}

function mkOpen() {
  var box = $('#mkcard');
  if (!box) return;
  MK.open = true;
  MK.q = '';
  MK.list = maskCandidates();
  box.hidden = false;
  try { document.body.classList.add('pc'); } catch (e) {}
  mkRender();
  var q = $('#mkq');
  if (q) { try { q.focus(); } catch (e) {} }
}
function mkClose() {
  var box = $('#mkcard');
  if (box) box.hidden = true;
  MK.open = false;
  // 资料页可能同时开着（它也用 body.pc 锁滚动），别把它的锁一起解了
  if (!PC.open) { try { document.body.classList.remove('pc'); } catch (e) {} }
}

function mkRender() {
  var box = $('#mkcard');
  if (!box) return;
  clear(box);

  var sheet = el('div', 'msheet');
  sheet.onclick = function (e) { e.stopPropagation(); };

  var head = el('div', 'mhead');
  head.appendChild(el('b', null, '屏蔽头像 / ID'));
  var x = el('button', 'pbtn', '✕');
  x.setAttribute('aria-label', '关闭');
  x.onclick = function () { mkClose(); };
  head.appendChild(x);
  sheet.appendChild(head);

  var body = el('div', 'mbody');

  var q = el('input');
  q.type = 'search';
  q.id = 'mkq';
  q.placeholder = '搜发过消息的玩家…';
  q.value = MK.q;
  q.oninput = function () {
    MK.q = q.value || '';
    /*
     * 只重画列表那一段，不重画整个面板 ——
     * 整个重画会把输入框换成新的，光标当场丢掉，打字变成一次一个字。
     * 计算器那边的小数点就是栽在同一件事上。
     */
    mkFill(listBox);
  };
  body.appendChild(q);

  var listBox = el('div', 'mlist');
  mkFill(listBox);
  body.appendChild(listBox);
  sheet.appendChild(body);

  sheet.appendChild(el('div', 'mnote',
    '只改聊天流里的显示：头像换成占位图、名字换成「玩家N」，正文里 @ 到他的地方一起换。\n' +
    '点名字打开的资料页、侧栏的发送者列表【不遮】，搜索也照样按真名工作。\n' +
    '名单只存在这台设备的浏览器里，不会上传，别人打开这个网站看到的还是原样。'));

  box.appendChild(sheet);
  box.onclick = function () { mkClose(); };
}

/** 列表那一段。屏蔽了的排最上面，下面是候选。 */
function mkFill(box) {
  clear(box);
  var low = (MK.q || '').toLowerCase();

  if (MASK.length) {
    box.appendChild(el('h3', null, '已屏蔽（' + MASK.length + ' 人）'));
    MASK.forEach(function (x, i) {
      var r = el('div', 'mrow');
      r.appendChild(maskAvatar());
      var l = el('span', 'lbl', x.name || ('#' + x.sid));
      r.appendChild(l);
      r.appendChild(el('span', 'as', '→ 玩家' + (i + 1)));
      var b = el('span', 'n', '取消');
      r.appendChild(b);
      r.onclick = function () { maskToggle(x.sid, x.name); };
      box.appendChild(r);
    });
  }

  var list = (MK.list || []).filter(function (v) {
    if (maskOn(v.sid)) return false;
    return !low || v.name.toLowerCase().indexOf(low) >= 0;
  });
  box.appendChild(el('h3', null,
    low ? ('搜到 ' + list.length + ' 人') : ('发过消息的玩家（' + list.length + ' 人）')));
  if (!list.length) {
    box.appendChild(el('div', 'mnone',
      low ? '没有匹配的人。名单只认【已经载入的消息】里出现过的发言者 —— 多载几天再找找。'
          : '还没载入任何消息。'));
    return;
  }
  list.slice(0, 200).forEach(function (v) {
    var r = el('div', 'mrow');
    var l = el('span', 'lbl', v.name);
    l.style.color = colorOf(v.sid);
    r.appendChild(l);
    r.appendChild(el('span', 'n', v.n));
    r.onclick = function () { maskToggle(v.sid, v.name); };
    box.appendChild(r);
  });
  if (list.length > 200) {
    box.appendChild(el('div', 'mnone',
      '还有 ' + (list.length - 200) + ' 人没列出来 —— 用上面的搜索框找。'));
  }
}

/*
 * raw=true 表示【要真的那一份】—— 资料页用。
 * 聊天流不传这个参数，被屏蔽的人在那儿一律是占位图。
 */
function avatar(m, raw) {
  if (!raw && maskOn(m.sid)) return maskAvatar();
  var initial = (m.name.charAt(0) || '?').toUpperCase();
  if (m.logo && m.logo.indexOf(AVATAR_HOST) === 0) {
    var img = el('img', 'av');
    img.src = m.logo; img.alt = ''; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer';
    img.onerror = function () {
      var ph = el('div', 'av ph', initial);
      ph.style.background = colorOf(m.sid);
      if (img.parentNode) img.parentNode.replaceChild(ph, img);
    };
    return img;
  }
  var ph = el('div', 'av ph', initial);
  ph.style.background = colorOf(m.sid);
  return ph;
}

// ---------- 筛选与渲染 ----------
/**
 * 重建排序数组和侧栏统计。只在【载入了新数据】时跑，不随搜索跑。
 *
 * 消息一旦入库就不会变，所以排序一次就够了。以前是每次筛选都把结果重排一遍，
 * 二十万条时每敲一个字都要 O(n log n)。
 */
function rebuild() {
  SORTED = [];
  ALL.forEach(function (m) { SORTED.push(m); });
  SORTED.sort(function (a, b) { return a.t - b.t || a.id - b.id; });

  // 按房间分桶。分完每桶依然有序（是从有序数组里顺序推进去的），
  // 所以"只看某个房间"这个最常见的情况可以直接用现成数组，一次拷贝都不用。
  BYROOM = {};
  for (var i = 0; i < SORTED.length; i++) {
    var m = SORTED[i];
    (BYROOM[m.room] || (BYROOM[m.room] = [])).push(m);
  }
  STATS = null;      // 侧栏统计跟着作废
  DIRTY = false;
}

/** 当前房间的消息（已按时间排好）。 */
function roomMsgs() {
  if (DIRTY) rebuild();
  return BYROOM[sel.room] || [];
}

/** 索引里有哪些房间、各多少条 —— 来自索引而不是已载入的数据。
 *  这一点很关键：还没载入的房间也必须在侧栏里出现，否则你根本无从选它。 */
function indexRooms() {
  var out = {};
  if (INDEX) {
    (INDEX.days || []).forEach(function (d) {
      out[d.room] = (out[d.room] || 0) + (d.n || 0);
    });
  }
  // 只在快通道里出现、还没进索引的房间也要列出来（刚加的聊天室就是这种）。
  // 索引里已有的以索引为准 —— 那是"存档总量"，recent 只是最近一小包。
  Object.keys(RECENT_ROOMS).forEach(function (r) {
    if (!out[r]) out[r] = RECENT_ROOMS[r];
  });
  return out;
}

/** 当前房间的日期列表（索引里的，倒序）。 */
function roomDays() {
  if (!INDEX) return [];
  return (INDEX.days || []).filter(function (d) { return d.room === sel.room; });
}

/** 选一个存在的房间：优先沿用上次的，其次 ZH，再不行就第一个。 */
function pickRoom() {
  var rooms = indexRooms(), keys = Object.keys(rooms).sort();
  if (!keys.length) return sel.room;
  if (rooms[sel.room]) return sel.room;
  if (rooms.ZH) return 'ZH';
  return keys[0];
}

/** 侧栏用的统计。结果缓存起来，搜索时直接复用。 */
function stats() {
  if (STATS) return STATS;
  if (DIRTY) rebuild();

  // 只统计【当前房间】—— 侧栏里的发送者、领域、时间跨度必须和你眼前看到的
  // 是同一批消息。混着别的房间算，数字对不上，人会以为是坏了。
  var base = roomMsgs();
  var senders = new Map(), days = {}, realms = {};
  for (var i = 0; i < base.length; i++) {
    var m = base[i];
    realms[m._r] = (realms[m._r] || 0) + 1;
    days[m._d] = 1;
    var e = senders.get(m.sid);
    if (e) { e.n++; e.name = m.name; }
    else senders.set(m.sid, { name: m.name, sid: m.sid, n: 1 });
  }
  var list = [];
  senders.forEach(function (v) { list.push(v); });
  list.sort(function (a, b) { return b.n - a.n; });

  // 时间跨度直接取首尾两条 —— 数组本来就是按时间排好的。
  //
  // 这里原本写的是 Math.max.apply(null, ts)，那是把每一条消息的时间戳当成一个
  // 函数参数展开。参数个数有上限，实测 15 万条就会抛 RangeError，
  // 而异常正好发生在渲染路径上，整个页面会卡死不再响应。
  var hrs = 0;
  if (base.length) {
    hrs = (base[base.length - 1].t - base[0].t) / 3600000;
    if (!(hrs >= 0)) hrs = 0;
  }

  STATS = { senders: list, realms: realms, n: base.length,
            days: Object.keys(days).length, hrs: hrs };

  // 载入的数据里压根没有当前选中的领域（比如默认的 R1）就回落到「全部」，
  // 否则会看到一个空页面还不知道为什么。
  if (sel.realm != null && !realms[sel.realm]) sel.realm = null;

  return STATS;
}

/* ======================= 深搜：不把整个存档装进内存 =======================
 *
 * 老做法：想搜全部历史，就得先点「载入全部」把所有日文件 expand 成对象塞进 ALL。
 * 实测 ZH 一年 = 1,277,135 条 → 11 秒、584 MB 堆。手机必崩。
 *
 * 新做法两条，合起来解决问题：
 *
 *   ① 从【最新的一天】往回翻，凑够 DEEP_TARGET 条命中就停。
 *      实测：要最新 500 条命中 = 63 毫秒、0 MB、只翻了 4/365 天。
 *      道理很简单 —— 你搜一个词，绝大多数时候想看的是最近的那批，
 *      不是一次把一年的都摆出来。不够再点「继续找更早的」。
 *
 *   ② 扫完就扔。每天解析出来的消息只留【命中的】，其余当场丢掉，
 *      不进 ALL、不进任何长期容器。实测扫全年也只有 36 MB
 *      （而且这个数只跟"命中多少条"有关，跟存档多大无关）。
 *
 * ⚠️ 一个【故意没做】的优化，写在这里免得以后有人"顺手加上"：
 *   本来可以在解析之前先在日文件的原始文本上 indexOf 一次，不含就整天不解析
 *   （对生僻词是 12 倍加速）。实测踩过坑：搜 BFR 会返回 0 条，
 *   而正确答案是 83,981 条 —— 因为 "BFR" 这个名字【不在原文里】，
 *   原文只有 :re-94:，产品名是 expand() 里由图标码翻出来的。
 *   它不报错，就是安静地搜不到。
 *   所以这里坚持走同一个 expand() + 同一个 _s —— 浏览和搜索用同一套判定，
 *   永远不会出现"页面上看得到、搜索搜不到"。
 *   真要加预筛，必须把查询词展开成"它自己 + 对应的图标码"一起找，并且配测试。
 */
var DEEP_TARGET = 500;        // 一轮凑够多少条命中就停
var DEEP_MORE   = 500;        // 点「继续找更早的」再加多少
var DEEP_BATCH  = 4;          // 一批并发拉几天（和 loadDays 保持一致）
var DEEP = null;

/** 当前深搜的结果适用于现在这个查询吗？不适用就当没有。 */
function deepMsgs() {
  if (!DEEP) return null;
  if (DEEP.room !== sel.room) return null;
  if (DEEP.q !== sel.q.toLowerCase()) return null;
  return DEEP.msgs;
}

function deepStop() {
  if (DEEP) DEEP.cancel = true;
}

/**
 * 开一轮深搜。同一个词重复调用不会重开，只会把目标条数往上加。
 * more = 这次要再多找几条（不给就是从头找 DEEP_TARGET 条）。
 */
function deepSearch(more) {
  var q = sel.q.toLowerCase();
  if (!q) { deepStop(); DEEP = null; renderDeep(); return Promise.resolve(); }
  if (!INDEX) return Promise.resolve();

  if (DEEP && DEEP.q === q && DEEP.room === sel.room) {
    if (DEEP.running) return Promise.resolve();
    if (DEEP.exhausted) return Promise.resolve();
    DEEP.target = DEEP.msgs.length + (more || DEEP_MORE);
  } else {
    deepStop();
    // 从最新的一天往回排。已经完整载入内存的天直接跳过 ——
    // 那些消息本来就在 ALL 里，applyFilters 已经会筛到它们。
    var days = roomDays().slice().sort(function (a, b) {
      return a.day < b.day ? 1 : (a.day > b.day ? -1 : 0);
    });
    DEEP = {
      q: q, room: sel.room, msgs: [], seen: {},
      queue: days, total: days.length, scanned: 0, fetched: 0, failed: 0,
      target: more || DEEP_TARGET, running: false, cancel: false, exhausted: false,
    };
  }
  return deepRun(DEEP);
}

function deepRun(d) {
  if (d.running) return Promise.resolve();
  d.running = true;
  renderDeep();

  function batch() {
    if (d !== DEEP || d.cancel) return Promise.resolve();
    if (d.msgs.length >= d.target) return Promise.resolve();

    // 先把已经在内存里的天跳掉（不发请求）
    while (d.queue.length && !needLoad(d.queue[0])) { d.queue.shift(); d.scanned++; }
    if (!d.queue.length) { d.exhausted = true; return Promise.resolve(); }

    var take = d.queue.splice(0, DEEP_BATCH);
    d.scanned += take.length;
    var before = d.msgs.length;

    return Promise.all(take.map(function (it) {
      return getPack(DATA + '/d/' + encodeURIComponent(it.room) + '/' +
                     encodeURIComponent(it.day) + '.json', true)
        .then(function (pack) {
          d.fetched++;
          var msgs = expand(pack);
          for (var i = 0; i < msgs.length; i++) {
            var m = msgs[i];
            // 和浏览用的是同一个 _s —— 这是"页面上看得到就一定搜得到"的保证
            if (m._s.indexOf(d.q) < 0) continue;
            if (ALL.has(m.id) || d.seen[m.id]) continue;
            d.seen[m.id] = 1;
            d.msgs.push(m);
          }
          // msgs / pack 这一轮就丢掉 —— 这就是"扫完就扔"，不往 ALL 里塞
        })
        .catch(function () { d.failed++; });
    })).then(function () {
      if (d !== DEEP) return;
      renderDeep();
      // 只在真的多出东西时才重画，免得扫几百天就重排几百次
      if (d.msgs.length > before) refreshKeepScroll();
      return batch();
    });
  }

  return batch().then(function () {
    if (d !== DEEP) return;
    d.running = false;
    if (!d.queue.length) d.exhausted = true;
    renderDeep();
    refreshKeepScroll();
  });
}

/*
 * 深搜是一边翻一边往里插结果的，而插进来的都是【更早】的消息 ——
 * 它们排在前面。renderFeed 每次都是清空重画，滚动位置会归零，
 * 于是你正看着的地方会突然跳到顶部。
 * 所以按"离底部多远"来恢复，和「载入更早的」那个按钮用的是同一招。
 */
function refreshKeepScroll() {
  var f = $('#feed');
  var fromBottom = f ? (f.scrollHeight - f.scrollTop) : 0;
  refresh(false);
  if (f) {
    requestAnimationFrame(function () {
      f.scrollTop = Math.max(0, f.scrollHeight - fromBottom);
    });
  }
}

/** 搜索栏下面那条状态/操作条。 */
function renderDeep() {
  var bar = $('#deep');
  if (!bar) return;
  clear(bar);
  var d = DEEP;
  if (!d || d.q !== sel.q.toLowerCase() || d.room !== sel.room) {
    bar.className = '';
    return;
  }
  bar.className = 'on';

  var n = el('b', null, d.msgs.length.toLocaleString());
  bar.appendChild(el('span', null, '更早的存档里又找到 '));
  bar.appendChild(n);
  bar.appendChild(el('span', null, ' 条'));

  if (d.running) {
    bar.appendChild(el('span', null, '· 已翻 ' + d.scanned + '/' + d.total + ' 天…'));
    var stop = el('button', null, '停');
    stop.onclick = function () { deepStop(); };
    bar.appendChild(stop);
    return;
  }

  if (d.exhausted) {
    bar.appendChild(el('span', null, '· 已经找遍这个房间的全部 ' + d.total + ' 天'));
  } else {
    var left = d.queue.length;
    bar.appendChild(el('span', null, '· 翻到第 ' + d.scanned + '/' + d.total +
                                     ' 天就够了，还有 ' + left + ' 天没找'));
    var more = el('button', null, '继续找更早的');
    more.onclick = function () { deepSearch(DEEP_MORE); };
    bar.appendChild(more);
  }
  if (d.failed) {
    bar.appendChild(el('span', null, '·（' + d.failed + ' 个文件没读到）'));
  }
}

/*
 * ===================== 每日 AI 摘要 =====================
 *
 * 采集端每天给【已经结束的那一天】生成一段话，发成 data/ai/<房间>/<日期>.json。
 * 这里只是多读一个静态文件 —— 页面【不会】去调任何模型，也没有任何 key。
 * （CSP 是 connect-src 'self'，就算想调也调不出去，这是有意为之。）
 *
 * 三条规矩：
 *   1. 只在【选中了某一天】时出现。没选具体日期就没有"这一天"可总结。
 *   2. 404 = 那天没有摘要，很正常（没开、跳过了、生成失败）。
 *      记下来，不要每次重画都再敲一次 404。
 *   3. 标识必须一眼可见，而且【折不掉】—— 折叠只收正文。
 */
var AI_MEMO = {};        // 'room|day' -> 对象 / false（没有）/ 'wait'（正在取）
/*
 * 正文展开着吗（整页记忆，不是每天各记一份）。
 *
 * ⚠️ 手机上默认【收起】。
 * 这张卡在 #bar 和 #feed 中间，手机屏幕本来就矮 ——
 * 展开状态下它能占掉三分之一还多，剩下的地方翻两条消息就到底了，
 * 实际体验是"一打开这一天，屏幕被总结糊住了"。
 *
 * 电脑上默认展开：那边地方够，总结正是最该先看到的东西。
 * 收起状态下横幅还在，所以"这是 AI 写的"这件事任何时候都没被藏起来。
 */
/*
 * 要不要在正文里标出"进了选读的那些"。默认开 ——
 * 这个功能的全部意义就是让选择可核对，默认关掉等于没做。
 */
var AI_MARK = true;

/** 当前这一天的摘要依据了哪些消息 id。没有就返回 null。 */
function aiSrcSet() {
  var k = aiKeyOf();
  if (!k) return null;
  var o = AI_MEMO[k];
  if (!o || o === 'wait' || !o.src || !o.src.length) return null;
  /*
   * ⚠️ 缓存【不要挂在 obj 上】。
   * 那个对象是从 JSON 读来的，别处可能会把它再序列化一遍 ——
   * 挂上去的 Set 会变成 {}，而 {} 没有 .has，
   * 于是标记功能悄悄失效（或者当场报错）。
   * 单独存一份，只按 key 认。
   */
  if (AI_SET.k !== k) {
    var set = new Set();
    for (var i = 0; i < o.src.length; i++) set.add(Number(o.src[i]));
    AI_SET = { k: k, set: set };
  }
  return AI_SET.set;
}
var AI_SET = { k: null, set: null };

var AI_OPEN = (function () {
  try { return !window.matchMedia('(max-width:860px)').matches; }
  catch (e) { return true; }        // 判断不了就按电脑处理
})();

function aiKeyOf() {
  return (sel.day && sel.room) ? (sel.room + '|' + sel.day) : null;
}

/** 取一天的摘要。取到、或者确认没有，都会重画一次卡片。 */
function loadAiSummary(room, day) {
  var k = room + '|' + day;
  if (AI_MEMO[k] !== undefined) return;          // 已有结论（含"没有"）
  AI_MEMO[k] = 'wait';
  /*
   * ⚠️ reuse 必须是 false（= 带时间戳 + no-store）。
   *
   * 原来写的是 true，理由是"摘要生成一次就永不改变，重下毫无意义"。
   * **那个前提是错的** —— 提示词要反复调，调完就要重做那一天。
   * 结果是：采集端明明写了新的，浏览器还拿着旧的那份不放，
   * 而这种"写了但看不见"最容易被误判成"根本没写进去"。
   *
   * 代价：切一次日期多一个几百字节的请求。摘要就那么点大，
   * 拿这个换"改完立刻看得到"，太值了。
   *
   * 同一天只会请求一次 —— AI_MEMO 记着结果，重画不会重复发。
   */
  getPack(DATA + '/ai/' + encodeURIComponent(room) + '/' +
          encodeURIComponent(day) + '.json', false)
    .then(function (obj) {
      AI_MEMO[k] = (obj && obj.text) ? obj : false;
    })
    .catch(function () {
      AI_MEMO[k] = false;                        // 没有就是没有，不报错打扰人
    })
    .then(function () {
      if (aiKeyOf() === k) renderAiCard();       // 期间可能已经切走了
    });
}

function renderAiCard() {
  var box = $('#aicard');
  if (!box) return;
  clear(box);
  var k = aiKeyOf();
  if (!k) { box.className = ''; return; }        // 没选具体某天

  loadAiSummary(sel.room, sel.day);
  var obj = AI_MEMO[k];
  if (!obj || obj === 'wait') { box.className = ''; return; }

  box.className = 'on';

  // ---- 横幅：这一条永远在，折叠也收不掉 ----
  var head = el('div', 'aihead');
  /*
   * 先写清楚【这是什么】，再写警告。
   *
   * 原来第一句直接是"本段由 AI 生成"—— 那是个免责声明，不是名字。
   * 结果这块东西在页面上没有名字：知道它是什么的人才看得懂它是什么。
   * 名字要能被指认（"你看 AI 总结里说…"），免责声明做不到这件事。
   */
  /*
   * 人工挑的和机器读全天的，**名字不能一样** —— 它们的可信范围不同。
   *
   * 「AI 总结」这四个字本身就在暗示"这是当天全貌"，
   * 而人工挑选的那份从来不是。一大半"断章取义"的指责起点就在这儿：
   * 读者以为它是全文摘要。名字改对了，期待就对了。
   */
  var manual = Number(obj.manual);
  head.appendChild(el('span', 'aititle', manual ? 'AI 选读' : 'AI 总结'));
  head.appendChild(el('span', null, '🤖 由 AI 生成'));
  if (manual) {
    head.appendChild(el('span', 'warn',
      '· 人工挑选 ' + Number(obj.n_src || 0).toLocaleString() + '/' +
      Number(obj.total || 0).toLocaleString() + ' 条，不是当天全貌'));
  }
  /*
   * 免责声明有长短两版，按屏幕宽度切换 —— **不是"手机上就不显示"**。
   * 手机屏窄，长句会把标题和按钮挤到第二行；但为了省一行就把
   * "可能有误"整句删掉，等于在最容易被当真的地方拿掉了唯一的提醒。
   * 宁可短，不能没有。
   */
  head.appendChild(el('span', 'warn warn-long',
    '· 可能有误、可能遗漏，以下方原始记录为准'));
  head.appendChild(el('span', 'warn warn-short', '· 可能有误'));
  head.appendChild(el('span', 'spacer'));
  /*
   * 「标出进了选读的那些」——【在全文里内联标】，不是单独开一个筛选模式。
   *
   * 这一点是关键：读者滚过去的时候，被标的和没被标的挨在一起，
   * **遗漏是默认可见的**，不需要他主动去点"只看没选的"。
   * 单独做一个筛选模式反而更差：要主动切换，等于没人会看。
   */
  var ids = aiSrcSet();
  if (ids && ids.size) {
    var mk = el('button', 'aitoggle' + (AI_MARK ? ' on' : ''),
      (AI_MARK ? '✓ ' : '') + '在下方标出这 ' + ids.size.toLocaleString() + ' 条');
    mk.title = '把进了这份选读的消息在下面的记录里标出来。\n' +
               '没被标的就是没选进去的 —— 一起看，才知道漏了什么。';
    mk.onclick = function () { AI_MARK = !AI_MARK; refreshKeepScroll(); };
    head.appendChild(mk);
  }

  var tg = el('button', 'aitoggle', AI_OPEN ? '收起' : '展开');
  tg.onclick = function () { AI_OPEN = !AI_OPEN; renderAiCard(); };
  head.appendChild(tg);
  box.appendChild(head);

  if (!AI_OPEN) return;

  // ---- 正文：模型写的字，只用 textContent ----
  var body = el('div', 'aibody');
  body.textContent = String(obj.text || '');
  box.appendChild(body);

  /*
   * 脚注写清楚"它看的是什么"。没有出处的摘要没法验证，那就只是个好看的猜测：
   * 这一天一共多少条、其中多少条被喂进去、用的哪个模型、什么时候生成的。
   */
  var foot = el('div', 'aifoot');
  var n = Number(obj.n_src || 0), tot = Number(obj.total || 0);
  /*
   * 房间不一样，"依据了什么"也不一样：
   *   · 消息少的房间（社交）整天原样读，没有筛
   *   · 消息多的房间要先按游戏相关性筛一遍
   * 所以这句话【按数字来判断】，不写死。
   * 写死成"和游戏有关的 N 条"的话，没筛的房间会被描述成筛过 ——
   * 那是在骗人，而且骗的正是"这段总结可信到什么程度"这件事。
   */
  /*
   * 人工挑的和机器筛的，来源不一样，可信度也不一样 —— 必须让人看得出来。
   * 都写成"依据 N 条"的话，一份人工精选和一份机器粗筛长得一模一样，
   * 而它们值得的信任程度差很远。
   */
  if (Number(obj.manual)) {
    var man = el('span', null, '✍️ 素材由人工挑选');
    man.style.color = '#86efac';
    foot.appendChild(man);
  }
  foot.appendChild(el('span', null,
    (Number(obj.manual)
      ? ('从这一天 ' + tot.toLocaleString() + ' 条里挑了 ' + n.toLocaleString() + ' 条')
      : n >= tot ? ('依据这一天全部 ' + tot.toLocaleString() + ' 条')
              : ('依据这一天 ' + tot.toLocaleString() + ' 条里的 ' +
                 n.toLocaleString() + ' 条'))));
  /*
   * 消息特别多的那天会超出单次字符上限，只有较晚的一段被读到。
   * 这件事【必须写出来】：一段看着完整、其实只覆盖半天的总结，
   * 比没有总结更糟 —— 它会让人以为自己已经知道那天发生了什么。
   */
  if (Number(obj.truncated)) {
    var cut = el('span', null, '⚠️ 这天消息太多，只读了较晚的一段');
    cut.style.color = 'var(--warn)';
    foot.appendChild(cut);
  }
  if (obj.model) foot.appendChild(el('span', null, '模型 ' + obj.model));
  if (obj.generated) {
    foot.appendChild(el('span', null, '生成于 ' + fmtFull(obj.generated)));
  }
  box.appendChild(foot);
}

function applyFilters() {
  if (DIRTY) rebuild();
  var q = sel.q.toLowerCase();

  // 房间永远是选中的，所以底子就是那个房间的桶（已排好序）。
  // 没有别的筛选条件时直接用它，一次拷贝都不做。
  var base = roomMsgs();
  if (!q && !sel.day && sel.sender == null && !realmHides()) {
    view = base;
    limit = 400;
    return;
  }

  // base 已经有序，挑出来的子集自然也有序，不需要再排
  var hideRealm = realmHides();
  view = [];
  for (var i = 0; i < base.length; i++) {
    var m = base[i];
    if (sel.day && m._d !== sel.day) continue;
    if (sel.sender != null && m.sid !== sel.sender) continue;
    if (hideRealm && m._r !== sel.realm) continue;
    if (q && m._s.indexOf(q) < 0) continue;
    view.push(m);
  }

  /*
   * 深搜捞回来的那些消息【不在 ALL 里】—— 这是故意的，不然内存就又长回去了。
   * 所以在这里单独并进来。它们已经按 q 筛过，但别的筛选条件（某一天 / 某个人 /
   * 领域）还得照样过一遍，否则"点某天"之后会冒出别的天的结果。
   */
  var extra = deepMsgs();
  if (extra && extra.length) {
    var merged = false;
    for (var k = 0; k < extra.length; k++) {
      var e = extra[k];
      /*
       * ⚠️ 这里要【每次都】重新查 ALL，不能只在深搜捞到的那一刻查一次。
       * 场景：先搜了一个词（深搜从老日子里捞回来几条），之后又点了那一天、
       * 或者点了「全部」把那天整个载进 ALL —— 同一条消息就同时存在于
       * ALL 和 DEEP.msgs 里，view 里会出现两遍。
       */
      if (ALL.has(e.id)) continue;
      if (sel.day && e._d !== sel.day) continue;
      if (sel.sender != null && e.sid !== sel.sender) continue;
      if (hideRealm && e._r !== sel.realm) continue;
      view.push(e);
      merged = true;
    }
    // 并进来之后顺序就乱了，重排一次。深搜结果最多几千条，这一步毫秒级。
    if (merged) view.sort(function (a, b) { return a.t - b.t || a.id - b.id; });
  }
  limit = 400;
}

function renderFeed() {
  var feed = $('#feed');
  clear(feed);
  if (!ALL.size) return;
  if (!view.length) {
    var ph = el('div', 'placeholder');
    ph.appendChild(el('div', 'big', '🔍'));
    ph.appendChild(el('div', '没有匹配的消息'));
    feed.appendChild(ph);
    return;
  }
  var start = Math.max(0, view.length - limit);
  if (start > 0) {
    var b = el('button', null, '↑ 载入更早的 ' + Math.min(400, start) + ' 条（还有 ' + start + ' 条）');
    b.id = 'more';
    b.onclick = function () {
      var keep = feed.scrollHeight - feed.scrollTop;
      limit += 400; renderFeed(); feed.scrollTop = feed.scrollHeight - keep;
    };
    feed.appendChild(b);
  }

  var dimOn = sel.realm != null && sel.dimOthers;
  // 只在开着标记、且这一天确实有摘要时才标
  var markSet = AI_MARK ? aiSrcSet() : null;
  var lastDay = '', lastSid = null, lastT = 0;
  for (var i = start; i < view.length; i++) {
    var m = view[i], d = m._d || dayOf(m.t), first = false;
    if (d !== lastDay) {
      var sep = el('div', 'daysep');
      sep.appendChild(el('span', null, dayLabel(d)));
      feed.appendChild(sep);
      lastDay = d; lastSid = null; first = true;
    }
    var grouped = (m.sid === lastSid && m.t - lastT < 300000 && !first);
    lastSid = m.sid; lastT = m.t;

    // 变暗只在"选了某个领域且开着显示其他"时发生。隐藏模式下这些消息
    // 压根不在 view 里，也就轮不到这一句。
    var row = el('div', 'msg' + (grouped ? '' : ' first') +
                        ((m.retracted || m.deleted) ? ' gone' : '') +
                        ((markSet && markSet.has(m.id)) ? ' picked' : '') +
                        ((dimOn && m._r !== sel.realm) ? ' dim' : ''));
    if (grouped) {
      row.appendChild(el('div', 'gutter', hmOf(m.t)));
    } else {
      row.appendChild(avatar(m));
    }
    var content = el('div', 'content');
    if (!grouped) {
      var head = el('div', 'head');
      var who = el('span', 'who', maskName(m));
      who.style.color = colorOf(m.sid);
      who.title = '看看这个人';
      /*
       * 点名字 = 打开资料页。
       *
       * 原来这里直接切「只看这个人」。那个功能没丢，它在资料面板里
       * 那个「只看他的消息」按钮上 —— 多一次点击，换来的是
       * 点之前就知道自己要点的是谁。
       * 已经在只看某人的状态下，再点他的名字就退回全部 ——
       * 不然"取消筛选"要绕一圈，那是原来一下就能做到的事。
       */
      (function (mm) {
        who.onclick = function () {
          if (sel.sender === mm.sid) { sel.sender = null; refresh(true); return; }
          pcOpen(mm);
        };
      })(m);
      head.appendChild(who);
      if (m.mod) head.appendChild(el('span', 'tag mod', '管理'));
      if (m.sup) head.appendChild(el('span', 'tag sup', '赞助'));
      if (m.cert) head.appendChild(el('span', 'tag cert', '证书 ' + m.cert));
      head.appendChild(el('span', 'tag realm', 'R' + m._r));
      var ts = el('span', 'ts', timeOf(m.t));
      ts.title = new Date(m.t).toString();
      head.appendChild(ts);
      // 一次只显示一个房间，每条都挂个一样的房间标签纯属噪音
      content.appendChild(head);
    }
    var body = el('div', 'body');
    renderBody(body, m.body, sel.q, true);
    content.appendChild(body);

    if (m.pinned || m.retracted || m.deleted) {
      var fl = el('div', 'flags');
      if (m.pinned) fl.appendChild(el('span', 'flag pin', '📌 置顶'));
      if (m.retracted) fl.appendChild(el('span', 'flag del', '已撤回'));
      if (m.deleted) fl.appendChild(el('span', 'flag del', '已删除'));
      content.appendChild(fl);
    }
    row.appendChild(content);
    feed.appendChild(row);
  }
}

/**
 * 日期列表 —— 只列【当前房间】的日期。
 *
 * 以前这里把三个房间的日期混在一起列，点其中一个会同时钉住日期和房间，
 * 而「全部已载入」只清日期不清房间 —— 于是就锁死了：另外两个房间的消息
 * 明明已经在内存里，却怎么点都出不来。
 * 现在房间在上面单选，这里只是那个房间内部的日期，两件事不再互相影响。
 */
function renderFiles() {
  var box = $('#files');
  clear(box);
  if (!INDEX) return;

  var mine = roomDays();
  var allRow = el('div', 'row' + (sel.day === null ? ' on' : ''));
  allRow.appendChild(el('span', 'lbl', '本房间全部已载入'));
  allRow.appendChild(el('span', 'n', roomMsgs().length));
  allRow.onclick = function () { sel.day = null; refresh(true); };
  box.appendChild(allRow);

  if (!mine.length) {
    var none = el('div', 'row');
    // 刚加的聊天室会短暂处于这个状态：消息已经从快通道来了，
    // 但按天分的日文件要等整点那次完整发布才生成。
    none.appendChild(el('span', 'lbl',
      roomMsgs().length ? '（日文件还没发布，先看最近这一小包）'
                        : '（这个房间还没有已发布的日期）'));
    box.appendChild(none);
    return;
  }

  mine.forEach(function (d) {
    var k = d.room + '|' + d.day;
    var on = LOADED.has(k);
    var stale = on && LOADED.get(k).got < (d.n || 0);   // 载过，但之后又有新消息
    var r = el('div', 'row' +
      (sel.day === d.day ? ' on' : (on && !stale ? ' done' : '')));
    r.appendChild(el('span', 'lbl',
      d.day + (stale ? ' ↻ 有更新' : on ? ' ✓' : '')));
    r.appendChild(el('span', 'n', d.n));
    if (stale) r.style.color = 'var(--warn)';
    r.onclick = function () {
      if (on && !stale) { sel.day = d.day; refresh(true); }
      else loadDays([d]);
    };
    box.appendChild(r);
  });
}

/**
 * 切换房间：换房间 → 清掉房间内部的筛选 → 载入这个房间最近几天。
 *
 * 日期、发送者都是"房间内部"的概念，换了房间它们必然失效，所以一并清掉。
 * 领域是跨房间的偏好，不动它。
 */
/*
 * ⚠️ 换房间【绝对不能等网络】。
 *
 * 线上反馈（国内用户，GitHub 部署）：点房间按钮没反应，
 * 而日期列表却跟着变了 —— 一半动一半不动，看着像界面坏了。
 *
 * 原因就在这个函数的最后一行：以前是
 *     return loadDays(...).then(function () { refresh(true); });
 * 也就是**先等文件下载完，再画界面**。而 refresh() 才是
 * 画房间高亮和消息列表的那一步（renderSidebar 在它里面）。
 * 于是网络一挂：
 *
 *     sel.room 换了            ← 状态其实是对的
 *     renderFiles() 跑了       ← 所以日期列表变了
 *     refresh() 永远等不到     ← 高亮和消息列表原地不动
 *
 * 用户看到的就是"点了没反应"，而且**他会以为数据没下来**——
 * 实际上那个房间的消息很多时候【已经在内存里了】（快通道那一包是全房间的）。
 *
 * 现在改成：**先画，后载。** 界面立刻切过去，能显示多少显示多少，
 * 文件在后台补。网络不通最多是内容少几天，而不是整个页面装死。
 */
function switchRoom(r) {
  deepStop();            // 上一轮还在给旧房间拉文件，先停
  if (r === sel.room) return;
  sel.room = r;
  sel.day = null;
  sel.sender = null;
  STATS = null;
  savePref();
  renderFiles();
  refresh(true);         // ← 立刻切过去，不等网络
  return loadDays(roomDays().slice(0, 3));
}

function renderSidebar() {
  var S = stats();               // 已缓存，搜索时不会重算

  // 房间是单选，而且【列表来自索引不是来自已载入的数据】。
  // 这一条是这次那个 bug 的根：以前从已载入的消息里统计房间，
  // 而开页只载最近三天 —— 那三天可能全是同一个房间的，
  // 于是另外两个房间在侧栏里压根不出现，看上去就像"数据没保存下来"。
  var rc = indexRooms();
  var rbox = $('#rooms'); clear(rbox);
  Object.keys(rc).sort().forEach(function (r) {
    var c = el('div', 'chip' + (sel.room === r ? ' on' : ''),
               roomLabel(r) + ' ' + rc[r].toLocaleString());
    c.title = r;                        // 悬停看得到原始的房间标识
    c.onclick = function () { switchRoom(r); };
    rbox.appendChild(c);
  });

  /*
   * ---- 正文列宽：正常 / 紧凑 ----
   *
   * 换档【只改一个 CSS 类】，不重画消息流 —— 所以这里不调 refresh()。
   * 这是有意的：录视频的时候常常是滚到某一段再切档，
   * 重画会把滚动位置弹回去，那一下正好毁掉一条镜头。
   */
  var wbox = $('#widthchips'); clear(wbox);
  [['normal', '正常'], ['compact', '紧凑']].forEach(function (p) {
    var c = el('div', 'chip' + (sel.width === p[0] ? ' on' : ''), p[1]);
    c.title = p[0] === 'compact' ? '正文列 440px —— 录视频用，长消息不会横着拖出画面'
                                 : '正文列 880px —— 平时看存档';
    c.onclick = function () {
      if (sel.width === p[0]) return;
      sel.width = p[0];
      savePref();
      applyWidth();
      renderSidebar();                  // 只重画侧栏，消息流一个字不动
    };
    wbox.appendChild(c);
  });
  $('#widthnote').textContent = sel.width === 'compact'
    ? '正文 440px。录视频用 —— 一行短，长消息不会横着拖出画面。'
    : '正文 880px。屏幕再宽也不会一路铺到最右边。';

  // ---- 领域 ----
  var rlbox = $('#realms'); clear(rlbox);
  var rkeys = Object.keys(S.realms).map(Number).sort(function (a, b) { return a - b; });
  var mkRealmChip = function (val, label, cnt) {
    var c = el('div', 'chip' + (sel.realm === val ? ' on' : ''),
               label + (cnt == null ? '' : ' ' + cnt.toLocaleString()));
    c.onclick = function () {
      if (sel.realm === val) return;
      sel.realm = val;
      savePref();
      refresh(true);
    };
    rlbox.appendChild(c);
  };
  mkRealmChip(null, '全部', ALL.size);
  rkeys.forEach(function (r) { mkRealmChip(r, 'R' + r, S.realms[r]); });

  // 选了「全部」就没有"其他领域"可言，开关置灰
  var dimBox = $('#dimother');
  var dimWrap = $('#dimwrap');
  dimBox.checked = sel.dimOthers;
  dimBox.disabled = (sel.realm == null);
  dimWrap.className = 'opt' + (sel.realm == null ? ' off' : '');

  // 发送者列表已经按条数排好了，这里只是按输入框过滤一下，很便宜
  var filt = ($('#qs').value || '').toLowerCase();
  var list = filt
    ? S.senders.filter(function (v) { return v.name.toLowerCase().indexOf(filt) >= 0; })
    : S.senders;
  var sbox = $('#senders'); clear(sbox);
  var all = el('div', 'row' + (sel.sender === null ? ' on' : ''));
  all.appendChild(el('span', 'lbl', '全部（' + S.senders.length + ' 人）'));
  all.onclick = function () { sel.sender = null; refresh(true); };
  sbox.appendChild(all);
  list.slice(0, 300).forEach(function (e) {
    var r = el('div', 'row' + (sel.sender === e.sid ? ' on' : ''));
    var l = el('span', 'lbl', e.name);
    l.style.color = colorOf(e.sid);
    r.appendChild(l); r.appendChild(el('span', 'n', e.n));
    r.onclick = function () { sel.sender = (sel.sender === e.sid ? null : e.sid); refresh(true); };
    sbox.appendChild(r);
  });

  var hrs = S.hrs;
  var rows = [
    ['已载入', ALL.size.toLocaleString()],
    ['发送者', S.senders.length],
    ['天数', S.days],
    ['时间跨度', hrs >= 48 ? (hrs / 24).toFixed(1) + ' 天' : hrs.toFixed(1) + ' 小时'],
  ];
  var mn = $('#masknote');
  if (mn) {
    mn.textContent = MASK.length
      ? ('已屏蔽 ' + MASK.length + ' 人：' +
         MASK.map(function (x, i) { return '玩家' + (i + 1) + '＝' + (x.name || ('#' + x.sid)); })
             .join('、') +
         '\n只在聊天流里遮，侧栏和资料页照旧。')
      : '把某个人的头像和 ID 换成占位图，正文里 @ 他的地方一起换。\n只影响这台设备上的显示。';
  }

  var st = $('#stats'); clear(st);
  rows.forEach(function (kv) {
    var d = el('div', 'stat');
    d.appendChild(el('span', null, kv[0]));
    d.appendChild(el('b', null, kv[1]));
    st.appendChild(d);
  });
}

function refresh(bottom) {
  applyFilters(); renderSidebar(); renderFeed(); renderFiles(); renderDeep();
  renderAiCard();
  var p = [roomLabel(sel.room)];
  if (sel.day) p.push(sel.day);
  if (sel.sender != null) {
    var one = view[0];
    if (!one) ALL.forEach(function (m) { if (!one && m.sid === sel.sender) one = m; });
    // 顶栏就在聊天流正上方，录视频时一起入镜 —— 这里也要按屏蔽后的叫
    if (one) p.push(maskName(one));
  }
  if (sel.realm != null) p.push('R' + sel.realm + (sel.dimOthers ? '' : ' 独占'));
  if (sel.q) p.push('搜索「' + sel.q + '」');
  $('#btitle').textContent = ALL.size ? p.join(' · ') : '聊天记录';
  var inRoom = roomMsgs().length;
  var extraN = (deepMsgs() || []).length;
  // 深搜捞回来的不在 ALL 里，所以 view 可能比"已载入的条数"还多。
  // 直接写成 x / y 会看着像出错了，分开写清楚。
  $('#bsub').textContent = ALL.size
    ? (extraN
        ? view.length.toLocaleString() + ' 条（含更早存档里的 ' +
          extraN.toLocaleString() + ' 条）'
        : view.length.toLocaleString() + ' / ' + inRoom.toLocaleString() + ' 条')
    : '';
  if (bottom) requestAnimationFrame(function () {
    var f = $('#feed'); f.scrollTop = f.scrollHeight;
  });
}

// ---------- 事件 ----------
/** 重读索引，并把"已载入但又有新增"的日期重新拉一遍。 */
function refreshAll() {
  /*
   * 手动刷新时把快通道的"没有这个文件"结论清掉，重新试一次。
   *
   * 那个结论有可能是错的（比如部署刚补上 recent、或者当初那次是 404 之外的
   * 什么原因），而**用户唯一能主动做的补救动作就是点刷新** ——
   * 点了还不重试，就等于告诉他"没救了"。多一次请求而已。
   */
  HAS_RECENT = null;
  setErr(''); setInfo('检查更新…');
  return getJSON(DATA + '/index.json').then(function (ix) {
    INDEX = ix;
    // 只按条数过滤，不按 published 过滤。published:false 只表示"这天还有一部分
    // 没传上去"，已经传上去的那部分是真实存在的，不该被藏起来。
    INDEX.days = (ix.days || []).filter(function (d) { return (d.n || 0) > 0; });
    if (!encReady()) return;
    sel.room = pickRoom();
    var about = $('#about');
    clear(about);
    about.appendChild(el('div', null, '更新时间 ' + fmtFull(ix.generated)));
    freshLines().forEach(function (t) {
      var d = el('div', null, t);
      if (t.indexOf('⚠️') === 0) { d.style.color = 'var(--warn)'; d.style.lineHeight = '1.6'; }
      about.appendChild(d);
    });
    about.appendChild(el('div', null, '游戏内公开聊天频道的存档，仅供查阅。'));
    // 页面版本号：两个站对不上就说明有一边的页面没更新
    var bv = el('div', null, '页面 ' + PAGE_BUILD);
    bv.style.opacity = '.55';
    bv.style.fontVariantNumeric = 'tabular-nums';
    bv.title = '这份页面的版本号。CF 和 GitHub 两个站的这个号应该一样，' +
               '对不上就说明有一边没更新。';
    about.appendChild(bv);
    renderFiles();
    // 当前房间一天都没载过
    var loadedHere = 0;
    LOADED.forEach(function (v, k) { if (k.split('|')[0] === sel.room) loadedHere++; });
    if (!loadedHere) return loadDays(roomDays().slice(0, 3)).then(withRecent);

    // 要重新拉的有两类：
    //   1. 已经载过、但条数变多了的（当天又有新消息）
    //   2. 索引里【新冒出来的一天】—— 归档按天分文件，跨过 UTC 零点之后新消息
    //      全进新的日文件。只认第 1 类的话，一到零点页面就再也不更新了，
    //      表现正是"侧栏能看到新文件，就是不显示新内容"。
    // 「最新的一天」要按房间各算各的 —— 混着算的话，最吵的那个房间
    // 会把安静房间的新日期挡在门外（它的日期比别人"旧"）。
    var newest = '';
    LOADED.forEach(function (v, k) {
      var p2 = k.split('|');
      if (p2[0] !== sel.room) return;
      if (p2[1] > newest) newest = p2[1];
    });
    var todo = roomDays().filter(function (d) {
      if (LOADED.has(d.room + '|' + d.day)) return needLoad(d);
      return d.day >= newest;        // 只补更新的日期，不顺手把整个历史拖下来
    });
    return loadDays(todo).then(withRecent);
  }).catch(function (e) { setErr('刷新失败：' + e.message); setInfo(); });
}

$('#b_refresh').onclick = refreshAll;
// 这两个按钮都只管【当前房间】—— 和左边的日期列表是同一个范围，
// 不会顺手把另外两个房间的几十万条一起拖下来。
$('#b_recent').onclick = function () { if (INDEX) loadDays(roomDays().slice(0, 7)); };
$('#b_all').onclick = function () {
  if (!INDEX) return;
  var mine = roomDays();
  // 按【条数】提醒，不是文件数 —— 40 个文件可能是两万条，也可能是几十万条，
  // 差别在低端手机上就是"有点慢"和"被系统杀掉"的区别。
  var msgs = mine.reduce(function (a, d) { return a + (d.n || 0); }, 0);
  if (msgs > 50000 &&
      !confirm('将载入' + roomLabel(sel.room) + '的 ' + msgs.toLocaleString() +
               ' 条消息（' + mine.length + ' 个文件）。\n' +
               '数据量较大，手机上可能很慢甚至卡死。\n\n' +
               '建议改为点左侧某一天单独载入。仍要继续吗？')) return;
  loadDays(mine);
};
var qt;
$('#q').oninput = function (e) {
  clearTimeout(qt);
  var v = e.target.value;
  qt = setTimeout(function () {
    sel.q = v.trim();
    deepStop();                 // 上一轮还在跑就先叫停，别把结果混在一起
    refresh(true);
    // 已载入的那几天是瞬时筛出来的（上面那句），然后再去更早的存档里找。
    // 从最新往回翻、凑够 500 条就停 —— 实测通常只翻 2~4 天、几十毫秒。
    deepSearch();
  }, 180);
};
$('#dimother').onchange = function (e) {
  sel.dimOthers = !!e.target.checked;
  savePref();
  refresh(true);
};
$('#qs').oninput = renderSidebar;
$('#b_mask').onclick = function () { mkOpen(); };
$('#burger').onclick = function () { document.body.classList.toggle('nav'); };
$('#scrim').onclick = function () { document.body.classList.remove('nav'); };
document.addEventListener('keydown', function (e) {
  if ((e.metaKey || e.ctrlKey) && e.key === 'f') { e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Escape') {
    /*
     * ⚠️ 灯箱开着时，Esc 只关灯箱，【不要】顺手把筛选也清了。
     * 不加这个 return 的话，看完一张图按 Esc，
     * 你翻了半天的搜索词和日期选择会一起消失 —— 而且看不出是被谁清的。
     */
    if (LB.open) { lbClose(); return; }
    // 资料面板同理：Esc 只关面板，不动筛选
    if (PC.open) { pcClose(); return; }
    // 屏蔽面板同理
    if (MK.open) { mkClose(); return; }
    // 领域是"偏好"不是"临时筛选"，Esc 不动它。
    // 房间同理，而且它必须始终有一个选中的 —— 清空就没东西可显示了。
    sel.q = ''; sel.day = null; sel.sender = null;
    $('#q').value = ''; document.body.classList.remove('nav'); refresh(true);
  }
});

// 切回本页且距上次检查超过 2 分钟时，自动查一次更新
var lastCheck = Date.now();
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState !== 'visible') return;
  if (Date.now() - lastCheck < 120000) return;
  lastCheck = Date.now();
  if (INDEX) refreshAll();
});

(function () {
  var rb = document.querySelector('#c_reset');
  if (rb) rb.onclick = function () {
    var blank = calcBlank();
    CALC.hours = blank.hours; CALC.wage = blank.wage;
    CALC.bonus = blank.bonus; CALC.target = blank.target;
    CALC.items = blank.items;
    calcSave();
    renderCalc();
  };
})();

boot();
})();
</script>
</body>
</html>
