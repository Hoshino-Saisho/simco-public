  return { q: q, c: c / q, h: h / q, n: e.length };
}
/** 直接往【初始那一份】里记一笔。只有初始小时才让填。 */
function mapAddCost(id, q, c, h, t) {
  if (!(q > 0)) return;
  if (!MAP.cost[id]) MAP.cost[id] = { e: [] };
  MAP.cost[id].e.push({ q: q, c: c, h: h || 0, t: t || 'make' });
  mapStockBust(); mapSave();
}
/*
 * ⚠️ 仓库【不能删】了。
 *    以前那个「删除」是在改一份现状；现在仓库是从事件算出来的，
 *    删掉一行等于凭空让东西消失，而账上不会有任何一处对得上。
 *    要清就整份重置。
 */

// ------------------------------- 开工（生产 / 零售）-------------------------
/**
 * 一次开工到第 H 小时为止已经入库多少。
 *
 * 逐小时入库，**每次都是步长的整数倍**（原料不能半个半个地用），
 * 而且最后一小时一定补齐到总数 —— 所以"每小时都有收成"和
 * "最终产量不变"两条同时成立。
 */
function mapRunGot(e, H) {
  if (H <= e.h) return 0;
  var t = Math.min(e.hours, H - e.h);
  if (t >= e.hours) return e.units;
  var step = e.step || 1;
  return Math.floor(e.units * t / e.hours / step) * step;
}
/** 这次开工做完了吗。 */
function mapRunDone(e, H) { return H >= e.h + e.hours; }

/** 这栋楼在第 H 小时正在跑的那次开工（没有就是 null）。 */
function mapRunAt(k, H) {
  var got = null;
  mapEv().forEach(function (e) {
    if (e.t === 'run' && e.k === k && e.h <= H && H < e.h + e.hours) got = e;
  });
  return got;
}

// ------------------------------- 材料账单 -----------------------------------
/*
 * 建造和升级都要吃这四样：钢筋混凝土 / 砖块 / 木板 / 建造单位。
 *
 * 前三样是物品表里的东西（有 id、能进仓库）；**建造单位不是**，
 * 它在物品表里根本没有编号 —— 所以单独给它一个价格框（MAP.cuPrice）。
 * 不给的话表现是"我到处找不到哪儿能给建造单位定价"。
 *
 * 结账规矩：**仓库里有的先用，不够的按单价买、从现金里扣。**
 * 这两条他都说了（"消耗材料"和"根据价格和数量消耗现金"），
 * 而只做一边都会算错：只扣材料的话钱永远不动，只扣钱的话仓库永远不减。
 */
function mapCuPrice() {
  /*
   * ⚠️ 不能直接 Number(MAP.cuPrice)：**Number(null) 是 0，不是 NaN**。
   *    那样"没填价"会被当成"价格是 0"，于是建造白送 ——
   *    而它算出来的总价看着完全正常。
   */
  var raw = MAP.cuPrice;
  if (raw === null || raw === undefined || raw === '') return null;
  var v = Number(raw);
  return (isFinite(v) && v >= 0) ? v : null;
}
function mapMatList() {
  return [
    { k: 'cc', id: MAP_DATA.mat.cc, n: mapName(MAP_DATA.mat.cc) },
    { k: 'br', id: MAP_DATA.mat.br, n: mapName(MAP_DATA.mat.br) },
    { k: 'pl', id: MAP_DATA.mat.pl, n: mapName(MAP_DATA.mat.pl) },
    { k: 'cu', id: null, n: '建造单位' },
  ];
}
/**
 * 把一份消耗（{cc,br,pl,cu}）结成账：从仓库拿多少、还要买多少、一共花多少钱。
 * 有一样没定价就 { err:'price', miss:[…] } —— 缺价按 0 算会得出一个
 * 看着很便宜、其实是假的总价。
 */
function mapMatBill(cost) {
  var take = [], buy = [], cash = 0, miss = [];
  mapMatList().forEach(function (m) {
    var need = cost[m.k] || 0;
    if (!(need > 0)) return;
    var price = null, have = 0;
    if (m.id == null) {
      price = mapCuPrice();
    } else {
      var g = mapStock(m.id);
      if (g) { price = g.c; have = g.q; }
    }
    if (price === null) { miss.push(m.n); return; }
    var from = Math.min(have, need), rest = need - from;
    if (from > 0) take.push({ id: m.id, n: from, name: m.n });
    if (rest > 0) {
      buy.push({ id: m.id, n: rest, name: m.n, price: price });
      cash += rest * price;
    }
  });
  if (miss.length) return { err: 'price', miss: miss };
  return { take: take, buy: buy, cash: cash };
}

/**
 * 一个事件到第 H 小时为止对现金的影响。
 *
 *   原料钱  开工那一刻一次扣掉
 *   工资    按小时扣（跑到一半就只扣一半）
 *   出售    成交那一刻进账
 */
function mapEvCash(e, H) {
  if (e.h > H) return 0;
  if (e.t === 'run') {
    var ran = Math.min(e.hours, H - e.h);
    return -(e.matC || 0) - (e.wagePerH || 0) * ran;
  }
  if (e.t === 'sell') return (e.net || 0);
  // 建造 / 升级：仓库不够的那部分是买来的，钱在开工那一刻付
  if (e.t === 'up' || e.t === 'build') return -(e.cash || 0);
  if (e.t === 'buy') return -(e.units * e.price);
  if (e.t === 'hire') return 0;
  return 0;
}

// ---------------------------------------------------------------------------
// 一批要做多久、吃多少
// ---------------------------------------------------------------------------
/**
 * 「按 24 小时做」一批。
 *
 * 规矩（你定的）：按最大产量算，但不超过 24 小时；
 * **原料必须整个整个地消耗，不能出现小数** —— 后一条决定了产量只能是
 * 某个步长的整数倍（一个原料一次要 0.005 个，产量就得是 200 的倍数）。
 * 每个物品的步长在数据里预先算好了（st）。
 *
 * ⚠️ 往【小】了取整。往大取就超过 24 小时了，而"24 小时"是这个按钮唯一的承诺。
 */
function mapRunPlan(it, lv, kind, hours) {
  var mul = (kind === 'r') ? mapSaleMul() : mapProdMul();
  var rate = (kind === 'r' ? it.sold : it.ph) * lv * mul;
  if (!(rate > 0)) return null;
  var hrs = Math.max(MAP_RUN_MIN, Math.min(MAP_RUN_MAX, Math.floor(hours) || MAP_HOURS));
  var cap = Math.floor(rate * hrs);
  var step = (kind === 'r') ? 1 : (it.st || 1);
  var units = Math.floor(cap / step) * step;
  var uses = [];
  if (kind !== 'r') {
    it['in'].forEach(function (p) { uses.push({ id: p[0], n: p[1] * units }); });
  }
  /*
   * hours 是【玩家选的那个时长】，不是"做完这批要多久"。
   * 取整到步长之后产量会比满产少一点，但楼照样被占满这么久 ——
   * 现实就是这样，而把 hours 改成 units/rate 会让工资少算一截。
   */
  return { rate: rate, units: units, hours: hrs, busy: hrs,
           step: step, cap: cap, uses: uses };
}
/** 老名字，24 小时那一档。测试和几处显示还在用。 */
function map24(it, lv, kind) { return mapRunPlan(it, lv, kind, MAP_HOURS); }

/** 一个单位占掉多少【一级】小时。速度加成算，等级不算 —— 你定的。 */
function mapUnitHours(it) {
  var r = it.ph * mapProdMul();
  return r > 0 ? 1 / r : 0;
}

/**
 * 造一批的账。
 * 返回 null 表示有原料还没定价 —— 那就【什么都不算】，不拿 0 当价格。
 * 缺价的东西按 0 算，会得出一个漂亮的低成本，而你根本看不出它是假的。
 */
function mapMakeCost(it, bld, lv, hours) {
  var r = mapRunPlan(it, lv, 'p', hours || MAP_HOURS);
  if (!r || !r.units) return { err: r ? 'step' : 'zero', r: r };
  var miss = [], matC = 0, matH = 0, short = [];
  r.uses.forEach(function (u) {
    var g = mapStock(u.id);
    if (!g) { miss.push(u.id); return; }
    matC += g.c * u.n;
    matH += g.h * u.n;          // 原料自己的时间，跟着往上游带
    // 仓库里够不够。不够也照算，但要说出来 —— 悄悄按够了算是最坑的
    if (g.q < u.n - 1e-9) short.push({ id: u.id, need: u.n, have: g.q });
  });
  if (miss.length) return { err: 'miss', miss: miss, r: r };
  var wage = mapWagePerHour(bld, lv) * r.hours;
  var unitC = (wage + matC) / r.units;
  var unitH = mapUnitHours(it) + matH / r.units;
  return { r: r, wage: wage, matC: matC, matH: matH, short: short,
           unitC: unitC, unitH: unitH };
}

/**
 * 真的开工：把这一批记成时间轴上的一个事件。
 *
 * ⚠️ 开工之后【中途碰不了】—— 只能等它跑完，或者直接跳到结束那一刻。
 *    所以原料、工资、产量这些数在开工那一刻就定死存进事件里，
 *    不跟着后来改的价格走。不定死的话，跑到一半回头改个原料价，
 *    这一批的成本会自己变，而账已经记出去了。
 */
function mapStartRun(k, itemId, kind, hours) {
  if (!mapCanEdit()) return;
  var x = null;
  mapListAt(mapCur()).forEach(function (b) { if (b.k === k) x = b; });
  if (!x) return;
  var H = mapCur();
  if (mapRunAt(k, H) || mapBusyAt(x, H)) return;     // 在跑 / 在施工就不许再开
  var it = mapItem(itemId), bd = mapBld(x.b);
  if (!it || !bd) return;
  var lv = mapLvAt(x, H);
  var hrs = Math.max(MAP_RUN_MIN, Math.min(MAP_RUN_MAX, Math.floor(hours) || MAP_HOURS));
  if (H + hrs > mapWinEnd()) return;                 // 跑出规划窗口就不许开
  var r = mapRunPlan(it, lv, kind, hrs);
  if (!r || !r.units) return;
  var ev = { t: 'run', h: H, k: k, item: itemId, kind: kind,
             hours: hrs, units: r.units, step: r.step,
             uses: r.uses, wagePerH: mapWagePerHour(bd, lv),
             matC: 0, unitC: 0, unitH: 0 };
  if (kind === 'r') {
    // 零售：不吃原料，产出就是"卖掉"的量，成本按仓库里那份走
    ev.uses = [];
    var g0 = mapStock(itemId);
    ev.unitC = g0 ? g0.c : 0;
    ev.unitH = g0 ? g0.h : 0;
  } else {
    var m = mapMakeCost(it, bd, lv, hrs);
    if (m.err) return;
    ev.matC = m.matC; ev.unitC = m.unitC; ev.unitH = m.unitH;
  }
  mapEv().push(ev);
  // 开工 = 每日成就那一下，simboost 看的就是这个
  if (!mapEv().some(function (e) { return e.t === 'work' && e.k === k && e.h === H; })) {
    mapEv().push({ t: 'work', h: H, k: k });
  }
  mapStockBust(); mapSave(); renderMap();
}

/**
 * 卖一批的账。
 *   交易所  到手 96%，运输按 transportation 全额
 *   合同    到手 100%，运输减半
 * 运输本身也要有成本和工时（它也是个产品，13 号运输单位）—— 没定价就不算。
 */
var MAP_TRANSPORT_ID = 13;

/**
 * 升到 n 级一共要花多少（初始等级 0 那条）。
 *
 *     T = k × (1 + (m + n) × (n − 1 − m) / 2)      m = 初始等级，这一版恒为 0
 *
 * 对一遍：n=1 → k；n=2 → 2k；n=3 → 4k；n=4 → 7k。
 * 也就是每一级比上一级多花一份，累加起来。k 是"一级要多少"——
 * 钢混 / 砖块 / 木板 / CU / 小时各有各的 k，公式是同一个。
 *
 * ⚠️ 这个函数算的是【从零建到 n 级一共要投多少】，左边那一栏用它。
 *    「升一级要多少」是另一回事，见 mapUpStep。
 */
function mapUpFactor(n, m) {
  m = m || 0;
  if (!(n > m)) return 0;
  return 1 + ((m + n) * (n - 1 - m)) / 2;
}

/**
 * 从 from 级升到 to 级要花几份 k。
 *
 * ⚠️ **升级消耗看的是当前等级**：from → from+1 花 from 份
 *    （5 级升 6 级 5 份，50 级升 51 级 50 份），因为
 *    f(n) = 1 + n(n−1)/2 的相邻差正好是 n−1… 准确说 f(L+1) − f(L) = L。
 *
 * 这里刻意写成【差值】而不是把 from 塞进 mapUpFactor 的 m：
 * 那样代进去得到 T = 1 + (2L+1)×0/2 = 1，**每一级都只要 1 份 k**，
 * 于是 50 级升 51 级和 1 级升 2 级一样便宜。
 *
 * 用差值还有一个必须的好处：**分几次升和一次升到位价钱完全一样**。
 * 不然会出现"拆开一级一级升更便宜"这种谁都会去薅的漏洞，
 * 而模拟器一旦和游戏在这种地方对不上，算出来的规划就没法照着执行。
 */
function mapUpStep(from, to) {
  var a = Math.max(0, Math.floor(from)), b = Math.floor(to);
  if (!(b > a)) return 0;
  return mapUpFactor(b, 0) - mapUpFactor(a, 0);
}
/** 一栋楼从 from（默认 0）升到 lv 级的消耗（材料 + 时间）。 */
function mapUpCost(bld, lv, from) {
  var f = from ? mapUpStep(from, lv) : mapUpFactor(lv, 0);
  var u = bld.up || {};
  return { f: f, cc: (u.cc || 0) * f, br: (u.br || 0) * f, pl: (u.pl || 0) * f,
           cu: (u.cu || 0) * f, hr: (u.hr || 0) * f };
}
function mapSellCalc(it, units, price, mode) {
  var rate = (mode === 'ct') ? MAP_CT_RATE : MAP_EX_RATE;
  var trEach = it.tr * ((mode === 'ct') ? MAP_CT_TR : 1);
  var trUnits = trEach * units;
  var g = mapStock(it.id);
  var tg = mapStock(MAP_TRANSPORT_ID);
  var income = price * rate * units;
  var out = { rate: rate, trEach: trEach, trUnits: trUnits, income: income,
              haveCost: !!g, haveTr: !!tg || trUnits === 0 };
  out.goods = g ? g.c * units : 0;
  out.goodsH = g ? g.h * units : 0;
  out.tr = tg ? tg.c * trUnits : 0;
  out.trH = tg ? tg.h * trUnits : 0;
  out.profit = income - out.goods - out.tr;
  out.hours = out.goodsH + out.trH;
  /*
   * 一条龙时利 —— 和「计算器 → 一条龙」那边是**同一个公式**：
   *
   *     时利 = 利润 ÷ 总耗时，  总耗时 = Σ(这一步要多少 ÷ 这一步每小时产多少)
   *
   * 那边是一步步手填的；这边的"总时间"就是仓库里那个单位时间 ——
   * 它本来就是顺着原料链一路加上来的（自己 + 每样原料带来的），
   * 所以这里直接除就行，不用再把产业链拆一遍。
   * 外购的那几步工时是 0（没占你的产能），和一条龙那边"不勾自产就不计时"一致。
   */
  out.hourly = out.hours > 0 ? out.profit / out.hours : null;
  return out;
}

// ---------------------------------------------------------------------------
// 摆楼
// ---------------------------------------------------------------------------
// ---------------------------------------------------------------------------
// 游戏时钟 / 时间轴
// ---------------------------------------------------------------------------
/*
 * ============================ 游戏里的时间表 ============================
 *
 * 游戏钟走 **UTC**，不跟夏令时。下面这张表就是官方那份周期表，
 * 照抄下来当数据用 —— 时间点写死在各处代码里的话，改一个要翻半天。
 *
 * dow：星期几才发生（0 = 周日 … 6 = 周六，按 UTC 算）。不写 = 每天。
 * dur：这件事大约持续多少分钟，只用来显示。
 * tag：这一版真的接进算式的那几条，别的先只显示。
 */
var MAP_CLOCK = [
  { h: 0,  m: 0,  n: '参考价格' },
  { h: 0,  m: 0,  n: '丰度更新（矿井/油井/采石场 −0.032%）' },
  { h: 0,  m: 0,  n: '债券利息', dur: 60 },
  { h: 0,  m: 0,  n: '活动更替', dow: 1 },
  { h: 0,  m: 30, n: '每日成就重置', tag: 'ach' },
  { h: 0,  m: 30, n: 'simboost 兑换额度重置（$10,000）' },
  { h: 1,  m: 0,  n: '公司价值更新', dur: 120 },
  { h: 2,  m: 30, n: '利润表', dur: 240 },
  { h: 3,  m: 0,  n: '会计费用' },
  { h: 4,  m: 0,  n: '高管薪酬', tag: 'pay' },
  { h: 8,  m: 0,  n: '高管退休（看年龄和薪酬）', tag: 'retire' },
  { h: 11, m: 0,  n: '季节广场建筑更新' },
  { h: 13, m: 0,  n: '政府订单中标公示', dow: 1 },
  { h: 13, m: 0,  n: '政府订单招标', dow: 3 },
  { h: 14, m: 0,  n: '高管经验', tag: 'exp' },
  { h: 15, m: 0,  n: '转换经济周期', dow: 5 },
  { h: 16, m: 0,  n: '报纸出版', dow: 4 },
  { h: 23, m: 30, n: '零售更新' },
];

var MAP_HOUR = 3600000;
var MAP_DAY = 24 * MAP_HOUR;
var MAP_ACH_MIN = 30;              // 每日成就在 00:30 UTC 重置
var MAP_SIMBOOST_PER_DAY = 5;      // 那个成就给几个
var MAP_EXEC_AGE_DAYS = 2;         // 几天长一岁
var MAP_EXEC_AGE_MIN = 21;         // 最小年龄
var MAP_PLAN_MAX_H = 24 * 365;     // 最远能规划到哪儿（一年，纯粹是别让它无限滚）

function mapHourMs(ms) { return Math.floor(ms / MAP_HOUR) * MAP_HOUR; }

/**
 * 计划起点。**第一次用到时才定下来**，定了就不动 ——
 * 每次开页重新取"现在"的话，昨天排的计划今天会整体挪位，
 * 而排在第 30 小时的那次升级会突然变成"已经过去了"。
 */
function mapT0() {
  if (!MAP.t0) { MAP.t0 = mapHourMs(Date.now()); mapSave(); }
  return MAP.t0;
}
function mapCur() { return Math.max(0, Math.floor(Number(MAP.cur) || 0)); }
function mapMsAt(h) { return mapT0() + h * MAP_HOUR; }
function mapNowMs() { return mapMsAt(mapCur()); }

function mapPad2(n) { return (n < 10 ? '0' : '') + n; }
/** 'MM-DD HH:00 周三' —— 全按 UTC。 */
function mapFmtT(ms) {
  var d = new Date(ms);
  return mapPad2(d.getUTCMonth() + 1) + '-' + mapPad2(d.getUTCDate()) + ' ' +
    mapPad2(d.getUTCHours()) + ':00　' +
    ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][d.getUTCDay()];
}
/** 相对起点的说法：+0 / +7 小时 / +2 天 3 小时 */
function mapFmtOff(h) {
  if (h <= 0) return '起点';
  var d = Math.floor(h / 24), r = h % 24;
  return '+' + (d ? d + ' 天' + (r ? ' ' + r + ' 小时' : '') : r + ' 小时');
}

/**
 * 游戏日的编号。**边界是 00:30 UTC**（每日成就重置那一刻），不是自然午夜 ——
 * 用午夜切的话，00:00~00:30 那半小时会被算进新的一天，
 * 而成就其实还没重置，simboost 会多给一次。
 */
function mapGameDay(ms) {
  return Math.floor((ms - MAP_ACH_MIN * 60000) / MAP_DAY);
}

/** [ms, ms+1小时) 这一格里会发生的游戏事件。 */
function mapClockAt(ms) {
  var d = new Date(ms), hh = d.getUTCHours(), dow = d.getUTCDay();
  return MAP_CLOCK.filter(function (e) {
    return e.h === hh && (e.dow === undefined || e.dow === dow);
  });
}

// ------------------------------- 时间轴上的事件 -----------------------------
/*
 * 计划是一串【记了小时的事件】，当前状态是把它们放到某个小时上算出来的，
 * 不是一份被改来改去的现状。
 *
 * 这么写才可能满足他要的那两条：
 *   · 时间是停的，只有点到未来某个小时，那个小时之前的事情才算数
 *   · 可以随便往回翻；翻回做决定那一刻，就能改
 *
 * 事件：
 *   { t:'up',   h, k, from, to, dur }   在第 h 小时点了升级，dur 小时后完成
 *   { t:'work', h, k }                  在第 h 小时让这栋楼开工（成就 / simboost 看这个）
 */
function mapEv() {
  if (!MAP.ev || Object.prototype.toString.call(MAP.ev) !== '[object Array]') MAP.ev = [];
  return MAP.ev;
}
function mapEvOf(k, t) {
  return mapEv().filter(function (e) { return e.k === k && (!t || e.t === t); })
    .sort(function (a, b) { return a.h - b.h; });
}

/** 这栋楼在第 H 小时是几级：初始等级 + 那时候【已经完工】的升级。 */
function mapLvAt(x, H) {
  var lv = Math.max(1, Math.floor(Number(x.lv) || 1));
  mapEvOf(x.k, 'up').forEach(function (e) {
    if (e.h + e.dur <= H) lv = e.to;
  });
  return lv;
}
/** 当前看的那个小时上的等级 —— 页面上到处用的就是这个。 */
function mapLvNow(x) { return mapLvAt(x, mapCur()); }

/** 第 H 小时正在施工吗：返回 { e, left, to } 或 null。 */
function mapBusyAt(x, H) {
  var got = null;
  mapEvOf(x.k, 'up').forEach(function (e) {
    if (e.h <= H && H < e.h + e.dur) got = { e: e, left: e.h + e.dur - H, to: e.to };
  });
  return got;
}
/** 排在【以后】的升级（还没到点的），用来在界面上摆出来、也能撤销。 */
function mapPendingAt(x, H) {
  return mapEvOf(x.k, 'up').filter(function (e) { return e.h > H; });
}

/**
 * 到第 H 小时为止攒了多少 simboost。
 *
 * 规则（他定的）：生产和零售是**同一个成就**，不叠加 ——
 * 一个游戏日里只要有建筑【开始】工作过，就拿 5 个；没开工就一个都没有。
 * 所以这里按"游戏日"去重，不按开工次数数。
 */
function mapSimboostAt(H) {
  var days = {};
  mapEv().forEach(function (e) {
    if (e.t !== 'work' || e.h > H) return;
    days[mapGameDay(mapMsAt(e.h))] = 1;
  });
  return Object.keys(days).length * MAP_SIMBOOST_PER_DAY;
}
/** 第 H 小时所在的那个游戏日，已经开过工了吗（开过就不会再给了）。 */
function mapWorkedToday(H) {
  var day = mapGameDay(mapMsAt(H));
  return mapEv().some(function (e) {
    return e.t === 'work' && e.h <= H && mapGameDay(mapMsAt(e.h)) === day;
  });
}

/**
 * 高管在第 H 小时多大。两天长一岁，最小 21，暂时不封顶。
 *
 * ⚠️ 年龄是【算出来的】，不是存一个数然后定时去加。
 *    存着加的话，往回翻时间年龄不会跟着退回去 ——
 *    而"能随便回溯"正是这个模式的前提。
 */
function mapExecAgeAt(man, H) {
  var a0 = Math.floor(Number(man && man.age));
  if (!isFinite(a0) || a0 < MAP_EXEC_AGE_MIN) a0 = MAP_EXEC_AGE_MIN;
  return a0 + Math.floor(H / (24 * MAP_EXEC_AGE_DAYS));
}

var MAP_SEQ = 1;
/*
 * ⚠️ 摆楼 / 拆楼 / 改初始等级，都【只有在起点那一小时才允许】。
 *
 * 不拦的话，往前走到第 30 小时再改初始等级，等于把已经"发生过"的
 * 30 小时重写了一遍 —— 之前算出来的成本、排下去的施工全部对不上，
 * 而页面上不会有任何一处提示你刚刚改的是历史。
 * 想改就往回走到起点，这条规矩他自己也是这么说的。
 */
function mapAtStart() { return mapSetupOn(); }

function mapAdd(name) {
  if (!mapSetupOn()) return;
  if (mapListAt(mapCur()).length >= MAP_MAX || !mapBld(name)) return;
  MAP.list.push({ k: 'b' + (Date.now() % 1e7) + '-' + (MAP_SEQ++), b: name, lv: 1 });
  mapSave(); renderMap();
}
function mapRemove(k) {
  if (!mapSetupOn()) return;
  MAP.list = MAP.list.filter(function (x) { return x.k !== k; });
  // 那栋楼的安排也一起收走，不然会留下一串指向不存在建筑的事件
  MAP.ev = mapEv().filter(function (e) { return e.k !== k; });
  if (MAP.sel === k) MAP.sel = null;
  mapSave(); renderMap();
}
/** 等级只认 1 以上的整数；填了乱七八糟的就当没改，不要偷偷变成 1。 */
function mapSetLv(k, v) {
  if (!mapSetupOn()) { renderMap(); return; }
  var b = null;
  MAP.list.forEach(function (x) { if (x.k === k) b = x; });
  if (!b) return;
  var n = Math.floor(Number(v));
  if (!isFinite(n) || n < 1) { renderMap(); return; }
  b.lv = Math.min(999, n);
  mapSave(); renderMap();
}

// ---------------------------------------------------------------------------
// 小工具
// ---------------------------------------------------------------------------
function mnum(x) {
  if (!isFinite(x)) return '—';
  if (Math.abs(x) >= 1000) return Math.round(x).toLocaleString();
  if (Math.abs(x - Math.round(x)) < 1e-9) return String(Math.round(x));
  if (Math.abs(x) >= 1) return String(Math.round(x * 100) / 100);
  return String(Math.round(x * 10000) / 10000);
}
function mmoney(x) { return isFinite(x) ? '$' + mnum(x) : '—'; }
function mhrs(h) {
  if (!isFinite(h)) return '—';
  if (h >= 1) return mnum(h) + ' 小时';
  if (h >= 1 / 60) return mnum(h * 60) + ' 分';
  return mnum(h * 3600) + ' 秒';
}
function mIn(val, ph, onset, w) {
  var i = document.createElement('input');
  i.type = 'number'; i.step = 'any'; i.value = (val === '' || val == null) ? '' : String(val);
  if (ph) i.placeholder = ph;
  if (w) i.style.width = w;
  /*
   * ⚠️ 用 change 不用 input，而且重画要【推迟到这一轮事件之后】。
   *    change 是在 blur 里派发的，在它里面同步换掉整块 DOM，浏览器会抛
   *    "Failed to execute 'removeChild' … moved in a 'blur' event handler?"
   *    —— 页面看着没事，控制台是条真异常，那次改动还会半途而废。实测撞到过。
   */
  i.onchange = function () {
    var v = i.value;
    setTimeout(function () { onset(v); }, 0);
  };
  return i;
}

// ---------------------------------------------------------------------------
// 画：列表
// ---------------------------------------------------------------------------
function renderMap() {
  var box = document.querySelector('#mapwrap');
  if (!box) return;
  // ⚠️ 仓库是按"当前小时 + 事件"算出来的，每次重画都得让缓存过期。
  //    不打掉的话，翻了时间仓库还停在上一次那一格 —— 而它看着完全正常。
  mapStockBust();
  clear(box);
  var cur = null;
  mapListAt(mapCur()).forEach(function (x) { if (x.k === MAP.sel) cur = x; });
  var topw = el('div', 'minner');
  renderMapTop(topw);
  box.appendChild(topw);
  var cols = el('div', 'mcols');
  var left = el('div', 'mleft');
  var right = el('div', 'mright');
  var inner = el('div', 'minner');
  right.appendChild(inner);
  renderMapUp(left);
  if (cur) renderMapOne(inner, cur);
  else renderMapList(inner);
  cols.appendChild(left);
  cols.appendChild(right);
  box.appendChild(cols);
}

/**

/** 百分比，一位小数。 */
function mpct1(x) { return (Math.round((Number(x) || 0) * 1000) / 10) + '%'; }

/**
 * 一栋楼的等级那一块。分成两件事，而它们**不是一回事**：
 *
 *   初始等级   这栋楼在【计划起点】是几级 —— 只有回到起点才能改
 *   升级       在当前这个小时排一次施工，要花时间，到点了等级才变
 *
 * 分开是必须的：不分的话"我把等级从 10 改成 20"到底是
 * "我本来就有 20 级"还是"我要升到 20 级"分不出来 ——
 * 而这两件事一个不花钱不花时间，一个两样都要花。
 */
function renderMapLevel(box, x, b) {
  var H = mapCur(), lv = mapLvAt(x, H), busy = mapBusyAt(x, H), atStart = H === 0;

  var lvb = el('div', 'mlvbox');

  inp.disabled = !atStart;

  up.disabled = !atStart;
  up.onclick = function () { mapSetLv(x.k, x.lv + 1); };
  lvb.appendChild(up);
  var del = el('button', 'btn', '拆除');
  del.disabled = !atStart;
  del.style.marginLeft = '10px';
  del.onclick = function () { if (confirm('拆掉「' + x.b + '」？')) mapRemove(x.k); };
  lvb.appendChild(del);
  if (!atStart) {
    /*
     * ⚠️ 这句话必须点出【怎么才能改】。
     *    只把输入框灰掉的话，表现是"这里坏了"，

  var ub = el('div', 'mlvbox');

    /*
     * 报一下这一次要花多少。**按当前等级算** ——
     * 升一级的花费是"当前等级"份 k，不是"目标等级"份，
     * 也不是从零建到目标等级的那个总数（那个在左边那一栏）。

  var setup = mapSetupOn();
  // ⚠️ 在岗的人要在【座位下拉框用到它之前】就算好 —— 放在下面的话
  //    var 提升成 undefined，座位那一行 forEach 直接抛，整个模式白屏。
  var ALLM = mapExecsAt(mapCur());

  /*

     *    招来的人是绑在事件的 seat 上的，不走 MAP.seats ——
     *    只读 MAP.seats 的话，明明有人在岗，框里却写着「（空着）」。
     */

    sel.disabled = !setup;

    var uc = el('td', 'mexh2');
    if (hiring) {

    } else if (!man && !setup) {
      /*
       * 空位置直接在这一行招 —— 他定的：高管只能在位置里招。
       * 资质是当场随机的，而且不给看（专精 / 正常 / 笨蛋全是隐藏数据）。
       */
      var hb = el('button', 'btn', '招人（' + MAP_HIRE_HOURS + ' 小时）');

    } else {
      uc.appendChild(el('span', null, seat.use || '（这一项还没接进算式）'));
    }

    tb.appendChild(tr);
  });
  var sc = el('div', 'mexscroll');
  sc.appendChild(tb);
  card.appendChild(sc);

  /*
   * ---- 人事表：高管本人 ----
   * 点数和年龄填在【人】身上，跟着人走 —— 换个位置不会变。

   */
  var ph = el('div', 'mexph');

    ph.appendChild(el('span', 'mu', '　初始小时：点数和年龄随便填'));
  } else {
    ph.appendChild(el('span', 'mu',
      '　出了初始小时，人只能在【空位置那一行】招，花 ' + MAP_HIRE_HOURS +
      ' 小时，资质当场随机（专精 / 正常 / 笨蛋是隐藏数据，不显示）。' +
      '定锚点时，不在任何位置上的人会被删掉。'));
  }
  card.appendChild(ph);

  if (ALLM.length) {
    var tb2 = el('table', 'mextb');
    var hr2 = document.createElement('tr');
    hr2.appendChild(el('th', 'mexh1', '名字'));
    MAP_EXEC_STATS.forEach(function (st) { hr2.appendChild(el('th', null, st.n)); });
    hr2.appendChild(el('th', null, '起始年龄'));
    hr2.appendChild(el('th', null, '现在'));
    hr2.appendChild(el('th', 'mexh1', ''));
    tb2.appendChild(hr2);
    ALLM.forEach(function (m) {
      var tr2 = document.createElement('tr');
      var nc = el('td', 'mexh1');
      var ni = document.createElement('input');
      ni.type = 'text'; ni.value = m.n; ni.className = 'mexname';
      ni.disabled = !setup || m.hired;
      ni.onchange = function () {
        var v = ni.value;
        setTimeout(function () {
          m.n = String(v).slice(0, 16) || m.n; mapSave(); renderMap();
        }, 0);
      };
      nc.appendChild(ni);
      // 坐在哪儿，直接标出来 —— 不然一堆人分不清谁在岗
      var seatOf = null;
      MAP_EXEC_SEATS.forEach(function (st) {
        if (mapSeatMan(st.k) && mapSeatMan(st.k).id === m.id) seatOf = st.n;
      });
      nc.appendChild(el('span', 'mu', seatOf ? '　' + seatOf : '　待岗'));
      tr2.appendChild(nc);
      MAP_EXEC_STATS.forEach(function (st) {
        var td = el('td');
        var inp = mIn(mapExecStat(m, st.k, mapCur()), '0', function (v) {
          var n = Number(v);
          m[st.k] = (v === '' || !isFinite(n) || n < 0) ? 0 : n;
          mapSave(); renderMap();
        }, '54px');
        inp.disabled = !setup || m.hired;
        td.appendChild(inp);
        tr2.appendChild(td);
      });
      var ac = el('td');
      var ai = mIn(m.age == null ? '' : m.age, String(MAP_EXEC_AGE_MIN), function (v) {
        var n = Math.floor(Number(v));
        m.age = (v === '' || !isFinite(n)) ? MAP_EXEC_AGE_MIN
                                           : Math.max(MAP_EXEC_AGE_MIN, n);
        mapSave(); renderMap();
      }, '54px');
      ai.disabled = !setup || m.hired;
      ac.appendChild(ai);
      tr2.appendChild(ac);
      tr2.appendChild(el('td', 'mexn', String(mapExecAgeAt(m, mapCur())) + ' 岁'));
      var dc = el('td', 'mexh1');
      var fire = el('button', 'btn', '解雇');
      fire.disabled = !setup || m.hired;

      tr2.appendChild(dc);
      tb2.appendChild(tr2);

    var sc2 = el('div', 'mexscroll');

  } else {
    card.appendChild(el('div', 'mnote2', '还没有高管。' + (setup
      ? '点上面「＋ 加一个」，或者在座位那一行挑人。'
      : '在上面某个空位置那一行点「招人」。')));
  }


  var ad = mapAdmin(), raw = mapAdminRaw(), cut = mapAdminCut();
  card.appendChild(el('div', 'mnote2',
    '高管是【独立的人】：点数和年龄跟着人走，换个位置不会变，也可以解雇。\n' +
    '和位置对口的那一个点数全额生效，另外三个只生效四分之一' +
    '（所以 CFO 身上的管理点数也会帮 COO 一点点忙）。\n' +
    '四个点数各自先把四个位置加完，再过一道衰减：' +
    MAP_EXEC_K1 + ' 以内原样，' + MAP_EXEC_K1 + '~' + MAP_EXEC_K2 +
    ' 之间每点算半点，' + MAP_EXEC_K2 + ' 以上每点算四分之一点。\n' +
    'COO 的管理点数按【百分比的百分比】减管理费：' +
    '管理费 60%、管理 50 点 → 减掉 60% 的一半 → 30%，不是 10%。\n' +
    '现在：管理费 ' + mpct1(raw) + ' → ' + mpct1(ad) +
    (cut > 0 ? '（砍掉 ' + mpct1(cut) + '）' : '（还没有管理点数）') + '\n' +
    'CFO / CMO / CTO 暂时只显示最终点数，还没有接进任何算式。\n' +
    '年龄填的是【初始小时那一刻】的岁数，往前走会自己长：' +
    MAP_EXEC_AGE_DAYS + ' 天一岁，最小 ' + MAP_EXEC_AGE_MIN + '，暂时不封顶。' +
    '（游戏里 08:00 UTC 会按年龄和薪酬判退休，那一条还没接。）'));
  box.appendChild(card);
}

/**
 * 左边那一栏：按【建筑种类】合并的升级消耗。
 *
 * 同一种建筑摆了好几栋就合并成一行 —— 你要的是"炼油厂这摊子一共要投多少"，
 * 而不是"这一栋和那一栋各要多少"。
 *
 * 成本那几列**默认不显示**：没在仓库里定过价的材料就不给数
 * （见 mapMakeCost 上面那段 —— 缺价按 0 算会得出一个看不出是假的低成本）。
 */
function renderMapUp(box) {
  var side = el('div', 'mside');
  var h = el('div', 'msideh');
  h.appendChild(el('h3', null, '升级消耗'));
  side.appendChild(h);
  var LIST = mapListAt(mapCur());
  if (!LIST.length) {
    side.appendChild(el('div', 'mnote2', '还没摆楼。'));
    box.appendChild(side);
    return;
  }
  // 按种类合并
  var by = {}, order = [];
  LIST.forEach(function (x) {
    if (!by[x.b]) { by[x.b] = { n: x.b, cnt: 0, lv: 0, c: null }; order.push(x.b); }
    by[x.b].cnt++;
    by[x.b].lv += mapLvNow(x);
  });
  var sum = { cc: 0, br: 0, pl: 0, cu: 0, hr: 0 };
  order.forEach(function (n) {
    var g = by[n], bd = mapBld(n);
    if (!bd) return;
    // ⚠️ 每一栋各自算再相加。拿"等级之和"去套公式是错的 ——
    //    公式对等级是二次的，两栋 5 级 ≠ 一栋 10 级。
    var acc = { cc: 0, br: 0, pl: 0, cu: 0, hr: 0, f: 0 };
    LIST.forEach(function (x) {
      if (x.b !== n) return;
      var c = mapUpCost(bd, mapLvNow(x));
      acc.f += c.f; acc.cc += c.cc; acc.br += c.br;
      acc.pl += c.pl; acc.cu += c.cu; acc.hr += c.hr;
    });
    g.c = acc;
    sum.cc += acc.cc; sum.br += acc.br; sum.pl += acc.pl;
    sum.cu += acc.cu; sum.hr += acc.hr;

    var d = el('div', 'mupb');
    var t1 = el('div', 'mupn');
    t1.appendChild(el('span', null, n));
    t1.appendChild(el('span', 'mupc', g.cnt + ' 栋　共 ' + g.lv + ' 级'));
    d.appendChild(t1);
    var rows = [['钢筋混凝土', acc.cc, MAP_DATA.mat.cc],
                ['砖块', acc.br, MAP_DATA.mat.br],
                ['木板', acc.pl, MAP_DATA.mat.pl],
                ['建造单位', acc.cu, null],
                ['时间', acc.hr, 'hr']];
    rows.forEach(function (r) {
      if (!(r[1] > 0)) return;
      var line = el('div', 'mupl');
      line.appendChild(el('span', 'mupk', r[0]));
      line.appendChild(el('span', 'mupv',
        r[2] === 'hr' ? mnum(r[1]) + ' 小时' : mnum(r[1])));
      if (typeof r[2] === 'number') {
        var g2 = mapStock(r[2]);
        if (g2) line.appendChild(el('span', 'mupm', mmoney(g2.c * r[1])));
      }
      d.appendChild(line);
    });
    side.appendChild(d);
  });

  // 有价的材料才加总，没价的不硬凑一个数
  var money = 0, missing = [];
  [['cc', sum.cc], ['br', sum.br], ['pl', sum.pl]].forEach(function (k) {
    var id = MAP_DATA.mat[k[0]], g = mapStock(id);
    if (!(k[1] > 0)) return;
    if (g) money += g.c * k[1]; else missing.push(mapName(id));
  });
  var tot = el('div', 'muptot');
  tot.appendChild(el('div', 'mupl2', '合计 ' + mnum(sum.hr) + ' 小时'));
  if (money > 0 && !missing.length) {
    tot.appendChild(el('div', 'mupl2 ok', '合计 ' + mmoney(money)));
  }
  side.appendChild(tot);
  box.appendChild(side);
}

function renderMapList(box) {
  var row = el('div', 'mrow0');
  var sel = document.createElement('select');
  var cats = {};
  MAP_DATA.blds.forEach(function (b) { (cats[b.cat] = cats[b.cat] || []).push(b); });
  Object.keys(cats).forEach(function (c) {
    var g = document.createElement('optgroup');
    g.label = c;
    cats[c].slice().sort(function (a, b) { return a.phase - b.phase; })
      .forEach(function (b) {
        var o = document.createElement('option');
        o.value = b.n;
        o.textContent = b.n;          // 只写名字（你要求的）
        g.appendChild(o);
      });
    sel.appendChild(g);
  });
  /*
   * ⚠️ 换了建筑要重画，而且【选中的那个得记住】。
   *
   *    下面那份"要多少料、花多少钱"是照着 sel.value 现算的。
   *    不重画的话，屏幕上是上一个建筑的账、按钮建的是新选的那个；
   *    重画了但不记住选中项的话，下拉框弹回第一个，
   *    于是显示的又变回发电厂 —— 两种都是【看到一个数、建出另一个东西】，
   *    而两个数看着都很正常。这两脚我在浏览器里都实测踩到了。
   */
  if (MAP.pick && mapBld(MAP.pick)) sel.value = MAP.pick;
  sel.onchange = function () {
    var v = sel.value;
    setTimeout(function () { MAP.pick = v; mapSave(); renderMap(); }, 0);
  };
  row.appendChild(sel);
  var H0 = mapCur(), LIST = mapListAt(H0), doing = mapBuildingAt(H0);
  var full = LIST.length + doing.length >= MAP_MAX;
  var setup = mapSetupOn();

  if (setup) {
    // 初始小时：白送，直接摆上去
    var add = el('button', 'btn pri', '确定，摆上去');
    add.disabled = full;
    add.onclick = function () { mapAdd(sel.value); };
    row.appendChild(add);
  } else {
    /*
     * 初始小时之外只能【建造】：付材料、付钱、等时间。
     * 用的是建造那条公式（多一个 +1 份），不是升级那条。
     */
    var lvst = { v: 1 };
    row.appendChild(el('span', 'ml', '建到'));
    row.appendChild(mIn(1, '1', function (v) {
      lvst.v = Math.max(1, Math.floor(Number(v)) || 1); renderMap();
    }, '58px'));
    row.appendChild(el('span', 'mu', '级'));
    var bd0 = mapBld(sel.value);
    var c0 = bd0 ? mapUpCost(bd0, lvst.v, 0) : null;
    var bill0 = c0 ? mapMatBill(c0) : { err: 'price', miss: [] };
    var bt = el('button', 'btn pri', '建造' +
      (c0 ? '（' + Math.max(1, Math.ceil(c0.hr)) + ' 小时）' : ''));
    bt.disabled = full || !mapCanEdit() || !!bill0.err;
    bt.onclick = function () { mapQueueBuild(sel.value, lvst.v); };
    row.appendChild(bt);
    if (c0) {
      row.appendChild(el('span', 'mu', bill0.err
        ? ('这几样还没定价，建不了：' + bill0.miss.join('、'))
        : ('要 ' + mnum(c0.cc) + ' 钢混 / ' + mnum(c0.br) + ' 砖块 / ' +
           mnum(c0.pl) + ' 木板 / ' + mnum(c0.cu) + ' 建造单位' +
           (bill0.cash > 0 ? '，其中要买 ' + mmoney(bill0.cash) : '，仓库里够'))));
    }
  }
  row.appendChild(el('span', 'mcount',
    LIST.length + (doing.length ? '+' + doing.length + ' 在建' : '') +
    ' / ' + MAP_MAX + (full ? '　已经满了' : '')));
  box.appendChild(row);

  // 在建的那几栋单独摆出来 —— 不然"我明明点了建造，怎么什么都没有"
  if (doing.length) {
    var dl = el('div', 'mnote2', '在建：' + doing.map(function (e) {
      return e.b + ' → ' + e.to + ' 级，还有 ' + (e.h + e.dur - H0) + ' 小时';
    }).join('；'));
    box.appendChild(dl);
  }

  if (!LIST.length) {
    box.appendChild(el('div', 'mempty', setup
      ? '还没摆任何建筑。上面挑一个，点「确定，摆上去」。'
      : '场上还没有建筑。上面挑一个「建造」—— 要付材料和钱，还要等施工时间。'));
  } else {
    var grid = el('div', 'mgrid');
    LIST.forEach(function (x) {
      var b = mapBld(x.b) || { cat: '?', mk: [] };
      var c = el('button', 'mcard');
      c.appendChild(el('div', 'mn', x.b));
      c.appendChild(el('div', 'mlv', '等级 ' + mapLvNow(x)));
      c.appendChild(el('div', 'mc2', b.cat));
      var kinds = (b.cat === '零售') ? (b.sell || []).length : b.mk.length;
      c.appendChild(el('div', 'midle', kinds
        ? (kinds + ' 种　人工 ' + mmoney(mapWagePerHour(b, mapLvNow(x))) + '/时')
        : (b.note ? '玩法特殊' : '没有产品表')));
      c.onclick = function () { MAP.sel = x.k; renderMap(); };
      grid.appendChild(c);
    });
    box.appendChild(grid);
  }
  renderMapStock(box);
}

/** 仓库：所有已经定过价的东西。 */
function renderMapStock(box) {
  /*
   * ⚠️ 列表要从【算出来的那一份】取 id，不能从 MAP.cost 取。
   *    MAP.cost 只是初始小时填的那份底子；开工产出来的东西根本不在里面 ——
   *    表现是"跑完一批，仓库还是空的"，而每一步看着都对。
   */
  var snap = mapStockAt(mapCur());
  var ids = Object.keys(snap).map(Number).filter(function (id) {
    return !!mapStock(id);
  }).sort(function (a, b) { return a - b; });
  var h = el('div', 'mstockh');
  h.appendChild(el('h3', null, '仓库'));
  h.appendChild(el('span', 'mtag', ids.length + ' 样'));
  box.appendChild(h);

  /*
   * 直接添一样。
   *
   * ⚠️ 这条是补的，而它不是可有可无：原来只能在【某栋楼的原料格】里定价，
   *    于是"运输单位"这种谁的原料都不是的东西根本没法填 ——
   *    而它是每一笔交易所出售都要用到的。表现是"我想卖点东西，
   *    它说运输单位没定价，可我找不到哪儿能填"。
   */
  var addr = el('div', 'mrow0');
  var asel = document.createElement('select');
  MAP_DATA.items.slice().sort(function (a, b2) {
    return mapName(a.id) < mapName(b2.id) ? -1 : 1;
  }).forEach(function (it) {
    var o = document.createElement('option');
    o.value = String(it.id);
    o.textContent = mapName(it.id);
    asel.appendChild(o);
  });
  addr.appendChild(asel);
  var aval = mIn('', '单价', function () {}, '84px');
  addr.appendChild(aval);
  var aqty = mIn('', '数量', function () {}, '84px');
  addr.appendChild(aqty);
  /*
   * 「购入」：初始小时是白送（那一格本来就随便捏），出了那一格是真的花钱 ——
   * 单价 × 数量从现金里扣，货进仓库。
   * 不扣钱的话，"买原料"就成了凭空变东西，整个现金模型都白做了。
   */
  var setupBuy = mapSetupOn();
  var abtn = el('button', 'btn', setupBuy ? '填进仓库' : '购入');
  abtn.disabled = !mapCanEdit();
  abtn.onclick = function () {
    var n = Number(aval.value), q = Number(aqty.value);
    if (!isFinite(n) || n < 0) return;
    if (!isFinite(q) || q <= 0) q = 1;
    var id = Number(asel.value);
    if (setupBuy) {
      mapAddCost(id, q, n, 0, 'buy');
    } else {
      mapEv().push({ t: 'buy', h: mapCur(), item: id, units: q, price: n });
      mapSave();
    }
    renderMap();
  };
  addr.appendChild(abtn);
  addr.appendChild(el('span', 'mu', setupBuy
    ? '初始小时：直接填进去，不花钱。买来的东西不带时间（没占产能）。'
    : '单价 × 数量从现金里扣。买来的东西不带时间（没占产能）。'));
  box.appendChild(addr);

  /*
   * 建造单位的价。**它不在物品表里**（没有编号、进不了仓库），
   * 所以只能单独给一个框 —— 不给的话表现是
   * "建造说建造单位没定价，可我到处找不到哪儿能填"。
   */
  var cur2 = el('div', 'mrow0');
  cur2.appendChild(el('span', 'ml', '建造单位单价'));
  cur2.appendChild(mIn(MAP.cuPrice == null ? '' : MAP.cuPrice, '每个多少钱',
    function (v) {
      var n = Number(v);
      MAP.cuPrice = (v === '' || !isFinite(n) || n < 0) ? null : n;
      mapSave(); renderMap();
    }, '96px'));
  cur2.appendChild(el('span', 'mu',
    '建造和升级都要吃它，但它不是物品、进不了仓库 —— 所以在这儿填。'));
  box.appendChild(cur2);
  if (!ids.length) {
    box.appendChild(el('div', 'mempty',
      '仓库还是空的。\n' +
      '上面直接添一样，或者进一栋楼给原料填价、点「生产」把成本算出来。'));
    return;
  }
  var t = el('table', 'mstock');
  var hr = el('tr');
  ['东西', '单位成本', '单位时间', '批次', ''].forEach(function (x) {
    hr.appendChild(el('th', null, x));
  });
  t.appendChild(hr);
  ids.forEach(function (id) {
    var g = mapStock(id);
    var tr = el('tr');
    tr.appendChild(el('td', 'mnm', mapName(id)));
    tr.appendChild(el('td', 'mn2', mmoney(g.c)));
    tr.appendChild(el('td', 'mn2', g.h > 0 ? mhrs(g.h) : '—'));
    tr.appendChild(el('td', 'mn2', g.n + ' 笔 / ' + mnum(g.q) + ' 个'));
    var td = el('td', 'mn2 mact');
    var sl = el('button', 'btn', '出售…');
    sl.onclick = function () {
      MAP.sell = (MAP.sell === id) ? null : id;
      renderMap();
    };
    td.appendChild(sl);
    /*
     * ⚠️ 「删除」拿掉了。仓库现在是从事件算出来的 ——
     *    删掉一行等于凭空让东西消失，而账上没有任何一处对得上。
     *    要清就整份「重置」。
     */
    tr.appendChild(td);
    t.appendChild(tr);
    if (MAP.sell === id) {
      var wrap = el('tr');
      var cell = el('td');
      cell.colSpan = 5;
      var it = mapItem(id);
      if (it) mapDoSell(cell, it);
      else cell.appendChild(el('div', 'mnote2', '这东西不在物品表里，卖不了。'));
      wrap.appendChild(cell);
      t.appendChild(wrap);
    }
  });
  box.appendChild(t);
  box.appendChild(el('div', 'mnote2',
    '「单位时间」= 做一个要占掉多少【一级建筑】小时，速度加成算进去了、等级不算 —— ' +
    '所以它衡量的是"这东西有多难做"，换楼不会变。\n' +
    '手填的价格不带时间（买来的东西没占产能）。同一样东西记了好几笔时按数量平均。'));
}

// ---------------------------------------------------------------------------
// 画：一栋楼
// ---------------------------------------------------------------------------
function renderMapOne(box, x) {
  var b = mapBld(x.b) || { cat: '?', mk: [], phase: 0, sal: 0 };
  var head = el('div', 'mhead');
  var back = el('button', 'btn', '← 返回');
  back.onclick = function () { MAP.sel = null; renderMap(); };
  head.appendChild(back);
  head.appendChild(el('h3', null, x.b));
  head.appendChild(el('span', 'mtag', b.cat));
  box.appendChild(head);

  renderMapLevel(box, x, b);

  var wb = el('div', 'mlvbox');
  wb.appendChild(el('span', 'ml', '一级工资 / 小时'));
  wb.appendChild(mIn(mapBaseWage(b), String(b.sal), function (v) {
    var n = Number(v);
    if (v === '' || !isFinite(n) || n < 0) delete MAP.wage[b.n];
    else MAP.wage[b.n] = n;
    mapSave(); renderMap();
  }, '86px'));
  if (mapBaseWage(b) !== b.sal) {
    var rs = el('button', 'btn', '还原 ' + mnum(b.sal));
    rs.onclick = function () { delete MAP.wage[b.n]; mapSave(); renderMap(); };
    wb.appendChild(rs);
  }
  wb.appendChild(el('span', 'mu',
    '这栋 ' + mmoney(mapWagePerHour(b, mapLvNow(x))) + ' / 小时' +
    '（' + mnum(mapBaseWage(b)) + ' × ' + mapLvNow(x) + ' 级 × 管理 ' +
    (Math.round((1 + mapAdmin()) * 1000) / 1000) + '）　默认值取自建筑表，可以按游戏里的实数改'));
  box.appendChild(wb);

  /*
   * 零售建筑走 sell 那一列，生产建筑走 mk。
   * 两个特殊的单独说 —— 它们不是"没数据"，是玩法本来就不一样，
   * 而"没数据"和"这里本来就没有"必须分开说，不然会有人去补一份根本不存在的表。
   */
  var isR = (b.cat === '零售');
  var list = isR ? (b.sell || []) : b.mk;
  if (b.note === 'office') {
    box.appendChild(el('div', 'mempty',
      '销售办公室的玩法特殊，这里算不了 —— 可以移去销售办公室计算器\n' +
      '（上面「计算器」那个模式里就有）。'));
    return;
  }
  if (b.note === 'none') {
    box.appendChild(el('div', 'mempty', '没有就是没有。'));
    return;
  }
  if (!list.length) {
    box.appendChild(el('div', 'mempty',
      isR ? '这个零售建筑卖什么，数据里没有。' : '这栋楼能造什么，数据里没有。'));
    return;
  }
  list.forEach(function (pid) {
    var it = mapItem(pid);
    if (it) box.appendChild(renderMapItem(it, b, x, isR));
  });
}

function renderMapItem(it, b, x, isR) {
  var d = el('div', 'mitem');
  var h = el('div', 'mih');
  h.appendChild(el('span', 'min', mapName(it.id)));
  h.appendChild(el('span', 'mirate', isR
    ? ('零售 ' + mnum(it.sold * mapLvNow(x) * mapSaleMul()) + ' / 小时')
    : ('生产 ' + mnum(it.ph * mapLvNow(x) * mapProdMul()) + ' / 小时')));
  if (!isR && it.sold > 0) {
    h.appendChild(el('span', 'mtag',
      '零售 ' + mnum(it.sold * mapLvNow(x) * mapSaleMul()) + ' / 小时'));
  }
  if (isR) h.appendChild(el('span', 'mtag', '在' + (it.at || '?') + '生产'));
  h.appendChild(el('span', 'mtag', '运输 ' + mnum(it.tr)));
  var g0 = mapStock(it.id);
  if (g0) h.appendChild(el('span', 'mtag ok', '已定价 ' + mmoney(g0.c)));
  d.appendChild(h);

  if (isR) {
    var g1 = mapStock(it.id);
    var rw1 = el('div', 'mraw');
    var l1 = el('div', 'mrl');
    l1.appendChild(el('span', 'mrn', '零售速度 = 基础 ' + mnum(it.sold) +
      ' × 等级 ' + mapLvNow(x) + ' × 销售加成'));
    rw1.appendChild(l1);
    var l2 = el('div', 'mrl');
    l2.appendChild(el('span', 'mrn', '24 小时最多卖'));
    var q = map24(it, mapLvNow(x), 'r');
    l2.appendChild(el('span', 'mrh', q && q.units
      ? (mnum(q.units) + ' 个' + (g1 ? '　货源成本 ' + mmoney(g1.c) : '　（这东西还没定价）'))
      : '—'));
    rw1.appendChild(l2);
    d.appendChild(rw1);

    // 零售也能开工：自己挑小时数，逐小时把货卖出去
    var rst = { h: MAP_HOURS };
    var rrow = el('div', 'mbtns');
    rrow.appendChild(el('span', 'ml', '开工'));
    rrow.appendChild(mIn(rst.h, String(MAP_HOURS), function (v) {
      var n = Math.floor(Number(v));
      rst.h = (!isFinite(n)) ? MAP_HOURS
        : Math.max(MAP_RUN_MIN, Math.min(MAP_RUN_MAX, n));
      renderMap();
    }, '62px'));
    rrow.appendChild(el('span', 'mu', '小时（' + MAP_RUN_MIN + '~' + MAP_RUN_MAX + '）'));
    var Hr = mapCur();
    var rq = mapRunPlan(it, mapLvNow(x), 'r', rst.h);
    var rgo = el('button', 'btn pri',
      '开工 ' + rst.h + ' 小时（' + (rq ? mnum(rq.units) : 0) + ' 个）');
    rgo.disabled = !mapCanEdit() || !rq || !rq.units || !g1 ||
                   !!mapRunAt(x.k, Hr) || (Hr + rst.h > mapWinEnd());
    rgo.onclick = function () { mapStartRun(x.k, it.id, 'r', rst.h); };
    rrow.appendChild(rgo);
    d.appendChild(rrow);

    d.appendChild(el('div', 'mnote2',
      (!g1 ? '这东西仓库里还没有 —— 零售是把仓库里的货卖出去，先备货。\n' : '') +
      '零售建筑只管卖多快；卖多少钱、赚多少，去仓库里点「出售」。'));
    return d;
  }

  // ---- 原料：每一样都能直接填价 ----
  if (it['in'].length) {
    var rw = el('div', 'mraw');
    it['in'].forEach(function (p) {
      var g = mapStock(p[0]);
      var line = el('div', 'mrl');
      line.appendChild(el('span', 'mrn', mapName(p[0]) + ' × ' + mnum(p[1])));
      line.appendChild(mIn(g ? Math.round(g.c * 10000) / 10000 : '', '单价',
        function (v) {
          var n = Number(v);
          if (!isFinite(n) || n < 0) return;
          // 自己填的价 = 重新定价，把这样东西之前的账清掉再记一笔。
          // 不清的话它会和之前造出来的批次平均，而你以为自己是在"改价"。
          MAP.cost[p[0]] = { e: [] };
          mapAddCost(p[0], 1, n, 0, 'buy');
          renderMap();
        }, '92px'));
      line.appendChild(el('span', 'mrh', g
        ? (g.h > 0 ? '时间 ' + mhrs(g.h) : '（买的，不计时间）')
        : '还没定价'));
      rw.appendChild(line);
    });
    d.appendChild(rw);
  } else {
    var rw0 = el('div', 'mraw');
    rw0.appendChild(el('div', 'mrl', '不需要原料'));
    d.appendChild(rw0);
  }

  var out = el('div', 'mout');
  var row = el('div', 'mbtns');
  /*
   * 开工：自己挑 1~48 小时。
   *
   * ⚠️ 开工之后【中途碰不了】—— 要么等它跑完，要么直接跳到结束那一刻。
   *    所以先「算一算」给他看清楚，再让他按「开工」，
   *    而不是点一下就既算又开：这一下是不可撤的，得让他先看见代价。
   */
  var st = { h: MAP_HOURS };
  row.appendChild(el('span', 'ml', '开工'));
  row.appendChild(mIn(st.h, String(MAP_HOURS), function (v) {
    var n = Math.floor(Number(v));
    st.h = (!isFinite(n)) ? MAP_HOURS
      : Math.max(MAP_RUN_MIN, Math.min(MAP_RUN_MAX, n));
    mapDoMake(out, it, b, x, st);
  }, '62px'));
  row.appendChild(el('span', 'mu', '小时（' + MAP_RUN_MIN + '~' + MAP_RUN_MAX + '）'));
  var mk = el('button', 'btn', '计算');
  mk.onclick = function () { mapDoMake(out, it, b, x, st); };
  row.appendChild(mk);
  d.appendChild(row);
  d.appendChild(out);
  return d;
}

/** 点「生产」：算出这一批的成本，写进仓库。 */
function mapDoMake(out, it, b, x, st) {
  clear(out);
  var hrs = (st && st.h) || MAP_HOURS;
  var m = mapMakeCost(it, b, mapLvNow(x), hrs);
  if (m.err === 'zero') { out.appendChild(el('div', 'mbad', '这东西产量是 0。')); return; }
  if (m.err === 'step') {
    out.appendChild(el('div', 'mbad',
      hrs + ' 小时凑不够一个整数批次 —— 原料要整个消耗，产量必须是 ' +
      (it.st || 1) + ' 的倍数，而 ' + hrs + ' 小时最多做得出 ' + mnum(m.r.cap) +
      ' 个。把小时数、等级或者速度加成调高一点。'));
    return;
  }
  if (m.err === 'miss') {
    out.appendChild(el('div', 'mbad',
      '这几样原料还没定价，先在上面填上：' +
      m.miss.map(mapName).join('、') + '\n' +
      '（缺价的按 0 算会得出一个很漂亮的低成本，而那个数看不出是假的 —— 所以宁可不算。）'));
    return;
  }
  var r = m.r;
  var t = el('table', 'mcalc');
  function line(k, v, cls) {
    var tr = el('tr');
    tr.appendChild(el('td', null, k));
    tr.appendChild(el('td', cls || 'mn2', v));
    t.appendChild(tr);
  }
  line('做出来', mnum(r.units) + ' 个，用 ' + mhrs(r.hours) +
       (r.units < r.cap ? '（' + mnum(r.cap) + ' 个里取整到 ' + r.step + ' 的倍数）' : ''));
  line('人工', mmoney(m.wage) + '（' + mmoney(mapWagePerHour(b, mapLvNow(x))) +
       ' / 小时 × ' + mnum(r.hours) + ' 小时）');
  line('原料', mmoney(m.matC) + '　' + r.uses.map(function (u) {
    return mapName(u.id) + ' ' + mnum(u.n);
  }).join('、'));
  line('每个的人工', mmoney(m.wage / r.units) + '　每个的原料 ' +
       mmoney(m.matC / r.units), 'mn2');
  line('单位成本', mmoney(m.unitC), 'mn2 big ok');
  line('单位时间', mhrs(m.unitH) + '（自己 ' + mhrs(mapUnitHours(it)) +
       ' + 原料带来的 ' + mhrs(m.matH / r.units) + '）', 'mn2');
  out.appendChild(t);

  // 原料不够也照算，但要说出来 —— 悄悄按够了算是最坑的
  if (m.short && m.short.length) {
    out.appendChild(el('div', 'mbad', '仓库里不够：' + m.short.map(function (u) {
      return mapName(u.id) + ' 要 ' + mnum(u.need) + '、只有 ' + mnum(u.have);
    }).join('；') + '\n（照样能开，但账上会透支 —— 先把原料备够更准。）'));
  }

  var H = mapCur();
  var run = mapRunAt(x.k, H), busy = mapBusyAt(x, H);
  var go = el('button', 'btn pri', '开工 ' + r.hours + ' 小时');
  go.disabled = !mapCanEdit() || !!run || !!busy || (H + r.hours > mapWinEnd());
  go.onclick = function () { mapStartRun(x.k, it.id, 'p', r.hours); };
  out.appendChild(go);
  out.appendChild(el('div', 'mnote2',
    (run ? '这栋楼正在跑另一批（' + mapName(run.item) + '），跑完才能再开。\n'
     : busy ? '这栋楼在施工，完工才能开工。\n'
     : H + r.hours > mapWinEnd() ? '跑完会超出规划窗口（到 ' +
        mapFmtOff(mapWinEnd()) + '）—— 把小时数调小，或者先把锚点往前挪。\n'
     : !mapCanEdit() ? '现在是回头看，改不了。\n' : '') +
    '开工之后【中途碰不了】—— 只能等它跑完，或者直接跳到结束那一刻。\n' +
    '原料在开工那一刻整批扣掉、工资按小时扣；产出逐小时入库' +
    '（每次都是 ' + r.step + ' 的整数倍，最后一小时补齐到 ' + mnum(r.units) + '）。\n' +
    '记进去之后，别的楼把它当原料时会自动用这个成本和时间。'));
}

/** 点「出售…」：交易所 / 合同两种模式。 */
function mapDoSell(out, it) {
  clear(out);
  var st = { price: '', mode: 'ex', units: '' };
  var row = el('div', 'mbtns');
  row.appendChild(el('span', 'ml', '售价'));
  row.appendChild(mIn('', '每个多少钱', function (v) { st.price = v; draw(); }, '110px'));
  row.appendChild(el('span', 'ml', '数量'));
  var g = mapStock(it.id);
  var uInp = mIn('', g ? String(Math.round(g.q)) : '几个', function (v) {
    st.units = v; draw();
  }, '100px');
  row.appendChild(uInp);
  if (g && g.q > 0) {
    // 「全部」= 仓库里现在有多少就卖多少，省得你去看一眼数字再手抄一遍
    var allb = el('button', 'btn', '全部 ' + mnum(g.q));
    allb.onclick = function () {
      st.units = String(g.q);
      uInp.value = String(g.q);
      draw();
    };
    row.appendChild(allb);
  }
  var seg = el('span', 'mseg');
  [['ex', '交易所（96%）'], ['ct', '合同（100%，运输减半）']].forEach(function (o) {
    var bb = el('button', st.mode === o[0] ? 'on' : null, o[1]);
    bb.onclick = function () {
      st.mode = o[0];
      Array.prototype.forEach.call(seg.children, function (c, i) {
        c.className = (i === (st.mode === 'ex' ? 0 : 1)) ? 'on' : '';
      });
      draw();
    };
    seg.appendChild(bb);
  });
  row.appendChild(seg);
  out.appendChild(row);
  var res = el('div');
  out.appendChild(res);

  function draw() {
    clear(res);
    var price = Number(st.price), units = Number(st.units);
    if (!isFinite(price) || price <= 0 || !isFinite(units) || units <= 0) {
      res.appendChild(el('div', 'mnote2', '填上售价和数量。'));
      return;
    }
    var s = mapSellCalc(it, units, price, st.mode);
    var t = el('table', 'mcalc');
    function line(k, v, cls) {
      var tr = el('tr');
      tr.appendChild(el('td', null, k));
      tr.appendChild(el('td', cls || 'mn2', v));
      t.appendChild(tr);
    }
    line('到手', mmoney(s.income) + '（' + mmoney(price) + ' × ' +
         Math.round(s.rate * 100) + '% × ' + mnum(units) + '）');
    if (!s.haveCost) {
      line('货的成本', '还没定价 —— 先点「生产」或者给它填个价', 'mn2 bad');
    } else {
      line('货的成本', mmoney(s.goods) + '　时间 ' + mhrs(s.goodsH));
    }
    if (it.tr > 0) {
      if (!s.haveTr) {
        line('运输', '要 ' + mnum(s.trUnits) + ' 个运输单位，但它还没定价', 'mn2 bad');
      } else {
        line('运输', mmoney(s.tr) + '（' + mnum(s.trUnits) + ' 个运输单位' +
             (st.mode === 'ct' ? '，合同已减半' : '') + '）　时间 ' + mhrs(s.trH));
      }
    } else {
      line('运输', '这东西不占运输');
    }
    if (s.haveCost && s.haveTr) {
      line('赚', mmoney(s.profit), 'mn2 big ' + (s.profit >= 0 ? 'ok' : 'bad'));
      line('每个赚', mmoney(s.profit / units), 'mn2');
      line('总共占掉', mhrs(s.hours) + '（一级楼的时间）', 'mn2');
      if (s.hourly == null) {
        line('一条龙时利', '整条链都是买来的，没占产能 —— 算不出时利', 'mn2');
      } else {
        line('一条龙时利', mmoney(s.hourly) + ' / 小时',
             'mn2 big ' + (s.hourly >= 0 ? 'ok' : 'bad'));
      }
    }
    res.appendChild(t);
    /*
     * 真的卖掉：从仓库扣货 + 扣运输单位，钱进现金。
     * 和开工一样记成时间轴上的一个事件 —— 往回翻时钱和货要一起退回去。
     */
    if (s && s.haveCost && units > 0) {
      var doIt = el('button', 'btn pri', '卖掉');
      doIt.disabled = !mapCanEdit();
      doIt.onclick = function () {
        mapEv().push({ t: 'sell', h: mapCur(), item: it.id, units: units,
                       mode: st.mode, price: Number(st.price) || 0,
                       trUnits: s.trUnits, net: s.profit });
        MAP.sell = null;
        mapSave(); renderMap();
      };
      res.appendChild(doIt);
      res.appendChild(el('div', 'mnote2', mapCanEdit()
        ? ('按下去就真的卖了：货和运输单位从仓库扣掉，' +
           mmoney(s.profit) + ' 进现金。往回翻时间会一起退回去。')
        : '现在是回头看，卖不了。'));
    }
  }
  draw();
}

function renderCalc() {

  while (box.firstChild) box.removeChild(box.firstChild);

  if (sel.calcTab === 'contract') {
    var soon = cel('div', 'card');
    soon.appendChild(cel('h3', null, '合同计算器'));
    soon.appendChild(cel('div', 'sub', '正在施工'));
    box.appendChild(soon);
    return;
  }
  if (sel.calcTab === 'chain') { renderChain(box); return; }

  var R = calcContract(CALC);
  var B = calcBudget(CALC);

  /* ---------------- 卡片 ①：销售办公室计算器 ---------------- */

  var btns = cel('div', 'crow');

  var k1 = cel('div', 'kpis');

                      R.hourly >= cnum(CALC.target) ? 'good' : 'bad'));

/*
 * ===================== 第三个模式：文章总结 =====================
 *
 * 游戏每周出一期报纸，里面有【玩家自己写的】文章。采集端把它们收进表格、
 * 配一段中文总结，发布成两种文件：
 *
 *   data/articles.json     索引：期号 / 标题 / 作者 / 点赞 / 中文总结。开页就载。
 *   data/np/<期号>.json    英文原文：点「看原文」才去取。
 *
 * 分开的理由和聊天记录的「索引 + 日文件」一模一样：400 多期的原文加起来
 * 好几 MB，全塞一个文件的话，国内那条线路上光开个页面就要等半天，
 * 而绝大多数人只会看最近几期。
 *
 * ⚠️ 这一段【一个聊天记录那边的函数都不调用】。和计算器同样的隔离：
 *    这边写崩了，存档那边照样跑。
 */
var NEWS = { state: 'idle', idx: null, err: '', bodies: {}, open: {}, sort: 'issue' };

function newsLoad() {
  if (NEWS.state === 'ok' || NEWS.state === 'wait') return Promise.resolve();
  NEWS.state = 'wait';
  // ⚠️ 同上：上次停在文章模式的人，boot 里那句 setMode 会赶在索引前面调过来
  return indexReady().then(function () {
    return getPack(DATA + '/articles.json');
  }).then(function (j) {
    NEWS.idx = j && Array.isArray(j.articles) ? j : { articles: [], issues: [] };
    NEWS.state = 'ok';
  }).catch(function (e) {
    NEWS.state = 'err';
    NEWS.err = (e && e.status === 404)
      ? '这个站点还没有文章数据 —— 采集端那边把「报纸」打开、抓过一期并发布之后，这里就有了。'
      : ('取文章索引失败：' + (e && e.message ? e.message : e));
  }).then(function () { renderNews(); });
}

/** 某一期的英文原文。取过一次就留在内存里。 */
function newsBody(issue) {
  if (NEWS.bodies[issue]) return Promise.resolve(NEWS.bodies[issue]);
  return getPack(DATA + '/np/' + encodeURIComponent(issue) + '.json').then(function (j) {
    var m = {};
    ((j && j.articles) || []).forEach(function (a) { m[a.id] = String(a.body || ''); });
    NEWS.bodies[issue] = m;
    return m;
  });
}

function newsList() {
  var all = (NEWS.idx && NEWS.idx.articles) || [];
  var q = String((document.querySelector('#nq') || {}).value || '').trim().toLowerCase();
  var out = q ? all.filter(function (a) {
    return (a.title + ' ' + a.co + ' ' + a.sum).toLowerCase().indexOf(q) >= 0;
  }) : all.slice();
  if (NEWS.sort === 'likes') {
    out.sort(function (a, b) { return (b.likes - a.likes) || (b.issue - a.issue); });
  } else {
    out.sort(function (a, b) { return (b.issue - a.issue) || (a.id - b.id); });
  }
  return out;
}

function renderNewsTabs() {
  var box = document.querySelector('#newssort');
  if (!box) return;
  while (box.firstChild) box.removeChild(box.firstChild);
  [['issue', '按期号'], ['likes', '按点赞']].forEach(function (p) {
    var b = cel('button', NEWS.sort === p[0] ? 'on' : null, p[1]);
    b.onclick = function () { NEWS.sort = p[0]; renderNews(); };
    box.appendChild(b);
  });
}

function renderNews() {
  renderNewsTabs();
  var box = document.querySelector('#newswrap');
  if (!box) return;
  while (box.firstChild) box.removeChild(box.firstChild);

  if (NEWS.state === 'wait') { box.appendChild(cel('div', 'nnote', '载入中…')); return; }
  if (NEWS.state === 'err') { box.appendChild(cel('div', 'nnote', NEWS.err)); return; }
  if (NEWS.state !== 'ok') return;

  var list = newsList();
  var total = ((NEWS.idx && NEWS.idx.articles) || []).length;
  var head = cel('div', 'nnote');
  head.appendChild(document.createTextNode(
    total
      ? ('共 ' + total + ' 篇玩家写的文章，覆盖 ' +
         ((NEWS.idx.issues || []).length) + ' 期' +
         (list.length !== total ? '｜筛出 ' + list.length + ' 篇' : '') +
         '。只收玩家自己写的，游戏自动生成的行情播报和 sponsor 广告都不在里面。')
      : '还没有文章。'));
  box.appendChild(head);
  if (!list.length) return;

  var lastIssue = null;
  list.forEach(function (a) {
    if (NEWS.sort === 'issue' && a.issue !== lastIssue) {
      lastIssue = a.issue;
      var h = cel('div', 'nissue');
      var link = document.createElement('a');
      link.href = 'https://www.simcompanies.com/newspaper/0/' + a.issue + '/';
      link.target = '_blank';
      link.rel = 'noopener noreferrer nofollow';
      link.textContent = '第 ' + a.issue + ' 期';
      h.appendChild(link);
      if (a.pub) h.appendChild(cel('span', null, a.pub));
      box.appendChild(h);
    }
    box.appendChild(newsCard(a));
  });
}

function newsCard(a) {
  var card = cel('div', 'nart');
  card.appendChild(cel('h3', null, a.title || '（无标题）'));

  var meta = cel('div', 'nmeta');
  meta.appendChild(cel('span', 'co', a.co || '（不详）'));
  meta.appendChild(cel('span', 'likes', '👍 ' + (a.likes || 0)));
  if (NEWS.sort === 'likes') meta.appendChild(cel('span', null, '第 ' + a.issue + ' 期'));
  if (a.pub && NEWS.sort === 'likes') meta.appendChild(cel('span', null, a.pub));
  card.appendChild(meta);

  card.appendChild(a.sum
    ? cel('div', 'nsum', a.sum)
    : cel('div', 'nsum none', '（这篇还没生成中文总结 —— 采集端一天做几篇，点赞高的先做）'));

  var btns = cel('div', 'nbtns');
  var open = !!NEWS.open[a.id];
  var b = cel('button', 'nbtn', open ? '收起原文' : '看原文（英文，' + (a.len || 0) + ' 字）');
  b.onclick = function () {
    if (NEWS.open[a.id]) { delete NEWS.open[a.id]; renderNews(); return; }
    NEWS.open[a.id] = 1;
    if (NEWS.bodies[a.issue]) { renderNews(); return; }
    b.textContent = '取原文中…';
    newsBody(a.issue).then(function () { renderNews(); })
      .catch(function (e) {
        NEWS.bodies[a.issue] = {};
        renderNews();
      });
  };
  btns.appendChild(b);
  // 「去游戏里看」那个按钮删了 —— 期号那一行本来就是个链接，重复。
  card.appendChild(btns);

  if (open) {
    var m = NEWS.bodies[a.issue];
    var txt = m ? m[a.id] : null;
    card.appendChild(cel('div', 'nbody',
      txt ? txt : (m ? '（这一期的原文包里没有这篇 —— 采集端重发一次正文包就有了）' : '取原文中…')));
  }
  return card;
}

/* ------------------------------ 模式切换 ------------------------------ */

/*
 * 存档那边的滚动位置要自己存一下再还原：display:none 会把 scrollTop 抹成 0，
 * 不还原的话每从计算器切回来一次，就被弹回消息流顶上一次。
 */
var MODE_FEED_TOP = 0;
/*
 * ⚠️ 模式从两个变成三个之后，【不能再写成 toCalc 这种布尔】。
 *    布尔的写法在加第三个的时候会悄悄退化成"不是计算器就是聊天" ——
 *    切到文章模式，body 上那个 mode-calc 被摘掉，聊天那一块就露出来了。
 *    所以这里一律按名字来：认识的就是它，不认识的一律回落到 chat。
 */
var MODES = ['chat', 'calc', 'news', 'map'];
function normMode(m) { return MODES.indexOf(m) >= 0 ? m : 'chat'; }
function setMode(m) {
  var to = normMode(m);
  var feed = document.querySelector('#feed');
  if (to !== 'chat' && feed) MODE_FEED_TOP = feed.scrollTop;
  try {
    document.body.classList.toggle('mode-calc', to === 'calc');
    document.body.classList.toggle('mode-news', to === 'news');
    document.body.classList.toggle('mode-map', to === 'map');
  } catch (e) {}
  var changed = (sel.mode !== to);
  sel.mode = to;
  savePref();
  if (to === 'calc') renderCalc();
  else if (to === 'news') { renderNews(); newsLoad(); }
  else if (to === 'map') renderMap();
  else if (feed) feed.scrollTop = MODE_FEED_TOP;
  renderModeTabs();
  /*
   * 鸥子：切到计算器 = 序列 4，文章总结 = 序列 5，游戏模拟 = 序列 6。
   * ⚠️ 只在【真的换了】的时候说 —— renderModeTabs 每次都把按钮重建一遍，
   * 再点一次当前那个模式也会走到这里，那不算"切过来"。
   */
  gullShow();
  if (changed && to === 'calc') gullFire(4, {});
  if (changed && to === 'news') gullFire(5, {});
  if (changed && to === 'map') gullFire(6, {});
}

function setCalcTab(t) {
  sel.calcTab = (t === 'contract' || t === 'chain') ? t : 'office';
  savePref();
  renderCalc();

function renderModeTabs() {

      b.onclick = function () { setMode(p[0]); };

/** 计算器里面那一层：销售办公室 / 合同（后者还没做）。 */
function renderCalcTabs() {

/*
 * ============ 数据到底卡在哪一边 ============
 *
 * "表格在正常更新、发布也报成功，可网页就是不涨" —— 这种时候
 * 光看页面完全分不清是【发布端在发旧数据】还是【页面没载到】。
 * 而这两件事要查的地方完全不同。
 *
 * 页面这边其实有足够的信息自己判断，只是以前没说出来：
 *
 *   索引时间  = 发布端最后一次跑完是什么时候（index.json 里的 generated）
 *   最新消息  = 已经载进来的消息里最新的那一条是什么时候
 *
 *   索引新、消息旧  → **发布端在发旧数据**，去查采集/合并那边
 *   索引也旧        → **发布根本没跑**，去查定时发布
 *   两个都新        → 页面是好的，你要的那条可能真的还没发生
 */
function freshLines() {
  var out = [];
  if (!INDEX) return out;
  var now = Date.now();
  var ixMs = Date.parse(INDEX.generated || '');
  var ixMin = ixMs ? Math.round((now - ixMs) / 60000) : -1;

  // 已载入的消息里最新的一条（不分房间 —— 问的是"这份数据整体新不新"）
  var newest = 0;
  ALL.forEach(function (m) {
    var t = Date.parse(m.dt || '');
    if (t && t > newest) newest = t;
  });
  var msgMin = newest ? Math.round((now - newest) / 60000) : -1;

  out.push('索引更新于 ' + (ixMin < 0 ? '？' : ixMin + ' 分钟前'));
  out.push('最新消息是 ' + (msgMin < 0 ? '？' : msgMin + ' 分钟前') + '的');

  if (ixMin >= 0 && msgMin >= 0) {
    if (ixMin < 90 && msgMin > 90) {
      out.push('⚠️ 索引是新的、消息是旧的 —— 说明【发布端在发旧数据】，' +
               '问题不在这个页面，去查采集端那边的合并/发布。');
    } else if (ixMin > 90) {
      out.push('⚠️ 索引本身就是旧的 —— 说明【定时发布没跑】，去查发布触发器。');
    }
  }
  return out;
}

function boot() {
  /*
   * 宽度档位【在拿数据之前就先应用】。
   * 放在后面的话，上次选了紧凑的人会先看到一帧正常宽度再跳回去 ——
   * 一闪一跳，看着像页面自己抖了一下。
   */
  applyWidth();
  // 屏蔽名单也要在第一帧之前读回来 —— 晚一步的话，被屏蔽的人会先露一下脸
  maskLoad();
  hideLoad();
  /*
   * 模式也在拿数据之前就定下来。
   * 上次停在计算器的人，如果等索引回来才切，会先闪一下聊天界面 ——
   * 而索引在国内可能要等十几秒，那就不是"闪一下"了。
   */
  renderModeTabs();
  if (sel.mode !== 'chat') setMode(sel.mode);
  renderTools();
  /*
   * 鸥子放在【索引之前】起来：它一个字都不依赖聊天数据，
   * 而索引在国内可能要等十几秒 —— 让人对着一个空页面等，还不如先有只鸟。
   * 上面那句 setMode 会试着开火（序列 4/5），那会儿台词还没到，
   * gullFire 自己会先去取再回来说 —— 所以这两行的先后不重要。
   */
  gullBoot();
  getJSON(DATA + '/index.json').then(function (ix) {
    INDEX = ix;
    // 只按条数过滤，不按 published 过滤。published:false 只表示"这天还有一部分
    // 没传上去"，已经传上去的那部分是真实存在的，不该被藏起来。
    INDEX.days = (ix.days || []).filter(function (d) { return (d.n || 0) > 0; });
    // 现在才知道这个站是不是压缩存的 —— 等在门口的鸥子/文章可以走了
    indexSettled_();
    if (!encReady()) return;
    // 索引到手才知道有哪些房间。上次选的那个可能已经不在了，回落到 ZH。
    sel.room = pickRoom();
    renderFiles(); setInfo();
    var about = $('#about');
    clear(about);
    about.appendChild(el('div', null, '更新时间 ' + fmtFull(ix.generated)));
    freshLines().forEach(function (t) {
      var d = el('div', null, t);
      if (t.indexOf('⚠️') === 0) { d.style.color = 'var(--warn)'; d.style.lineHeight = '1.6'; }
      about.appendChild(d);
    });
    about.appendChild(el('div', null, '游戏内公开聊天频道的存档，仅供查阅。'));
    // 页面版本号：两个站对不上就说明有一边的页面没更新
    var bv = el('div', null, '页面 ' + PAGE_BUILD);
    bv.style.opacity = '.55';
    bv.style.fontVariantNumeric = 'tabular-nums';
    bv.title = '这份页面的版本号。CF 和 GitHub 两个站的这个号应该一样，' +
               '对不上就说明有一边没更新。';
    about.appendChild(bv);
    if (!INDEX.days.length) {
      emptyState('📭', '索引里还没有已发布的日期',
                 '采集端跑一会儿并发布快照之后，刷新本页即可');
      return;
    }
    // 只载【当前房间】最近三天。以前这里是 INDEX.days.slice(0,3) ——
    // 三个房间混在一起排序，这三天很可能全是同一个房间的。
    return loadDays(roomDays().slice(0, 3)).then(withRecent);
  }).catch(function (e) {
    indexSettled_();          // 索引挂了也要放行，不然鸥子会一直等在门口
    setErr('读不到索引：' + e.message);
    emptyState('📭', '还没有数据', '等采集端发布第一份快照后刷新即可');
  });
}

// ---------- 时间 / 颜色 ----------
var PALETTE = ['#7dd3fc','#86efac','#fcd34d','#fca5a5','#c4b5fd','#f9a8d4',
               '#5eead4','#fdba74','#a5b4fc','#d9f99d','#f0abfc','#93c5fd'];
function colorOf(sid) { return PALETTE[Math.abs(Number(sid) || 0) % PALETTE.length]; }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function dayOf(t) { var d = new Date(t);
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function timeOf(t) { var d = new Date(t);
  return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }
function hmOf(t) { var d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function fmtFull(iso) { var d = new Date(iso); return isNaN(d) ? '未知' :
  dayOf(d.getTime()) + ' ' + hmOf(d.getTime()); }
function dayLabel(day) {
  var today = dayOf(Date.now()), y = dayOf(Date.now() - 86400000);
  if (day === today) return day + '  今天';
  if (day === y) return day + '  昨天';
  var w = '日一二三四五六'[new Date(day + 'T12:00:00').getDay()];
  return day + '  周' + (w || '?');
}

// ---------- 正文渲染：分词后逐个建节点，一次 innerHTML 都不用 ----------
function splitBy(parts, re, type) {
  var out = [];
  parts.forEach(function (p) {
    if (p.t !== 'txt') { out.push(p); return; }
    var last = 0, m;
    re.lastIndex = 0;
    while ((m = re.exec(p.s)) !== null) {
      if (!m[0].length) { re.lastIndex++; continue; }
      if (m.index > last) out.push({ t: 'txt', s: p.s.slice(last, m.index) });
      out.push({ t: type, s: m[0] });
      last = m.index + m[0].length;
    }
    if (last < p.s.length) out.push({ t: 'txt', s: p.s.slice(last) });
  });
  return out;
}

function appendText(parent, text, q) {
  if (!q) { parent.appendChild(document.createTextNode(text)); return; }
  var low = text.toLowerCase(), needle = q.toLowerCase(), i = 0;
  while (true) {
    var at = low.indexOf(needle, i);
    if (at < 0) { parent.appendChild(document.createTextNode(text.slice(i))); break; }
    if (at > i) parent.appendChild(document.createTextNode(text.slice(i, at)));
    parent.appendChild(el('mark', null, text.slice(at, at + needle.length)));
    i = at + needle.length;
  }
}

/*
 * ==================== 玩家贴的图 ====================
 *
 * 玩家会发 https://snipboard.io/XXXX.jpg 这种截图链接。
 * 只当链接的话，看存档的人要一个个点开 —— 而截图往往正是那条消息的全部内容。
 *
 * ⚠️ 但"把任何 URL 都当图片渲染"是不行的，这是别人写的内容：
 *   · 只认【白名单里的域名】，别的一律还是纯链接
 *   · 路径必须长得像图片文件（防止拿站内某个页面当图片加载）
 *   · 只认 https
 *   · no-referrer：不告诉对方是从哪个页面点过去的
 *   · lazy：滚到才加载 —— 一整天几千条里可能有几十张图，
 *     一次性全加载既慢又等于把每个访客的 IP 都送过去
 *
 * ⚠️ 还有一件必须说清楚的事：**图片是从第三方加载的。**
 * 谁看存档，谁的浏览器就会去连 snipboard。这是内嵌外部图片的固有代价，
 * 换不掉 —— 除非把图转存到自己这边，那是另一件事（版权、容量、失效）。
 */
var IMG_HOSTS = [
  'https://snipboard.io/',
  'https://i.snipboard.io/',
];
/*
 * 路径必须【整条】长这样：/文件名.后缀，不许有下级目录。
 * ⚠️ 只写结尾锚点（$）是不够的 —— /a/b.jpg 一样能匹配上末尾那段。
 * 起头的 ^ 才是把"多级路径"挡在外面的那一笔。
 */
var RE_IMG_PATH = /^\/[A-Za-z0-9_\-]+\.(?:jpg|jpeg|png|gif|webp)$/i;

/** 这个链接能不能安全地当图片显示。 */
function imageUrl(u) {
  var s = String(u || '');
  for (var i = 0; i < IMG_HOSTS.length; i++) {
    if (s.indexOf(IMG_HOSTS[i]) !== 0) continue;
    // 掐掉 ?query 和 #hash 再看路径形状 —— 带参数的一律不认
    if (s.indexOf('?') >= 0 || s.indexOf('#') >= 0) return null;
    try {
      var path = s.slice(IMG_HOSTS[i].length - 1);   // 保留开头的 /
      if (RE_IMG_PATH.test(path)) return s;
    } catch (e) { return null; }
    return null;
  }
  return null;
}

/*
 * 灯箱。整个页面共用一个，开的时候才填内容 ——
 * 每张图各建一个的话，一天几十张图就是几十个隐藏节点白占内存。
 */
var LB = { open: false, url: '', real: false };

function lbClose() {
  var box = $('#lightbox');
  if (!box) return;
  box.hidden = true;
  box.className = '';
  clear(box);
  LB.open = false;
  try { document.body.classList.remove('lb'); } catch (e) {}
}

function lbToggleReal() {
  var box = $('#lightbox');
  if (!box) return;
  LB.real = !LB.real;
  box.className = LB.real ? 'real' : '';
  var t = $('#lbzoom');
  if (t) t.textContent = LB.real ? '缩到整屏' : '看原始大小';
}

function lbOpen(url) {
  var box = $('#lightbox');
  if (!box) return;
  clear(box);
  LB.open = true; LB.url = url; LB.real = false;
  box.className = '';
  box.hidden = false;
  try { document.body.classList.add('lb'); } catch (e) {}

  var stage = el('div', 'lbstage');
  var img = el('img');
  img.src = url;
  img.alt = '玩家贴的图';
  img.referrerPolicy = 'no-referrer';
  /*
   * 点图片本身 = 在【铺满】和【原始像素】之间切，不关灯箱。
   * "看不清"要靠这个解决：铺满屏幕对一张 1920 宽的截图，
   * 在手机上仍然是缩小的。
   */
  img.onclick = function (e) { e.stopPropagation(); lbToggleReal(); };
  img.onerror = function () { lbClose(); };
  stage.appendChild(img);
  /* 点空白处关掉 —— 手机上这是最自然的动作 */
  stage.onclick = function () { lbClose(); };
  box.appendChild(stage);

  var bar = el('div', 'lbbar');
  var zoom = el('button', 'lbbtn', '看原始大小');
  zoom.id = 'lbzoom';
  zoom.onclick = function (e) { e.stopPropagation(); lbToggleReal(); };
  bar.appendChild(zoom);

  var open = el('a', 'lbbtn', '新标签打开');
  open.href = url; open.target = '_blank';
  open.rel = 'noopener noreferrer nofollow';
  open.onclick = function (e) { e.stopPropagation(); };
  bar.appendChild(open);

  bar.appendChild(el('span', 'sp'));

  var x = el('button', 'lbbtn', '✕ 关闭');
  x.setAttribute('aria-label', '关闭');
  x.onclick = function (e) { e.stopPropagation(); lbClose(); };
  bar.appendChild(x);

  box.appendChild(bar);
  box.onclick = function () { lbClose(); };
}

/*
 * ===================== 玩家资料页 =====================
 *
 * 点名字打开。三件事写在一起：接口抓来的公司资料、存档里的统计、
 * 以及原来那个「只看这个人的消息」。
 *
 * ⚠️ 资料【不是实时的】。采集端一天只抓几十个人，一轮下来要好几天，
 * 所以"抓取于 N 天前"那一行不是装饰 —— 它得显眼，超过 30 天还要变色。
 * 一份两周前的资料和实时的长得一模一样，这是这个页面最容易骗人的地方。
 *
 * ⚠️ 名单只覆盖游戏房（ZH）。别的房间的人点开是"还没有资料"，
 * 这不是出错 —— 面板里要说清楚，不然看着像坏了。
 */
var PL = { map: null, name: null, state: 'idle' };   // idle | loading | ok | fail
var PC = { open: false };

/** players.json 只在第一次点名字时才拉，平时一个请求都不发。 */
function plLoad() {
  if (PL.state === 'ok' || PL.state === 'loading') return Promise.resolve();
  PL.state = 'loading';
  return indexReady().then(function () {
    return getPack(DATA + '/players.json');
  }).then(function (j) {
    var map = {}, byName = {};
    (j && j.players ? j.players : []).forEach(function (p) {
      if (p.sid) map[p.sid] = p;
      // 名字索引带上领域，否则同名不同服会互相盖掉
      if (p.co) byName[String(p.co).toLowerCase() + '|' + (Number(p.realm) || 0)] = p;
    });
    PL.map = map; PL.name = byName; PL.state = 'ok';
  }).catch(function () {
    PL.state = 'fail';                 // 没发布过 / 404 都走这里，不当错误弹
  });
}

/*
 * 找这个人的资料。
 *
 * 先按 sid 找，找不到再按公司名找。
 * 两条都留着是因为「聊天里的 sid 就是公司 id」这件事**没有被真正验证过** ——
 * 看起来是，但看起来是和验过了不是一回事。哪天不是了，
 * 名字这条路还能兜住，而不是整个功能静默地全部失灵。
 */
function plFind(m) {
  if (PL.state !== 'ok') return null;
  /*
   * 先按 sid 找。sid 是公司 id，全站唯一 —— 两个服务器的同名公司 id 不同，
   * 所以这条路本身就分得开。
   *
   * 按名字兜底时【必须带上领域】：R1 和 R2 可以有同名公司，
   * 只按名字找会把另一个服务器那个人的资料显示在这个人名下。
   */
  if (m.sid && PL.map[m.sid]) return PL.map[m.sid];
  if (!m.name) return null;
  // m._r 是 realm+1（R1 = 1），发布数据里的 realm 是 0 起
  return PL.name[String(m.name).toLowerCase() + '|' + ((Number(m._r) || 1) - 1)] || null;
}

/** LimitedCompany 这种代号，能翻就翻，翻不了原样显示 —— 绝不留空。 */
var LEVEL_KIND = {
  LimitedCompany: '有限公司', PublicCompany: '上市公司',
  Corporation: '股份公司', SoleTrader: '个体户', Partnership: '合伙企业',
};
function levelKindName(k) { return LEVEL_KIND[k] || String(k || ''); }

/**
 * 带符号的加成。
 * 原来一律拼 '+'，负数就成了 "+-1" —— 销售加成是真的会是负的。
 */
function psign(n) {
  if (typeof n !== 'number' || !n) return '';
  return (n > 0 ? '+' : '') + n;
}

function pnum(n) {
  n = Number(n) || 0;
  if (n >= 1e8) return (n / 1e8).toFixed(2) + ' 亿';
  if (n >= 1e4) return (n / 1e4).toFixed(1) + ' 万';
  return String(n);
}

function pcClose() {
  var box = $('#pcard');
  if (!box) return;
  box.hidden = true;
  clear(box);
  PC.open = false;
  try { document.body.classList.remove('pc'); } catch (e) {}
}

function pcOpen(m) {
  var box = $('#pcard');
  if (!box) return;
  PC.open = true;
  box.hidden = false;
  try { document.body.classList.add('pc'); } catch (e) {}
  pcRender(m);
  // 资料还没载入就先把面板开出来（存档统计那部分立刻就能看），
  // 载完再重画一次。不这么做的话，点名字要等一个网络往返才有反应。
  if (PL.state !== 'ok') {
    plLoad().then(function () { if (PC.open) pcRender(m); });
  }
}

function pcRender(m) {
  var box = $('#pcard');
  if (!box) return;
  clear(box);
  var p = plFind(m);

  var sheet = el('div', 'psheet');
  sheet.onclick = function (e) { e.stopPropagation(); };

  var head = el('div', 'phead');
  // 资料页永远是真的：这个功能是"录视频时别露脸"，不是"我自己也查不了"
  head.appendChild(avatar(m, true));
  var nm = el('div', 'pname', (p && p.co) || m.name);
  nm.style.color = colorOf(m.sid);
  head.appendChild(nm);
  var x = el('button', 'pbtn', '✕');
  x.setAttribute('aria-label', '关闭');
  x.onclick = function () { pcClose(); };
  head.appendChild(x);
  sheet.appendChild(head);

  var body = el('div', 'pbody');

  if (p) {
    // 「抓取于 N 天前」—— 这一行是这个页面最重要的一句话
    var days = 0;
    var at = new Date(String(p.at || '') + 'T00:00:00Z').getTime();
    if (at) days = Math.max(0, Math.floor((Date.now() - at) / 86400000));
    var when = el('div', 'pwhen' + (days > 30 ? ' old' : ''),
      p.at ? ('资料抓取于 ' + p.at + '（' + (days ? days + ' 天前' : '今天') + '）' +
              (days > 30 ? ' · 已经挺久了，可能不准' : ''))
           : '不知道是什么时候抓的');
    body.appendChild(when);

    var grid = el('div', 'pgrid');
    function cell(k, v, title) {
      if (v === '' || v == null) return;
      var c = el('div', 'pcell');
      c.appendChild(el('div', 'k', k));
      var vv = el('div', 'v', v);
      if (title) vv.title = title;
      c.appendChild(vv);
      grid.appendChild(c);
    }
    cell('玩家等级', p.lv ? (String(p.lv) + (p.lvk ? ' · ' + levelKindName(p.lvk) : '')) : '');
    cell('信用评级', p.rating ? (p.rating + (p.bracket ? '（' + p.bracket + '）' : '')) : '');
    cell('排名', p.rank ? '#' + p.rank : '');
    cell('EVA 排名', p.eva ? '#' + p.eva : '');
    cell('公司净值', p.value ? pnum(p.value) : '', p.value ? String(p.value) : '');
    cell('建筑价值', p.bval ? pnum(p.bval) : '', p.bval ? String(p.bval) : '');
    cell('专利价值', p.pval ? pnum(p.pval) : '', p.pval ? String(p.pval) : '');
    cell('负债', p.bonds ? pnum(p.bonds) : '', p.bonds ? String(p.bonds) : '');
    cell('员工', p.workers ? pnum(p.workers) : '');
    /*
     * 建筑数和格子数【本来就可能对不上】：免费 / 季节建筑（沙滩集市那种）
     * 不占格子。所以分成两格显示，并把免费那几栋标出来 ——
     * 挤在一起写成"10 栋 / 9 格"看着就像个错。
     */
    cell('建筑', p.nb ? (p.nb + ' 栋' +
      (p.nfree ? '（含 ' + p.nfree + ' 栋免费/季节）' : '')) : '');
    cell('建筑格子', p.slots ? ((p.slots + (p.xslots || 0)) + ' 格' +
      (p.xslots ? '（含额外 ' + p.xslots + '）' : '')) : '');
    cell('生产加成', psign(p.prod));
    cell('销售加成', psign(p.sales));
    cell('休闲加成', psign(p.rec));
    /*
     * 接口给的是一个倍率（1.3 = 比基准多花 30%），显示成"1.3×"要人自己换算。
     * 减 1 变成百分比才是它真正的意思：多付出的那部分。
     */
    cell('管理费用', (typeof p.admin === 'number' && p.admin)
      ? (Math.round((p.admin - 1) * 1000) / 10 + '%') : '');
    cell('政府订单档', (p.gov != null && p.gov >= 0) ? String(p.gov) : '');
    cell('入坑', p.joined || '');
    cell('重开于', p.reset || '');
    cell('赞助者', p.sup ? '是' : '');
    cell('管理员', p.mod ? '是' : '');
    cell('已删除', p.del ? '是' : '');
    body.appendChild(grid);

    // 改过的旧名字。这个在存档里很有用 —— 改名之前的聊天记录是挂在旧名下的
    if (p.prev && p.prev.length) {
      body.appendChild(el('h3', null, '用过的名字'));
      var pc = el('div', 'chips');
      p.prev.forEach(function (x) { pc.appendChild(el('span', 'chip', x)); });
      body.appendChild(pc);
    }

    /*
     * 自我介绍。走的是和聊天正文【完全同一条】渲染路径 ——
     * renderBody 全程 textContent / createTextNode，链接只认 http(s)，
     * 图片只认白名单里的图床，:re-N: 会显示成产品名。
     * 这是一段别人写的自由文本，任何时候都不能因为"它在资料页里"
     * 就换一条更省事的路。
     */
    if (p.note) {
      body.appendChild(el('h3', null, '自我介绍'));
      var nb = el('div', 'pnote');
      renderBody(nb, p.note, '');
      body.appendChild(nb);
    }

    if (p.kinds && p.kinds.length) {
      body.appendChild(el('h3', null, '都有些什么'));
      var chips = el('div', 'chips');
      p.kinds.forEach(function (k) { chips.appendChild(el('span', 'chip', k)); });
      body.appendChild(chips);
    }
  } else {
    var why = PL.state === 'loading' ? '正在读资料…'
            : PL.state === 'fail' ? '这个站点还没有发布玩家资料。'
            : '还没抓到这个人的资料。\n' +
              '资料只覆盖游戏房里出现过的玩家，而且一天只抓几十个人，' +
              '一轮要好几天 —— 过阵子再来看。';
    body.appendChild(el('div', 'pnone', why));
  }

  // ---- 存档里 ----
  body.appendChild(el('h3', null, '在存档里'));
  var st = plArchiveStats(m, p);
  var g2 = el('div', 'pgrid');
  function cell2(k, v) {
    if (!v) return;
    var c = el('div', 'pcell');
    c.appendChild(el('div', 'k', k));
    c.appendChild(el('div', 'v', v));
    g2.appendChild(c);
  }
  cell2('发言', st.n ? (st.n + ' 条') : '');
  cell2('首次发言', st.first || '');
  cell2('最后发言', st.last || '');
  body.appendChild(g2);
  if (st.partial) {
    body.appendChild(el('div', 'pwhen', '（只统计了你这次载入的日期，不是全部存档）'));
  }

  // ---- 原来那个筛选，就在这儿 ----
  var btns = el('div', 'pbtns');
  var only = el('button', 'pbtn main', '只看他的消息');
  (function (sid) {
    only.onclick = function () {
      sel.sender = sid;
      pcClose();
      document.body.classList.remove('nav');
      refresh(true);
      gullFire(3, { sid: sid });          // 鸥子序列 3（另一条入口：资料卡里那个按钮）
    };
  })(m.sid);
  btns.appendChild(only);
  var close = el('button', 'pbtn', '关闭');
  close.onclick = function () { pcClose(); };
  btns.appendChild(close);
  body.appendChild(btns);

  body.appendChild(el('div', 'pfoot',
    '资料来自游戏公开的公司页面，只保留展示性的字段 —— ' +
    '不收在线状态、所在地区、自我介绍和正在生产什么。' +
    '不想被收录的，说一声就去掉。'));

  sheet.appendChild(body);
  box.appendChild(sheet);
  box.onclick = function () { pcClose(); };
}

/**
 * 存档统计：优先用发布数据里的（那是【全量】算的），
 * 没有才退回数当前载入的这些天 —— 并且明说这是不全的。
 * 不说的话，"发言 12 条"会被当成这人一共只说过 12 句。
 */
function plArchiveStats(m, p) {
  if (p && p.msgs) {
    return { n: p.msgs, first: p.first || '', last: p.last || '', partial: false };
  }
  var n = 0, lo = 0, hi = 0;
  ALL.forEach(function (x) {
    if (x.sid !== m.sid) return;
    n++;
    if (!lo || x.t < lo) lo = x.t;
    if (x.t > hi) hi = x.t;
  });
  var d = function (t) { return t ? new Date(t).toISOString().slice(0, 10) : ''; };
  return { n: n, first: d(lo), last: d(hi), partial: true };
}

/**
 * 把认得出来的图片链接渲染成缩略图，挂在消息正文下面。
 * 链接本身【照样保留】—— 图挂了的时候还能点开看。
 */
function appendImages(parent, urls) {
  if (!urls.length) return;
  var box = el('div', 'imgs');
  urls.forEach(function (u) {
    var a = el('a', 'imgwrap');
    /*
     * href 保留着不是摆设：中键、右键"新标签打开"、复制链接地址都还能用，
     * 而且万一灯箱那段脚本出了问题，点击也还是能看到图 —— 降级到旧行为。
     */
    a.href = u; a.target = '_blank'; a.rel = 'noopener noreferrer nofollow';
    a.onclick = function (e) {
      // 让 Ctrl/⌘/中键 保持"新标签打开"的原生行为
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;
      e.preventDefault();
      lbOpen(u);
    };
    var img = el('img');
    img.src = u;
    img.alt = '玩家贴的图';
    img.loading = 'lazy';
    img.decoding = 'async';
    img.referrerPolicy = 'no-referrer';
    /*
     * 加载失败就把整块拿掉 —— 图床上的图是会过期的，
     * 留一个碎图标既难看又让人以为是存档坏了。链接还在正文里，不影响。
     */
    img.onerror = function () { try { box.removeChild(a); } catch (e) {} };
    a.appendChild(img);
    box.appendChild(a);
  });
  parent.appendChild(box);
}

function renderBody(parent, text, q, maskOnly) {
  var parts = [{ t: 'txt', s: String(text || '') }];
  parts = splitBy(parts, /https?:\/\/[^\s<>"']+/g, 'url');
  /*
   * ⚠️ 被屏蔽的人要【先】切出来，再走通用的 @ 规则。
   *
   * 顺序反过来就不对了：通用那条正则遇到空格就停，
   * 而公司名是可以带空格的 —— 「@Big Corp」它只咬得到「@Big」，
   * 剩下的「 Corp」原样留在正文里，等于遮了个寂寞。
   * 这里的正则是拿真名【整个】拼出来的，空格照样匹配得上。
   */
  if (maskOnly && MASK_RE) parts = splitBy(parts, MASK_RE, 'atmk');
  parts = splitBy(parts, /@[A-Za-z0-9_一-龥][\w.\-一-龥]*/g, 'at');
  parts = splitBy(parts, RE_ICON, 'emo');
  var pics = [];
  parts.forEach(function (p) {
    if (p.t === 'url') {
      // 只接受 http(s)，其余按纯文字处理，绝不产生 javascript: 之类的链接
      if (/^https?:\/\//i.test(p.s)) {
        var a = el('a', null, p.s);
        a.href = p.s; a.target = '_blank'; a.rel = 'noopener noreferrer nofollow';
        parent.appendChild(a);
        var pic = imageUrl(p.s);
        if (pic && pics.indexOf(pic) < 0) pics.push(pic);
      } else parent.appendChild(document.createTextNode(p.s));
    } else if (p.t === 'atmk') {
      parent.appendChild(el('span', 'mention', maskAtText(p.s)));
    } else if (p.t === 'at') {
      parent.appendChild(el('span', 'mention', p.s));
    } else if (p.t === 'emo') {
      // 认得出来就显示产品名，认不出来原样显示原始码 —— 绝不留空
      var pn = productName(p.s);
      var chip = el('span', 'emote', pn || p.s);
      if (pn) chip.title = p.s;            // 悬停能看到原始的 :re-30:
      parent.appendChild(chip);
    } else {
      appendText(parent, p.s, q);
    }
  });
  appendImages(parent, pics);
}

/*
 * ==================== 屏蔽头像 / ID ====================
 *
 * 做的事只有一件：**在聊天流里，把某几个人的头像换成占位图、名字换成「玩家N」，
 * 顺带把正文里 @ 到他们的地方也换掉。**
 *
 * 边界（每一条都是故意的）：
 *   · 只改【显示】，不改数据。搜索、统计、导出、深搜全都还是按真名工作 ——
 *     所以你搜真名照样搜得到他说过的话。
 *   · 点名字打开的资料页【不遮】。那是"我要看看这是谁"的地方，
 *     遮了的话这个功能就从"录视频时别露脸"变成"我自己也查不了了"。
 *   · 侧栏「发送者」那一列【不遮】—— 你得能一眼找到人。
 *     录视频时侧栏本来就可以收起来。

var MASK = [];          // [{sid, name}]，【顺序就是编号】：第一个是玩家1
var MASK_IX = {};       // sid -> 1..n
var MASK_NAME = {};     // 归一化后的名字 -> 编号（一个人可能有好几个旧名字）
var MASK_RE = null;     // 认 @某某某 的正则；没人被屏蔽时是 null（renderBody 直接跳过）

function reEsc(x) { return String(x).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

/** 从本地偏好里读回名单。坏数据一律当没有，绝不让它把页面带崩。 */
function maskLoad() {
  MASK = [];
  var raw = PREF.mask;
  var seen = {};
  if (Object.prototype.toString.call(raw) === '[object Array]') {
    raw.forEach(function (x) {
      var sid = Number(x && x.sid) || 0;
      if (!sid || seen[sid]) return;
      seen[sid] = 1;
      MASK.push({ sid: sid, name: String((x && x.name) || '') });
    });
  }
  maskRebuild();
}

/*
 * 名字归一化：小写 + 去掉所有空格 / 连字符 / 下划线。
 *
 * ⚠️ 这一条是线上抓出来的：公司名叫「Rabbit House」，
 *    而游戏里 @ 出来的是「@Rabbit-House」—— 空格变成了连字符。
 *    按原文精确匹配的话，这个人【永远遮不住】。
 */
function maskKey(x) { return String(x).toLowerCase().replace(/[\s\-_]+/g, ''); }

function maskRebuild() {
  MASK_IX = {}; MASK_NAME = {};
  MASK.forEach(function (x, i) { MASK_IX[x.sid] = i + 1; });

  var names = [], seen = {};
  function add(nm, n) {
    nm = String(nm || '');
    var k = maskKey(nm);
    if (!k) return;
    if (MASK_NAME[k] === undefined) MASK_NAME[k] = n;
    var low = nm.toLowerCase();
    if (!seen[low]) { seen[low] = 1; names.push(nm); }
  }
  MASK.forEach(function (x, i) { add(x.name, i + 1); });
  /*
   * 改过名的人：把他在【已载入的消息】里用过的每个名字都收进来。
   *
   * 名单里只存了一个名字（加进名单那一刻他叫什么）。可存档是跨时间的 ——
   * 半个月前别人 @ 的是他的旧名字，只认新名字的话那一段全都遮不住。
   * 反过来也一样：他今天改了名，老名字还挂在几千条历史消息里。
   */
  if (MASK.length) {
    try {
      ALL.forEach(function (m) {
        var n = MASK_IX[m.sid];
        if (n) add(m.name, n);
      });
    } catch (e) { /* 数据还没载入就算了，载完 rebuild 会再来一次 */ }
  }

   * ⚠️ 长的名字必须排在前面。
   * 同时屏蔽了「Ab」和「AbCorp」时，正则是从左往右挨个试的 ——
   * 短的排前面就会把 @AbCorp 咬掉半截，剩一个 "Corp" 露在外面。

   *
   * 【一】分隔符要互换。
   *   公司名「Rabbit House」，游戏里 @ 出来是「@Rabbit-House」。
   *   所以名字里的空格/连字符/下划线一律拆开，中间用 [\s\-_]* 接回去 ——
   *   连「@RabbitHouse」这种全去掉的写法也一起认了。
   *
   * 【二】右边界要看名字最后一个字是什么。
   *   第一版给所有名字都加了「后面不能紧跟名字里可能出现的字」这条限制。
   *   拉丁名字没问题，中文名字当场就废了：
   *
   *       @星辰工业 在吗      ← 带空格，遮得住
   *       @星辰工业在吗       ← 下一个字是汉字 → 那条限制直接否定掉，
   *                            于是掉回通用的 @ 规则，完整名字原样露出来
   *
   *   而中文聊天里【不带空格才是常态】。根因是中文没有词边界、拉丁有，
   *   所以按结尾分开处理：
   *     以字母/数字结尾 → 后面不能紧跟字母/数字（@Abxyz 不该被 @Ab 吃掉）
   *     以汉字结尾     → 不加任何限制（@星辰工业在吗 必须遮得住）
   *   两个互为前缀的中文名字同时被屏蔽时，靠上面那句"长的排前面"分开。
   */
  var alts = names.map(function (nm) {
    var parts = nm.split(/[\s\-_]+/).filter(Boolean);
    if (!parts.length) return null;
    var body = parts.map(reEsc).join('[\\s\\-_]*');
    var tail = parts[parts.length - 1];

}

function maskOn(sid) { return !!MASK_IX[sid]; }
/** 这个人在聊天流里叫什么。没被屏蔽就是他自己的名字。 */
function maskName(m) {
  var n = MASK_IX[m.sid];
  return n ? ('玩家' + n) : m.name;
}
/** @ 到的那一段该换成什么。按归一化后的名字反查编号，查不到就退回「玩家」。 */
function maskAtText(hit) {
  var n = MASK_NAME[maskKey(String(hit).slice(1))];
  return n ? ('@玩家' + n) : '@玩家';
}

/**
 * 加进名单 / 从名单里去掉。
 *
 * ⚠️ 编号是按【名单顺序】算的，所以去掉中间那个人，后面的编号会往前挪
 * （玩家3 变成玩家2）。这是有意的：编号必须连着，不然录出来的画面里
 * 会出现「玩家1、玩家3」这种一看就知道"中间还有一个"的东西。
 */
function maskToggle(sid, name) {

  for (var i = 0; i < MASK.length; i++) { if (MASK[i].sid === sid) { at = i; break; } }

  else MASK.push({ sid: Number(sid), name: String(name || '') });

  savePref();
  refresh();
  if (MK.open) mkRender();
