/*
 * ============ 数据到底卡在哪一边 ============
 *
 * "表格在正常更新、发布也报成功，可网页就是不涨" —— 这种时候
 * 光看页面完全分不清是【发布端在发旧数据】还是【页面没载到】。
 * 而这两件事要查的地方完全不同。
 *
 * 页面这边其实有足够的信息自己判断，只是以前没说出来：
 *
 *   索引时间  = 发布端最后一次跑完是什么时候（index.json 里的 generated）
 *   最新消息  = 已经载进来的消息里最新的那一条是什么时候
 *
 *   索引新、消息旧  → **发布端在发旧数据**，去查采集/合并那边
 *   索引也旧        → **发布根本没跑**，去查定时发布
 *   两个都新        → 页面是好的，你要的那条可能真的还没发生
 */
function freshLines() {
  var out = [];
  if (!INDEX) return out;
  var now = Date.now();
  var ixMs = Date.parse(INDEX.generated || '');
  var ixMin = ixMs ? Math.round((now - ixMs) / 60000) : -1;

  // 已载入的消息里最新的一条（不分房间 —— 问的是"这份数据整体新不新"）
  var newest = 0;
  ALL.forEach(function (m) {
    var t = Date.parse(m.dt || '');
    if (t && t > newest) newest = t;
  });
  var msgMin = newest ? Math.round((now - newest) / 60000) : -1;

  out.push('索引更新于 ' + (ixMin < 0 ? '？' : ixMin + ' 分钟前'));
  out.push('最新消息是 ' + (msgMin < 0 ? '？' : msgMin + ' 分钟前') + '的');

  if (ixMin >= 0 && msgMin >= 0) {
    if (ixMin < 90 && msgMin > 90) {
      out.push('⚠️ 索引是新的、消息是旧的 —— 说明【发布端在发旧数据】，' +
               '问题不在这个页面，去查采集端那边的合并/发布。');
    } else if (ixMin > 90) {
      out.push('⚠️ 索引本身就是旧的 —— 说明【定时发布没跑】，去查发布触发器。');
    }
  }
  return out;
}

function boot() {
  /*
   * 宽度档位【在拿数据之前就先应用】。
   * 放在后面的话，上次选了紧凑的人会先看到一帧正常宽度再跳回去 ——
   * 一闪一跳，看着像页面自己抖了一下。
   */
  applyWidth();
  // 屏蔽名单也要在第一帧之前读回来 —— 晚一步的话，被屏蔽的人会先露一下脸
  maskLoad();
  hideLoad();
  /*
   * 模式也在拿数据之前就定下来。
   * 上次停在计算器的人，如果等索引回来才切，会先闪一下聊天界面 ——
   * 而索引在国内可能要等十几秒，那就不是"闪一下"了。
   */
  renderModeTabs();
  if (sel.mode !== 'chat') setMode(sel.mode);
  renderTools();
  /*
   * 鸥子放在【索引之前】起来：它一个字都不依赖聊天数据，
   * 而索引在国内可能要等十几秒 —— 让人对着一个空页面等，还不如先有只鸟。
   * 上面那句 setMode 会试着开火（序列 4/5），那会儿台词还没到，
   * gullFire 自己会先去取再回来说 —— 所以这两行的先后不重要。
   */
  gullBoot();
  getJSON(DATA + '/index.json').then(function (ix) {
    INDEX = ix;
    // 只按条数过滤，不按 published 过滤。published:false 只表示"这天还有一部分
    // 没传上去"，已经传上去的那部分是真实存在的，不该被藏起来。
    INDEX.days = (ix.days || []).filter(function (d) { return (d.n || 0) > 0; });
    // 现在才知道这个站是不是压缩存的 —— 等在门口的鸥子/文章可以走了
    indexSettled_();
    if (!encReady()) return;
    // 索引到手才知道有哪些房间。上次选的那个可能已经不在了，回落到 ZH。
    sel.room = pickRoom();
    renderFiles(); setInfo();
    var about = $('#about');
    clear(about);
    about.appendChild(el('div', null, '更新时间 ' + fmtFull(ix.generated)));
    freshLines().forEach(function (t) {
      var d = el('div', null, t);
      if (t.indexOf('⚠️') === 0) { d.style.color = 'var(--warn)'; d.style.lineHeight = '1.6'; }
      about.appendChild(d);
    });
    about.appendChild(el('div', null, '游戏内公开聊天频道的存档，仅供查阅。'));
    // 页面版本号：两个站对不上就说明有一边的页面没更新
    var bv = el('div', null, '页面 ' + PAGE_BUILD);
    bv.style.opacity = '.55';
    bv.style.fontVariantNumeric = 'tabular-nums';
    bv.title = '这份页面的版本号。CF 和 GitHub 两个站的这个号应该一样，' +
               '对不上就说明有一边没更新。';
    about.appendChild(bv);
    if (!INDEX.days.length) {
      emptyState('📭', '索引里还没有已发布的日期',
                 '采集端跑一会儿并发布快照之后，刷新本页即可');
      return;
    }
    // 只载【当前房间】最近三天。以前这里是 INDEX.days.slice(0,3) ——
    // 三个房间混在一起排序，这三天很可能全是同一个房间的。
    return loadDays(roomDays().slice(0, 3)).then(withRecent);
  }).catch(function (e) {
    indexSettled_();          // 索引挂了也要放行，不然鸥子会一直等在门口
    setErr('读不到索引：' + e.message);
    emptyState('📭', '还没有数据', '等采集端发布第一份快照后刷新即可');
  });
}

// ---------- 时间 / 颜色 ----------
var PALETTE = ['#7dd3fc','#86efac','#fcd34d','#fca5a5','#c4b5fd','#f9a8d4',
               '#5eead4','#fdba74','#a5b4fc','#d9f99d','#f0abfc','#93c5fd'];
function colorOf(sid) { return PALETTE[Math.abs(Number(sid) || 0) % PALETTE.length]; }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function dayOf(t) { var d = new Date(t);
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function timeOf(t) { var d = new Date(t);
  return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }
function hmOf(t) { var d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function fmtFull(iso) { var d = new Date(iso); return isNaN(d) ? '未知' :
  dayOf(d.getTime()) + ' ' + hmOf(d.getTime()); }
function dayLabel(day) {
  var today = dayOf(Date.now()), y = dayOf(Date.now() - 86400000);
  if (day === today) return day + '  今天';
  if (day === y) return day + '  昨天';
  var w = '日一二三四五六'[new Date(day + 'T12:00:00').getDay()];
  return day + '  周' + (w || '?');
}

// ---------- 正文渲染：分词后逐个建节点，一次 innerHTML 都不用 ----------
function splitBy(parts, re, type) {
  var out = [];
  parts.forEach(function (p) {
    if (p.t !== 'txt') { out.push(p); return; }
    var last = 0, m;
    re.lastIndex = 0;
    while ((m = re.exec(p.s)) !== null) {
      if (!m[0].length) { re.lastIndex++; continue; }
      if (m.index > last) out.push({ t: 'txt', s: p.s.slice(last, m.index) });
      out.push({ t: type, s: m[0] });
      last = m.index + m[0].length;
    }
    if (last < p.s.length) out.push({ t: 'txt', s: p.s.slice(last) });
  });
  return out;
}

function appendText(parent, text, q) {
  if (!q) { parent.appendChild(document.createTextNode(text)); return; }
  var low = text.toLowerCase(), needle = q.toLowerCase(), i = 0;
  while (true) {
    var at = low.indexOf(needle, i);
    if (at < 0) { parent.appendChild(document.createTextNode(text.slice(i))); break; }
    if (at > i) parent.appendChild(document.createTextNode(text.slice(i, at)));
    parent.appendChild(el('mark', null, text.slice(at, at + needle.length)));
    i = at + needle.length;
  }
}

/*
 * ==================== 玩家贴的图 ====================
 *
 * 玩家会发 https://snipboard.io/XXXX.jpg 这种截图链接。
 * 只当链接的话，看存档的人要一个个点开 —— 而截图往往正是那条消息的全部内容。
 *
 * ⚠️ 但"把任何 URL 都当图片渲染"是不行的，这是别人写的内容：
 *   · 只认【白名单里的域名】，别的一律还是纯链接
 *   · 路径必须长得像图片文件（防止拿站内某个页面当图片加载）
 *   · 只认 https
 *   · no-referrer：不告诉对方是从哪个页面点过去的
 *   · lazy：滚到才加载 —— 一整天几千条里可能有几十张图，
 *     一次性全加载既慢又等于把每个访客的 IP 都送过去
 *
 * ⚠️ 还有一件必须说清楚的事：**图片是从第三方加载的。**
 * 谁看存档，谁的浏览器就会去连 snipboard。这是内嵌外部图片的固有代价，
 * 换不掉 —— 除非把图转存到自己这边，那是另一件事（版权、容量、失效）。
 */
var IMG_HOSTS = [
  'https://snipboard.io/',
  'https://i.snipboard.io/',
];
/*
 * 路径必须【整条】长这样：/文件名.后缀，不许有下级目录。
 * ⚠️ 只写结尾锚点（$）是不够的 —— /a/b.jpg 一样能匹配上末尾那段。
 * 起头的 ^ 才是把"多级路径"挡在外面的那一笔。
 */
var RE_IMG_PATH = /^\/[A-Za-z0-9_\-]+\.(?:jpg|jpeg|png|gif|webp)$/i;

/** 这个链接能不能安全地当图片显示。 */
function imageUrl(u) {
  var s = String(u || '');
  for (var i = 0; i < IMG_HOSTS.length; i++) {
    if (s.indexOf(IMG_HOSTS[i]) !== 0) continue;
    // 掐掉 ?query 和 #hash 再看路径形状 —— 带参数的一律不认
    if (s.indexOf('?') >= 0 || s.indexOf('#') >= 0) return null;
    try {
      var path = s.slice(IMG_HOSTS[i].length - 1);   // 保留开头的 /
      if (RE_IMG_PATH.test(path)) return s;
    } catch (e) { return null; }
    return null;
  }
  return null;
}

/*
 * 灯箱。整个页面共用一个，开的时候才填内容 ——
 * 每张图各建一个的话，一天几十张图就是几十个隐藏节点白占内存。
 */
var LB = { open: false, url: '', real: false };

function lbClose() {
  var box = $('#lightbox');
  if (!box) return;
  box.hidden = true;
  box.className = '';
  clear(box);
  LB.open = false;
  try { document.body.classList.remove('lb'); } catch (e) {}
}

function lbToggleReal() {
  var box = $('#lightbox');
  if (!box) return;
  LB.real = !LB.real;
  box.className = LB.real ? 'real' : '';
  var t = $('#lbzoom');
  if (t) t.textContent = LB.real ? '缩到整屏' : '看原始大小';
}

function lbOpen(url) {
  var box = $('#lightbox');
  if (!box) return;
  clear(box);
  LB.open = true; LB.url = url; LB.real = false;
  box.className = '';
  box.hidden = false;
  try { document.body.classList.add('lb'); } catch (e) {}

  var stage = el('div', 'lbstage');
  var img = el('img');
  img.src = url;
  img.alt = '玩家贴的图';
  img.referrerPolicy = 'no-referrer';
  /*
   * 点图片本身 = 在【铺满】和【原始像素】之间切，不关灯箱。
   * "看不清"要靠这个解决：铺满屏幕对一张 1920 宽的截图，
   * 在手机上仍然是缩小的。
   */
  img.onclick = function (e) { e.stopPropagation(); lbToggleReal(); };
  img.onerror = function () { lbClose(); };
  stage.appendChild(img);
  /* 点空白处关掉 —— 手机上这是最自然的动作 */
  stage.onclick = function () { lbClose(); };
  box.appendChild(stage);

  var bar = el('div', 'lbbar');
  var zoom = el('button', 'lbbtn', '看原始大小');
  zoom.id = 'lbzoom';
  zoom.onclick = function (e) { e.stopPropagation(); lbToggleReal(); };
  bar.appendChild(zoom);

  var open = el('a', 'lbbtn', '新标签打开');
  open.href = url; open.target = '_blank';
  open.rel = 'noopener noreferrer nofollow';
  open.onclick = function (e) { e.stopPropagation(); };
  bar.appendChild(open);

  bar.appendChild(el('span', 'sp'));

  var x = el('button', 'lbbtn', '✕ 关闭');
  x.setAttribute('aria-label', '关闭');
  x.onclick = function (e) { e.stopPropagation(); lbClose(); };
  bar.appendChild(x);

  box.appendChild(bar);
  box.onclick = function () { lbClose(); };
}

/*
 * ===================== 玩家资料页 =====================
 *
 * 点名字打开。三件事写在一起：接口抓来的公司资料、存档里的统计、
 * 以及原来那个「只看这个人的消息」。
 *
 * ⚠️ 资料【不是实时的】。采集端一天只抓几十个人，一轮下来要好几天，
 * 所以"抓取于 N 天前"那一行不是装饰 —— 它得显眼，超过 30 天还要变色。
 * 一份两周前的资料和实时的长得一模一样，这是这个页面最容易骗人的地方。
 *
 * ⚠️ 名单只覆盖游戏房（ZH）。别的房间的人点开是"还没有资料"，
 * 这不是出错 —— 面板里要说清楚，不然看着像坏了。
 */
var PL = { map: null, name: null, state: 'idle' };   // idle | loading | ok | fail
var PC = { open: false };

/** players.json 只在第一次点名字时才拉，平时一个请求都不发。 */
function plLoad() {
  if (PL.state === 'ok' || PL.state === 'loading') return Promise.resolve();
  PL.state = 'loading';
  return indexReady().then(function () {
    return getPack(DATA + '/players.json');
  }).then(function (j) {
    var map = {}, byName = {};
    (j && j.players ? j.players : []).forEach(function (p) {
      if (p.sid) map[p.sid] = p;
      // 名字索引带上领域，否则同名不同服会互相盖掉
      if (p.co) byName[String(p.co).toLowerCase() + '|' + (Number(p.realm) || 0)] = p;
    });
    PL.map = map; PL.name = byName; PL.state = 'ok';
  }).catch(function () {
    PL.state = 'fail';                 // 没发布过 / 404 都走这里，不当错误弹
  });
}

/*
 * 找这个人的资料。
 *
 * 先按 sid 找，找不到再按公司名找。
 * 两条都留着是因为「聊天里的 sid 就是公司 id」这件事**没有被真正验证过** ——
 * 看起来是，但看起来是和验过了不是一回事。哪天不是了，
 * 名字这条路还能兜住，而不是整个功能静默地全部失灵。
 */
function plFind(m) {
  if (PL.state !== 'ok') return null;
  /*
   * 先按 sid 找。sid 是公司 id，全站唯一 —— 两个服务器的同名公司 id 不同，
   * 所以这条路本身就分得开。
   *
   * 按名字兜底时【必须带上领域】：R1 和 R2 可以有同名公司，
   * 只按名字找会把另一个服务器那个人的资料显示在这个人名下。
   */
  if (m.sid && PL.map[m.sid]) return PL.map[m.sid];
  if (!m.name) return null;
  // m._r 是 realm+1（R1 = 1），发布数据里的 realm 是 0 起
  return PL.name[String(m.name).toLowerCase() + '|' + ((Number(m._r) || 1) - 1)] || null;
}

/** LimitedCompany 这种代号，能翻就翻，翻不了原样显示 —— 绝不留空。 */
var LEVEL_KIND = {
  LimitedCompany: '有限公司', PublicCompany: '上市公司',
  Corporation: '股份公司', SoleTrader: '个体户', Partnership: '合伙企业',
};
function levelKindName(k) { return LEVEL_KIND[k] || String(k || ''); }

/**
 * 带符号的加成。
 * 原来一律拼 '+'，负数就成了 "+-1" —— 销售加成是真的会是负的。
 */
function psign(n) {
  if (typeof n !== 'number' || !n) return '';
  return (n > 0 ? '+' : '') + n;
}

function pnum(n) {
  n = Number(n) || 0;
  if (n >= 1e8) return (n / 1e8).toFixed(2) + ' 亿';
  if (n >= 1e4) return (n / 1e4).toFixed(1) + ' 万';
  return String(n);
}

function pcClose() {
  var box = $('#pcard');
  if (!box) return;
  box.hidden = true;
  clear(box);
  PC.open = false;
  try { document.body.classList.remove('pc'); } catch (e) {}
}

function pcOpen(m) {
  var box = $('#pcard');
  if (!box) return;
  PC.open = true;
  box.hidden = false;
  try { document.body.classList.add('pc'); } catch (e) {}
  pcRender(m);
  // 资料还没载入就先把面板开出来（存档统计那部分立刻就能看），
  // 载完再重画一次。不这么做的话，点名字要等一个网络往返才有反应。
  if (PL.state !== 'ok') {
    plLoad().then(function () { if (PC.open) pcRender(m); });
  }
}

function pcRender(m) {
  var box = $('#pcard');
  if (!box) return;
  clear(box);
  var p = plFind(m);

  var sheet = el('div', 'psheet');
  sheet.onclick = function (e) { e.stopPropagation(); };

  var head = el('div', 'phead');
  // 资料页永远是真的：这个功能是"录视频时别露脸"，不是"我自己也查不了"
  head.appendChild(avatar(m, true));
  var nm = el('div', 'pname', (p && p.co) || m.name);
  nm.style.color = colorOf(m.sid);
  head.appendChild(nm);
  var x = el('button', 'pbtn', '✕');
  x.setAttribute('aria-label', '关闭');
  x.onclick = function () { pcClose(); };
  head.appendChild(x);
  sheet.appendChild(head);

  var body = el('div', 'pbody');

  if (p) {
    // 「抓取于 N 天前」—— 这一行是这个页面最重要的一句话
    var days = 0;
    var at = new Date(String(p.at || '') + 'T00:00:00Z').getTime();
    if (at) days = Math.max(0, Math.floor((Date.now() - at) / 86400000));
    var when = el('div', 'pwhen' + (days > 30 ? ' old' : ''),
      p.at ? ('资料抓取于 ' + p.at + '（' + (days ? days + ' 天前' : '今天') + '）' +
              (days > 30 ? ' · 已经挺久了，可能不准' : ''))
           : '不知道是什么时候抓的');
    body.appendChild(when);

    var grid = el('div', 'pgrid');
    function cell(k, v, title) {
      if (v === '' || v == null) return;
      var c = el('div', 'pcell');
      c.appendChild(el('div', 'k', k));
      var vv = el('div', 'v', v);
      if (title) vv.title = title;
      c.appendChild(vv);
      grid.appendChild(c);
    }
    cell('玩家等级', p.lv ? (String(p.lv) + (p.lvk ? ' · ' + levelKindName(p.lvk) : '')) : '');
    cell('信用评级', p.rating ? (p.rating + (p.bracket ? '（' + p.bracket + '）' : '')) : '');
    cell('排名', p.rank ? '#' + p.rank : '');
    cell('EVA 排名', p.eva ? '#' + p.eva : '');
    cell('公司净值', p.value ? pnum(p.value) : '', p.value ? String(p.value) : '');
    cell('建筑价值', p.bval ? pnum(p.bval) : '', p.bval ? String(p.bval) : '');
    cell('专利价值', p.pval ? pnum(p.pval) : '', p.pval ? String(p.pval) : '');
    cell('负债', p.bonds ? pnum(p.bonds) : '', p.bonds ? String(p.bonds) : '');
    cell('员工', p.workers ? pnum(p.workers) : '');
    /*
     * 建筑数和格子数【本来就可能对不上】：免费 / 季节建筑（沙滩集市那种）
     * 不占格子。所以分成两格显示，并把免费那几栋标出来 ——
     * 挤在一起写成"10 栋 / 9 格"看着就像个错。
     */
    cell('建筑', p.nb ? (p.nb + ' 栋' +
      (p.nfree ? '（含 ' + p.nfree + ' 栋免费/季节）' : '')) : '');
    cell('建筑格子', p.slots ? ((p.slots + (p.xslots || 0)) + ' 格' +
      (p.xslots ? '（含额外 ' + p.xslots + '）' : '')) : '');
    cell('生产加成', psign(p.prod));
    cell('销售加成', psign(p.sales));
    cell('休闲加成', psign(p.rec));
    /*
     * 接口给的是一个倍率（1.3 = 比基准多花 30%），显示成"1.3×"要人自己换算。
     * 减 1 变成百分比才是它真正的意思：多付出的那部分。
     */
    cell('管理费用', (typeof p.admin === 'number' && p.admin)
      ? (Math.round((p.admin - 1) * 1000) / 10 + '%') : '');
    cell('政府订单档', (p.gov != null && p.gov >= 0) ? String(p.gov) : '');
    cell('入坑', p.joined || '');
    cell('重开于', p.reset || '');
    cell('赞助者', p.sup ? '是' : '');
    cell('管理员', p.mod ? '是' : '');
    cell('已删除', p.del ? '是' : '');
    body.appendChild(grid);

    // 改过的旧名字。这个在存档里很有用 —— 改名之前的聊天记录是挂在旧名下的
    if (p.prev && p.prev.length) {
      body.appendChild(el('h3', null, '用过的名字'));
      var pc = el('div', 'chips');
      p.prev.forEach(function (x) { pc.appendChild(el('span', 'chip', x)); });
      body.appendChild(pc);
    }

    /*
     * 自我介绍。走的是和聊天正文【完全同一条】渲染路径 ——
     * renderBody 全程 textContent / createTextNode，链接只认 http(s)，
     * 图片只认白名单里的图床，:re-N: 会显示成产品名。
     * 这是一段别人写的自由文本，任何时候都不能因为"它在资料页里"
     * 就换一条更省事的路。
     */
    if (p.note) {
      body.appendChild(el('h3', null, '自我介绍'));
      var nb = el('div', 'pnote');
      renderBody(nb, p.note, '');
      body.appendChild(nb);
    }

    if (p.kinds && p.kinds.length) {
      body.appendChild(el('h3', null, '都有些什么'));
      var chips = el('div', 'chips');
      p.kinds.forEach(function (k) { chips.appendChild(el('span', 'chip', k)); });
      body.appendChild(chips);
    }
  } else {
    var why = PL.state === 'loading' ? '正在读资料…'
            : PL.state === 'fail' ? '这个站点还没有发布玩家资料。'
            : '还没抓到这个人的资料。\n' +
              '资料只覆盖游戏房里出现过的玩家，而且一天只抓几十个人，' +
              '一轮要好几天 —— 过阵子再来看。';
    body.appendChild(el('div', 'pnone', why));
  }

  // ---- 存档里 ----
  body.appendChild(el('h3', null, '在存档里'));
  var st = plArchiveStats(m, p);
  var g2 = el('div', 'pgrid');
  function cell2(k, v) {
    if (!v) return;
    var c = el('div', 'pcell');
    c.appendChild(el('div', 'k', k));
    c.appendChild(el('div', 'v', v));
    g2.appendChild(c);
  }
  cell2('发言', st.n ? (st.n + ' 条') : '');
  cell2('首次发言', st.first || '');
  cell2('最后发言', st.last || '');
  body.appendChild(g2);
  if (st.partial) {
    body.appendChild(el('div', 'pwhen', '（只统计了你这次载入的日期，不是全部存档）'));
  }

  // ---- 原来那个筛选，就在这儿 ----
  var btns = el('div', 'pbtns');
  var only = el('button', 'pbtn main', '只看他的消息');
  (function (sid) {
    only.onclick = function () {
      sel.sender = sid;
      pcClose();
      document.body.classList.remove('nav');
      refresh(true);
      gullFire(3, { sid: sid });          // 鸥子序列 3（另一条入口：资料卡里那个按钮）
    };
  })(m.sid);
  btns.appendChild(only);
  var close = el('button', 'pbtn', '关闭');
  close.onclick = function () { pcClose(); };
  btns.appendChild(close);
  body.appendChild(btns);

  body.appendChild(el('div', 'pfoot',
    '资料来自游戏公开的公司页面，只保留展示性的字段 —— ' +
    '不收在线状态、所在地区、自我介绍和正在生产什么。' +
    '不想被收录的，说一声就去掉。'));

  sheet.appendChild(body);
  box.appendChild(sheet);
  box.onclick = function () { pcClose(); };
}

/**
 * 存档统计：优先用发布数据里的（那是【全量】算的），
 * 没有才退回数当前载入的这些天 —— 并且明说这是不全的。
 * 不说的话，"发言 12 条"会被当成这人一共只说过 12 句。
 */
function plArchiveStats(m, p) {
  if (p && p.msgs) {
    return { n: p.msgs, first: p.first || '', last: p.last || '', partial: false };
  }
  var n = 0, lo = 0, hi = 0;
  ALL.forEach(function (x) {
    if (x.sid !== m.sid) return;
    n++;
    if (!lo || x.t < lo) lo = x.t;
    if (x.t > hi) hi = x.t;
  });
  var d = function (t) { return t ? new Date(t).toISOString().slice(0, 10) : ''; };
  return { n: n, first: d(lo), last: d(hi), partial: true };
}

/**
 * 把认得出来的图片链接渲染成缩略图，挂在消息正文下面。
 * 链接本身【照样保留】—— 图挂了的时候还能点开看。
 */
function appendImages(parent, urls) {
  if (!urls.length) return;
  var box = el('div', 'imgs');
  urls.forEach(function (u) {
    var a = el('a', 'imgwrap');
    /*
     * href 保留着不是摆设：中键、右键"新标签打开"、复制链接地址都还能用，
     * 而且万一灯箱那段脚本出了问题，点击也还是能看到图 —— 降级到旧行为。
     */
    a.href = u; a.target = '_blank'; a.rel = 'noopener noreferrer nofollow';
    a.onclick = function (e) {
      // 让 Ctrl/⌘/中键 保持"新标签打开"的原生行为
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;
      e.preventDefault();
      lbOpen(u);
    };
    var img = el('img');
    img.src = u;
    img.alt = '玩家贴的图';
    img.loading = 'lazy';
    img.decoding = 'async';
    img.referrerPolicy = 'no-referrer';
    /*
     * 加载失败就把整块拿掉 —— 图床上的图是会过期的，
     * 留一个碎图标既难看又让人以为是存档坏了。链接还在正文里，不影响。
     */
    img.onerror = function () { try { box.removeChild(a); } catch (e) {} };
    a.appendChild(img);
    box.appendChild(a);
  });
  parent.appendChild(box);
}

function renderBody(parent, text, q, maskOnly) {
  var parts = [{ t: 'txt', s: String(text || '') }];
  parts = splitBy(parts, /https?:\/\/[^\s<>"']+/g, 'url');
  /*
   * ⚠️ 被屏蔽的人要【先】切出来，再走通用的 @ 规则。
   *
   * 顺序反过来就不对了：通用那条正则遇到空格就停，
   * 而公司名是可以带空格的 —— 「@Big Corp」它只咬得到「@Big」，
   * 剩下的「 Corp」原样留在正文里，等于遮了个寂寞。
   * 这里的正则是拿真名【整个】拼出来的，空格照样匹配得上。
   */
  if (maskOnly && MASK_RE) parts = splitBy(parts, MASK_RE, 'atmk');
  parts = splitBy(parts, /@[A-Za-z0-9_一-龥][\w.\-一-龥]*/g, 'at');
  parts = splitBy(parts, RE_ICON, 'emo');
  var pics = [];
  parts.forEach(function (p) {
    if (p.t === 'url') {
      // 只接受 http(s)，其余按纯文字处理，绝不产生 javascript: 之类的链接
      if (/^https?:\/\//i.test(p.s)) {
        var a = el('a', null, p.s);
        a.href = p.s; a.target = '_blank'; a.rel = 'noopener noreferrer nofollow';
        parent.appendChild(a);

var MASK_IX = {};       // sid -> 1..n
var MASK_NAME = {};     // 归一化后的名字 -> 编号（一个人可能有好几个旧名字）
var MASK_RE = null;     // 认 @某某某 的正则；没人被屏蔽时是 null（renderBody 直接跳过）

function reEsc(x) { return String(x).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

/** 从本地偏好里读回名单。坏数据一律当没有，绝不让它把页面带崩。 */
function maskLoad() {
  MASK = [];
  var raw = PREF.mask;
  var seen = {};
  if (Object.prototype.toString.call(raw) === '[object Array]') {
    raw.forEach(function (x) {
      var sid = Number(x && x.sid) || 0;
      if (!sid || seen[sid]) return;
      seen[sid] = 1;
      MASK.push({ sid: sid, name: String((x && x.name) || '') });
    });
  }
  maskRebuild();
}

/*
 * 名字归一化：小写 + 去掉所有空格 / 连字符 / 下划线。
 *
 * ⚠️ 这一条是线上抓出来的：公司名叫「Rabbit House」，
 *    而游戏里 @ 出来的是「@Rabbit-House」—— 空格变成了连字符。
 *    按原文精确匹配的话，这个人【永远遮不住】。
 */
function maskKey(x) { return String(x).toLowerCase().replace(/[\s\-_]+/g, ''); }

function maskRebuild() {
  MASK_IX = {}; MASK_NAME = {};
  MASK.forEach(function (x, i) { MASK_IX[x.sid] = i + 1; });

  var names = [], seen = {};
  function add(nm, n) {
    nm = String(nm || '');
    var k = maskKey(nm);
    if (!k) return;
    if (MASK_NAME[k] === undefined) MASK_NAME[k] = n;
    var low = nm.toLowerCase();
    if (!seen[low]) { seen[low] = 1; names.push(nm); }
  }
  MASK.forEach(function (x, i) { add(x.name, i + 1); });
  /*
   * 改过名的人：把他在【已载入的消息】里用过的每个名字都收进来。
   *
   * 名单里只存了一个名字（加进名单那一刻他叫什么）。可存档是跨时间的 ——
   * 半个月前别人 @ 的是他的旧名字，只认新名字的话那一段全都遮不住。
   * 反过来也一样：他今天改了名，老名字还挂在几千条历史消息里。
   */
  if (MASK.length) {
    try {
      ALL.forEach(function (m) {
        var n = MASK_IX[m.sid];
        if (n) add(m.name, n);
      });
    } catch (e) { /* 数据还没载入就算了，载完 rebuild 会再来一次 */ }
  }

  /*
   * ⚠️ 长的名字必须排在前面。
   * 同时屏蔽了「Ab」和「AbCorp」时，正则是从左往右挨个试的 ——
   * 短的排前面就会把 @AbCorp 咬掉半截，剩一个 "Corp" 露在外面。

  names.sort(function (a, b) { return b.length - a.length; });

   *
   * 【一】分隔符要互换。
   *   公司名「Rabbit House」，游戏里 @ 出来是「@Rabbit-House」。
   *   所以名字里的空格/连字符/下划线一律拆开，中间用 [\s\-_]* 接回去 ——
   *   连「@RabbitHouse」这种全去掉的写法也一起认了。
   *
   * 【二】右边界要看名字最后一个字是什么。
   *   第一版给所有名字都加了「后面不能紧跟名字里可能出现的字」这条限制。
   *   拉丁名字没问题，中文名字当场就废了：
   *
   *       @星辰工业 在吗      ← 带空格，遮得住
   *       @星辰工业在吗       ← 下一个字是汉字 → 那条限制直接否定掉，
   *                            于是掉回通用的 @ 规则，完整名字原样露出来
   *
   *   而中文聊天里【不带空格才是常态】。根因是中文没有词边界、拉丁有，
   *   所以按结尾分开处理：
   *     以字母/数字结尾 → 后面不能紧跟字母/数字（@Abxyz 不该被 @Ab 吃掉）
   *     以汉字结尾     → 不加任何限制（@星辰工业在吗 必须遮得住）
   *   两个互为前缀的中文名字同时被屏蔽时，靠上面那句"长的排前面"分开。
   */
  var alts = names.map(function (nm) {
    var parts = nm.split(/[\s\-_]+/).filter(Boolean);

    var body = parts.map(reEsc).join('[\\s\\-_]*');

function maskOn(sid) { return !!MASK_IX[sid]; }
/** 这个人在聊天流里叫什么。没被屏蔽就是他自己的名字。 */

/** @ 到的那一段该换成什么。按归一化后的名字反查编号，查不到就退回「玩家」。 */
function maskAtText(hit) {
  var n = MASK_NAME[maskKey(String(hit).slice(1))];
  return n ? ('@玩家' + n) : '@玩家';

/**
 * 加进名单 / 从名单里去掉。
 *
 * ⚠️ 编号是按【名单顺序】算的，所以去掉中间那个人，后面的编号会往前挪

 * 会出现「玩家1、玩家3」这种一看就知道"中间还有一个"的东西。

/** 屏蔽用的占位头像元素。每次都新建一个 —— DOM 节点不能共用。 */
function maskAvatar() {

  img.src = MASK_AV;

}

/* ---------- 那个面板 ---------- */
var MK = { open: false, list: null, q: '' };

/**
 * 候选名单 = 【发过消息的人】，跨房间，按条数从多到少。
 *
 * 只在打开面板时算一次。ALL 可能有二十万条，
 * 每敲一个字重算一遍的话，搜索框会卡得没法用 —— 输入时只筛这个现成数组。
 */
function maskCandidates() {
  var by = new Map();
  ALL.forEach(function (m) {
    var e = by.get(m.sid);
    if (e) { e.n++; if (m.t >= e.t) { e.name = m.name; e.t = m.t; } }
    else by.set(m.sid, { sid: m.sid, name: m.name, n: 1, t: m.t });
  });
  var list = [];
  by.forEach(function (v) { list.push(v); });
  list.sort(function (a, b) { return b.n - a.n; });
  return list;
}

function mkOpen() {
  var box = $('#mkcard');
  if (!box) return;
  MK.open = true;
  MK.q = '';
  MK.list = maskCandidates();
  box.hidden = false;
  try { document.body.classList.add('pc'); } catch (e) {}
  mkRender();
  var q = $('#mkq');
  if (q) { try { q.focus(); } catch (e) {} }
}
function mkClose() {
  var box = $('#mkcard');
  if (box) box.hidden = true;
  MK.open = false;
  // 资料页可能同时开着（它也用 body.pc 锁滚动），别把它的锁一起解了
  if (!PC.open) { try { document.body.classList.remove('pc'); } catch (e) {} }
}

function mkRender() {
  var box = $('#mkcard');
  if (!box) return;
  clear(box);

  var sheet = el('div', 'msheet');
  sheet.onclick = function (e) { e.stopPropagation(); };

  var head = el('div', 'mhead');
  head.appendChild(el('b', null, '屏蔽头像 / ID'));
  var x = el('button', 'pbtn', '✕');
  x.setAttribute('aria-label', '关闭');
  x.onclick = function () { mkClose(); };
  head.appendChild(x);
  sheet.appendChild(head);

  var body = el('div', 'mbody');

  var q = el('input');
  q.type = 'search';
  q.id = 'mkq';
  q.placeholder = '搜发过消息的玩家…';
  q.value = MK.q;
  q.oninput = function () {
    MK.q = q.value || '';
    /*
     * 只重画列表那一段，不重画整个面板 ——
     * 整个重画会把输入框换成新的，光标当场丢掉，打字变成一次一个字。
     * 计算器那边的小数点就是栽在同一件事上。
     */
    mkFill(listBox);
  };
  body.appendChild(q);

  var listBox = el('div', 'mlist');
  mkFill(listBox);
  body.appendChild(listBox);
  sheet.appendChild(body);

  sheet.appendChild(el('div', 'mnote',
    '只改聊天流里的显示：头像换成占位图、名字换成「玩家N」，正文里 @ 到他的地方一起换。\n' +
    '点名字打开的资料页、侧栏的发送者列表【不遮】，搜索也照样按真名工作。\n' +
    '名单只存在这台设备的浏览器里，不会上传，别人打开这个网站看到的还是原样。'));

  box.appendChild(sheet);
  box.onclick = function () { mkClose(); };
}

/** 列表那一段。屏蔽了的排最上面，下面是候选。 */
function mkFill(box) {
  clear(box);
  var low = (MK.q || '').toLowerCase();

  if (MASK.length) {
    box.appendChild(el('h3', null, '已屏蔽（' + MASK.length + ' 人）'));
    MASK.forEach(function (x, i) {
      var r = el('div', 'mrow');
      r.appendChild(maskAvatar());
      var l = el('span', 'lbl', x.name || ('#' + x.sid));
      r.appendChild(l);
      r.appendChild(el('span', 'as', '→ 玩家' + (i + 1)));
      var b = el('span', 'n', '取消');
      r.appendChild(b);
      r.onclick = function () { maskToggle(x.sid, x.name); };
      box.appendChild(r);
    });
  }

  var list = (MK.list || []).filter(function (v) {
    if (maskOn(v.sid)) return false;
    return !low || v.name.toLowerCase().indexOf(low) >= 0;
  });
  box.appendChild(el('h3', null,
    low ? ('搜到 ' + list.length + ' 人') : ('发过消息的玩家（' + list.length + ' 人）')));
  if (!list.length) {
    box.appendChild(el('div', 'mnone',
      low ? '没有匹配的人。名单只认【已经载入的消息】里出现过的发言者 —— 多载几天再找找。'
          : '还没载入任何消息。'));
    return;
  }
  list.slice(0, 200).forEach(function (v) {
    var r = el('div', 'mrow');
    var l = el('span', 'lbl', v.name);
    l.style.color = colorOf(v.sid);
    r.appendChild(l);
    r.appendChild(el('span', 'n', v.n));
    r.onclick = function () { maskToggle(v.sid, v.name); };
    box.appendChild(r);
  });
  if (list.length > 200) {
    box.appendChild(el('div', 'mnone',
      '还有 ' + (list.length - 200) + ' 人没列出来 —— 用上面的搜索框找。'));
  }
}

/*
 * raw=true 表示【要真的那一份】—— 资料页用。
 * 聊天流不传这个参数，被屏蔽的人在那儿一律是占位图。
 */
function avatar(m, raw) {
  if (!raw && maskOn(m.sid)) return maskAvatar();
  var initial = (m.name.charAt(0) || '?').toUpperCase();
  if (m.logo && m.logo.indexOf(AVATAR_HOST) === 0) {
    var img = el('img', 'av');
    img.src = m.logo; img.alt = ''; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer';
    img.onerror = function () {
      var ph = el('div', 'av ph', initial);
      ph.style.background = colorOf(m.sid);
      if (img.parentNode) img.parentNode.replaceChild(ph, img);
    };
    return img;
  }
  var ph = el('div', 'av ph', initial);
  ph.style.background = colorOf(m.sid);
  return ph;
}

// ---------- 筛选与渲染 ----------
/**
 * 重建排序数组和侧栏统计。只在【载入了新数据】时跑，不随搜索跑。
 *
 * 消息一旦入库就不会变，所以排序一次就够了。以前是每次筛选都把结果重排一遍，
 * 二十万条时每敲一个字都要 O(n log n)。
 */
function rebuild() {
  /*
   * 屏蔽名单的【别名】要跟着数据走：改过名的人，旧名字只存在于老消息里。
   * 载入新的一天可能就带出一个以前没见过的旧名字 —— 不在这儿重建的话，
   * 那一段的 @ 会遮不住，而且看上去像"这个功能时灵时不灵"。
   */
  try { if (MASK.length) maskRebuild(); } catch (e) {}
  SORTED = [];
  ALL.forEach(function (m) { SORTED.push(m); });
  SORTED.sort(function (a, b) { return a.t - b.t || a.id - b.id; });

  // 按房间分桶。分完每桶依然有序（是从有序数组里顺序推进去的），
  // 所以"只看某个房间"这个最常见的情况可以直接用现成数组，一次拷贝都不用。
  BYROOM = {};
  for (var i = 0; i < SORTED.length; i++) {
    var m = SORTED[i];
    (BYROOM[m.room] || (BYROOM[m.room] = [])).push(m);
  }
  STATS = null;      // 侧栏统计跟着作废
  DIRTY = false;
}

/** 当前房间的消息（已按时间排好）。 */
function roomMsgs() {
  if (DIRTY) rebuild();
  return BYROOM[sel.room] || [];
}

/** 索引里有哪些房间、各多少条 —— 来自索引而不是已载入的数据。
 *  这一点很关键：还没载入的房间也必须在侧栏里出现，否则你根本无从选它。 */
function indexRooms() {
  var out = {};
  if (INDEX) {
    (INDEX.days || []).forEach(function (d) {
      out[d.room] = (out[d.room] || 0) + (d.n || 0);
    });
  }
  // 只在快通道里出现、还没进索引的房间也要列出来（刚加的聊天室就是这种）。
  // 索引里已有的以索引为准 —— 那是"存档总量"，recent 只是最近一小包。
  Object.keys(RECENT_ROOMS).forEach(function (r) {
    if (!out[r]) out[r] = RECENT_ROOMS[r];
  });
  return out;
}

/** 当前房间的日期列表（索引里的，倒序）。 */
function roomDays() {
  if (!INDEX) return [];
  return (INDEX.days || []).filter(function (d) { return d.room === sel.room; });
}

/** 选一个存在的房间：优先沿用上次的，其次 ZH，再不行就第一个。 */
function pickRoom() {
  var rooms = indexRooms(), keys = Object.keys(rooms).sort();
  if (!keys.length) return sel.room;
  if (rooms[sel.room]) return sel.room;
  if (rooms.ZH) return 'ZH';
  return keys[0];
}

/** 侧栏用的统计。结果缓存起来，搜索时直接复用。 */
function stats() {
  if (STATS) return STATS;
  if (DIRTY) rebuild();

  // 只统计【当前房间】—— 侧栏里的发送者、领域、时间跨度必须和你眼前看到的
  // 是同一批消息。混着别的房间算，数字对不上，人会以为是坏了。
  var base = roomMsgs();
  var senders = new Map(), days = {}, realms = {};
  for (var i = 0; i < base.length; i++) {
    var m = base[i];
    realms[m._r] = (realms[m._r] || 0) + 1;
    days[m._d] = 1;
    var e = senders.get(m.sid);
    if (e) { e.n++; e.name = m.name; }
    else senders.set(m.sid, { name: m.name, sid: m.sid, n: 1 });
  }
  var list = [];
  senders.forEach(function (v) { list.push(v); });
  list.sort(function (a, b) { return b.n - a.n; });

  // 时间跨度直接取首尾两条 —— 数组本来就是按时间排好的。
  //
  // 这里原本写的是 Math.max.apply(null, ts)，那是把每一条消息的时间戳当成一个
  // 函数参数展开。参数个数有上限，实测 15 万条就会抛 RangeError，
  // 而异常正好发生在渲染路径上，整个页面会卡死不再响应。
  var hrs = 0;
  if (base.length) {
    hrs = (base[base.length - 1].t - base[0].t) / 3600000;
    if (!(hrs >= 0)) hrs = 0;
  }

  STATS = { senders: list, realms: realms, n: base.length,
            days: Object.keys(days).length, hrs: hrs };

  // 载入的数据里压根没有当前选中的领域（比如默认的 R1）就回落到「全部」，
  // 否则会看到一个空页面还不知道为什么。
  if (sel.realm != null && !realms[sel.realm]) sel.realm = null;

  return STATS;
}

/* ======================= 深搜：不把整个存档装进内存 =======================
 *
 * 老做法：想搜全部历史，就得先点「载入全部」把所有日文件 expand 成对象塞进 ALL。
 * 实测 ZH 一年 = 1,277,135 条 → 11 秒、584 MB 堆。手机必崩。
 *
 * 新做法两条，合起来解决问题：
 *
 *   ① 从【最新的一天】往回翻，凑够 DEEP_TARGET 条命中就停。
 *      实测：要最新 500 条命中 = 63 毫秒、0 MB、只翻了 4/365 天。
 *      道理很简单 —— 你搜一个词，绝大多数时候想看的是最近的那批，
 *      不是一次把一年的都摆出来。不够再点「继续找更早的」。
 *
 *   ② 扫完就扔。每天解析出来的消息只留【命中的】，其余当场丢掉，
 *      不进 ALL、不进任何长期容器。实测扫全年也只有 36 MB
 *      （而且这个数只跟"命中多少条"有关，跟存档多大无关）。
 *
 * ⚠️ 一个【故意没做】的优化，写在这里免得以后有人"顺手加上"：
 *   本来可以在解析之前先在日文件的原始文本上 indexOf 一次，不含就整天不解析
 *   （对生僻词是 12 倍加速）。实测踩过坑：搜 BFR 会返回 0 条，
 *   而正确答案是 83,981 条 —— 因为 "BFR" 这个名字【不在原文里】，
 *   原文只有 :re-94:，产品名是 expand() 里由图标码翻出来的。
 *   它不报错，就是安静地搜不到。
 *   所以这里坚持走同一个 expand() + 同一个 _s —— 浏览和搜索用同一套判定，
 *   永远不会出现"页面上看得到、搜索搜不到"。
 *   真要加预筛，必须把查询词展开成"它自己 + 对应的图标码"一起找，并且配测试。
 */
var DEEP_TARGET = 500;        // 一轮凑够多少条命中就停
var DEEP_MORE   = 500;        // 点「继续找更早的」再加多少
var DEEP_BATCH  = 4;          // 一批并发拉几天（和 loadDays 保持一致）
var DEEP = null;

/** 当前深搜的结果适用于现在这个查询吗？不适用就当没有。 */
function deepMsgs() {
  if (!DEEP) return null;
  if (DEEP.room !== sel.room) return null;
  if (DEEP.q !== sel.q.toLowerCase()) return null;
  return DEEP.msgs;
}

function deepStop() {
  if (DEEP) DEEP.cancel = true;
}

/**
 * 开一轮深搜。同一个词重复调用不会重开，只会把目标条数往上加。
 * more = 这次要再多找几条（不给就是从头找 DEEP_TARGET 条）。
 */
function deepSearch(more) {
  var q = sel.q.toLowerCase();
  if (!q) { deepStop(); DEEP = null; renderDeep(); return Promise.resolve(); }
  if (!INDEX) return Promise.resolve();

  if (DEEP && DEEP.q === q && DEEP.room === sel.room) {
    if (DEEP.running) return Promise.resolve();
    if (DEEP.exhausted) return Promise.resolve();
    DEEP.target = DEEP.msgs.length + (more || DEEP_MORE);
  } else {
    deepStop();
    // 从最新的一天往回排。已经完整载入内存的天直接跳过 ——
    // 那些消息本来就在 ALL 里，applyFilters 已经会筛到它们。
    var days = roomDays().slice().sort(function (a, b) {
      return a.day < b.day ? 1 : (a.day > b.day ? -1 : 0);
    });
    DEEP = {
      q: q, room: sel.room, msgs: [], seen: {},
      queue: days, total: days.length, scanned: 0, fetched: 0, failed: 0,
      target: more || DEEP_TARGET, running: false, cancel: false, exhausted: false,
    };
  }
  return deepRun(DEEP);
}

function deepRun(d) {
  if (d.running) return Promise.resolve();
  d.running = true;
  renderDeep();

  function batch() {
    if (d !== DEEP || d.cancel) return Promise.resolve();
    if (d.msgs.length >= d.target) return Promise.resolve();

    // 先把已经在内存里的天跳掉（不发请求）
    while (d.queue.length && !needLoad(d.queue[0])) { d.queue.shift(); d.scanned++; }
    if (!d.queue.length) { d.exhausted = true; return Promise.resolve(); }

    var take = d.queue.splice(0, DEEP_BATCH);
    d.scanned += take.length;
    var before = d.msgs.length;

    return Promise.all(take.map(function (it) {
      return getPack(DATA + '/d/' + encodeURIComponent(it.room) + '/' +
                     encodeURIComponent(it.day) + '.json', true)
        .then(function (pack) {
          d.fetched++;
          var msgs = expand(pack);
          for (var i = 0; i < msgs.length; i++) {
            var m = msgs[i];
            // 和浏览用的是同一个 _s —— 这是"页面上看得到就一定搜得到"的保证
            if (m._s.indexOf(d.q) < 0) continue;
            if (ALL.has(m.id) || d.seen[m.id]) continue;
            d.seen[m.id] = 1;
            d.msgs.push(m);
          }
          // msgs / pack 这一轮就丢掉 —— 这就是"扫完就扔"，不往 ALL 里塞
        })
        .catch(function () { d.failed++; });
    })).then(function () {
      if (d !== DEEP) return;
      renderDeep();
      // 只在真的多出东西时才重画，免得扫几百天就重排几百次
      if (d.msgs.length > before) refreshKeepScroll();
      return batch();
    });
  }

  return batch().then(function () {
    if (d !== DEEP) return;
    d.running = false;
    if (!d.queue.length) d.exhausted = true;
    renderDeep();
    refreshKeepScroll();
  });
}

/*
 * 深搜是一边翻一边往里插结果的，而插进来的都是【更早】的消息 ——
 * 它们排在前面。renderFeed 每次都是清空重画，滚动位置会归零，
 * 于是你正看着的地方会突然跳到顶部。
 * 所以按"离底部多远"来恢复，和「载入更早的」那个按钮用的是同一招。
 */
function refreshKeepScroll() {
  var f = $('#feed');
  var fromBottom = f ? (f.scrollHeight - f.scrollTop) : 0;
  refresh(false);
  if (f) {
    requestAnimationFrame(function () {
      f.scrollTop = Math.max(0, f.scrollHeight - fromBottom);
    });
  }
}

/** 搜索栏下面那条状态/操作条。 */
function renderDeep() {
  var bar = $('#deep');
  if (!bar) return;
  clear(bar);
  var d = DEEP;
  if (!d || d.q !== sel.q.toLowerCase() || d.room !== sel.room) {
    bar.className = '';
    return;
  }
  bar.className = 'on';

  var n = el('b', null, d.msgs.length.toLocaleString());
  bar.appendChild(el('span', null, '更早的存档里又找到 '));
  bar.appendChild(n);
  bar.appendChild(el('span', null, ' 条'));

  if (d.running) {
    bar.appendChild(el('span', null, '· 已翻 ' + d.scanned + '/' + d.total + ' 天…'));
    var stop = el('button', null, '停');
    stop.onclick = function () { deepStop(); };
    bar.appendChild(stop);
    return;
  }

  if (d.exhausted) {
    bar.appendChild(el('span', null, '· 已经找遍这个房间的全部 ' + d.total + ' 天'));
  } else {
    var left = d.queue.length;
    bar.appendChild(el('span', null, '· 翻到第 ' + d.scanned + '/' + d.total +
                                     ' 天就够了，还有 ' + left + ' 天没找'));
    var more = el('button', null, '继续找更早的');
    more.onclick = function () { deepSearch(DEEP_MORE); };
    bar.appendChild(more);
  }
  if (d.failed) {
    bar.appendChild(el('span', null, '·（' + d.failed + ' 个文件没读到）'));
  }
}

/*
 * ===================== 每日 AI 摘要 =====================
 *
 * 采集端每天给【已经结束的那一天】生成一段话，发成 data/ai/<房间>/<日期>.json。
 * 这里只是多读一个静态文件 —— 页面【不会】去调任何模型，也没有任何 key。
 * （CSP 是 connect-src 'self'，就算想调也调不出去，这是有意为之。）
 *
 * 三条规矩：
 *   1. 只在【选中了某一天】时出现。没选具体日期就没有"这一天"可总结。
 *   2. 404 = 那天没有摘要，很正常（没开、跳过了、生成失败）。
 *      记下来，不要每次重画都再敲一次 404。
 *   3. 标识必须一眼可见，而且【折不掉】—— 折叠只收正文。
 */
var AI_MEMO = {};        // 'room|day' -> 对象 / false（没有）/ 'wait'（正在取）
/*
 * 正文展开着吗（整页记忆，不是每天各记一份）。
 *
 * ⚠️ 手机上默认【收起】。
 * 这张卡在 #bar 和 #feed 中间，手机屏幕本来就矮 ——
 * 展开状态下它能占掉三分之一还多，剩下的地方翻两条消息就到底了，
 * 实际体验是"一打开这一天，屏幕被总结糊住了"。
 *
 * 电脑上默认展开：那边地方够，总结正是最该先看到的东西。
 * 收起状态下横幅还在，所以"这是 AI 写的"这件事任何时候都没被藏起来。
 */
/*
 * 要不要在正文里标出"进了选读的那些"。默认开 ——
 * 这个功能的全部意义就是让选择可核对，默认关掉等于没做。
 */
var AI_MARK = true;

/** 当前这一天的摘要依据了哪些消息 id。没有就返回 null。 */
function aiSrcSet() {
  var k = aiKeyOf();
  if (!k) return null;
  var o = AI_MEMO[k];
  if (!o || o === 'wait' || !o.src || !o.src.length) return null;
  /*
   * ⚠️ 缓存【不要挂在 obj 上】。
   * 那个对象是从 JSON 读来的，别处可能会把它再序列化一遍 ——
   * 挂上去的 Set 会变成 {}，而 {} 没有 .has，
   * 于是标记功能悄悄失效（或者当场报错）。
   * 单独存一份，只按 key 认。
   */
  if (AI_SET.k !== k) {
    var set = new Set();
    for (var i = 0; i < o.src.length; i++) set.add(Number(o.src[i]));
    AI_SET = { k: k, set: set };
  }
  return AI_SET.set;
}
var AI_SET = { k: null, set: null };

var AI_OPEN = (function () {
  try { return !window.matchMedia('(max-width:860px)').matches; }
  catch (e) { return true; }        // 判断不了就按电脑处理
})();

function aiKeyOf() {
  return (sel.day && sel.room) ? (sel.room + '|' + sel.day) : null;
}

/** 取一天的摘要。取到、或者确认没有，都会重画一次卡片。 */
function loadAiSummary(room, day) {
  var k = room + '|' + day;
  if (AI_MEMO[k] !== undefined) return;          // 已有结论（含"没有"）
  AI_MEMO[k] = 'wait';
  /*
   * ⚠️ reuse 必须是 false（= 带时间戳 + no-store）。
   *
   * 原来写的是 true，理由是"摘要生成一次就永不改变，重下毫无意义"。
   * **那个前提是错的** —— 提示词要反复调，调完就要重做那一天。
   * 结果是：采集端明明写了新的，浏览器还拿着旧的那份不放，
   * 而这种"写了但看不见"最容易被误判成"根本没写进去"。
   *
   * 代价：切一次日期多一个几百字节的请求。摘要就那么点大，
   * 拿这个换"改完立刻看得到"，太值了。
   *
   * 同一天只会请求一次 —— AI_MEMO 记着结果，重画不会重复发。
   */
  getPack(DATA + '/ai/' + encodeURIComponent(room) + '/' +
          encodeURIComponent(day) + '.json', false)
    .then(function (obj) {
      AI_MEMO[k] = (obj && obj.text) ? obj : false;
    })
    .catch(function () {
      AI_MEMO[k] = false;                        // 没有就是没有，不报错打扰人
    })
    .then(function () {
      if (aiKeyOf() === k) renderAiCard();       // 期间可能已经切走了
    });
}

function renderAiCard() {
  var box = $('#aicard');
  if (!box) return;
  clear(box);
  var k = aiKeyOf();
  if (!k) { box.className = ''; return; }        // 没选具体某天

  loadAiSummary(sel.room, sel.day);
  var obj = AI_MEMO[k];
  if (!obj || obj === 'wait') { box.className = ''; return; }

  box.className = 'on';

  // ---- 横幅：这一条永远在，折叠也收不掉 ----
  var head = el('div', 'aihead');
  /*
   * 先写清楚【这是什么】，再写警告。
   *
   * 原来第一句直接是"本段由 AI 生成"—— 那是个免责声明，不是名字。
   * 结果这块东西在页面上没有名字：知道它是什么的人才看得懂它是什么。
   * 名字要能被指认（"你看 AI 总结里说…"），免责声明做不到这件事。
   */
  /*
   * 人工挑的和机器读全天的，**名字不能一样** —— 它们的可信范围不同。
   *
   * 「AI 总结」这四个字本身就在暗示"这是当天全貌"，
   * 而人工挑选的那份从来不是。一大半"断章取义"的指责起点就在这儿：
   * 读者以为它是全文摘要。名字改对了，期待就对了。
   */
  var manual = Number(obj.manual);
  head.appendChild(el('span', 'aititle', manual ? 'AI 选读' : 'AI 总结'));
  head.appendChild(el('span', null, '🤖 由 AI 生成'));
  if (manual) {
    head.appendChild(el('span', 'warn',
      '· 人工挑选 ' + Number(obj.n_src || 0).toLocaleString() + '/' +
      Number(obj.total || 0).toLocaleString() + ' 条，不是当天全貌'));
  }
  /*
   * 免责声明有长短两版，按屏幕宽度切换 —— **不是"手机上就不显示"**。
   * 手机屏窄，长句会把标题和按钮挤到第二行；但为了省一行就把
   * "可能有误"整句删掉，等于在最容易被当真的地方拿掉了唯一的提醒。
   * 宁可短，不能没有。
   */
  head.appendChild(el('span', 'warn warn-long',
    '· 可能有误、可能遗漏，以下方原始记录为准'));
  head.appendChild(el('span', 'warn warn-short', '· 可能有误'));
  head.appendChild(el('span', 'spacer'));
  /*
   * 「标出进了选读的那些」——【在全文里内联标】，不是单独开一个筛选模式。
   *
   * 这一点是关键：读者滚过去的时候，被标的和没被标的挨在一起，
   * **遗漏是默认可见的**，不需要他主动去点"只看没选的"。
   * 单独做一个筛选模式反而更差：要主动切换，等于没人会看。
   */
  var ids = aiSrcSet();
  if (ids && ids.size) {
    var mk = el('button', 'aitoggle' + (AI_MARK ? ' on' : ''),
      (AI_MARK ? '✓ ' : '') + '在下方标出这 ' + ids.size.toLocaleString() + ' 条');
    mk.title = '把进了这份选读的消息在下面的记录里标出来。\n' +
               '没被标的就是没选进去的 —— 一起看，才知道漏了什么。';
    mk.onclick = function () { AI_MARK = !AI_MARK; refreshKeepScroll(); };
    head.appendChild(mk);
  }

  var tg = el('button', 'aitoggle', AI_OPEN ? '收起' : '展开');
  tg.onclick = function () { AI_OPEN = !AI_OPEN; renderAiCard(); };
  head.appendChild(tg);
  box.appendChild(head);

  if (!AI_OPEN) return;

  // ---- 正文：模型写的字，只用 textContent ----
  var body = el('div', 'aibody');
  body.textContent = String(obj.text || '');
  box.appendChild(body);

  /*
   * 脚注写清楚"它看的是什么"。没有出处的摘要没法验证，那就只是个好看的猜测：
   * 这一天一共多少条、其中多少条被喂进去、用的哪个模型、什么时候生成的。
   */
  var foot = el('div', 'aifoot');
  var n = Number(obj.n_src || 0), tot = Number(obj.total || 0);
  /*
   * 房间不一样，"依据了什么"也不一样：
   *   · 消息少的房间（社交）整天原样读，没有筛
   *   · 消息多的房间要先按游戏相关性筛一遍
   * 所以这句话【按数字来判断】，不写死。
   * 写死成"和游戏有关的 N 条"的话，没筛的房间会被描述成筛过 ——
   * 那是在骗人，而且骗的正是"这段总结可信到什么程度"这件事。
   */
  /*
   * 人工挑的和机器筛的，来源不一样，可信度也不一样 —— 必须让人看得出来。
   * 都写成"依据 N 条"的话，一份人工精选和一份机器粗筛长得一模一样，
   * 而它们值得的信任程度差很远。
   */
  if (Number(obj.manual)) {
    var man = el('span', null, '✍️ 素材由人工挑选');
    man.style.color = '#86efac';
    foot.appendChild(man);
  }
  foot.appendChild(el('span', null,
    (Number(obj.manual)
      ? ('从这一天 ' + tot.toLocaleString() + ' 条里挑了 ' + n.toLocaleString() + ' 条')
      : n >= tot ? ('依据这一天全部 ' + tot.toLocaleString() + ' 条')
              : ('依据这一天 ' + tot.toLocaleString() + ' 条里的 ' +
                 n.toLocaleString() + ' 条'))));
  /*
   * 消息特别多的那天会超出单次字符上限，只有较晚的一段被读到。
   * 这件事【必须写出来】：一段看着完整、其实只覆盖半天的总结，
   * 比没有总结更糟 —— 它会让人以为自己已经知道那天发生了什么。
   */
  if (Number(obj.truncated)) {
    var cut = el('span', null, '⚠️ 这天消息太多，只读了较晚的一段');
    cut.style.color = 'var(--warn)';
    foot.appendChild(cut);
  }
  if (obj.model) foot.appendChild(el('span', null, '模型 ' + obj.model));
  if (obj.generated) {
    foot.appendChild(el('span', null, '生成于 ' + fmtFull(obj.generated)));
  }
  box.appendChild(foot);
}

/*
 * ===================== 暂时不显示某几条消息 =====================
 *
 * 录视频用的。有些对话和素材毫无关系，摆在画面里碍眼 ——
 * 这个功能就是**让它们暂时不出现**，仅此而已：
 *
 *   · **不是删除**：数据一个字节都没动，线上的日文件照旧
 *   · **不是屏蔽**：屏蔽是按【人】遮住头像和 ID，这个是按【条】整条不出现
 *   · 名单只存在这台设备的浏览器里，别人打开看到的还是全的
 *
 * ⚠️ 实现上只有一件事要想清楚，其余全是自然结果：
 *
 *     **必须"先过滤，再分组"。**
 *
 * 消息流是按"连着的同一个人"分组的：一组里第一条画头像和名字，
 * 后面几条只画一个时间槽。要是先分组再把某几条藏掉：
 *   · 藏掉组里第一条 → 剩下的全是没有名字的时间槽，孤零零挂在那儿
 *   · 一个人这一段全藏了 → 头像还在，底下什么都没有，非常诡异
 *
 * 而只要在【进入渲染之前】就把它们从 view 里拿掉，分组是照着剩下的重算的，
 * 于是"整段都藏了就连头像、证书、时间一起消失，像他没说过话一样"
 * 这件事【不需要任何特判】—— 它自己就成立了。
 * 顺带日期分隔条、顶栏条数、深搜结果也全都自动对上。
 */
var HIDE = {};        // 消息 id -> 1
var HIDE_N = 0;

function hideLoad() {
  HIDE = {}; HIDE_N = 0;
  var raw = PREF.hide;
  if (Object.prototype.toString.call(raw) !== '[object Array]') return;
  raw.forEach(function (x) {
    var id = Number(x) || 0;
    if (id && !HIDE[id]) { HIDE[id] = 1; HIDE_N++; }
  });
}
function hideList() {
  var out = [];
  Object.keys(HIDE).forEach(function (k) { out.push(Number(k)); });
  return out;
}
function hideOn(id) { return !!HIDE[id]; }
function hideToggle(id) {
  id = Number(id) || 0;
  if (!id) return;
  if (HIDE[id]) { delete HIDE[id]; HIDE_N--; }
  else { HIDE[id] = 1; HIDE_N++; }
  savePref();
  refresh();
}
function hideClear() {
  HIDE = {}; HIDE_N = 0;
  savePref();
  refresh();
}
/*
 * 挑选模式。
 *
 * 开着时，被藏起来的消息【照样显示】，只是变暗 + 标一个「已隐藏」——
 * 不然藏完就找不回来了，只能靠「全部恢复」推倒重来。
 * 关掉之后它们才真的从画面上消失。
 *
 * 这个开关【不存偏好】：它是编辑时的临时状态，
 * 存下来的话下次开页会带着一堆变暗的消息，看着像坏了。
 */
var HIDE_PICK = false;
function hidePick(on) {
  HIDE_PICK = !!on;
  try { document.body.classList.toggle('picking', HIDE_PICK); } catch (e) {}
  refresh();
}

/*
 * 每种序列各自一套参数。
 *
 *   cool  说完之后这一路至少静多少毫秒（只防连点，不是"有时候不说"）
 *
 * ⚠️ 这里【曾经有一个"有多大概率真的说话"的骰子】，2~5 各摇一次，
 *    0.55 / 0.7。那是我把"每种序列的对话出现概率独立计算"理解错了 ——
 *    那句话说的是【已经出现过的那句重复概率变少，各路各算各的】，
 *    不是"点了也可能没反应"。
 *
 *    后果正是他报回来的那两条：选了个玩家、切到计算器，鸥子一声不吭，
 *    而这和"这一路根本没台词"、"功能坏了"在表现上一模一样。
 *    **触发一次就说一句** —— 说不说话是台词表决定的，不是骰子决定的。
 *
 * 冷却也从 4.5 秒压到 0.9 秒：它只该挡住连点两下变成两句话，
 * 挡不该长到让人觉得"刚才那下没反应"。
 */
var GULL_SEQ = {
  0: { cool: 0 },
  1: { cool: 260 },
  2: { cool: 900 },
  3: { cool: 900 },
  4: { cool: 900 },
  5: { cool: 900 },
};
var GULL_SEQ_MAX = 5;
var GULL_EVERY_MIN = 50000;    // 序列 0 两句之间最短间隔
var GULL_EVERY_MAX = 165000;   // 最长
var GULL_SHOW_MS = 9500;       // 一句话在屏幕上挂多久
var GULL_SEEN_CAP = 400;       // localStorage 里最多记多少行的出现次数

var GULL = {
  on: PREF.gull !== false,
  lines: null,            // [{lead, text, seq, k}]
  state: 'idle',          // idle | wait | ok
  p: null,                // 取台词那一趟的 Promise（只跑一趟，见 gullLoad）
  src: '',                // 'sheet' | 'builtin'
  seen: {},               // 行指纹 -> 出现过几次
  last: {},               // 序列 -> 上一句的指纹
  cool: {},               // 序列 -> 最早什么时候能再说
  timer: 0,
  hideT: 0,
  said: 0,
  /*
   * 现在挂着的是哪张脸。
   *
   * ⚠️ **换过去就不换回来** —— 一直保持到下一句话（他明确要求的，
   *    而且这条要求是对的：说完一句就"啪"地弹回平常，看着像表情没生效，
   *    而气泡收起来的那一刻正好是人把视线移开的时候，
   *    真正被看到的反而是那张弹回来的脸）。
   *    所以 gullQuiet 里一个字都不能碰它。
   */
  face: 1,
};

 * 刻意写得少而短 —— 它的作用是"证明这块是活的"，不是替他把话写完。
 */
var GULL_BUILTIN = [
  { lead: '鸥子',       seq: 0, face: 1, text: '这里是公开只读存档，页面不会把你的任何东西传回去。' },
  { lead: '温馨提示',   seq: 0, face: 1, text: '现在是 {现在}，你在看{房间}，眼前这一屏有 {条数} 条。' },
  { lead: '鸥子',       seq: 0, face: 2, text: '台词还没写呢 —— 去采集端那张「鸥子」表里加几行，我就换词了。' },
  { lead: '鸥子',       seq: 1, face: 3, text: '别戳了，斧头会掉的。' },
  { lead: '鸥子',       seq: 1, face: 2, text: '在的在的。今天是 {今天}。' },
  { lead: '鸥子',       seq: 2, face: 1, text: '{日期简}是{星期}，那天这屋里有 {当天条数} 条，翻起来慢慢看。' },
  { lead: '鸥子',       seq: 3, face: 1, text: '现在只看 {玩家} 一个人说话了，再点一次他的名字就退回全部。' },
  { lead: '游戏机制小提示', seq: 4, face: 4, text: '算之前先把品质加成填对，那一项最容易忘，也最影响结果。' },
  { lead: '鸥子',       seq: 5, face: 1, text: '这些文章是玩家自己写的，中文那段是 AI 翻的，看个大意就好。' },
];

/*
 * 内置那份的规范化结果。**永远可用**，因为它要当两种兜底：
 *   ① 整份 gull.json 取不到（站点还没发布）
 *   ② 表里某一路一句台词都没写（这一路照样得有反应）
 * 在 gullNorm 之后赋值 —— 它是个函数声明，会提升，所以这里能直接调。
 */
var GULL_FALLBACK = null;

/** 行指纹：**认内容不认行号**，这样他在表格里插行、排序，出现次数不会跟着串位。 */
function gullKey(seq, lead, text, face) {
  var s = seq + '' + (face || 1) + '' + lead + '' + text;
  var h = 5381;
  for (var i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
  return h.toString(36);
}

function gullNorm(rows) {
  var out = [];
  (rows || []).forEach(function (r) {
    if (!r) return;
    var text = String(r.text == null ? r[1] : r.text || '').trim();
    if (!text) return;                       // 内容空的那一行 = 这行先不用
    var lead = String((r.lead == null ? r[0] : r.lead) || '').trim();
    var seq = Number(r.seq == null ? r[2] : r.seq);
    if (!isFinite(seq) || seq < 0 || seq > GULL_SEQ_MAX) seq = 0;
    seq = Math.floor(seq);
    // 表情：认不出 / 没写 一律当 1（平常）。第一版发出来的 gull.json 没有这个字段
    var face = Math.floor(Number(r.face));
    if (!isFinite(face) || face < 1 || face > GULL_FACE_TOP) face = 1;
    out.push({ lead: lead, text: text, seq: seq, face: face,
               k: gullKey(seq, lead, text, face) });
  });
  return out;
}

/*
 * ⚠️ 取台词【只跑一趟】，而且要把那一趟的 Promise 存下来。
 *
 * 第一版写的是"正在取就直接 Promise.resolve()"，配上 gullFire 里
 * "还没取到就取完再来一次"，就成了一个死循环：
 * 取的过程中来一次触发 → 立刻拿到一个已完成的 Promise → 再触发一次 → …
 * 栈不会爆（是微任务），表现是**整个页面卡住**，而且看不出跟鸥子有关。
 */
function gullLoad() {
  if (GULL.p) return GULL.p;
  if (!GULL_FALLBACK) GULL_FALLBACK = gullNorm(GULL_BUILTIN);
  GULL.state = 'wait';
  // ⚠️ 先等索引 —— 不等的话在 GitHub 站上必 404，见 indexReady() 上面那段
  GULL.p = indexReady().then(function () {
    return getPack(DATA + '/gull.json');
  }).then(function (j) {
    var got = gullNorm(j && j.lines);
    if (got.length) { GULL.lines = got; GULL.src = 'sheet'; }
    else { GULL.lines = GULL_FALLBACK; GULL.src = 'builtin'; }
    GULL.state = 'ok';
  }).catch(function () {
    // 404 / 断网 / 这个站点根本没发布过 —— 都用内置那份，不报错、不打扰
    GULL.lines = GULL_FALLBACK;
    GULL.src = 'builtin';
    GULL.state = 'ok';
  }).then(function () { gullNote(); });
  return GULL.p;
}

// ---------------------------------------------------------------------------
// 模板函数：在表格里写 {日期}，出来的是你刚点的那一天
// ---------------------------------------------------------------------------
/*
 * 三条规矩，都是踩过的：
 *
 * ① **替换出来的东西插在句子里**，不是把整个对话框换成一个日期。
 *    所以这里返回的是【片段数组】，由 gullSay 拼成一串文本节点 + 一个
 *    带样式的 <span>，句子的前后文一个字都不丢。
 *
 * ② **认不出的记号原样留着**。写错了要看得见 —— 悄悄吞掉的话，
 *    他会以为是自己那句话写错了，回去把整行删掉重写。
 *
 * ③ **这一句缺数据就整句作废**（返回 null）。比如序列 0 的定时台词里
 *    写了 {玩家}，那会儿根本没选人 —— 与其冒一句"现在只看  一个人说话了"，
 *    不如换一句能说的。所以取不到值的行【连候选都进不去】。
 */
var GULL_WEEK = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

function gullDayN(day) {
  var n = 0;
  ALL.forEach(function (m) { if (m._d === day && m.room === sel.room) n++; });
  return n;
}

/** 这个人在当前房间说过几条。 */
function gullSidN(sid) {
  var n = 0;
  ALL.forEach(function (m) { if (m.sid === sid && m.room === sel.room) n++; });
  return n;
}

/** 这个人叫什么 —— **被屏蔽的人一律吐「玩家N」**，绝不吐真名。 */
function gullWho(sid) {
  if (MASK_IX[sid]) return '玩家' + MASK_IX[sid];
  var nm = '';
  var st = STATS;
  if (st && st.senders) {
    for (var i = 0; i < st.senders.length; i++) {
      if (st.senders[i].sid === sid) { nm = st.senders[i].name; break; }
    }
  }
  if (!nm) ALL.forEach(function (m) { if (!nm && m.sid === sid) nm = m.name; });
  return nm || null;
}

var GULL_MODE_NAME = { chat: '聊天记录', calc: '计算器', news: '文章总结' };

var GULL_FN = {
  '今天':   function () { return dayOf(Date.now()); },
  '现在':   function () { return hmOf(Date.now()); },
  '房间':   function () { return roomLabel(sel.room); },
  '模式':   function () { return GULL_MODE_NAME[sel.mode] || null; },
  '条数':   function () { return String(view.length); },
  '存档条数': function () { return String(ALL.size); },

  '日期':   function (c) { return c.day || null; },
  '日期简': function (c) {
    if (!c.day) return null;
    var p = c.day.split('-');
    return p.length === 3 ? (Number(p[1]) + '月' + Number(p[2]) + '日') : c.day;
  },
  '星期':   function (c) {
    if (!c.day) return null;
    var d = new Date(c.day + 'T12:00:00');
    return isNaN(d) ? null : GULL_WEEK[d.getDay()];
  },
  '几天前': function (c) {
    if (!c.day) return null;
    var d = new Date(c.day + 'T12:00:00');
    if (isNaN(d)) return null;
    var t = new Date(); t.setHours(12, 0, 0, 0);
    var n = Math.round((t - d) / 86400000);
    if (n <= 0) return '今天';
    if (n === 1) return '昨天';
    if (n === 2) return '前天';
    return n + ' 天前';
  },
  '当天条数': function (c) { return c.day ? String(gullDayN(c.day)) : null; },

  '玩家':   function (c) { return c.sid == null ? null : gullWho(c.sid); },
  // ⚠️ 屏蔽的就是「头像和 ID」。被屏蔽的人这一句直接作废，不给任何替代写法。
  '玩家id': function (c) {
    return (c.sid == null || MASK_IX[c.sid]) ? null : String(c.sid);
  },
  '玩家条数': function (c) { return c.sid == null ? null : String(gullSidN(c.sid)); },
};

var GULL_TOKEN_RE = /\{([^{}\n]{1,60})\}/g;

/**
 * 把一句台词拆成片段。
 * 返回 [{t:'文本'} | {v:'替换进来的值'}]，取不到值就返回 null（这句作废）。
 */
function gullFill(text, ctx) {
  var out = [], last = 0, m, dead = false;
  GULL_TOKEN_RE.lastIndex = 0;
  while ((m = GULL_TOKEN_RE.exec(text)) !== null) {
    var raw = m[1].trim();
    var sp = raw.indexOf(' ');
    var name = sp < 0 ? raw : raw.slice(0, sp);
    var arg = sp < 0 ? '' : raw.slice(sp + 1);
    var val;
    if (name === '随机') {
      // {随机 甲|乙|丙} —— 同一句话每次冒出来不完全一样
      var opts = arg.split('|').map(function (x) { return x.trim(); })
                    .filter(function (x) { return x; });
      val = opts.length ? opts[Math.floor(Math.random() * opts.length)] : null;
    } else if (Object.prototype.hasOwnProperty.call(GULL_FN, name)) {
      try { val = GULL_FN[name](ctx); } catch (e) { val = null; }
    } else {
      val = undefined;                    // 不认识 → 原样留着，但不算作废
    }
    if (val === null) { dead = true; break; }
    if (m.index > last) out.push({ t: text.slice(last, m.index) });
    if (val === undefined) out.push({ t: m[0] });
    else out.push({ v: String(val) });
    last = m.index + m[0].length;
  }
  if (dead) return null;
  if (last < text.length) out.push({ t: text.slice(last) });
  return out.length ? out : [{ t: text }];
}

// ---------------------------------------------------------------------------
// 挑一句：出现过的少出现
// ---------------------------------------------------------------------------
/*
 * 权重 = 1 / (1 + 2 × 出现过几次)。第一次 1，第二次 0.33，第三次 0.2 ——
 * 是"变少"，不是"再也不出现"。全说过一遍之后大家又回到同一水平上，
 * 这正是想要的：台词只有五句的时候，硬去重会直接没话可说。
 *
 * 另外刚说过的那一句额外压到 0.15：连着两遍同一句话最容易让人觉得坏了。
 */
function gullCands(pool, seq, ctx) {
  var out = [];
  for (var i = 0; i < (pool || []).length; i++) {
    var l = pool[i];
    if (l.seq !== seq) continue;
    var parts = gullFill(l.text, ctx);
    if (!parts) continue;                 // 这句要的数据现在没有
    out.push({ l: l, parts: parts });
  }
  return out;
}

function gullPick(seq, ctx) {
  var cands = gullCands(GULL.lines, seq, ctx);
  /*
   * ⚠️ 这一路在表里一句台词都没有 —— **退回内置的那句，别装哑巴。**
   *
   * 他报回来的"切到计算器鸥子没反应"多半就是这个：表里 0 和 1 写得满满的，
   * 4、5 一句没写。而"没写"和"坏了"在屏幕上长得完全一样，
   * 他只能来问我，而我这边（表是全的）永远复现不出来。
   * 现在至少会冒一句，侧栏也会写明这一路还是内置的。
   */
  if (!cands.length) cands = gullCands(GULL_FALLBACK, seq, ctx);
  if (!cands.length) return null;
  var lastK = GULL.last[seq];
  var ws = [], tot = 0;
  for (var j = 0; j < cands.length; j++) {
    var w = 1 / (1 + 2 * (GULL.seen[cands[j].l.k] || 0));
    if (cands.length > 1 && cands[j].l.k === lastK) w *= 0.15;
    ws.push(w); tot += w;
  }
  var r = Math.random() * tot;
  for (var k = 0; k < cands.length; k++) {
    r -= ws[k];
    if (r <= 0) return cands[k];
  }
  return cands[cands.length - 1];
}

// ---------------------------------------------------------------------------
// 说话
// ---------------------------------------------------------------------------
function gullBox() { return document.querySelector('#gull'); }

/**
 * 把鸥子摆出来。
 *
 * 每次切模式都重新确认一次 —— 他报过"在计算器里鸥子不显示"，
 * 而我这边（三个模式都试过、连油猴插件都装上量过）复现不出来。
 * 复现不出来的时候，与其猜，不如把这一句放在每条路上：
 * 它只是把 hidden 摘掉，代价是零，而且**开关关掉时不会被它顶回来**
 * （那条走的是 body 上的 no-gull 类，跟这里互不干涉）。
 */
function gullShow() {
  var box = gullBox();
  if (box && box.hidden) box.hidden = false;
}

/** 收起对话框（鸥子本人还在）。 */
function gullQuiet() {
  var box = gullBox();
  if (!box) return;
  box.classList.remove('talking');
  if (GULL.hideT) { clearTimeout(GULL.hideT); GULL.hideT = 0; }
  // 等淡出动画走完再真的藏起来，不然它会"啪"地消失
  setTimeout(function () {
    var b = document.querySelector('#gbub'), bx = gullBox();
    if (b && bx && !bx.classList.contains('talking')) b.hidden = true;
  }, 220);
}

/**
 * 触发某一路。**每一路的概率、冷却各算各的。**
 * force = true 时跳过概率（点鸥子那一路用）。
 */
function gullFire(seq, ctx, force) {
  if (!GULL.on) return;
  if (GULL.state !== 'ok') {
    // 台词还在路上：等这一趟取完再补说一次。取完还是不 ok 就作罢，不再排队。
    gullLoad().then(function () { if (GULL.state === 'ok') gullFire(seq, ctx, force); });
    return;
  }
  var cfg = GULL_SEQ[seq] || GULL_SEQ[0];
  var now = Date.now();
  if (!force && now < (GULL.cool[seq] || 0)) return;
  var hit = gullPick(seq, ctx || {});
  if (!hit) return;
  GULL.cool[seq] = now + cfg.cool;
  GULL.last[seq] = hit.l.k;
  GULL.seen[hit.l.k] = (GULL.seen[hit.l.k] || 0) + 1;
  GULL.said++;
  gullSeenSave();
  gullSay(hit.l.lead, hit.parts, hit.l.face);
}

/**
 * 换脸。
 *
 * 只在【真的换了】的时候动 img.src —— 同一张脸重复赋值会让某些浏览器
 * 重新解码一次图片，表现是气泡冒出来的那一瞬间鸥子闪一下白。
 *
 * 换完不回落：GULL.face 一直留着，直到下一句话再改。
 */
function gullFace(n) {
  var f = Math.floor(Number(n));
  if (!isFinite(f) || f < 1 || f > GULL_FACE_TOP) f = 1;
  if (f === GULL.face) return;
  var img = document.querySelector('#gimg');
  if (!img) return;
  var src = gullFaceImg(f);
  GULL.face = f;
  if (img.getAttribute('src') !== src) img.src = src;
  img.alt = '鸥子（' + GULL_FACE_NAME[f] + '）';
}

/** 把片段画进气泡。**全程 textContent，一个 innerHTML 都没有。** */
function gullSay(lead, parts, face) {
  var box = gullBox(), bub = document.querySelector('#gbub');
  if (!box || !bub) return;
  gullFace(face);
  clear(bub);

  var x = el('button', 'gx', '×');
  x.title = '知道了';
  x.setAttribute('aria-label', '收起鸥子这句话');
  x.onclick = function (ev) { ev.stopPropagation(); gullQuiet(); };
  bub.appendChild(x);

  if (lead) bub.appendChild(el('span', 'glead', lead));
  var line = el('span', 'gtx');
  parts.forEach(function (p) {
    if (p.v !== undefined) line.appendChild(el('span', 'gv', p.v));
    else line.appendChild(document.createTextNode(p.t));
  });
  bub.appendChild(line);

  bub.hidden = false;
  // 重放点头动画：先摘掉再挂上，中间强制一次重排
  box.classList.remove('talking');
  void box.offsetWidth;
  box.classList.add('talking');

  if (GULL.hideT) clearTimeout(GULL.hideT);
  // 长句子多留一会儿 —— 按能读完算，不是所有话都一样长
  var ms = Math.min(20000, GULL_SHOW_MS + line.textContent.length * 90);
  GULL.hideT = setTimeout(gullQuiet, ms);
}

// ---------------------------------------------------------------------------
// 序列 0：随机定时
// ---------------------------------------------------------------------------
/*
 * ⚠️ 页面在后台标签里的时候【不说话】——
 * 不然切回来会看到一句上上个话题的台词，还占着计时器。
 */
function gullTimer() {
  if (GULL.timer) { clearTimeout(GULL.timer); GULL.timer = 0; }
  if (!GULL.on) return;
  var wait = GULL_EVERY_MIN + Math.random() * (GULL_EVERY_MAX - GULL_EVERY_MIN);
  GULL.timer = setTimeout(function () {
    GULL.timer = 0;
    var hidden = false;
    try { hidden = !!document.hidden; } catch (e) {}
    if (!hidden) gullFire(0, {});
    gullTimer();
  }, wait);
}

// ---------------------------------------------------------------------------
// 开关 / 存盘
// ---------------------------------------------------------------------------
/*
 * 出现次数单独存一个键，**不跟 simco.pref 混**：
 * pref 是"你怎么设置的"，这个是"你已经看过什么"，
 * 两者的生命周期完全不同 —— 清掉后者不该把屏蔽名单和藏起来的消息一起清掉。
 */
function gullSeenLoad() {
  GULL.seen = {};
  try {
    var o = JSON.parse(localStorage.getItem('simco.gull') || '{}') || {};
    Object.keys(o).forEach(function (k) {
      var n = Number(o[k]);
      if (isFinite(n) && n > 0) GULL.seen[k] = n;
    });
  } catch (e) { /* 存不了就当没看过，不影响使用 */ }
}
function gullSeenSave() {
  try {
    var keys = Object.keys(GULL.seen);
    // 表格改来改去，老指纹会一直堆着。超了就整个丢掉重新数 ——
    // 这本账丢了没有任何后果，不值得为它写一套淘汰算法。
    if (keys.length > GULL_SEEN_CAP) GULL.seen = {};
    localStorage.setItem('simco.gull', JSON.stringify(GULL.seen));
  } catch (e) {}
}

function gullSet(on) {
  GULL.on = !!on;
  try { document.body.classList.toggle('no-gull', !GULL.on); } catch (e) {}
  savePref();
  gullNote();
  if (GULL.on) { gullLoad(); gullTimer(); }
  else { gullQuiet(); if (GULL.timer) { clearTimeout(GULL.timer); GULL.timer = 0; } }
}

var GULL_SEQ_NAME = ['自己冒出来', '点鸥子', '选日期', '选玩家', '计算器', '文章总结'];

/*
 * 侧栏那行小字。
 *
 * ⚠️ 它必须回答一个问题：**"我点了它没说话，是没写台词还是坏了？"**
 * 第一版只写了"台词 N 句"，而那个数是【全部序列加起来】的 ——
 * 表里 30 句全是序列 0，看起来一片繁荣，切到计算器却一声不吭。
 * 所以现在把空着的那几路直接点名。
 */
function gullNote() {
  var n = document.querySelector('#gullnote');
  if (!n) return;
  if (!GULL.on) { n.textContent = '关了。台词和出现次数都还留着，打开就接着来。'; return; }
  if (GULL.state !== 'ok') { n.textContent = '正在取台词…'; return; }
  var by = {}, cnt = 0;
  (GULL.lines || []).forEach(function (l) { by[l.seq] = (by[l.seq] || 0) + 1; cnt++; });
  var empty = [];
  for (var s = 0; s <= GULL_SEQ_MAX; s++) if (!by[s]) empty.push(GULL_SEQ_NAME[s]);
  /*
   * 表情用到了、但那张脸的图没传 —— 必须说出来。
   * 不说的话表现是"我表里明明写了 3，鸥子一点变化都没有"，
   * 而他会去怀疑表情这个功能坏了，不会想到是图还没上传。
   */
  var wantFace = {};
  (GULL.lines || []).forEach(function (l) { if (l.face > 1) wantFace[l.face] = 1; });
  var noImg = [];
  Object.keys(wantFace).map(Number).sort().forEach(function (f) {
    if (gullFaceImg(f) === GULL_IMG) noImg.push(GULL_FACE_NAME[f]);
  });

  n.textContent =
    (GULL.src === 'sheet'
      ? ('台词 ' + cnt + ' 句，来自采集端的「鸥子」表。')
      : ('台词 ' + cnt + ' 句（内置的那几句）—— 采集端还没发布 data/gull.json。')) +
    (empty.length
      ? '　这几路表里还没写，先用内置的：' + empty.join('、') + '。'
      : '') +
    (noImg.length
      ? '　这几种表情表里用到了、但图还没传，先用平常那张：' + noImg.join('、') + '。'
      : '');
}

function gullBoot() {
  var box = gullBox(), img = document.querySelector('#gimg');
  if (!box || !img) return;
  GULL.face = 1;
  img.src = gullFaceImg(1);
  img.alt = '鸥子（' + GULL_FACE_NAME[1] + '）';
  img.onclick = function () { gullFire(1, {}, true); };
  img.title = '鸥子';
  gullShow();
  try { document.body.classList.toggle('no-gull', !GULL.on); } catch (e) {}
  var cb = document.querySelector('#gullon');
  if (cb) {
    cb.checked = GULL.on;
    cb.onchange = function () { gullSet(cb.checked); };
  }
  gullSeenLoad();
  gullNote();
  if (GULL.on) { gullLoad(); gullTimer(); }
}

function applyFilters() {
  if (DIRTY) rebuild();
  var q = sel.q.toLowerCase();

  // 房间永远是选中的，所以底子就是那个房间的桶（已排好序）。
  // 没有别的筛选条件时直接用它，一次拷贝都不做。
  var base = roomMsgs();
  if (!q && !sel.day && sel.sender == null && !realmHides()) {
    // ⚠️ 快路径也得把"暂时不显示"那几条摘掉，不然它只在有别的筛选条件时才生效
    view = (HIDE_N && !HIDE_PICK) ? base.filter(function (m) { return !HIDE[m.id]; }) : base;
    limit = 400;
    return;
  }

  // base 已经有序，挑出来的子集自然也有序，不需要再排
  var hideRealm = realmHides();
  view = [];
  for (var i = 0; i < base.length; i++) {
    var m = base[i];
    if (sel.day && m._d !== sel.day) continue;
    if (sel.sender != null && m.sid !== sel.sender) continue;
    if (hideRealm && m._r !== sel.realm) continue;
    if (q && m._s.indexOf(q) < 0) continue;
    if (HIDE_N && !HIDE_PICK && HIDE[m.id]) continue;
    view.push(m);
  }

  /*
   * 深搜捞回来的那些消息【不在 ALL 里】—— 这是故意的，不然内存就又长回去了。
   * 所以在这里单独并进来。它们已经按 q 筛过，但别的筛选条件（某一天 / 某个人 /
   * 领域）还得照样过一遍，否则"点某天"之后会冒出别的天的结果。
   */
  var extra = deepMsgs();
  if (extra && extra.length) {
    var merged = false;
    for (var k = 0; k < extra.length; k++) {
      var e = extra[k];
      /*
       * ⚠️ 这里要【每次都】重新查 ALL，不能只在深搜捞到的那一刻查一次。
       * 场景：先搜了一个词（深搜从老日子里捞回来几条），之后又点了那一天、
       * 或者点了「全部」把那天整个载进 ALL —— 同一条消息就同时存在于
       * ALL 和 DEEP.msgs 里，view 里会出现两遍。
       */
      if (ALL.has(e.id)) continue;
      if (sel.day && e._d !== sel.day) continue;
      if (sel.sender != null && e.sid !== sel.sender) continue;
      if (hideRealm && e._r !== sel.realm) continue;
      if (HIDE_N && !HIDE_PICK && HIDE[e.id]) continue;
      view.push(e);
      merged = true;
    }
    // 并进来之后顺序就乱了，重排一次。深搜结果最多几千条，这一步毫秒级。
    if (merged) view.sort(function (a, b) { return a.t - b.t || a.id - b.id; });
  }
  limit = 400;
}

function renderFeed() {
  var feed = $('#feed');
  clear(feed);
  if (!ALL.size) return;
  if (!view.length) {
    var ph = el('div', 'placeholder');
    ph.appendChild(el('div', 'big', '🔍'));
    ph.appendChild(el('div', '没有匹配的消息'));
    feed.appendChild(ph);
    return;
  }
  var start = Math.max(0, view.length - limit);
  if (start > 0) {
    var b = el('button', null, '↑ 载入更早的 ' + Math.min(400, start) + ' 条（还有 ' + start + ' 条）');
    b.id = 'more';
    b.onclick = function () {
      var keep = feed.scrollHeight - feed.scrollTop;
      limit += 400; renderFeed(); feed.scrollTop = feed.scrollHeight - keep;
    };
    feed.appendChild(b);
  }

  var dimOn = sel.realm != null && sel.dimOthers;
  // 只在开着标记、且这一天确实有摘要时才标
  var markSet = AI_MARK ? aiSrcSet() : null;
  var lastDay = '', lastSid = null, lastT = 0;
  for (var i = start; i < view.length; i++) {
    var m = view[i], d = m._d || dayOf(m.t), first = false;
    if (d !== lastDay) {
      var sep = el('div', 'daysep');
      sep.appendChild(el('span', null, dayLabel(d)));
      feed.appendChild(sep);
      lastDay = d; lastSid = null; first = true;
    }
    var grouped = (m.sid === lastSid && m.t - lastT < 300000 && !first);
    lastSid = m.sid; lastT = m.t;

    // 变暗只在"选了某个领域且开着显示其他"时发生。隐藏模式下这些消息
    // 压根不在 view 里，也就轮不到这一句。
    var isHid = HIDE_PICK && HIDE[m.id];
    var row = el('div', 'msg' + (grouped ? '' : ' first') +
                        ((m.retracted || m.deleted) ? ' gone' : '') +
                        ((markSet && markSet.has(m.id)) ? ' picked' : '') +
                        (isHid ? ' hid' : '') +
                        ((dimOn && m._r !== sel.realm) ? ' dim' : ''));
    /*
     * 按钮【只在挑选模式下才建】。
     * 平时一条消息一个多余节点，二十万条就是二十万个 —— 那是白扔的内存和渲染时间，
     * 而它一年到头也用不上几次。
     */
    if (HIDE_PICK) {
      (function (mm) {
        var hb = el('button', 'hidebtn', HIDE[mm.id] ? '↩ 恢复' : '✕ 藏起来');
        hb.title = HIDE[mm.id] ? '让它重新显示' : '暂时不显示这一条（数据不动）';
        hb.onclick = function (ev) { ev.stopPropagation(); hideToggle(mm.id); };
        row.appendChild(hb);
      })(m);
    }
    if (grouped) {
      row.appendChild(el('div', 'gutter', hmOf(m.t)));
    } else {
      row.appendChild(avatar(m));
    }
    var content = el('div', 'content');
    if (!grouped) {
      var head = el('div', 'head');
      var who = el('span', 'who', maskName(m));
      who.style.color = colorOf(m.sid);
      who.title = '看看这个人';
      /*
       * 点名字 = 打开资料页。
       *
       * 原来这里直接切「只看这个人」。那个功能没丢，它在资料面板里
       * 那个「只看他的消息」按钮上 —— 多一次点击，换来的是
       * 点之前就知道自己要点的是谁。
       * 已经在只看某人的状态下，再点他的名字就退回全部 ——
       * 不然"取消筛选"要绕一圈，那是原来一下就能做到的事。
       */
      (function (mm) {
        who.onclick = function () {
          if (sel.sender === mm.sid) { sel.sender = null; refresh(true); return; }
          pcOpen(mm);
        };
      })(m);
      head.appendChild(who);
      if (m.mod) head.appendChild(el('span', 'tag mod', '管理'));
      if (m.sup) head.appendChild(el('span', 'tag sup', '赞助'));
      if (m.cert) head.appendChild(el('span', 'tag cert', '证书 ' + m.cert));
      head.appendChild(el('span', 'tag realm', 'R' + m._r));
      if (isHid) head.appendChild(el('span', 'hidetag', '已隐藏'));
      var ts = el('span', 'ts', timeOf(m.t));
      ts.title = new Date(m.t).toString();
      head.appendChild(ts);
      // 一次只显示一个房间，每条都挂个一样的房间标签纯属噪音
      content.appendChild(head);
    }
    var body = el('div', 'body');
    renderBody(body, m.body, sel.q, true);
    content.appendChild(body);

    if (m.pinned || m.retracted || m.deleted) {
      var fl = el('div', 'flags');
      if (m.pinned) fl.appendChild(el('span', 'flag pin', '📌 置顶'));
      if (m.retracted) fl.appendChild(el('span', 'flag del', '已撤回'));
      if (m.deleted) fl.appendChild(el('span', 'flag del', '已删除'));
      content.appendChild(fl);
    }
    row.appendChild(content);
    feed.appendChild(row);
  }
}

/**
 * 日期列表 —— 只列【当前房间】的日期。
 *
 * 以前这里把三个房间的日期混在一起列，点其中一个会同时钉住日期和房间，
 * 而「全部已载入」只清日期不清房间 —— 于是就锁死了：另外两个房间的消息
 * 明明已经在内存里，却怎么点都出不来。
 * 现在房间在上面单选，这里只是那个房间内部的日期，两件事不再互相影响。
 */
function renderFiles() {
  var box = $('#files');
  clear(box);
  if (!INDEX) return;

  var mine = roomDays();
  var allRow = el('div', 'row' + (sel.day === null ? ' on' : ''));
  allRow.appendChild(el('span', 'lbl', '本房间全部已载入'));
  allRow.appendChild(el('span', 'n', roomMsgs().length));
  allRow.onclick = function () { sel.day = null; refresh(true); };
  box.appendChild(allRow);

  if (!mine.length) {
    var none = el('div', 'row');
    // 刚加的聊天室会短暂处于这个状态：消息已经从快通道来了，
    // 但按天分的日文件要等整点那次完整发布才生成。
    none.appendChild(el('span', 'lbl',
      roomMsgs().length ? '（日文件还没发布，先看最近这一小包）'
                        : '（这个房间还没有已发布的日期）'));
    box.appendChild(none);
    return;
  }

  mine.forEach(function (d) {
    var k = d.room + '|' + d.day;
    var on = LOADED.has(k);
    var stale = on && LOADED.get(k).got < (d.n || 0);   // 载过，但之后又有新消息
    var r = el('div', 'row' +
      (sel.day === d.day ? ' on' : (on && !stale ? ' done' : '')));
    r.appendChild(el('span', 'lbl',
      d.day + (stale ? ' ↻ 有更新' : on ? ' ✓' : '')));
    r.appendChild(el('span', 'n', d.n));
    if (stale) r.style.color = 'var(--warn)';
    r.onclick = function () {
      if (on && !stale) {
        sel.day = d.day; refresh(true);
        // 鸥子序列 2。只在【选中某一天】时说 ——「全部」那一行是取消筛选，
        // 那会儿 {日期} 根本没有值，硬说就成了一句半截话。
        gullFire(2, { day: d.day });
      } else loadDays([d]);
    };
    box.appendChild(r);
  });
}

/**
 * 切换房间：换房间 → 清掉房间内部的筛选 → 载入这个房间最近几天。
 *
 * 日期、发送者都是"房间内部"的概念，换了房间它们必然失效，所以一并清掉。
 * 领域是跨房间的偏好，不动它。
 */
/*
 * ⚠️ 换房间【绝对不能等网络】。
 *
 * 线上反馈（国内用户，GitHub 部署）：点房间按钮没反应，
 * 而日期列表却跟着变了 —— 一半动一半不动，看着像界面坏了。
 *
 * 原因就在这个函数的最后一行：以前是
 *     return loadDays(...).then(function () { refresh(true); });
 * 也就是**先等文件下载完，再画界面**。而 refresh() 才是
 * 画房间高亮和消息列表的那一步（renderSidebar 在它里面）。
 * 于是网络一挂：
 *
 *     sel.room 换了            ← 状态其实是对的
 *     renderFiles() 跑了       ← 所以日期列表变了
 *     refresh() 永远等不到     ← 高亮和消息列表原地不动
 *
 * 用户看到的就是"点了没反应"，而且**他会以为数据没下来**——
 * 实际上那个房间的消息很多时候【已经在内存里了】（快通道那一包是全房间的）。
 *
 * 现在改成：**先画，后载。** 界面立刻切过去，能显示多少显示多少，
 * 文件在后台补。网络不通最多是内容少几天，而不是整个页面装死。
 */
function switchRoom(r) {
  deepStop();            // 上一轮还在给旧房间拉文件，先停
  if (r === sel.room) return;
  sel.room = r;
  sel.day = null;
  sel.sender = null;
  STATS = null;
  savePref();
  renderFiles();
  refresh(true);         // ← 立刻切过去，不等网络
  return loadDays(roomDays().slice(0, 3));
}

function renderSidebar() {
  var S = stats();               // 已缓存，搜索时不会重算

  // 房间是单选，而且【列表来自索引不是来自已载入的数据】。
  // 这一条是这次那个 bug 的根：以前从已载入的消息里统计房间，
  // 而开页只载最近三天 —— 那三天可能全是同一个房间的，
  // 于是另外两个房间在侧栏里压根不出现，看上去就像"数据没保存下来"。
  var rc = indexRooms();
  var rbox = $('#rooms'); clear(rbox);
  Object.keys(rc).sort().forEach(function (r) {
    var c = el('div', 'chip' + (sel.room === r ? ' on' : ''),
               roomLabel(r) + ' ' + rc[r].toLocaleString());
    c.title = r;                        // 悬停看得到原始的房间标识
    c.onclick = function () { switchRoom(r); };
    rbox.appendChild(c);
  });

  /*
   * ---- 正文列宽：正常 / 紧凑 ----
   *
   * 换档【只改一个 CSS 类】，不重画消息流 —— 所以这里不调 refresh()。
   * 这是有意的：录视频的时候常常是滚到某一段再切档，
   * 重画会把滚动位置弹回去，那一下正好毁掉一条镜头。
   */
  var wbox = $('#widthchips'); clear(wbox);
  [['normal', '正常'], ['compact', '紧凑']].forEach(function (p) {
    var c = el('div', 'chip' + (sel.width === p[0] ? ' on' : ''), p[1]);
    c.title = p[0] === 'compact' ? '正文列 440px —— 录视频用，长消息不会横着拖出画面'
                                 : '正文列 880px —— 平时看存档';
    c.onclick = function () {
      if (sel.width === p[0]) return;
      sel.width = p[0];
      savePref();
      applyWidth();
      renderSidebar();                  // 只重画侧栏，消息流一个字不动
    };
    wbox.appendChild(c);
  });
  $('#widthnote').textContent = sel.width === 'compact'
    ? '正文 440px。录视频用 —— 一行短，长消息不会横着拖出画面。'
    : '正文 880px。屏幕再宽也不会一路铺到最右边。';

  // ---- 领域 ----
  var rlbox = $('#realms'); clear(rlbox);
  var rkeys = Object.keys(S.realms).map(Number).sort(function (a, b) { return a - b; });
  var mkRealmChip = function (val, label, cnt) {
    var c = el('div', 'chip' + (sel.realm === val ? ' on' : ''),
               label + (cnt == null ? '' : ' ' + cnt.toLocaleString()));
    c.onclick = function () {
      if (sel.realm === val) return;
      sel.realm = val;
      savePref();
      refresh(true);
    };
    rlbox.appendChild(c);
  };
  mkRealmChip(null, '全部', ALL.size);
  rkeys.forEach(function (r) { mkRealmChip(r, 'R' + r, S.realms[r]); });

  // 选了「全部」就没有"其他领域"可言，开关置灰
  var dimBox = $('#dimother');
  var dimWrap = $('#dimwrap');
  dimBox.checked = sel.dimOthers;
  dimBox.disabled = (sel.realm == null);
  dimWrap.className = 'opt' + (sel.realm == null ? ' off' : '');

  // 发送者列表已经按条数排好了，这里只是按输入框过滤一下，很便宜
  var filt = ($('#qs').value || '').toLowerCase();
  var list = filt
    ? S.senders.filter(function (v) { return v.name.toLowerCase().indexOf(filt) >= 0; })
    : S.senders;
  var sbox = $('#senders'); clear(sbox);
  var all = el('div', 'row' + (sel.sender === null ? ' on' : ''));
  all.appendChild(el('span', 'lbl', '全部（' + S.senders.length + ' 人）'));
  all.onclick = function () { sel.sender = null; refresh(true); };
  sbox.appendChild(all);
  list.slice(0, 300).forEach(function (e) {
    var r = el('div', 'row' + (sel.sender === e.sid ? ' on' : ''));
    var l = el('span', 'lbl', e.name);
    l.style.color = colorOf(e.sid);
    r.appendChild(l); r.appendChild(el('span', 'n', e.n));
    r.onclick = function () {
      var pick = (sel.sender === e.sid) ? null : e.sid;
      sel.sender = pick;
      refresh(true);
      // 鸥子序列 3。再点一次是【取消】只看他，那一下不说话。
      if (pick != null) gullFire(3, { sid: pick });
    };
    sbox.appendChild(r);
  });

  var hrs = S.hrs;
  var rows = [
    ['已载入', ALL.size.toLocaleString()],
    ['发送者', S.senders.length],
    ['天数', S.days],
    ['时间跨度', hrs >= 48 ? (hrs / 24).toFixed(1) + ' 天' : hrs.toFixed(1) + ' 小时'],
  ];
  var hn = $('#hidenote');
  if (hn) {
    hn.textContent = HIDE_N
      ? ('已藏起 ' + HIDE_N + ' 条。只是不显示 —— 数据没动，别人打开还是全的。\n' +
         '整段都藏了的话，那个人的头像、证书、时间也一起不出现。')
      : '录视频时把无关的几条暂时藏掉。按【条】选，不是按人；也不是删除。';
  }
  var pb = $('#b_pick');
  if (pb) pb.textContent = HIDE_PICK ? '挑完了（退出挑选）' : '挑选要藏的消息';
  var hb = $('#hidebar');
  if (hb) {
    clear(hb);
    if (HIDE_PICK) {
      hb.appendChild(el('span', null, '挑选模式：'));
      hb.appendChild(el('b', null, '已藏起 ' + HIDE_N + ' 条'));
      hb.appendChild(el('span', null,
        '　被藏的这会儿还看得见（变暗那些），退出挑选后才真的不显示。'));
      var done1 = el('button', 'btn', '挑完了');
      done1.onclick = function () { hidePick(false); };
      hb.appendChild(done1);
      if (HIDE_N) {
        var undo = el('button', 'btn', '全部恢复');
        undo.onclick = function () {
          if (typeof confirm === 'function' &&
              !confirm('把这 ' + HIDE_N + ' 条全都恢复显示？')) return;
          hideClear();
        };
        hb.appendChild(undo);
      }
    }
  }

  var mn = $('#masknote');
  if (mn) {
    mn.textContent = MASK.length
      ? ('已屏蔽 ' + MASK.length + ' 人：' +
         MASK.map(function (x, i) { return '玩家' + (i + 1) + '＝' + (x.name || ('#' + x.sid)); })
             .join('、') +
         '\n只在聊天流里遮，侧栏和资料页照旧。')
      : '把某个人的头像和 ID 换成占位图，正文里 @ 他的地方一起换。\n只影响这台设备上的显示。';
  }

  var st = $('#stats'); clear(st);
  rows.forEach(function (kv) {
    var d = el('div', 'stat');
    d.appendChild(el('span', null, kv[0]));
    d.appendChild(el('b', null, kv[1]));
    st.appendChild(d);
  });
}

function refresh(bottom) {
  applyFilters(); renderSidebar(); renderFeed(); renderFiles(); renderDeep();
  renderAiCard();
  var p = [roomLabel(sel.room)];
  if (sel.day) p.push(sel.day);
  if (sel.sender != null) {
    var one = view[0];
    if (!one) ALL.forEach(function (m) { if (!one && m.sid === sel.sender) one = m; });
    // 顶栏就在聊天流正上方，录视频时一起入镜 —— 这里也要按屏蔽后的叫
    if (one) p.push(maskName(one));
  }
  if (sel.realm != null) p.push('R' + sel.realm + (sel.dimOthers ? '' : ' 独占'));
  if (sel.q) p.push('搜索「' + sel.q + '」');
  $('#btitle').textContent = ALL.size ? p.join(' · ') : '聊天记录';
  var inRoom = roomMsgs().length;
  var extraN = (deepMsgs() || []).length;
  // 深搜捞回来的不在 ALL 里，所以 view 可能比"已载入的条数"还多。
  // 直接写成 x / y 会看着像出错了，分开写清楚。
  $('#bsub').textContent = ALL.size
    ? (extraN
        ? view.length.toLocaleString() + ' 条（含更早存档里的 ' +
          extraN.toLocaleString() + ' 条）'
        : view.length.toLocaleString() + ' / ' + inRoom.toLocaleString() + ' 条')
    : '';
  if (bottom) requestAnimationFrame(function () {
    var f = $('#feed'); f.scrollTop = f.scrollHeight;
  });
}

// ---------- 事件 ----------
/** 重读索引，并把"已载入但又有新增"的日期重新拉一遍。 */
function refreshAll() {
  /*
   * 手动刷新时把快通道的"没有这个文件"结论清掉，重新试一次。
   *
   * 那个结论有可能是错的（比如部署刚补上 recent、或者当初那次是 404 之外的
   * 什么原因），而**用户唯一能主动做的补救动作就是点刷新** ——
   * 点了还不重试，就等于告诉他"没救了"。多一次请求而已。
   */
  HAS_RECENT = null;
  setErr(''); setInfo('检查更新…');
  return getJSON(DATA + '/index.json').then(function (ix) {
    INDEX = ix;
    // 只按条数过滤，不按 published 过滤。published:false 只表示"这天还有一部分
    // 没传上去"，已经传上去的那部分是真实存在的，不该被藏起来。
    INDEX.days = (ix.days || []).filter(function (d) { return (d.n || 0) > 0; });
    indexSettled_();
    if (!encReady()) return;
    sel.room = pickRoom();
    var about = $('#about');
    clear(about);
    about.appendChild(el('div', null, '更新时间 ' + fmtFull(ix.generated)));
    freshLines().forEach(function (t) {
      var d = el('div', null, t);
      if (t.indexOf('⚠️') === 0) { d.style.color = 'var(--warn)'; d.style.lineHeight = '1.6'; }
      about.appendChild(d);
    });
    about.appendChild(el('div', null, '游戏内公开聊天频道的存档，仅供查阅。'));
    // 页面版本号：两个站对不上就说明有一边的页面没更新
    var bv = el('div', null, '页面 ' + PAGE_BUILD);
    bv.style.opacity = '.55';
    bv.style.fontVariantNumeric = 'tabular-nums';
    bv.title = '这份页面的版本号。CF 和 GitHub 两个站的这个号应该一样，' +
               '对不上就说明有一边没更新。';
    about.appendChild(bv);
    renderFiles();
    // 当前房间一天都没载过
    var loadedHere = 0;
    LOADED.forEach(function (v, k) { if (k.split('|')[0] === sel.room) loadedHere++; });
    if (!loadedHere) return loadDays(roomDays().slice(0, 3)).then(withRecent);

    // 要重新拉的有两类：
    //   1. 已经载过、但条数变多了的（当天又有新消息）
    //   2. 索引里【新冒出来的一天】—— 归档按天分文件，跨过 UTC 零点之后新消息
    //      全进新的日文件。只认第 1 类的话，一到零点页面就再也不更新了，
    //      表现正是"侧栏能看到新文件，就是不显示新内容"。
    // 「最新的一天」要按房间各算各的 —— 混着算的话，最吵的那个房间
    // 会把安静房间的新日期挡在门外（它的日期比别人"旧"）。
    var newest = '';
    LOADED.forEach(function (v, k) {
      var p2 = k.split('|');
      if (p2[0] !== sel.room) return;
      if (p2[1] > newest) newest = p2[1];
    });
    var todo = roomDays().filter(function (d) {
      if (LOADED.has(d.room + '|' + d.day)) return needLoad(d);
      return d.day >= newest;        // 只补更新的日期，不顺手把整个历史拖下来
    });
    return loadDays(todo).then(withRecent);
  }).catch(function (e) { setErr('刷新失败：' + e.message); setInfo(); });
}

$('#b_refresh').onclick = refreshAll;
// 这两个按钮都只管【当前房间】—— 和左边的日期列表是同一个范围，
// 不会顺手把另外两个房间的几十万条一起拖下来。
$('#b_recent').onclick = function () { if (INDEX) loadDays(roomDays().slice(0, 7)); };
$('#b_all').onclick = function () {
  if (!INDEX) return;
  var mine = roomDays();
  // 按【条数】提醒，不是文件数 —— 40 个文件可能是两万条，也可能是几十万条，
  // 差别在低端手机上就是"有点慢"和"被系统杀掉"的区别。
  var msgs = mine.reduce(function (a, d) { return a + (d.n || 0); }, 0);
  if (msgs > 50000 &&
      !confirm('将载入' + roomLabel(sel.room) + '的 ' + msgs.toLocaleString() +
               ' 条消息（' + mine.length + ' 个文件）。\n' +
               '数据量较大，手机上可能很慢甚至卡死。\n\n' +
               '建议改为点左侧某一天单独载入。仍要继续吗？')) return;
  loadDays(mine);
};
var qt;
$('#q').oninput = function (e) {
  clearTimeout(qt);
  var v = e.target.value;
  qt = setTimeout(function () {
    sel.q = v.trim();
    deepStop();                 // 上一轮还在跑就先叫停，别把结果混在一起
    refresh(true);
    // 已载入的那几天是瞬时筛出来的（上面那句），然后再去更早的存档里找。
    // 从最新往回翻、凑够 500 条就停 —— 实测通常只翻 2~4 天、几十毫秒。
    deepSearch();
  }, 180);
};
$('#dimother').onchange = function (e) {
  sel.dimOthers = !!e.target.checked;
  savePref();
  refresh(true);
};
$('#qs').oninput = renderSidebar;
$('#nq').oninput = renderNews;
$('#b_mask').onclick = function () { mkOpen(); };
$('#b_pick').onclick = function () { hidePick(!HIDE_PICK); };
$('#burger').onclick = function () { document.body.classList.toggle('nav'); };
$('#scrim').onclick = function () { document.body.classList.remove('nav'); };
document.addEventListener('keydown', function (e) {
  if ((e.metaKey || e.ctrlKey) && e.key === 'f') { e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Escape') {
    /*
     * ⚠️ 灯箱开着时，Esc 只关灯箱，【不要】顺手把筛选也清了。
     * 不加这个 return 的话，看完一张图按 Esc，
     * 你翻了半天的搜索词和日期选择会一起消失 —— 而且看不出是被谁清的。
     */
    if (LB.open) { lbClose(); return; }
    // 资料面板同理：Esc 只关面板，不动筛选
    if (PC.open) { pcClose(); return; }
    // 屏蔽面板同理
    if (MK.open) { mkClose(); return; }
    // 领域是"偏好"不是"临时筛选"，Esc 不动它。
    // 房间同理，而且它必须始终有一个选中的 —— 清空就没东西可显示了。
    sel.q = ''; sel.day = null; sel.sender = null;
    $('#q').value = ''; document.body.classList.remove('nav'); refresh(true);
  }
});

// 切回本页且距上次检查超过 2 分钟时，自动查一次更新
var lastCheck = Date.now();
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState !== 'visible') return;
  if (Date.now() - lastCheck < 120000) return;
  lastCheck = Date.now();
  if (INDEX) refreshAll();
});

(function () {
  var rb = document.querySelector('#c_reset');
  if (rb) rb.onclick = function () {
    var blank = calcBlank();
    CALC.hours = blank.hours; CALC.wage = blank.wage;
    CALC.bonus = blank.bonus; CALC.target = blank.target;
    CALC.items = blank.items;
    calcSave();
    renderCalc();
  };
})();

boot();
})();
</script>
</body>
</html>
