<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sim Companies 聊天记录</title>
<meta name="referrer" content="no-referrer">
<!--
  安全策略说明（这是公开页面，所以每一条都有意义）：

  default-src 'none'   默认什么都不许加载
  connect-src 'self'   只能读同源的静态 JSON。就算页面里出了问题，也无法把
                       任何东西发到外部域名 —— 数据只能进不能出
  img-src              只允许游戏自己的头像 CDN 和 data:，别的图片一律不加载，
                       避免有人把 logo 字段塞成追踪像素
  base-uri / form-action 'none'   禁止改写基准地址、禁止任何表单提交

  script-src / style-src 用 'unsafe-inline' 是因为这是单文件页面。真正的
  XSS 防线不在 CSP，而在渲染层：本页对聊天内容【完全不使用 innerHTML】，
  一律用 createTextNode 构造，所以消息里就算写满 <script> 也只是普通文字。
-->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'unsafe-inline';
  style-src 'unsafe-inline';
  connect-src 'self';
  img-src https://d1fxy698ilbz6u.cloudfront.net data:;
  base-uri 'none';
  form-action 'none';
  frame-ancestors 'none';
">
<style>
  :root{
    --bg:#0e1015; --panel:#151821; --panel2:#1b1f2a; --line:rgba(255,255,255,.08);
    --tx:#e6e9ef; --mut:#8b93a3; --dim:#666e7e; --acc:#7dd3fc; --ok:#86efac;
    --warn:#fbbf24; --bad:#f87171; --sw:250px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--tx);display:flex;height:100dvh;overflow:hidden;
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
         "Microsoft YaHei","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-text-size-adjust:100%;
  }
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:5px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.22)}
  ::-webkit-scrollbar-track{background:transparent}

  #side{width:var(--sw);flex:0 0 var(--sw);background:var(--panel);
        border-right:1px solid var(--line);display:flex;flex-direction:column;
        overflow-y:auto;overscroll-behavior:contain}
  #side h1{font-size:14px;margin:0;padding:15px 16px 4px;font-weight:700}
  #side .tagline{padding:0 16px 12px;font-size:11.5px;color:var(--dim);line-height:1.5}
  .sec{padding:11px 14px;border-top:1px solid var(--line);flex:0 0 auto}
  .sec h2{font-size:11px;color:var(--dim);margin:0 0 8px;font-weight:600;
          letter-spacing:.6px;text-transform:uppercase}

  .btn{padding:6px 12px;background:var(--panel2);color:var(--tx);border:1px solid var(--line);
       border-radius:6px;cursor:pointer;font-size:12.5px;font-family:inherit}
  .btn:hover:not(:disabled){border-color:rgba(255,255,255,.28)}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.pri{background:rgba(125,211,252,.15);border-color:rgba(125,211,252,.4);color:var(--acc)}
  .btnrow{display:flex;gap:6px;flex-wrap:wrap}

  input[type=search]{width:100%;padding:7px 9px;background:var(--panel2);color:var(--tx);
    border:1px solid var(--line);border-radius:6px;font-size:13px;font-family:inherit}
  input:focus{outline:none;border-color:var(--acc)}

  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{padding:3px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);
        font-size:12px;cursor:pointer;user-select:none;color:var(--mut)}
  .chip:hover{border-color:rgba(255,255,255,.25);color:var(--tx)}
  .chip.on{background:rgba(125,211,252,.16);border-color:var(--acc);color:var(--acc)}

  .rowlist{max-height:220px;overflow-y:auto;margin:0 -4px;overscroll-behavior:contain}
  .row{display:flex;justify-content:space-between;gap:8px;align-items:center;
       padding:4px 8px;border-radius:5px;cursor:pointer;font-size:12.5px;color:var(--mut)}
  .row:hover{background:rgba(255,255,255,.05);color:var(--tx)}
  .row.on{background:rgba(125,211,252,.14);color:var(--acc)}
  .row.done{color:var(--ok)}
  .row .n{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;flex:0 0 auto}
  .row .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stat{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);padding:2px 0}
  .stat b{color:var(--tx);font-weight:600;font-variant-numeric:tabular-nums}
  .note{font-size:11.5px;color:var(--dim);line-height:1.65}
  .err{color:var(--bad);font-size:12px;margin-top:6px;word-break:break-word}

  #main{flex:1;display:flex;flex-direction:column;min-width:0}
  #bar{padding:9px 16px;border-bottom:1px solid var(--line);background:var(--panel);
       display:flex;gap:10px;align-items:center;flex:0 0 auto}
  #bar .title{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #bar .sub{color:var(--dim);font-size:12.5px;white-space:nowrap}
  #bar .spacer{flex:1}
  #q{max-width:300px}
  #burger{display:none;background:none;border:0;color:var(--tx);font-size:19px;cursor:pointer;padding:0 4px}

  #feed{flex:1;overflow-y:auto;padding:8px 0 60px;overscroll-behavior:contain}
  .placeholder{height:100%;display:flex;flex-direction:column;align-items:center;
    justify-content:center;color:var(--dim);gap:10px;text-align:center;padding:24px}
  .placeholder .big{font-size:44px;opacity:.35}

  .daysep{display:flex;align-items:center;gap:12px;margin:20px 22px 12px;
          color:var(--dim);font-size:11.5px;letter-spacing:.5px}
  .daysep::before,.daysep::after{content:'';flex:1;height:1px;background:var(--line)}
  .daysep span{padding:2px 10px;border-radius:999px;border:1px solid var(--line)}

  .msg{display:flex;gap:11px;padding:3px 22px}
  .msg:hover{background:rgba(255,255,255,.028)}
  .msg.first{margin-top:9px}
  .av{width:38px;height:38px;border-radius:50%;flex:0 0 38px;object-fit:cover;
      background:var(--panel2);margin-top:2px}
  .av.ph{display:flex;align-items:center;justify-content:center;font-weight:700;
         font-size:15px;color:#0e1015;letter-spacing:-.5px}
  .gutter{width:38px;flex:0 0 38px;font-size:10.5px;color:var(--dim);text-align:right;
          padding-right:2px;opacity:0;line-height:1.7;font-variant-numeric:tabular-nums}
  .msg:hover .gutter{opacity:1}
  .content{min-width:0;flex:1}
  .head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:1px}
  .who{font-weight:600;font-size:14px;cursor:pointer}
  .who:hover{text-decoration:underline}
  .ts{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .body{white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
  .body a{color:var(--acc)}

  .tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;vertical-align:1px;
       background:rgba(255,255,255,.09);color:var(--mut);font-weight:600;letter-spacing:.3px}
  .tag.sup{background:rgba(251,191,36,.17);color:#fcd34d}
  .tag.mod{background:rgba(248,113,113,.17);color:#fca5a5}
  .tag.cert{background:rgba(125,211,252,.14);color:var(--acc)}
  .tag.rm{background:rgba(167,139,250,.16);color:#c4b5fd}
  .mention{color:var(--acc);background:rgba(125,211,252,.12);border-radius:4px;padding:0 3px}
  .emote{display:inline-block;font-size:11px;padding:0 5px;border-radius:4px;margin:0 1px;
         background:rgba(255,255,255,.08);color:var(--mut);
         font-family:ui-monospace,Menlo,Consolas,monospace}
  mark{background:rgba(251,191,36,.34);color:#fff;border-radius:2px;padding:0 1px}
  .flags{margin-top:2px;display:flex;gap:5px;flex-wrap:wrap}
  .flag{font-size:10.5px;padding:1px 7px;border-radius:4px;background:rgba(255,255,255,.07);color:var(--dim)}
  .flag.pin{background:rgba(251,191,36,.16);color:var(--warn)}
  .flag.del{background:rgba(248,113,113,.16);color:var(--bad)}
  .msg.gone .body{opacity:.42;text-decoration:line-through}

  #more{margin:16px auto 40px;display:block;padding:8px 20px;background:var(--panel2);
        color:var(--mut);border:1px solid var(--line);border-radius:7px;cursor:pointer;font-size:13px}
  #scrim{display:none}

  @media(max-width:760px){
    #side{position:fixed;left:0;top:0;bottom:0;z-index:30;transform:translateX(-100%);
          transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.6)}
    body.nav #side{transform:none}
    body.nav #scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20}
    #burger{display:block}
    #q{max-width:none;flex:1}
    #bar .sub,#bar .title{display:none}
    .msg{padding-left:12px;padding-right:12px}
    .daysep{margin-left:12px;margin-right:12px}
  }
</style>
</head>
<body>
<div id="scrim"></div>

<div id="side">
  <h1>Sim Companies 聊天记录</h1>
  <div class="tagline">公开只读存档 · 数据为静态文件，页面不接受任何输入</div>

  <div class="sec">
    <h2>载入</h2>
    <div class="btnrow" style="margin-bottom:8px">
      <button class="btn pri" id="b_refresh">刷新</button>
      <button class="btn" id="b_recent">最近 7 天</button>
      <button class="btn" id="b_all">全部</button>
    </div>
    <div class="note" id="info">正在读取索引…</div>
    <div class="err" id="err"></div>
  </div>

  <div class="sec"><h2>日期</h2><div class="rowlist" id="files"></div></div>
  <div class="sec"><h2>房间</h2><div class="chips" id="rooms"></div></div>
  <div class="sec">
    <h2>发送者</h2>
    <input type="search" id="qs" placeholder="筛选发送者…" style="margin-bottom:7px">
    <div class="rowlist" id="senders"></div>
  </div>
  <div class="sec"><h2>统计</h2><div id="stats"></div></div>

  <div style="flex:1"></div>
  <div class="sec note" id="about"></div>
</div>

<div id="main">
  <div id="bar">
    <button id="burger" aria-label="菜单">☰</button>
    <span class="title" id="btitle">聊天记录</span>
    <span class="sub" id="bsub"></span>
    <span class="spacer"></span>
    <input type="search" id="q" placeholder="搜索消息内容…">
  </div>
  <div id="feed">
    <div class="placeholder"><div class="big">💬</div><div>正在载入…</div></div>
  </div>
</div>

<script>
(function () {
'use strict';

// 数据目录（相对路径 = 同源，配合 CSP 的 connect-src 'self'）
var DATA = './data';

// 头像只信这一个来源。别的地址一律画首字母圆圈，避免 logo 字段被拿来当追踪像素。
var AVATAR_HOST = 'https://d1fxy698ilbz6u.cloudfront.net/';

var ALL = new Map();          // id -> msg
var SORTED = [];              // 同样这些消息，按时间排好；只在载入新数据时重建
var STATS = null;             // 侧栏统计缓存，搜索时直接复用
var DIRTY = true;             // 载入过新数据、SORTED 需要重建吗
var LOADED = new Map();       // '房间|日期' -> { got: 已载入条数, gen: 当时的索引版本 }

// 这一天需要（重新）拉吗？没载过要拉；载过但索引说变多了也要拉 ——
// 但同一版索引下只试一次，免得索引和文件对不上时无限重拉。
function needLoad(d) {
  var v = LOADED.get(d.room + '|' + d.day);
  if (!v) return true;
  if (v.got >= (d.n || 0)) return false;
  return v.gen !== (INDEX && INDEX.generated);
}
var INDEX = null;
var view = [], limit = 400;
var sel = { rooms: new Set(), day: null, sender: null, q: '' };

var $ = function (s) { return document.querySelector(s); };
var $$ = function (s) { return document.querySelectorAll(s); };

// ---------- 建元素：全部走 textContent / createTextNode，绝不 innerHTML ----------
function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = String(text);
  return e;
}
function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

// ---------- 载入 ----------
function expand(pack) {
  var cols = pack.cols || [], out = [];
  var ix = {};
  cols.forEach(function (c, i) { ix[c] = i; });
  (pack.rows || []).forEach(function (r) {
    var d = new Date(r[ix.dt]);
    var t = isNaN(d) ? 0 : d.getTime();
    var name = String(r[ix.co] || '(未知)');
    var body = String(r[ix.body] || '');
    out.push({
      id: Number(r[ix.id]) || 0,
      room: String(pack.room || ''),
      t: t,
      name: name,
      sid: Number(r[ix.sid]) || 0,
      body: body,
      cert: Number(r[ix.cert]) || 0,
      sup: !!Number(r[ix.sup]), mod: !!Number(r[ix.mod]),
      realm: Number(r[ix.realm]) || 0,
      logo: String(r[ix.logo] || ''),
      pinned: !!Number(r[ix.pin]), retracted: !!Number(r[ix.ret]), deleted: !!Number(r[ix.del]),

      // 下面两个只在载入时算一次。
      // 以前是每敲一个搜索字符就对每条消息重算一遍 toLowerCase + new Date，
      // 二十万条数据时，光这两样每次按键就要两百多毫秒（手机上是这个的好几倍）。
      _s: (body + ' ' + name).toLowerCase(),   // 检索用的小写串
      _d: t ? dayOf(t) : '',                   // 本地日期，形如 2026-08-17
    });
  });
  return out;
}

function addAll(list) {
  var n = 0;
  list.forEach(function (m) { if (m.id && !ALL.has(m.id)) { ALL.set(m.id, m); n++; } });
  if (n) DIRTY = true;        // 有新数据了，排序和统计下次用之前重建
  return n;
}

// 加时间戳绕开缓存。GitHub Pages 走 CDN，默认会缓存约 10 分钟，
// 不带这个参数的话刚发布的内容要等很久才看得到。
function getJSON(path) {
  var url = path + (path.indexOf('?') < 0 ? '?' : '&') + '_=' + Date.now();
  return fetch(url, { cache: 'no-store' }).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status + '：' + path);
    return r.json();
  });
}

function loadDays(items) {
  // 没载过、或者索引里的条数比已载入的多（当天又有新消息）-> 都要拉
  var todo = items.filter(function (d) {
    return needLoad(d);
  });
  if (!todo.length) { setInfo(); return Promise.resolve(0); }
  var done = 0, added = 0, failed = 0;
  setInfo('载入中 0/' + todo.length + ' …');

  // 顺序 4 路，避免一次开几十个请求
  function worker() {
    var d = todo.shift();
    if (!d) return Promise.resolve();
    return getJSON(DATA + '/d/' + encodeURIComponent(d.room) + '/' + encodeURIComponent(d.day) + '.json')
      .then(function (pack) {
        added += addAll(expand(pack));
        // 记两件事：实际拿到多少条，以及是在哪一版索引下拿的。
        // 索引和日文件的条数偶尔会对不上（发布中途失败、或者赶上 GitHub 抽风），
        // 只比条数的话就会每次刷新都判定"有更新"反复重拉同一个文件。
        // 加上索引版本：同一版索引下只试一次，等下一次发布再自动重试。
        LOADED.set(d.room + '|' + d.day,
                   { got: (pack.rows || []).length, gen: INDEX && INDEX.generated });
      })
      .catch(function () { failed++; })
      .then(function () { done++; setInfo('载入中 ' + done + '/' + (done + todo.length) + ' …'); return worker(); });
  }
  var pool = [];
  for (var i = 0; i < Math.min(4, todo.length); i++) pool.push(worker());
  return Promise.all(pool).then(function () {
    renderFiles(); setInfo();
    if (failed) setErr(failed + ' 个文件读取失败（可能还没发布）');
    if (!ALL.size) emptyState('📭', '这些文件里没有可显示的消息',
                              failed ? '有 ' + failed + ' 个文件没读到' : '');
    else refresh(true);
    return added;
  });
}

function setErr(m) { $('#err').textContent = m || ''; }
function setInfo(m) {
  if (m) { $('#info').textContent = m; return; }
  if (!INDEX) { $('#info').textContent = ''; return; }
  $('#info').textContent = '存档共 ' + INDEX.total.toLocaleString() + ' 条 / ' +
    INDEX.days.length + ' 天 · 已载入 ' + LOADED.size + ' 天';
}

function emptyState(icon, title, hint) {
  var f = $('#feed');
  clear(f);
  var ph = el('div', 'placeholder');
  ph.appendChild(el('div', 'big', icon));
  ph.appendChild(el('div', title));
  if (hint) {
    var h = el('div', null, hint);
    h.style.fontSize = '12.5px';
    ph.appendChild(h);
  }
  f.appendChild(ph);
}

function boot() {
  getJSON(DATA + '/index.json').then(function (ix) {
    INDEX = ix;
    // 只按条数过滤，不按 published 过滤。published:false 只表示"这天还有一部分
    // 没传上去"，已经传上去的那部分是真实存在的，不该被藏起来。
    INDEX.days = (ix.days || []).filter(function (d) { return (d.n || 0) > 0; });
    renderFiles(); setInfo();
    var about = $('#about');
    clear(about);
    about.appendChild(el('div', null, '更新时间 ' + fmtFull(ix.generated)));
    about.appendChild(el('div', null, '游戏内公开聊天频道的存档，仅供查阅。'));
    if (!INDEX.days.length) {
      emptyState('📭', '索引里还没有已发布的日期',
                 '采集端跑一会儿并发布快照之后，刷新本页即可');
      return;
    }
    return loadDays(INDEX.days.slice(0, 3));
  }).catch(function (e) {
    setErr('读不到索引：' + e.message);
    emptyState('📭', '还没有数据', '等采集端发布第一份快照后刷新即可');
  });
}

// ---------- 时间 / 颜色 ----------
var PALETTE = ['#7dd3fc','#86efac','#fcd34d','#fca5a5','#c4b5fd','#f9a8d4',
               '#5eead4','#fdba74','#a5b4fc','#d9f99d','#f0abfc','#93c5fd'];
function colorOf(sid) { return PALETTE[Math.abs(Number(sid) || 0) % PALETTE.length]; }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function dayOf(t) { var d = new Date(t);
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function timeOf(t) { var d = new Date(t);
  return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }
function hmOf(t) { var d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function fmtFull(iso) { var d = new Date(iso); return isNaN(d) ? '未知' :
  dayOf(d.getTime()) + ' ' + hmOf(d.getTime()); }
function dayLabel(day) {
  var today = dayOf(Date.now()), y = dayOf(Date.now() - 86400000);
  if (day === today) return day + '  今天';
  if (day === y) return day + '  昨天';
  var w = '日一二三四五六'[new Date(day + 'T12:00:00').getDay()];
  return day + '  周' + (w || '?');
}

// ---------- 正文渲染：分词后逐个建节点，一次 innerHTML 都不用 ----------
function splitBy(parts, re, type) {
  var out = [];
  parts.forEach(function (p) {
    if (p.t !== 'txt') { out.push(p); return; }
    var last = 0, m;
    re.lastIndex = 0;
    while ((m = re.exec(p.s)) !== null) {
      if (!m[0].length) { re.lastIndex++; continue; }
      if (m.index > last) out.push({ t: 'txt', s: p.s.slice(last, m.index) });
      out.push({ t: type, s: m[0] });
      last = m.index + m[0].length;
    }
    if (last < p.s.length) out.push({ t: 'txt', s: p.s.slice(last) });
  });
  return out;
}

function appendText(parent, text, q) {
  if (!q) { parent.appendChild(document.createTextNode(text)); return; }
  var low = text.toLowerCase(), needle = q.toLowerCase(), i = 0;
  while (true) {
    var at = low.indexOf(needle, i);
    if (at < 0) { parent.appendChild(document.createTextNode(text.slice(i))); break; }
    if (at > i) parent.appendChild(document.createTextNode(text.slice(i, at)));
    parent.appendChild(el('mark', null, text.slice(at, at + needle.length)));
    i = at + needle.length;
  }
}

function renderBody(parent, text, q) {
  var parts = [{ t: 'txt', s: String(text || '') }];
  parts = splitBy(parts, /https?:\/\/[^\s<>"']+/g, 'url');
  parts = splitBy(parts, /@[A-Za-z0-9_一-龥][\w.\-一-龥]*/g, 'at');
  parts = splitBy(parts, /:[a-z0-9]+(?:-[a-z0-9]+)+:/gi, 'emo');
  parts.forEach(function (p) {
    if (p.t === 'url') {
      // 只接受 http(s)，其余按纯文字处理，绝不产生 javascript: 之类的链接
      if (/^https?:\/\//i.test(p.s)) {
        var a = el('a', null, p.s);
        a.href = p.s; a.target = '_blank'; a.rel = 'noopener noreferrer nofollow';
        parent.appendChild(a);
      } else parent.appendChild(document.createTextNode(p.s));
    } else if (p.t === 'at') {
      parent.appendChild(el('span', 'mention', p.s));
    } else if (p.t === 'emo') {
      parent.appendChild(el('span', 'emote', p.s));
    } else {
      appendText(parent, p.s, q);
    }
  });
}

function avatar(m) {
  var initial = (m.name.charAt(0) || '?').toUpperCase();
  if (m.logo && m.logo.indexOf(AVATAR_HOST) === 0) {
    var img = el('img', 'av');
    img.src = m.logo; img.alt = ''; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer';
    img.onerror = function () {
      var ph = el('div', 'av ph', initial);
      ph.style.background = colorOf(m.sid);
      if (img.parentNode) img.parentNode.replaceChild(ph, img);
    };
    return img;
  }
  var ph = el('div', 'av ph', initial);
  ph.style.background = colorOf(m.sid);
  return ph;
}

// ---------- 筛选与渲染 ----------
/**
 * 重建排序数组和侧栏统计。只在【载入了新数据】时跑，不随搜索跑。
 *
 * 消息一旦入库就不会变，所以排序一次就够了。以前是每次筛选都把结果重排一遍，
 * 二十万条时每敲一个字都要 O(n log n)。
 */
function rebuild() {
  SORTED = [];
  ALL.forEach(function (m) { SORTED.push(m); });
  SORTED.sort(function (a, b) { return a.t - b.t || a.id - b.id; });
  STATS = null;      // 侧栏统计跟着作废
  DIRTY = false;
}

/** 侧栏用的统计。结果缓存起来，搜索时直接复用。 */
function stats() {
  if (STATS) return STATS;
  if (DIRTY) rebuild();

  var rooms = {}, senders = new Map(), days = {};
  for (var i = 0; i < SORTED.length; i++) {
    var m = SORTED[i];
    rooms[m.room] = (rooms[m.room] || 0) + 1;
    days[m._d] = 1;
    var e = senders.get(m.sid);
    if (e) { e.n++; e.name = m.name; }
    else senders.set(m.sid, { name: m.name, sid: m.sid, n: 1 });
  }
  var list = [];
  senders.forEach(function (v) { list.push(v); });
  list.sort(function (a, b) { return b.n - a.n; });

  // 时间跨度直接取首尾两条 —— 数组本来就是按时间排好的。
  //
  // 这里原本写的是 Math.max.apply(null, ts)，那是把每一条消息的时间戳当成一个
  // 函数参数展开。参数个数有上限，实测 15 万条就会抛 RangeError，
  // 而异常正好发生在渲染路径上，整个页面会卡死不再响应。
  var hrs = 0;
  if (SORTED.length) {
    hrs = (SORTED[SORTED.length - 1].t - SORTED[0].t) / 3600000;
    if (!(hrs >= 0)) hrs = 0;
  }

  STATS = { rooms: rooms, senders: list, days: Object.keys(days).length, hrs: hrs };
  return STATS;
}

function applyFilters() {
  if (DIRTY) rebuild();
  var q = sel.q.toLowerCase();

  // 什么都没筛 —— 直接用排好的那份，一次拷贝都不做
  if (!q && !sel.rooms.size && !sel.day && sel.sender == null) {
    view = SORTED;
    limit = 400;
    return;
  }

  // SORTED 已经有序，挑出来的子集自然也有序，不需要再排
  view = [];
  for (var i = 0; i < SORTED.length; i++) {
    var m = SORTED[i];
    if (sel.rooms.size && !sel.rooms.has(m.room)) continue;
    if (sel.day && m._d !== sel.day) continue;
    if (sel.sender != null && m.sid !== sel.sender) continue;
    if (q && m._s.indexOf(q) < 0) continue;
    view.push(m);
  }
  limit = 400;
}

function renderFeed() {
  var feed = $('#feed');
  clear(feed);
  if (!ALL.size) return;
  if (!view.length) {
    var ph = el('div', 'placeholder');
    ph.appendChild(el('div', 'big', '🔍'));
    ph.appendChild(el('div', '没有匹配的消息'));
    feed.appendChild(ph);
    return;
  }
  var start = Math.max(0, view.length - limit);
  if (start > 0) {
    var b = el('button', null, '↑ 载入更早的 ' + Math.min(400, start) + ' 条（还有 ' + start + ' 条）');
    b.id = 'more';
    b.onclick = function () {
      var keep = feed.scrollHeight - feed.scrollTop;
      limit += 400; renderFeed(); feed.scrollTop = feed.scrollHeight - keep;
    };
    feed.appendChild(b);
  }

  var lastDay = '', lastSid = null, lastT = 0;
  for (var i = start; i < view.length; i++) {
    var m = view[i], d = m._d || dayOf(m.t), first = false;
    if (d !== lastDay) {
      var sep = el('div', 'daysep');
      sep.appendChild(el('span', null, dayLabel(d)));
      feed.appendChild(sep);
      lastDay = d; lastSid = null; first = true;
    }
    var grouped = (m.sid === lastSid && m.t - lastT < 300000 && !first);
    lastSid = m.sid; lastT = m.t;

    var row = el('div', 'msg' + (grouped ? '' : ' first') +
                        ((m.retracted || m.deleted) ? ' gone' : ''));
    if (grouped) {
      row.appendChild(el('div', 'gutter', hmOf(m.t)));
    } else {
      row.appendChild(avatar(m));
    }
    var content = el('div', 'content');
    if (!grouped) {
      var head = el('div', 'head');
      var who = el('span', 'who', m.name);
      who.style.color = colorOf(m.sid);
      (function (sid) {
        who.onclick = function () { sel.sender = (sel.sender === sid ? null : sid); refresh(true); };
      })(m.sid);
      head.appendChild(who);
      if (m.mod) head.appendChild(el('span', 'tag mod', '管理'));
      if (m.sup) head.appendChild(el('span', 'tag sup', '赞助'));
      if (m.cert) head.appendChild(el('span', 'tag cert', '证书 ' + m.cert));
      if (m.realm) head.appendChild(el('span', 'tag rm', 'R' + m.realm));
      var ts = el('span', 'ts', timeOf(m.t));
      ts.title = new Date(m.t).toString();
      head.appendChild(ts);
      if (sel.rooms.size !== 1) head.appendChild(el('span', 'tag', m.room));
      content.appendChild(head);
    }
    var body = el('div', 'body');
    renderBody(body, m.body, sel.q);
    content.appendChild(body);

    if (m.pinned || m.retracted || m.deleted) {
      var fl = el('div', 'flags');
      if (m.pinned) fl.appendChild(el('span', 'flag pin', '📌 置顶'));
      if (m.retracted) fl.appendChild(el('span', 'flag del', '已撤回'));
      if (m.deleted) fl.appendChild(el('span', 'flag del', '已删除'));
      content.appendChild(fl);
    }
    row.appendChild(content);
    feed.appendChild(row);
  }
}

function renderFiles() {
  var box = $('#files');
  clear(box);
  if (!INDEX) return;
  var allRow = el('div', 'row' + (sel.day === null ? ' on' : ''));
  var lbl = el('span', 'lbl', '全部已载入');
  allRow.appendChild(lbl);
  allRow.appendChild(el('span', 'n', ALL.size));
  allRow.onclick = function () { sel.day = null; refresh(true); };
  box.appendChild(allRow);

  INDEX.days.forEach(function (d) {
    var k = d.room + '|' + d.day;
    var on = LOADED.has(k);
    var stale = on && LOADED.get(k).got < (d.n || 0);   // 载过，但之后又有新消息
    var r = el('div', 'row' + (on && !stale ? ' done' : ''));
    r.appendChild(el('span', 'lbl',
      d.room + '/' + d.day + (stale ? ' ↻ 有更新' : on ? ' ✓' : '')));
    r.appendChild(el('span', 'n', d.n));
    if (stale) r.style.color = 'var(--warn)';
    r.onclick = function () {
      if (on && !stale) { sel.day = d.day; sel.rooms = new Set([d.room]); refresh(true); }
      else loadDays([d]);
    };
    box.appendChild(r);
  });
}

function renderSidebar() {
  var S = stats();               // 已缓存，搜索时不会重算

  var rc = S.rooms;
  var rbox = $('#rooms'); clear(rbox);
  Object.keys(rc).sort().forEach(function (r) {
    var c = el('div', 'chip' + (sel.rooms.has(r) ? ' on' : ''), r + ' ' + rc[r]);
    c.onclick = function () {
      if (sel.rooms.has(r)) sel.rooms.delete(r); else sel.rooms.add(r);
      refresh(true);
    };
    rbox.appendChild(c);
  });

  // 发送者列表已经按条数排好了，这里只是按输入框过滤一下，很便宜
  var filt = ($('#qs').value || '').toLowerCase();
  var list = filt
    ? S.senders.filter(function (v) { return v.name.toLowerCase().indexOf(filt) >= 0; })
    : S.senders;
  var sbox = $('#senders'); clear(sbox);
  var all = el('div', 'row' + (sel.sender === null ? ' on' : ''));
  all.appendChild(el('span', 'lbl', '全部（' + S.senders.length + ' 人）'));
  all.onclick = function () { sel.sender = null; refresh(true); };
  sbox.appendChild(all);
  list.slice(0, 300).forEach(function (e) {
    var r = el('div', 'row' + (sel.sender === e.sid ? ' on' : ''));
    var l = el('span', 'lbl', e.name);
    l.style.color = colorOf(e.sid);
    r.appendChild(l); r.appendChild(el('span', 'n', e.n));
    r.onclick = function () { sel.sender = (sel.sender === e.sid ? null : e.sid); refresh(true); };
    sbox.appendChild(r);
  });

  var hrs = S.hrs;
  var rows = [
    ['已载入', ALL.size.toLocaleString()],
    ['发送者', S.senders.length],
    ['天数', S.days],
    ['时间跨度', hrs >= 48 ? (hrs / 24).toFixed(1) + ' 天' : hrs.toFixed(1) + ' 小时'],
  ];
  var st = $('#stats'); clear(st);
  rows.forEach(function (kv) {
    var d = el('div', 'stat');
    d.appendChild(el('span', null, kv[0]));
    d.appendChild(el('b', null, kv[1]));
    st.appendChild(d);
  });
}

function refresh(bottom) {
  applyFilters(); renderSidebar(); renderFeed(); renderFiles();
  var p = [];
  if (sel.rooms.size) p.push(Array.from(sel.rooms).join('/'));
  if (sel.day) p.push(sel.day);
  if (sel.sender != null) {
    var one = view[0];
    if (!one) ALL.forEach(function (m) { if (!one && m.sid === sel.sender) one = m; });
    if (one) p.push(one.name);
  }
  if (sel.q) p.push('搜索「' + sel.q + '」');
  $('#btitle').textContent = ALL.size ? (p.length ? p.join(' · ') : '全部消息') : '聊天记录';
  $('#bsub').textContent = ALL.size
    ? view.length.toLocaleString() + ' / ' + ALL.size.toLocaleString() + ' 条' : '';
  if (bottom) requestAnimationFrame(function () {
    var f = $('#feed'); f.scrollTop = f.scrollHeight;
  });
}

// ---------- 事件 ----------
/** 重读索引，并把"已载入但又有新增"的日期重新拉一遍。 */
function refreshAll() {
  setErr(''); setInfo('检查更新…');
  return getJSON(DATA + '/index.json').then(function (ix) {
    INDEX = ix;
    // 只按条数过滤，不按 published 过滤。published:false 只表示"这天还有一部分
    // 没传上去"，已经传上去的那部分是真实存在的，不该被藏起来。
    INDEX.days = (ix.days || []).filter(function (d) { return (d.n || 0) > 0; });
    var about = $('#about');
    clear(about);
    about.appendChild(el('div', null, '更新时间 ' + fmtFull(ix.generated)));
    about.appendChild(el('div', null, '游戏内公开聊天频道的存档，仅供查阅。'));
    renderFiles();
    if (!LOADED.size) return loadDays(INDEX.days.slice(0, 3));   // 一天都没载过

    // 要重新拉的有两类：
    //   1. 已经载过、但条数变多了的（当天又有新消息）
    //   2. 索引里【新冒出来的一天】—— 归档按天分文件，跨过 UTC 零点之后新消息
    //      全进新的日文件。只认第 1 类的话，一到零点页面就再也不更新了，
    //      表现正是"侧栏能看到新文件，就是不显示新内容"。
    var newest = '';
    LOADED.forEach(function (v, k) {
      var day = k.split('|')[1];
      if (day > newest) newest = day;
    });
    var todo = INDEX.days.filter(function (d) {
      if (LOADED.has(d.room + '|' + d.day)) return needLoad(d);
      return d.day >= newest;        // 只补更新的日期，不顺手把整个历史拖下来
    });
    return loadDays(todo);
  }).catch(function (e) { setErr('刷新失败：' + e.message); setInfo(); });
}

$('#b_refresh').onclick = refreshAll;
$('#b_recent').onclick = function () { if (INDEX) loadDays(INDEX.days.slice(0, 7)); };
$('#b_all').onclick = function () {
  if (!INDEX) return;
  // 按【条数】提醒，不是文件数 —— 40 个文件可能是两万条，也可能是几十万条，
  // 差别在低端手机上就是"有点慢"和"被系统杀掉"的区别。
  var msgs = INDEX.days.reduce(function (a, d) { return a + (d.n || 0); }, 0);
  if (msgs > 50000 &&
      !confirm('将载入 ' + msgs.toLocaleString() + ' 条消息（' + INDEX.days.length + ' 个文件）。\n' +
               '数据量较大，手机上可能很慢甚至卡死。\n\n' +
               '建议改为点左侧某一天单独载入。仍要继续吗？')) return;
  loadDays(INDEX.days);
};
var qt;
$('#q').oninput = function (e) {
  clearTimeout(qt);
  var v = e.target.value;
  qt = setTimeout(function () { sel.q = v.trim(); refresh(true); }, 180);
};
$('#qs').oninput = renderSidebar;
$('#burger').onclick = function () { document.body.classList.toggle('nav'); };
$('#scrim').onclick = function () { document.body.classList.remove('nav'); };
document.addEventListener('keydown', function (e) {
  if ((e.metaKey || e.ctrlKey) && e.key === 'f') { e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Escape') {
    sel.q = ''; sel.day = null; sel.sender = null; sel.rooms.clear();
    $('#q').value = ''; document.body.classList.remove('nav'); refresh(true);
  }
});

// 切回本页且距上次检查超过 2 分钟时，自动查一次更新
var lastCheck = Date.now();
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState !== 'visible') return;
  if (Date.now() - lastCheck < 120000) return;
  lastCheck = Date.now();
  if (INDEX) refreshAll();
});

boot();
})();
</script>
</body>
